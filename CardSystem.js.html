<script>
console.log('[ORBITAL] CardSystem.js.html started execution');
if (window.__showDebugMsg) window.__showDebugMsg('CardSystem読込開始');
var CardSystem;
(() => {
  'use strict';

  const CardSystem = {
    typeSymbols: {
      '草': '🌿', '炎': '🔥', '水': '💧', '雷': '⚡', '超': '👁️',
      '闘': '🥊', '悪': '🌙', '鋼': '⚙️', 'ドラゴン': '🐉', '無色': '⚪',
      '火': '🔥', '無': '⚪', '光': '☀️', '闇': '🌑', '風': '🌪️', '土': '🪨'
    },

    escape(v) {
      return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    },

    parseEnergyList(energyStr) {
      if (energyStr == null) return [];
      if (typeof energyStr === 'number') {
        return Array(Math.max(0, Math.floor(energyStr))).fill('無');
      }
      const raw = String(energyStr).trim();
      if (!raw || /^(0|なし|0個|不要|none|free|-|ー|—)$/i.test(raw)) {
        return [];
      }
      if (/^\d+$/.test(raw)) {
        return Array(Number(raw)).fill('無');
      }

      let normalized = raw.replace(/(ドラゴン|無色|colorless|lightning|fighting|darkness|psychic|dragon|grass|metal|water|fire|[草炎火水雷超闘悪鋼無光闇風土])\s*(?:[×*x]|個|\s)\s*(\d+)個?/gi, '$1$2');
      const chunks = normalized.split(/[\s,、，/／・+＋|｜]+/).filter(Boolean);
      const result = [];
      const tokenRegex = /(ドラゴン|無色|colorless|lightning|fighting|darkness|psychic|dragon|grass|metal|water|fire|[草炎火水雷超闘悪鋼無光闇風土])(?:\s*[×*x]?\s*(\d+))?/gi;

      for (let i = 0; i < chunks.length; i++) {
        const chunk = chunks[i];
        if (/^\d+個?$/.test(chunk)) {
          const num = parseInt(chunk, 10) || 0;
          for (let k = 0; k < num; k++) result.push('無');
          continue;
        }
        let matchFound = false;
        tokenRegex.lastIndex = 0;
        let m;
        while ((m = tokenRegex.exec(chunk)) !== null) {
          matchFound = true;
          const type = m[1];
          const count = m[2] ? parseInt(m[2], 10) : 1;
          for (let k = 0; k < count; k++) {
            result.push(type);
          }
        }
        if (!matchFound && chunk.length === 1 && !/\s/.test(chunk)) {
          result.push(chunk);
        }
      }
      return result;
    },

    get effectEditor() {
      return window.EffectEditor ? window.EffectEditor.effectEditor : null;
    },

    showMessage(msg, type = 'info') {
      if (window.App && typeof window.App.toast === 'function') {
        window.App.toast(msg, type === 'error' || type === 'warning');
      } else {
        alert(msg);
      }
    },

    getAdminToken() {
      return (window.App && window.App.state && window.App.state.adminToken) || '';
    },

    openEffectEditor(target) {
      if (window.EffectEditor) return window.EffectEditor.openEffectEditor(target);
    },
    closeEffectEditor() {
      if (window.EffectEditor) return window.EffectEditor.closeEffectEditor();
    },
    applyEffectEditor() {
      if (window.EffectEditor) return window.EffectEditor.applyEffectEditor();
    },
    insertEffectCode(snippet) {
      if (window.EffectEditor) return window.EffectEditor.insertEffectCode(snippet);
    },
    switchEffectTab(tab) {
      if (window.EffectEditor) return window.EffectEditor.switchEffectTab(tab);
    },
    updateCompletion(force) {
      if (window.EffectEditor) return window.EffectEditor.updateCompletion(force);
    },
    toggleFunctionList(open) {
      if (window.EffectEditor) return window.EffectEditor.toggleFunctionList(open);
    },
    renderFunctionList(search, cat) {
      if (window.EffectEditor) return window.EffectEditor.renderFunctionList(search, cat);
    },
    renderApiHelpGrid() {
      if (window.EffectEditor) return window.EffectEditor.renderApiHelpGrid();
    },
    updateCodePreview() {
      if (window.EffectEditor) return window.EffectEditor.updateCodePreview();
    },
    filterCompletionByQuery(q) {
      if (window.EffectEditor) return window.EffectEditor.filterCompletionByQuery(q);
    },
    makeEffectDisplayText(code) {
      if (window.EffectEditor && typeof window.EffectEditor.makeEffectDisplayText === 'function') {
        return window.EffectEditor.makeEffectDisplayText(code);
      }
      return '';
    },
    handleEditorKeydown(e) {
      if (window.EffectEditor) return window.EffectEditor.handleEditorKeydown(e);
    },
    toggleCompletionDock() {
      if (window.EffectEditor) return window.EffectEditor.toggleCompletionDock();
    },
    makeEffectDisplayText(code) {
      if (window.EffectEditor && window.EffectEditor.makeEffectDisplayText) {
        return window.EffectEditor.makeEffectDisplayText(code);
      }
      return '';
    },

    updatePreview() {
      const card = this.getFormCard();
      const root = document.getElementById('cardPreview');
      if (root) {
        root.innerHTML = this.createCardHtml(card, { size: 'lg' });
      }
    },

    delete(card) {
      if (!App.requireAdmin()) return;
      if (!confirm('本当に「' + card.name + '」を削除しますか？')) return;
      App.closeModal();
      google.script.run
        .withSuccessHandler((res) => {
          if (!res.ok) {
            App.toast(res.message || '削除できませんでした。', true);
            return;
          }
          App.toast('カードを削除しました。');
          App.loadCards();
          App.showPage('cards');
        })
        .withFailureHandler((err) => {
          App.toast('削除失敗: ' + (err.message || err), true);
        })
        .deleteCard(card.id, App.state.adminToken);
    },

    sortCards(cards, sortKey = 'name') {
      if (!Array.isArray(cards)) return [];

      const categoryOrder = {
        'たね': 1, 'たねex': 2, '1進化': 3, '1進化ex': 4, '2進化': 5, '2進化ex': 6,
        '進化': 7, 'トレーナー': 8, 'グッズ': 9, 'サポート': 10, 'スタジアム': 11,
        'エネルギー': 12, '基本エネルギー': 13, '特殊エネルギー': 14
      };
      const typeOrder = {
        '無色': 1, '炎': 2, '水': 3, '草': 4, '雷': 5, '超': 6, '闘': 7, '悪': 8, '鋼': 9
      };
      const rarityOrder = {
        'SR': 1, 'RR': 2, 'AR': 3, 'R': 4, 'N': 5, 'UR': 1
      };

      return cards.slice().sort((a, b) => {
        if (sortKey === 'id') {
          const idA = String(a.id || '');
          const idB = String(b.id || '');
          return idA.localeCompare(idB, 'ja', { numeric: true });
        }
        if (sortKey === 'category') {
          const catA = categoryOrder[a.category] || 99;
          const catB = categoryOrder[b.category] || 99;
          if (catA !== catB) return catA - catB;
        }
        if (sortKey === 'type') {
          const tA = typeOrder[a.type] || 99;
          const tB = typeOrder[b.type] || 99;
          if (tA !== tB) return tA - tB;
        }
        if (sortKey === 'hp') {
          const hpA = Number(a.hp) || 0;
          const hpB = Number(b.hp) || 0;
          if (hpA !== hpB) return hpB - hpA;
        }
        if (sortKey === 'rarity') {
          const rA = rarityOrder[a.rarity] || 99;
          const rB = rarityOrder[b.rarity] || 99;
          if (rA !== rB) return rA - rB;
        }

        // デフォルト: 名前順 (あいうえお順 / アルファベット順)
        const nameA = String(a.name || '');
        const nameB = String(b.name || '');
        return nameA.localeCompare(nameB, 'ja');
      });
    },

    renderList() {
      const root = document.getElementById('cardList');
      if (!root) return;

      const searchEl = document.getElementById('searchInput');
      const categoryEl = document.getElementById('categoryFilter');
      const typeEl = document.getElementById('typeFilter');
      const rarityEl = document.getElementById('rarityFilter');
      const sortEl = document.getElementById('cardSortSelect');

      const search = searchEl ? searchEl.value.trim().toLowerCase() : '';
      const category = categoryEl ? categoryEl.value : '';
      const type = typeEl ? typeEl.value : '';
      const rarity = rarityEl ? rarityEl.value : '';
      const sortKey = sortEl ? sortEl.value : 'name';

      const filtered = (App.state && Array.isArray(App.state.cards) ? App.state.cards : []).filter((card) => {
        let matchCat = !category;
        if (category) {
          if (category === '進化') {
            matchCat = card.category === '進化' || card.category === '1進化' || card.category === '2進化';
          } else if (category === 'ex') {
            matchCat = card.category === 'ex' || card.category === 'たねex' || card.category === '1進化ex' || card.category === '2進化ex' || !!card.isEx;
          } else if (category === 'トレーナー') {
            matchCat = card.category === 'トレーナー' || card.category === 'グッズ' || card.category === 'サポート' || card.category === 'スタジアム';
          } else if (category === 'エネルギー') {
            matchCat = card.category === 'エネルギー' || card.category === '基本エネルギー' || card.category === '特殊エネルギー';
          } else if (category === '基本エネルギー') {
            matchCat = card.category === '基本エネルギー' || (card.category === 'エネルギー' && !String(card.name || '').includes('特殊') && !String(card.category || '').includes('特殊'));
          } else if (category === '特殊エネルギー') {
            matchCat = card.category === '特殊エネルギー' || (card.category === 'エネルギー' && (String(card.name || '').includes('特殊') || String(card.category || '').includes('特殊')));
          } else {
            matchCat = card.category === category;
          }
        }
        return (!search || String(card.name).toLowerCase().includes(search)) &&
          matchCat &&
          (!type || card.type === type) &&
          (!rarity || card.rarity === rarity);
      });

      const cards = this.sortCards(filtered, sortKey);

      if (!cards.length) {
        root.innerHTML = '<div class="empty-page"><div><h2>カードがありません</h2><p>条件を変えるか、新しいカードを作成してください。</p></div></div>';
        return;
      }

      root.innerHTML = cards.map((card) => this.tileHtml(card)).join('');

      root.querySelectorAll('[data-card-id]').forEach((tile) => {
        tile.addEventListener('click', () => {
          const card = App.state.cards.find((c) => String(c.id) === String(tile.dataset.cardId));
          if (card) this.showDetail(card);
        });
      });
    },

    getUserCollection() {
      try {
        const raw = localStorage.getItem('ORBITAL_USER_COLLECTION');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {};
    },

    saveUserCollection(map) {
      try {
        localStorage.setItem('ORBITAL_USER_COLLECTION', JSON.stringify(map));
      } catch (e) {}
      if (window.App && window.App.state) {
        window.App.state.userCollection = map;
      }
      if (window.App && typeof window.App.saveUserCollectionToGas === 'function') {
        window.App.saveUserCollectionToGas(map);
      }
    },

    addCardsToCollection(drawnCards) {
      if (!Array.isArray(drawnCards) || !drawnCards.length) return;
      const col = this.getUserCollection();
      drawnCards.forEach((c) => {
        if (!c) return;
        const key = String(c.id || c.name);
        col[key] = (col[key] || 0) + 1;
      });
      this.saveUserCollection(col);
      if (window.App && typeof window.App.saveUserCollectionToGas === 'function') {
        window.App.saveUserCollectionToGas(col);
      }
      if (window.App && window.App.state && window.App.state.page === 'collection') {
        this.renderCollectionPage();
      }
    },

    renderCollectionPage() {
      const root = document.getElementById('collectionCardGrid');
      if (!root) return;

      const searchEl = document.getElementById('collectionSearchInput');
      const categoryEl = document.getElementById('collectionCategoryFilter');
      const rarityEl = document.getElementById('collectionRarityFilter');
      const ownedEl = document.getElementById('collectionOwnedFilter');
      const sortEl = document.getElementById('collectionSortSelect');

      const search = searchEl ? searchEl.value.trim().toLowerCase() : '';
      const category = categoryEl ? categoryEl.value : '';
      const rarity = rarityEl ? rarityEl.value : '';
      const ownedFilter = ownedEl ? ownedEl.value : 'owned';
      const sortKey = sortEl ? sortEl.value : 'name';

      const allCards = (window.App && window.App.state && Array.isArray(window.App.state.cards)) ? window.App.state.cards : [];
      const colMap = this.getUserCollection();

      let ownedTypeCount = 0;
      allCards.forEach((c) => {
        const key = String(c.id || c.name);
        if ((colMap[key] || 0) > 0) ownedTypeCount++;
      });
      const totalCards = allCards.length;
      const percentage = totalCards > 0 ? Math.floor((ownedTypeCount / totalCards) * 100) : 0;

      const statsBadge = document.getElementById('collectionStatsBadge');
      if (statsBadge) {
        statsBadge.textContent = '全 ' + totalCards + ' 種類中 ' + ownedTypeCount + ' 種類 獲得済み (' + percentage + '%)';
      }

      const filtered = allCards.filter((card) => {
        const key = String(card.id || card.name);
        const count = colMap[key] || 0;

        // ユーザー要求: コレクションは「入手したカードのみ」表示 (デフォルトは count > 0 のみ)
        if ((ownedFilter === 'owned' || !ownedFilter) && count <= 0) return false;
        if (ownedFilter === 'unowned' && count > 0) return false;

        let matchCat = !category;
        if (category) {
          if (category === '進化') {
            matchCat = card.category === '進化' || card.category === '1進化' || card.category === '2進化';
          } else if (category === 'ex') {
            matchCat = card.category === 'ex' || card.category === 'たneex' || card.category === '1進化ex' || card.category === '2進化ex' || !!card.isEx;
          } else if (category === 'トレーナー') {
            matchCat = card.category === 'トレーナー' || card.category === 'グッズ' || card.category === 'サポート' || card.category === 'スタジアム';
          } else if (category === 'エネルギー') {
            matchCat = card.category === 'エネルギー' || card.category === '基本エネルギー' || card.category === '特殊エネルギー';
          } else if (category === '基本エネルギー') {
            matchCat = card.category === '基本エネルギー' || (card.category === 'エネルギー' && !String(card.name || '').includes('特殊') && !String(card.category || '').includes('特殊'));
          } else if (category === '特殊エネルギー') {
            matchCat = card.category === '特殊エネルギー' || (card.category === 'エネルギー' && (String(card.name || '').includes('特殊') || String(card.category || '').includes('特殊')));
          } else {
            matchCat = card.category === category;
          }
        }

        return (!search || String(card.name).toLowerCase().includes(search)) &&
          matchCat &&
          (!rarity || card.rarity === rarity);
      });

      const cards = this.sortCards(filtered, sortKey);

      if (!cards.length) {
        root.innerHTML = '<div class="empty-page"><div><h2>所持しているカードがありません</h2><p>条件を変更するか、パックを開封してカードを獲得しましょう！</p></div></div>';
        return;
      }

      root.innerHTML = cards.map((card) => {
        const key = String(card.id || card.name);
        const count = colMap[key] || 0;
        const isUnowned = count <= 0;
        const countHtml = '<div class="pool-in-deck-badge" style="top: 8px; right: 8px; z-index: 10; background: ' + (isUnowned ? 'rgba(100,116,139,0.85)' : 'linear-gradient(135deg, #6366f1, #38bdf8)') + ';">' + (isUnowned ? '未所持' : '所持: ' + count + '枚') + '</div>';
        const cardHtml = this.createCardHtml(card, { size: 'normal' });
        return '<div class="collection-item ' + (isUnowned ? 'card-unowned' : '') + '" style="position: relative;">' +
          countHtml +
          cardHtml +
          '</div>';
      }).join('');

      root.querySelectorAll('[data-card-id]').forEach((tile) => {
        tile.addEventListener('click', () => {
          const card = (window.App?.state?.cards || []).find((c) => String(c.id) === String(tile.dataset.cardId));
          if (card) this.showDetail(card);
        });
      });
    },

    renderRecent() {
      const root = document.getElementById('recentCards');
      const cards = App.state.cards.slice(0, 6);
      root.innerHTML = cards.length ?
      cards.map((card) => this.tileHtml(card)).join('') :
      '<div class="muted">まだカードがありません。</div>';

      root.querySelectorAll('[data-card-id]').forEach((tile) => {
        tile.addEventListener('click', () => {
          const card = App.state.cards.find((c) => String(c.id) === String(tile.dataset.cardId));
          if (card) this.showDetail(card);
        });
      });
    },

    findCardImage(name, id) {
      if (!name && !id) return '';
      const pool = [
        ...(window.App?.state?.cards || []),
        ...(window.CardSystem?.state?.cards || []),
        ...(window.DeckSystem?.state?.cardPool || [])
      ];
      const match = pool.find((c) => c && c.image && ((id && String(c.id) === String(id)) || (name && String(c.name) === String(name))));
      if (match && match.image) return String(match.image).trim();

      const defaultMap = {
        'ピカチュウ': 'https://images.pokemontcg.io/sv3pt5/25_hires.png',
        'ミライドンex': 'https://images.pokemontcg.io/sv1/81_hires.png',
        'ライチュウ': 'https://images.pokemontcg.io/sv3pt5/26_hires.png',
        'ヒトカゲ': 'https://images.pokemontcg.io/sv3pt5/4_hires.png',
        'リザード': 'https://images.pokemontcg.io/sv3pt5/5_hires.png',
        'リザードンex': 'https://images.pokemontcg.io/sv3pt5/6_hires.png',
        'リザードン': 'https://images.pokemontcg.io/pgo/10_hires.png',
        'ゼニガメ': 'https://images.pokemontcg.io/sv3pt5/7_hires.png',
        'カメール': 'https://images.pokemontcg.io/sv3pt5/8_hires.png',
        'カメックスex': 'https://images.pokemontcg.io/sv3pt5/9_hires.png',
        'カメックス': 'https://images.pokemontcg.io/pgo/17_hires.png',
        '博士の研究': 'https://images.pokemontcg.io/sv1/189_hires.png',
        'ボスの指令': 'https://images.pokemontcg.io/sv2/172_hires.png',
        'きずぐすり': 'https://images.pokemontcg.io/sv1/182_hires.png',
        'ポケモンいれかえ': 'https://images.pokemontcg.io/sv1/191_hires.png',
        '基本雷エネルギー': 'https://images.pokemontcg.io/sve/4_hires.png',
        '基本炎エネルギー': 'https://images.pokemontcg.io/sve/2_hires.png',
        '基本水エネルギー': 'https://images.pokemontcg.io/sve/3_hires.png'
      };
      const cleanName = String(name || '').trim();
      return defaultMap[cleanName] || '';
    },

    createCardHtml(cardInput, options = {}) {
      if (!cardInput) cardInput = {};
      let card = cardInput;
      const pool = [
        ...(window.App?.state?.cards || []),
        ...(window.CardSystem?.state?.cards || []),
        ...(window.DeckSystem?.state?.cardPool || [])
      ];
      if (pool.length > 0) {
        const master = pool.find(c => c && ((c.id && cardInput.id && String(c.id) === String(cardInput.id)) || (c.name && cardInput.name && String(c.name).trim() === String(cardInput.name).trim())));
        if (master) {
          card = Object.assign({}, master, cardInput, {
            image: cardInput.image || master.image,
            hp: cardInput.hp != null && cardInput.hp !== '' ? cardInput.hp : master.hp,
            maxHp: master.hp || cardInput.maxHp || cardInput.hp || 100,
            abilityName: master.abilityName || cardInput.abilityName,
            abilityText: master.abilityText || cardInput.abilityText,
            attack1Name: master.attack1Name || cardInput.attack1Name,
            attack1Damage: master.attack1Damage != null && master.attack1Damage !== '' ? master.attack1Damage : cardInput.attack1Damage,
            attack1Text: master.attack1Text || cardInput.attack1Text,
            attack1Energy: master.attack1Energy || cardInput.attack1Energy,
            attack2Name: master.attack2Name || cardInput.attack2Name,
            attack2Damage: master.attack2Damage != null && master.attack2Damage !== '' ? master.attack2Damage : cardInput.attack2Damage,
            attack2Text: master.attack2Text || cardInput.attack2Text,
            attack2Energy: master.attack2Energy || cardInput.attack2Energy,
            description: master.description || cardInput.description,
            preEvolution: master.preEvolution || cardInput.preEvolution,
            artLayout: master.artLayout || cardInput.artLayout || 'standard',
            imageFit: master.imageFit || cardInput.imageFit || 'cover',
            imageScale: master.imageScale != null ? master.imageScale : cardInput.imageScale,
            imageX: master.imageX != null ? master.imageX : cardInput.imageX,
            imageY: master.imageY != null ? master.imageY : cardInput.imageY
          });
        }
      }

      const size = options.size || 'normal'; // 'normal' | 'lg' | 'sm' | 'battle' | 'bench' | 'hand'
      const inDeckCount = Number(options.inDeckCount) || 0;
      const isMax = !!options.isMax;
      const symbol = this.typeSymbols[card.type] || '✦';

      // エネルギー記号の描画
      const renderEnergy = (energyStr) => {
        const list = this.parseEnergyList(energyStr);
        if (!list || list.length === 0) return '';
        return list.map((e) => {
          const sym = this.typeSymbols[e] || e;
          return "<span class=\"energy-pip type-" + this.escape(e) + "\" title=\"" + this.escape(e) + "\">" + sym + "</span>";
        }).join('');
      };

      // 画像スタイルとサイズ調整パラメータ
      const scale = Math.max(20, Math.min(400, Number(card.imageScale) || 100));
      const fit = card.imageFit === 'contain' || card.imageFit === 'fill' ? card.imageFit : 'cover';
      const posX = card.imageX != null && card.imageX !== '' ? Math.max(0, Math.min(100, Number(card.imageX))) : 50;
      const posY = card.imageY != null && card.imageY !== '' ? Math.max(0, Math.min(100, Number(card.imageY))) : 50;
      const heightStyle = card.imageHeight && Number(card.imageHeight) > 0 ? "style=\"height: " + Number(card.imageHeight) + "%;\"" : '';

      const imgStyle = "object-fit: " + fit + "; object-position: " + posX + "% " + posY + "%; transform: scale(" + scale / 100 + "); transform-origin: " + posX + "% " + posY + "%;";

      const rawImgUrl = String(
        card.image || card.imageUrl || card.image_url ||
        card['画像'] || card['画像URL'] || card['画像url'] || card['イラスト'] || card['URL'] || card['url'] ||
        (typeof this.findCardImage === 'function' ? this.findCardImage(card.name, card.id) : '') || ''
      ).trim();

      let imgUrl = rawImgUrl;
      const driveMatch = rawImgUrl.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?export=view&id=)|lh3\.googleusercontent\.com\/d\/)([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        imgUrl = 'https://lh3.googleusercontent.com/d/' + driveMatch[1];
      }

      // 画像 / テクスチャアート (真ん中から上)
      const artHtml = imgUrl ? "<img src=\"" +

    populatePreEvolutionSelect(selectedVal) {
      const select = document.getElementById('preEvolution');
      if (!select) return;
      const currentVal = selectedVal != null ? String(selectedVal).trim() : (select.value || '').trim();
      const currentCardId = App.state.editingCardId;

      const cards = (App.state.cards || []).filter((c) => {
        if (!c || !c.name) return false;
        if (currentCardId && String(c.id) === String(currentCardId)) return false;
        const cat = String(c.category || '');
        return cat !== 'グッズ' && cat !== 'サポート' && cat !== 'トレーナー' && cat !== 'スタジアム' && cat !== 'エネルギー' && cat !== '基本エネルギー' && cat !== '特殊エネルギー';
      });

      const groups = {
        'たねポケモン': [],
        '1進化ポケモン': [],
        'その他': []
      };

      cards.forEach((c) => {
        const cat = String(c.category || '');
        if (cat.includes('たね')) {
          groups['たねポケモン'].push(c);
        } else if (cat.includes('1進化')) {
          groups['1進化ポケモン'].push(c);
        } else {
          groups['その他'].push(c);
        }
      });

      let html = '<option value="">（進化前なし / 選択してください）</option>';

      Object.keys(groups).forEach((groupName) => {
        const list = groups[groupName];
        if (!list || list.length === 0) return;
        html += '<optgroup label="' + this.escape(groupName) + '">';
        list.forEach((c) => {
          const isSelected = (currentVal && (String(c.id) === currentVal || String(c.name) === currentVal)) ? 'selected' : '';
          const typeSym = this.typeSymbols[c.type] || c.type || '';
          html += '<option value="' + this.escape(c.id) + '" ' + isSelected + '>' +
            this.escape(c.name) + ' [' + this.escape(c.category || 'たね') + ' / ' + typeSym + ' ' + this.escape(c.type || '無') + ' / HP' + this.escape(c.hp || '?') + ']' +
            '</option>';
        });
        html += '</optgroup>';
      });

      select.innerHTML = html;
      if (currentVal) {
        select.value = currentVal;
      }
    },

        };

        imageX,
        imageY,

        abilityText: val('abilityText'),
        abilityCode: val('abilityCode'),
        attack1Name: val('attack1Name') || (val('abilityName') ? '' : 'ワザ名'),
        attack1Damage: val('attack1Damage') !== '' ? val('attack1Damage') : (val('abilityName') ? '' : '30'),
        attack1Energy: val('attack1Energy') || (val('abilityName') ? '' : val('type') || '草'),
        attack1Text: val('attack1Text'),
        attack1Code: val('attack1Code'),
        attack2Name: val('attack2Name'),
        attack2Damage: val('attack2Damage'),
        attack2Energy: val('attack2Energy'),
        attack2Text: val('attack2Text'),
        attack2Code: val('attack2Code'),
        weakness: val('weakness'),
        resistance: val('resistance'),
        retreat: val('retreat'),

      };

    resetEditor() {

    resetImageAdjust() {

        const el = document.getElementById(id);
        if (el) el.value = v;
      };
      set('imageScale', 100);
      set('imageFit', 'cover');
      set('imageX', 50);
      set('imageY', 50);

      set('textSize', 'standard');
      this.syncImageAdjustBadges();

    syncImageAdjustBadges() {
      const scaleEl = document.getElementById('imageScale');
      const scaleValEl = document.getElementById('imageScaleVal');
      if (scaleEl && scaleValEl) {
        scaleValEl.textContent = scaleEl.value + "%";

      const yValEl = document.getElementById('imageYVal');
      if (yEl && yValEl) {
        const y = Number(yEl.value);

        if (y <= 25) label = "上寄り (" + y + "%)";else
        if (y >= 75) label = "下寄り (" + y + "%)";else
        if (y === 50) label = "中央 (50%)";
        yValEl.textContent = label;

          chip.classList.toggle('active', Number(chip.dataset.val) === y);
        });
      }

      const xEl = document.getElementById('imageX');
      const xValEl = document.getElementById('imageXVal');
      if (xEl && xValEl) {
        const x = Number(xEl.value);
        let label = x + "%";
        if (x <= 25) label = "左寄り (" + x + "%)";else
        if (x >= 75) label = "右寄り (" + x + "%)";else
        if (x === 50) label = "中央 (50%)";
        xValEl.textContent = label;
        document.querySelectorAll('.adjust-chip[data-target="imageX"]').forEach((chip) => {
          chip.classList.toggle('active', Number(chip.dataset.val) === x);
        });
      }

    edit(card) {
      if (!App.requireAdmin()) return;
      App.state.editingCardId = card.id;
      const titleEl = document.getElementById('editorTitle');
      if (titleEl) titleEl.textContent = 'カード編集';
      const set = (id, v) => {
        const el = document.getElementById(id);
        if (el) el.value = v == null ? '' : v;
      };
      set('cardId', card.id);
      set('name', card.name);
      set('category', card.category);
      set('preEvolution', card.preEvolution);
      set('type', card.type);
      set('rarity', card.rarity);
      set('hp', card.hp);
      set('image', card.image);
      set('imageScale', card.imageScale != null && card.imageScale !== '' ? card.imageScale : 100);
      set('imageFit', card.imageFit || 'cover');
      set('imageX', card.imageX != null && card.imageX !== '' ? card.imageX : 50);
      set('imageY', card.imageY != null && card.imageY !== '' ? card.imageY : 50);
      set('imageHeight', card.imageHeight || '');
      set('artLayout', card.artLayout || 'standard');
      set('textSize', card.textSize || 'standard');
      this.syncImageAdjustBadges();

      set('abilityName', card.abilityName);
      set('abilityText', card.abilityText);
      set('abilityCode', card.abilityCode);
      set('attack1Name', card.attack1Name);
      set('attack1Damage', card.attack1Damage);
      set('attack1Energy', card.attack1Energy);
      set('attack1Text', card.attack1Text);
      set('attack1Code', card.attack1Code);
      set('attack2Name', card.attack2Name);
      set('attack2Damage', card.attack2Damage);
      set('attack2Energy', card.attack2Energy);
      set('attack2Text', card.attack2Text);
      set('attack2Code', card.attack2Code);
      set('weakness', card.weakness);
      set('resistance', card.resistance);
      set('retreat', card.retreat);
      set('description', card.description);

      const updateSummary = (target, text, code) => {
        const el = document.getElementById(target + "EffectSummary");
        if (!el) return;
        const disp = text || this.makeEffectDisplayText(code);
        el.textContent = disp ? "✦ 設定効果: " + disp : code ? '✦ 設定効果: JavaScript効果設定済み' : '';
      };
      updateSummary('ability', card.abilityText, card.abilityCode);
      updateSummary('attack1', card.attack1Text, card.attack1Code);
      updateSummary('attack2', card.attack2Text, card.attack2Code);

      const isTrainer = card.category === 'グッズ' || card.category === 'サポート' || card.category === 'トレーナー' || card.category === 'スタジアム' || card.category === '特殊エネルギー';
      if (isTrainer) {
        const trDisp = card.attack1Text || card.description || this.makeEffectDisplayText(card.attack1Code);
        const trSummary = document.getElementById('trainerEffectSummary');
        if (trSummary) {
          trSummary.textContent = trDisp ? "✦ 設定効果: " + trDisp : card.attack1Code ? '✦ 設定効果: JavaScript効果設定済み' : '';
        }
      }

      this.syncCategoryForm();
      this.populatePreEvolutionSelect(card.preEvolution);
      const uploadStatus = document.getElementById('uploadStatus');
      if (uploadStatus) uploadStatus.textContent = '';
      this.updatePreview();
      App.showPage('create');
    },

    save() {
      if (this._isSaving) return;
      if (!App.requireAdmin()) return;
      const card = this.getFormCard();
      if (!card.name.trim()) {
        App.toast('カード名を入力してください。', true);
        return;
      }

      // 新規作成時はクライアント側で一意のIDを前もって生成・固定し、重複入力を防止
      if (!card.id) {
        card.id = 'card_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
        const cardIdEl = document.getElementById('cardId');
        if (cardIdEl) cardIdEl.value = card.id;
      }

      this._isSaving = true;
      const saveBtn = document.getElementById('saveCardButton');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = '保存中…';
      }

      google.script.run.
      withSuccessHandler((res) => {
        this._isSaving = false;
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = '保存する';
        }
        if (!res.ok) {
          App.toast(res.message || '保存できませんでした。', true);
          return;
        }
        App.toast(res.mode === 'created' ? 'カードを作成しました。' : 'カードを更新しました。');
        this.resetEditor();
        App.loadCards();
        App.showPage('cards');
      }).
      withFailureHandler((err) => {
        this._isSaving = false;
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = '保存する';
        }
        App.toast("保存失敗: " + (err.message || err), true);
      }).
      saveCard(card, App.state.adminToken);
    },

    uploadImage() {
      if (!App.requireAdmin()) return;
      const fileInput = document.getElementById('imageFile');
      const file = fileInput && fileInput.files && fileInput.files[0];
      if (!file) {
        App.toast('画像ファイルを選択してください。', true);
        return;
      }
      const status = document.getElementById('uploadStatus');
      const uploadBtn = document.getElementById('uploadImageButton');
      if (uploadBtn) uploadBtn.disabled = true;
      if (status) status.textContent = 'アップロード中…';

      const reader = new FileReader();
      reader.onload = (e) => {
        const base64Data = e.target.result;
        google.script.run.
        withSuccessHandler((res) => {
          if (uploadBtn) uploadBtn.disabled = false;
          if (status) status.textContent = '保存完了';
          if (res.ok && res.url) {
            const imageEl = document.getElementById('image');
            if (imageEl) imageEl.value = res.url;
            CardSystem.updatePreview();
            App.toast('画像をDriveに保存しました。');
          }
        }).
        withFailureHandler((err) => {
          if (uploadBtn) uploadBtn.disabled = false;
          if (status) status.textContent = '失敗';
          App.toast("画像アップロード失敗: " + (err.message || err), true);
        }).
        uploadCardImage(file.name, file.type, base64Data, App.state.adminToken);
      };
      reader.readAsDataURL(file);
    },

    init() {
      this.syncCategoryForm();
      this.bindImageControls();
      this.syncImageAdjustBadges();
      this.updatePreview();
      this.bindPreviewToggle();
      this.renderApiHelpGrid();
    },

    bindImageControls() {
      const scaleInput = document.getElementById('imageScale');
      const scaleDownBtn = document.getElementById('btnScaleDown');
      const scaleUpBtn = document.getElementById('btnScaleUp');
      const fitSelect = document.getElementById('imageFit');
      const yInput = document.getElementById('imageY');
      const xInput = document.getElementById('imageX');
      const heightSelect = document.getElementById('imageHeight');
      const resetBtn = document.getElementById('resetImageAdjustBtn');

      if (scaleInput && !scaleInput.dataset.bound) {
        scaleInput.dataset.bound = 'true';
        scaleInput.addEventListener('input', () => {
          this.syncImageAdjustBadges();
          this.updatePreview();
        });
      }

      if (scaleDownBtn && !scaleDownBtn.dataset.bound) {
        scaleDownBtn.dataset.bound = 'true';
        scaleDownBtn.addEventListener('click', () => {
          if (scaleInput) {
            scaleInput.value = Math.max(40, Number(scaleInput.value) - 10);
            this.syncImageAdjustBadges();
            this.updatePreview();
          }
        });
      }

      if (scaleUpBtn && !scaleUpBtn.dataset.bound) {
        scaleUpBtn.dataset.bound = 'true';
        scaleUpBtn.addEventListener('click', () => {
          if (scaleInput) {
            scaleInput.value = Math.min(250, Number(scaleInput.value) + 10);
            this.syncImageAdjustBadges();
            this.updatePreview();
          }
        });
      }

      if (yInput && !yInput.dataset.bound) {
        yInput.dataset.bound = 'true';
        yInput.addEventListener('input', () => {
          this.syncImageAdjustBadges();
          this.updatePreview();
        });
      }

      if (xInput && !xInput.dataset.bound) {
        xInput.dataset.bound = 'true';
        xInput.addEventListener('input', () => {
          this.syncImageAdjustBadges();
          this.updatePreview();
        });
      }

      if (fitSelect && !fitSelect.dataset.bound) {
        fitSelect.dataset.bound = 'true';
        fitSelect.addEventListener('change', () => this.updatePreview());
      }

      if (heightSelect && !heightSelect.dataset.bound) {
        heightSelect.dataset.bound = 'true';
        heightSelect.addEventListener('change', () => this.updatePreview());
      }

      const artLayoutSelect = document.getElementById('artLayout');
      if (artLayoutSelect && !artLayoutSelect.dataset.bound) {
        artLayoutSelect.dataset.bound = 'true';
        artLayoutSelect.addEventListener('change', () => this.updatePreview());
      }

      // クイック位置プリセットチップ
      document.querySelectorAll('.adjust-chip').forEach((chip) => {
        if (!chip.dataset.bound) {
          chip.dataset.bound = 'true';
          chip.addEventListener('click', () => {
            const targetId = chip.dataset.target;
            const targetVal = chip.dataset.val;
            const targetEl = document.getElementById(targetId);
            if (targetEl && targetVal != null) {
              targetEl.value = targetVal;
              this.syncImageAdjustBadges();
              this.updatePreview();
            }
          });

      });

      if (resetBtn && !resetBtn.dataset.bound) {
        resetBtn.dataset.bound = 'true';

          this.updatePreview();
        });

    bindPreviewToggle() {
      const btn = document.getElementById('previewToggleBtn');
      if (btn && !btn.dataset.bound) {
        btn.dataset.bound = 'true';
        btn.addEventListener('click', () => this.togglePreviewExpand());
      }
    },

    togglePreviewExpand() {
      const col = document.getElementById('previewColumn');
      const btn = document.getElementById('previewToggleBtn');
      if (!col) return;
      const isExpanded = col.classList.toggle('is-expanded');
      if (btn) {
        btn.textContent = isExpanded ? '✕ プレビュー縮小' : '👁 プレビュー拡大';
      }
    },

    /* ============================================================
       専用カードピッカー (Card Picker UI)
       ============================================================ */
    _pickerOptions: {
      title: 'カードを選択',
      mode: 'multi',
      selectedIds: new Set(),
      filterType: 'all',
      onConfirm: null
    },

    escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    },

    openCardPicker(options = {}) {
      const opts = Object.assign({
        title: 'カードを選択',
        mode: 'multi',
        filterOwnedOnly: false,
        selectedIds: [],
        onConfirm: null
      }, options);

      this._pickerOptions = {
        title: opts.title,
        mode: opts.mode,
        filterOwnedOnly: opts.filterOwnedOnly,
        selectedIds: new Set(opts.selectedIds || []),
        filterType: 'all',
        onConfirm: opts.onConfirm
      };

      const modal = document.getElementById('cardPickerModal');
      if (!modal) return;

      const titleEl = document.getElementById('cardPickerTitle');
      if (titleEl) titleEl.textContent = opts.title;

      const multiActions = document.getElementById('cardPickerMultiActions');
      if (multiActions) multiActions.style.display = opts.mode === 'multi' ? 'flex' : 'none';

      const modeLabel = document.getElementById('cardPickerModeLabel');
      if (modeLabel) modeLabel.textContent = opts.mode === 'multi' ? '[複数選択モード]' : (opts.filterOwnedOnly ? '[所持カード選択モード]' : '[単一選択モード]');

      const searchInput = document.getElementById('cardPickerSearchInput');
      if (searchInput) searchInput.value = '';

      document.querySelectorAll('.card-picker-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.pickerType === 'all');
      });

      modal.classList.remove('hidden');
      this.renderCardPickerGrid();
    },

    renderCardPickerGrid() {
      const container = document.getElementById('cardPickerGrid');
      if (!container) return;

      const searchInput = document.getElementById('cardPickerSearchInput');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const filterType = this._pickerOptions.filterType;
      const filterOwnedOnly = this._pickerOptions.filterOwnedOnly;

      const allCards = typeof App !== 'undefined' && App.getAllCards ? App.getAllCards() : (this.masterCards || []);

      const filtered = allCards.filter(c => {
        if (filterOwnedOnly && typeof App !== 'undefined' && App.getUserCardCount) {
          if (App.getUserCardCount(c.id) <= 0) return false;
        }
        if (filterType !== 'all') {
          const category = (c.category || '').toLowerCase();
          if (filterType === 'pokemon' && !category.includes('ポケモン')) return false;
          if (filterType === 'trainer' && !category.includes('トレーナー') && !category.includes('サポート') && !category.includes('グッズ')) return false;
          if (filterType === 'energy' && !category.includes('エネルギー')) return false;
        }
        if (query) {
          const nameMatch = (c.name || '').toLowerCase().includes(query);
          const idMatch = (c.id || '').toLowerCase().includes(query);
          const typeMatch = (c.type || '').toLowerCase().includes(query);
          const catMatch = (c.category || '').toLowerCase().includes(query);
          return nameMatch || idMatch || typeMatch || catMatch;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted); grid-column:1/-1;">該当するカードが見つかりません</div>';
        this.updateCardPickerCounter();
        return;
      }

      const selectedSet = this._pickerOptions.selectedIds;

      container.innerHTML = filtered.map(card => {
        const isSelected = selectedSet.has(card.id);
        const cardHtml = this.createCardHtml ? this.createCardHtml(card, { size: 'sm' }) : ('<div>' + this.escapeHtml(card.name) + '</div>');

        return '<div class="card-picker-item ' + (isSelected ? 'selected' : '') + '" data-card-id="' + this.escapeHtml(card.id) + '" onclick="CardSystem.togglePickerCard(\'' + this.escapeHtml(card.id) + '\')">' +
          '<div class="card-picker-badge ' + (isSelected ? 'active' : '') + '">' +
            (isSelected ? '✓ 選択中' : '選択') +
          '</div>' +
          '<div class="card-picker-frame">' +
            cardHtml +
          '</div>' +
          '<div class="card-picker-name-label">' + this.escapeHtml(card.name) + '</div>' +
        '</div>';
      }).join('');

      this.updateCardPickerCounter();
    },

    togglePickerCard(cardId) {
      const set = this._pickerOptions.selectedIds;
      if (this._pickerOptions.mode === 'single') {
        set.clear();
        set.add(cardId);
      } else {
        if (set.has(cardId)) set.delete(cardId);
        else set.add(cardId);
      }
      this.renderCardPickerGrid();
    },

    selectAllPickerCards() {
      if (this._pickerOptions.mode !== 'multi') return;
      const searchInput = document.getElementById('cardPickerSearchInput');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const filterType = this._pickerOptions.filterType;
      const allCards = typeof App !== 'undefined' && App.getAllCards ? App.getAllCards() : (this.masterCards || []);

      allCards.forEach(c => {
        if (filterType !== 'all') {
          const category = (c.category || '').toLowerCase();
          if (filterType === 'pokemon' && !category.includes('ポケモン')) return;
          if (filterType === 'trainer' && !category.includes('トレーナー') && !category.includes('サポート') && !category.includes('グッズ')) return;
          if (filterType === 'energy' && !category.includes('エネルギー')) return;
        }
        if (query) {
          const nameMatch = (c.name || '').toLowerCase().includes(query);
          const idMatch = (c.id || '').toLowerCase().includes(query);
          if (!nameMatch && !idMatch) return;
        }
        this._pickerOptions.selectedIds.add(c.id);
      });
      this.renderCardPickerGrid();
    },

    clearPickerSelection() {
      this._pickerOptions.selectedIds.clear();
      this.renderCardPickerGrid();
    },

    setPickerFilter(key, val, el) {
      if (key === 'type') {
        this._pickerOptions.filterType = val;
        document.querySelectorAll('.card-picker-tab').forEach(t => t.classList.remove('active'));
        if (el) el.classList.add('active');
        this.renderCardPickerGrid();
      }
    },

    updateCardPickerCounter() {
      const count = this._pickerOptions.selectedIds.size;
      const countEl = document.getElementById('cardPickerCount');
      const confirmCountEl = document.getElementById('cardPickerConfirmCount');
      if (countEl) countEl.textContent = count;
      if (confirmCountEl) confirmCountEl.textContent = count + '枚';
    },

    confirmCardPicker() {
      const selectedArr = Array.from(this._pickerOptions.selectedIds);
      if (typeof this._pickerOptions.onConfirm === 'function') {
        this._pickerOptions.onConfirm(selectedArr);
      }
      this.closeCardPicker();
    },

    closeCardPicker() {
      const modal = document.getElementById('cardPickerModal');
      if (modal) modal.classList.add('hidden');
    }
  };

  window.CardSystem = CardSystem;
  if (window.EffectEditor) {
    Object.keys(window.EffectEditor).forEach((key) => {
      if (CardSystem[key] === undefined) {
        CardSystem[key] = typeof window.EffectEditor[key] === 'function'
          ? function() { return window.EffectEditor[key].apply(window.EffectEditor, arguments); }
          : window.EffectEditor[key];
      }
    });
  }
  console.log('[ORBITAL] CardSystem.js.html finished execution. window.CardSystem =', typeof window.CardSystem);
  if (window.__showDebugMsg) window.__showDebugMsg('CardSystem準備完了 (' + typeof window.CardSystem + ')');

  // グローバルイベント委譲: App.init()の完了成否に依存せず100%確実にプレビュー更新とエディター起動を保証
  document.addEventListener('input', function (e) {
    if (e.target && (e.target.closest('#cardForm') || e.target.form?.id === 'cardForm')) {
      if (window.CardSystem && window.CardSystem.updatePreview) {
        window.CardSystem.updatePreview();
      }
    }
  }, true);

  document.addEventListener('change', function (e) {
    if (e.target && (e.target.closest('#cardForm') || e.target.form?.id === 'cardForm')) {
      if (window.CardSystem && window.CardSystem.updatePreview) {
        window.CardSystem.updatePreview();
      }
    }
    if (e.target && e.target.id === 'category' && window.CardSystem) {
      CardSystem.syncCategoryForm();
      CardSystem.updatePreview();
    }
  }, true);

  document.addEventListener('click', function (e) {
    const effectBtn = e.target.closest('#attack1EffectButton, #attack2EffectButton, #abilityEffectButton, #trainerEffectButton, .effect-editor-open');
    if (effectBtn && window.CardSystem) {
      e.preventDefault();
      let target = 'attack1';
      if (effectBtn.id === 'abilityEffectButton') target = 'ability';else
      if (effectBtn.id === 'attack2EffectButton') target = 'attack2';else
      if (effectBtn.id === 'trainerEffectButton') target = 'trainer';
      CardSystem.openEffectEditor(target);
      return;
    }

    // スニペット挿入
    const insertBtn = e.target.closest('[data-effect-insert]');
    if (insertBtn && window.CardSystem) {
      e.preventDefault();
      CardSystem.insertEffectCode(insertBtn.dataset.effectInsert || '');
      return;
    }

    // タブ切替
    const tabBtn = e.target.closest('[data-effect-tab]');
    if (tabBtn && window.CardSystem) {
      e.preventDefault();
      CardSystem.switchEffectTab(tabBtn.dataset.effectTab);
      return;
    }

    // 効果反映
    const saveEffectBtn = e.target.closest('#saveEffectEditorButton');
    if (saveEffectBtn && window.CardSystem) {
      e.preventDefault();
      CardSystem.applyEffectEditor();
      return;
    }

    // 効果エディター閉じる
    const closeBtn = e.target.closest('#closeEffectEditorButton, #cancelEffectEditorButton');
    if (closeBtn && window.CardSystem) {
      e.preventDefault();
      CardSystem.closeEffectEditor();
      return;
    }

    // 補完トグルボタン
    const toggleBtn = e.target.closest('#toggleCompletionButton');
    if (toggleBtn && window.CardSystem) {
      e.preventDefault();
      const popup = document.getElementById('effectCompletion');
      if (popup) {
        const isHidden = popup.style.display === 'none' || !popup.style.display;
        if (isHidden) {
          CardSystem.updateCompletion(true);
        } else {
          popup.style.display = 'none';
        }
      }
      return;
    }

    // 関数データリスト パネル トグル
    const funcListToggleBtn = e.target.closest('#toggleFunctionListButton');
    if (funcListToggleBtn && window.CardSystem) {
      e.preventDefault();
      CardSystem.toggleFunctionList();
      return;
    }

    // 関数データリスト 閉じるボタン
    const funcListCloseBtn = e.target.closest('#closeFunctionListButton');
    if (funcListCloseBtn && window.CardSystem) {
      e.preventDefault();
      CardSystem.toggleFunctionList(false);
      return;
    }

    // 関数データリスト カテゴリフィルター
    const catBtn = e.target.closest('.func-cat-btn');
    if (catBtn && window.CardSystem) {
      e.preventDefault();
      document.querySelectorAll('.func-cat-btn').forEach((b) => b.classList.toggle('active', b === catBtn));
      const cat = catBtn.dataset.funcCat || catBtn.dataset.cat || 'all';
      CardSystem.activeFuncCat = cat;
      const searchInput = document.getElementById('funcListSearchInput');
      CardSystem.renderFunctionList(searchInput ? searchInput.value : '', cat);
      return;
    }

    // 関数データリスト スニペット挿入
    const insertSnippetBtn = e.target.closest('[data-insert-snippet]');
    if (insertSnippetBtn && window.CardSystem) {
      e.preventDefault();
      const snippet = insertSnippetBtn.getAttribute('data-insert-snippet') || '';
      CardSystem.insertEffectCode(snippet);
      const originalText = insertSnippetBtn.textContent;
      insertSnippetBtn.textContent = '✔ 挿入済';
      setTimeout(() => {
        insertSnippetBtn.textContent = originalText;
      }, 1200);
      return;
    }

    // 関数データリスト スニペットコピー
    const copySnippetBtn = e.target.closest('[data-copy-snippet]');
    if (copySnippetBtn) {
      e.preventDefault();
      const snippet = copySnippetBtn.getAttribute('data-copy-snippet') || '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(snippet).then(() => {
          const orig = copySnippetBtn.textContent;
          copySnippetBtn.textContent = '✔ コピー済';
          setTimeout(() => {
            copySnippetBtn.textContent = orig;
          }, 1200);
        }).catch(() => {});
      }
      return;
    }

    // 自動補完ON/OFF切り替えボタン
    const autoToggleBtn = e.target.closest('#toggleAutoCompletionButton');
    if (autoToggleBtn && window.CardSystem) {
      e.preventDefault();
      const ed = window.CardSystem.effectEditor;
      ed.autoCompletionEnabled = !ed.autoCompletionEnabled;
      autoToggleBtn.textContent = ed.autoCompletionEnabled ? '⚡ 自動補完: ON' : '⚡ 自動補完: OFF';
      autoToggleBtn.classList.toggle('active', ed.autoCompletionEnabled);
      const popup = document.getElementById('effectCompletion');
      if (!ed.autoCompletionEnabled && popup) {
        popup.style.display = 'none';
      }
      return;
    }

    // 補完ずらしボタン
    const shiftBtn = e.target.closest('#shiftCompletionButton');
    if (shiftBtn && window.CardSystem) {
      e.preventDefault();
      CardSystem.toggleCompletionDock();
      return;
    }

    // エディター外クリックで補完ポップアップを閉じる (ツールバーやポップアップ内のクリックは除外)
    const popup = document.getElementById('effectCompletion');
    if (popup && !e.target.closest('.code-editor-wrapper') && !e.target.closest('.effect-code-toolbar') && !e.target.closest('#effectCompletion')) {
      popup.style.display = 'none';
    }
  }, true);

  // 日本語IME変換確定検知 (確定Enterでの誤爆防止)
  document.addEventListener('compositionend', function (e) {
    if (e.target && e.target.id === 'effectCodeEditor' && window.CardSystem) {
      window.CardSystem.effectEditor.lastCompositionEndTime = Date.now();
    }
  }, true);

  // エディターキーボード＆入力委譲
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'effectCodeEditor' && window.CardSystem) {
      CardSystem.updateCodePreview();
      CardSystem.updateCompletion();
    }
    if (e.target && e.target.id === 'completionSearchInput' && window.CardSystem) {
      CardSystem.filterCompletionByQuery(e.target.value);
    }
    if (e.target && e.target.id === 'funcListSearchInput' && window.CardSystem) {
      CardSystem.renderFunctionList(e.target.value, CardSystem.activeFuncCat || 'all');
    }
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'effectCodeEditor' && window.CardSystem) {
      CardSystem.handleEditorKeydown(e);
    }
  }, true);
})();
</script>
