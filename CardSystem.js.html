<script>
  console.log('[ORBITAL] CardSystem.js.html started execution');
  if (window.__showDebugMsg) window.__showDebugMsg('CardSystem読込開始');
  var CardSystem;
  (() => {
    'use strict';

    const CardSystem = {
      typeSymbols: {
        '草': '🌿', '炎': '🔥', '水': '💧', '雷': '⚡', '超': '👁️',
        '闘': '🥊', '悪': '🌙', '鋼': '⚙️', 'ドラゴン': '🐉', '無色': '⚪',
        '火': '🔥', '無': '⚪', '光': '☀️', '闇': '🌑', '風': '🌪️', '土': '🪨'
      },

      escape(v) {
        return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      },

      parseEnergyList(energyStr) {
        if (energyStr == null) return [];
        if (typeof energyStr === 'number') {
          return Array(Math.max(0, Math.floor(energyStr))).fill('無');
        }
        const raw = String(energyStr).trim();
        if (!raw || /^(0|なし|0個|不要|none|free|-|ー|—)$/i.test(raw)) {
          return [];
        }
        if (/^\d+$/.test(raw)) {
          return Array(Number(raw)).fill('無');
        }

        let normalized = raw.replace(/(ドラゴン|無色|colorless|lightning|fighting|darkness|psychic|dragon|grass|metal|water|fire|[草炎火水雷超闘悪鋼無光闇風土])\s*(?:[×*x]|個|\s)\s*(\d+)個?/gi, '$1$2');
        const chunks = normalized.split(/[\s,、，/／・+＋|｜]+/).filter(Boolean);
        const result = [];
        const tokenRegex = /(ドラゴン|無色|colorless|lightning|fighting|darkness|psychic|dragon|grass|metal|water|fire|[草炎火水雷超闘悪鋼無光闇風土])(?:\s*[×*x]?\s*(\d+))?/gi;

        for (let i = 0; i < chunks.length; i++) {
          const chunk = chunks[i];
          if (/^\d+個?$/.test(chunk)) {
            const num = parseInt(chunk, 10) || 0;
            for (let k = 0; k < num; k++) result.push('無');
            continue;
          }
          let matchFound = false;
          tokenRegex.lastIndex = 0;
          let m;
          while ((m = tokenRegex.exec(chunk)) !== null) {
            matchFound = true;
            const type = m[1];
            const count = m[2] ? parseInt(m[2], 10) : 1;
            for (let k = 0; k < count; k++) {
              result.push(type);
            }
          }
          if (!matchFound && chunk.length === 1 && !/\s/.test(chunk)) {
            result.push(chunk);
          }
        }
        return result;
      },

      get effectEditor() {
        return window.EffectEditor ? window.EffectEditor.effectEditor : null;
      },

      showMessage(msg, type = 'info') {
        if (window.App && typeof window.App.toast === 'function') {
          window.App.toast(msg, type === 'error' || type === 'warning');
        } else {
          alert(msg);
        }
      },

      getAdminToken() {
        return (window.App && window.App.state && window.App.state.adminToken) || '';
      },

      openEffectEditor(target) {
        if (window.EffectEditor) return window.EffectEditor.openEffectEditor(target);
      },
      closeEffectEditor() {
        if (window.EffectEditor) return window.EffectEditor.closeEffectEditor();
      },
      applyEffectEditor() {
        if (window.EffectEditor) return window.EffectEditor.applyEffectEditor();
      },
      insertEffectCode(snippet) {
        if (window.EffectEditor) return window.EffectEditor.insertEffectCode(snippet);
      },
      switchEffectTab(tab) {
        if (window.EffectEditor) return window.EffectEditor.switchEffectTab(tab);
      },
      updateCompletion(force) {
        if (window.EffectEditor) return window.EffectEditor.updateCompletion(force);
      },
      toggleFunctionList(open) {
        if (window.EffectEditor) return window.EffectEditor.toggleFunctionList(open);
      },
      renderFunctionList(search, cat) {
        if (window.EffectEditor) return window.EffectEditor.renderFunctionList(search, cat);
      },
      renderApiHelpGrid() {
        if (window.EffectEditor) return window.EffectEditor.renderApiHelpGrid();
      },
      updateCodePreview() {
        if (window.EffectEditor) return window.EffectEditor.updateCodePreview();
      },
      filterCompletionByQuery(q) {
        if (window.EffectEditor) return window.EffectEditor.filterCompletionByQuery(q);
      },
      handleEditorKeydown(e) {
        if (window.EffectEditor) return window.EffectEditor.handleEditorKeydown(e);
      },
      toggleCompletionDock() {
        if (window.EffectEditor) return window.EffectEditor.toggleCompletionDock();
      },
      makeEffectDisplayText(code) {
        if (window.EffectEditor && window.EffectEditor.makeEffectDisplayText) {
          return window.EffectEditor.makeEffectDisplayText(code);
        }
        return '';
      },

      updatePreview() {
        const card = this.getFormCard();
        const root = document.getElementById('cardPreview');
        if (root) {
          root.innerHTML = this.createCardHtml(card, { size: 'lg' });
        }
      },

      delete(card) {
        if (!App.requireAdmin()) return;
        if (!confirm('本当に「' + card.name + '」を削除しますか？')) return;
        App.closeModal();
        google.script.run
          .withSuccessHandler((res) => {
            if (!res.ok) {
              App.toast(res.message || '削除できませんでした。', true);
              return;
            }
            App.toast('カードを削除しました。');
            App.loadCards();
            App.showPage('cards');
          })
          .withFailureHandler((err) => {
            App.toast('削除失敗: ' + (err.message || err), true);
          })
          .deleteCard(card.id, App.state.adminToken);
      },

      renderList() {
        const root = document.getElementById('cardList');
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        const category = document.getElementById('categoryFilter').value;
        const type = document.getElementById('typeFilter').value;
        const rarity = document.getElementById('rarityFilter').value;

        const cards = App.state.cards.filter((card) => {
          let matchCat = !category;
          if (category) {
            if (category === '進化') {
              matchCat = card.category === '進化' || card.category === '1進化' || card.category === '2進化';
            } else if (category === 'ex') {
              matchCat = card.category === 'ex' || card.category === 'たねex' || card.category === '1進化ex' || card.category === '2進化ex' || !!card.isEx;
            } else {
              matchCat = card.category === category;
            }
          }
          return (!search || String(card.name).toLowerCase().includes(search)) &&
            matchCat &&
            (!type || card.type === type) &&
            (!rarity || card.rarity === rarity);
        });

        if (!cards.length) {
          root.innerHTML = '<div class="empty-page"><div><h2>カードがありません</h2><p>条件を変えるか、新しいカードを作成してください。</p></div></div>';
          return;
        }

        root.innerHTML = cards.map((card) => this.tileHtml(card)).join('');

        root.querySelectorAll('[data-card-id]').forEach((tile) => {
          tile.addEventListener('click', () => {
            const card = App.state.cards.find((c) => String(c.id) === String(tile.dataset.cardId));
            if (card) this.showDetail(card);
          });
        });
      },

      renderRecent() {
        const root = document.getElementById('recentCards');
        const cards = App.state.cards.slice(0, 6);
        root.innerHTML = cards.length ?
          cards.map((card) => this.tileHtml(card)).join('') :
          '<div class="muted">まだカードがありません。</div>';

        root.querySelectorAll('[data-card-id]').forEach((tile) => {
          tile.addEventListener('click', () => {
            const card = App.state.cards.find((c) => String(c.id) === String(tile.dataset.cardId));
            if (card) this.showDetail(card);
          });
        });
      },

      findCardImage(name, id) {
        if (!name && !id) return '';
        const pool = [
          ...(window.App?.state?.cards || []),
          ...(window.CardSystem?.state?.cards || []),
          ...(window.DeckSystem?.state?.cardPool || [])
        ];
        const match = pool.find((c) => c && c.image && ((id && String(c.id) === String(id)) || (name && String(c.name) === String(name))));
        if (match && match.image) return String(match.image).trim();

        const defaultMap = {
          'ピカチュウ': 'https://images.pokemontcg.io/sv3pt5/25_hires.png',
          'ミライドンex': 'https://images.pokemontcg.io/sv1/81_hires.png',
          'ライチュウ': 'https://images.pokemontcg.io/sv3pt5/26_hires.png',
          'ヒトカゲ': 'https://images.pokemontcg.io/sv3pt5/4_hires.png',
          'リザード': 'https://images.pokemontcg.io/sv3pt5/5_hires.png',
          'リザードンex': 'https://images.pokemontcg.io/sv3pt5/6_hires.png',
          'リザードン': 'https://images.pokemontcg.io/pgo/10_hires.png',
          'ゼニガメ': 'https://images.pokemontcg.io/sv3pt5/7_hires.png',
          'カメール': 'https://images.pokemontcg.io/sv3pt5/8_hires.png',
          'カメックスex': 'https://images.pokemontcg.io/sv3pt5/9_hires.png',
          'カメックス': 'https://images.pokemontcg.io/pgo/17_hires.png',
          '博士の研究': 'https://images.pokemontcg.io/sv1/189_hires.png',
          'ボスの指令': 'https://images.pokemontcg.io/sv2/172_hires.png',
          'きずぐすり': 'https://images.pokemontcg.io/sv1/182_hires.png',
          'ポケモンいれかえ': 'https://images.pokemontcg.io/sv1/191_hires.png',
          '基本雷エネルギー': 'https://images.pokemontcg.io/sve/4_hires.png',
          '基本炎エネルギー': 'https://images.pokemontcg.io/sve/2_hires.png',
          '基本水エネルギー': 'https://images.pokemontcg.io/sve/3_hires.png'
        };
        const cleanName = String(name || '').trim();
        return defaultMap[cleanName] || '';
      },

      createCardHtml(card, options = {}) {
        if (!card) card = {};
        const size = options.size || 'normal'; // 'normal' | 'lg' | 'sm'
        const inDeckCount = Number(options.inDeckCount) || 0;
        const isMax = !!options.isMax;
        const symbol = this.typeSymbols[card.type] || '✦';

        // エネルギー記号の描画
        const renderEnergy = (energyStr) => {
          const list = this.parseEnergyList(energyStr);
          if (!list || list.length === 0) return '';
          return list.map((e) => {
            const sym = this.typeSymbols[e] || e;
            return "<span class=\"energy-pip type-" + this.escape(e) + "\" title=\"" + this.escape(e) + "\">" + sym + "</span>";
          }).join('');
        };

        // 画像スタイルとサイズ調整パラメータ
        const scale = Math.max(20, Math.min(400, Number(card.imageScale) || 100));
        const fit = card.imageFit === 'contain' || card.imageFit === 'fill' ? card.imageFit : 'cover';
        const posX = card.imageX != null && card.imageX !== '' ? Math.max(0, Math.min(100, Number(card.imageX))) : 50;
        const posY = card.imageY != null && card.imageY !== '' ? Math.max(0, Math.min(100, Number(card.imageY))) : 50;
        const heightStyle = card.imageHeight && Number(card.imageHeight) > 0 ? "style=\"height: " + Number(card.imageHeight) + "%;\"" : '';

        const imgStyle = "object-fit: " + fit + "; object-position: " + posX + "% " + posY + "%; transform: scale(" + scale / 100 + "); transform-origin: " + posX + "% " + posY + "%;";

        const rawImgUrl = String(
          card.image || card.imageUrl || card.image_url ||
          card['画像'] || card['画像URL'] || card['画像url'] || card['イラスト'] || card['URL'] || card['url'] ||
          (typeof this.findCardImage === 'function' ? this.findCardImage(card.name, card.id) : '') || ''
        ).trim();

        let imgUrl = rawImgUrl;
        const driveMatch = rawImgUrl.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?export=view&id=)|lh3\.googleusercontent\.com\/d\/)([a-zA-Z0-9_-]+)/);
        if (driveMatch && driveMatch[1]) {
          imgUrl = 'https://lh3.googleusercontent.com/d/' + driveMatch[1];
        }

        // 画像 / テクスチャアート (真ん中から上)
        const artHtml = imgUrl ? "<img src=\"" +
          this.escape(imgUrl) + "\" alt=\"" + this.escape(card.name) + "\" class=\"card-texture-img\" draggable=\"false\" style=\"" + imgStyle + "\" referrerpolicy=\"no-referrer\" loading=\"lazy\" onerror=\"console.warn('Image load error for ' + this.alt + ':', this.src); this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';\"><div class=\"card-texture-placeholder\" style=\"display:none\"><div class=\"texture-watermark\">" + symbol + "</div><div class=\"texture-name\">" + this.escape(card.name || 'CARD') + "</div></div>" : "<div class=\"card-texture-placeholder\"><div class=\"texture-watermark\">" +
          symbol + "</div><div class=\"texture-name\">" + this.escape(card.name || 'CARD') + "</div></div>";

        // 特性ブロック
        const abilityHtml = card.abilityName ? "\n        <div class=\"card-rule-box ability-box\">\n          <div class=\"rule-title-row\">\n            <span class=\"rule-badge badge-ability\">特性</span>\n            <strong class=\"rule-name\">" +



          this.escape(card.abilityName) + "</strong>\n          </div>\n          <div class=\"rule-text\">" +

          this.escape(card.abilityText || '') + "</div>\n        </div>\n      " :

          '';

        // ワザ1ブロック
        const attack1TextHtml = card.attack1Text ? '<div class="rule-text">' + this.escape(card.attack1Text) + '</div>' : '';
        const attack1Html = card.attack1Name ?
          '<div class="card-rule-box attack-box">' +
          '<div class="rule-title-row">' +
          '<span class="attack-energies">' + renderEnergy(card.attack1Energy) + '</span>' +
          '<strong class="rule-name">' + this.escape(card.attack1Name) + '</strong>' +
          '<span class="rule-damage">' + this.escape(card.attack1Damage != null && card.attack1Damage !== '' ? card.attack1Damage : '') + '</span>' +
          '</div>' +
          attack1TextHtml +
          '</div>' :
          '';

        // ワザ2ブロック
        const attack2TextHtml = card.attack2Text ? '<div class="rule-text">' + this.escape(card.attack2Text) + '</div>' : '';
        const attack2Html = card.attack2Name ?
          '<div class="card-rule-box attack-box">' +
          '<div class="rule-title-row">' +
          '<span class="attack-energies">' + renderEnergy(card.attack2Energy) + '</span>' +
          '<strong class="rule-name">' + this.escape(card.attack2Name) + '</strong>' +
          '<span class="rule-damage">' + this.escape(card.attack2Damage != null && card.attack2Damage !== '' ? card.attack2Damage : '') + '</span>' +
          '</div>' +
          attack2TextHtml +
          '</div>' :
          '';

        // フレーバーテキスト / 説明文 (ワザがあっても説明文があれば必ず表示)
        let descriptionHtml = '';
        const hasMoves = !!(card.abilityName || card.attack1Name || card.attack2Name);
        if (!hasMoves && card.description) {
          descriptionHtml = '<div class="card-rule-box desc-box"><div class="rule-text trainer-desc">' + this.escape(card.description) + '</div></div>';
        } else if (hasMoves && card.description) {
          descriptionHtml = '<div class="card-flavor-box"><div class="card-flavor-text">' + this.escape(card.description) + '</div></div>';
        }

        // フルアート / ワイドアート判定
        const isFullArt = card.artLayout === 'full' || card.imageHeight === '100' || Number(card.imageHeight) === 100;
        const isWideArt = card.artLayout === 'wide';

        // ポケモンex判定
        const isEx = !!(card.isEx || String(card.category || '').includes('ex') || /[\s_・-]ex|ex/i.test(String(card.name || '')) || String(card.rarity || '').toLowerCase() === 'ex');

        const exRuleHtml = isEx ? '<div class="card-rule-box ex-rule-box"><span class="ex-rule-tag">exルール</span><span class="ex-rule-text">ポケモンexがきぜつしたとき、相手はサイドを2枚とる。</span></div>' : '';

        const isEnergy = card.category === 'エネルギー' || card.category === '基本エネルギー' || String(card.category || '').includes('エネルギー');
        const isSpecialEnergy = String(card.category || '').includes('特殊') || String(card.name || '').includes('特殊');
        const isUnlimitedEnergy = isEnergy && !isSpecialEnergy;

        const inDeckBadge = inDeckCount > 0 ? ('<div class="pool-in-deck-badge">' + inDeckCount + (isUnlimitedEnergy ? '枚' : '/4') + '</div>') : '';

        const isPokemon = card.category !== 'グッズ' && card.category !== 'サポート' && card.category !== 'トレーナー' && !isEnergy;
        const isTrainer = card.category === 'グッズ' || card.category === 'サポート' || card.category === 'トレーナー';
        const hpBadgeHtml = isPokemon && card.hp != null && card.hp !== '' && Number(card.hp) > 0 ? '<span class="card-hp-badge">HP <strong>' + this.escape(card.hp) + '</strong></span>' : '';
        const rarityBadgeHtml = card.rarity ? '<span class="card-rarity-badge">' + this.escape(card.rarity) + '</span>' : '';

        let typeBadgeHtml = '';
        if (!isTrainer && (card.type || isPokemon || isEnergy)) {
          typeBadgeHtml = '<span class="card-type-badge type-' + this.escape(card.type || '無') + '">' +
            '<span>' + symbol + '</span>' +
            '<span>' + this.escape(card.type || '無') + '</span>' +
            '</span>';
        }

        let preCard = null;
        let preEvoName = '';
        if (isPokemon && card.preEvolution) {
          const pVal = String(card.preEvolution).trim();
          preCard = (window.App?.state?.cards || []).find((c) => String(c.id) === pVal || String(c.name) === pVal) || null;
          preEvoName = preCard ? preCard.name : pVal;
        }
        const preEvoSubHtml = (isPokemon && preEvoName) ? '<span class="card-preevo-sub">（' + this.escape(preEvoName) + 'から進化）</span>' : '';

        let preEvoMiniHtml = '';
        if (isPokemon && (preCard || preEvoName)) {
          const miniSym = preCard ? (this.typeSymbols[preCard.type] || '✦') : '✦';
          let miniImgHtml = '';
          if (preCard && preCard.image) {
            let pImgUrl = String(preCard.image).trim();
            const pDriveMatch = pImgUrl.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?export=view&id=)|lh3\.googleusercontent\.com\/d\/)([a-zA-Z0-9_-]+)/);
            if (pDriveMatch && pDriveMatch[1]) pImgUrl = 'https://lh3.googleusercontent.com/d/' + pDriveMatch[1];
            miniImgHtml = '<img src="' + this.escape(pImgUrl) + '" alt="' + this.escape(preCard.name) + '" class="preevo-mini-img" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';"><div class="preevo-mini-placeholder" style="display:none;">' + miniSym + '</div>';
          } else {
            miniImgHtml = '<div class="preevo-mini-placeholder">' + miniSym + '</div>';
          }

          preEvoMiniHtml = '<div class="card-preevo-mini-box" title="【' + this.escape(preEvoName) + '】から進化">' +
            '<div class="preevo-mini-tag">進化前</div>' +
            '<div class="preevo-mini-avatar">' + miniImgHtml + '</div>' +
            '<div class="preevo-mini-name">' + this.escape(preEvoName) + '</div>' +
            '</div>';
        }

        let footerStatsHtml = '';
        if (card.category === 'グッズ' || card.category === 'サポート' || card.category === 'トレーナー') {
          footerStatsHtml = '<span>カテゴリ: <strong>' + this.escape(card.category) + '</strong></span><span>TRAINER CARD</span>';
        } else if (card.category === 'エネルギー' || card.category === '基本エネルギー') {
          footerStatsHtml = '<span>種類: <strong>' + this.escape(card.category) + '</strong></span><span>ENERGY CARD</span>';
        } else {
          const retreatNum = card.retreat !== '' && card.retreat != null ? Number(card.retreat) : null;
          let retreatDisplay = '<strong>—</strong>';
          if (retreatNum != null && !isNaN(retreatNum) && retreatNum > 0) {
            const safeLen = Math.max(0, Math.min(10, Math.floor(retreatNum)));
            retreatDisplay = '<span class="retreat-cost-display" title="逃げるエネルギー: ' + retreatNum + '">' + Array.from({ length: safeLen }).map(() => '<span class="retreat-pip">⚪</span>').join('') + '</span>';
          } else if (retreatNum === 0) {
            retreatDisplay = '<strong>0</strong>';
          }
          footerStatsHtml = '<span>弱点: <strong>' + this.escape(card.weakness || '—') + '</strong></span>' +
            '<span>抵抗: <strong>' + this.escape(card.resistance || '—') + '</strong></span>' +
            '<span>逃げ: ' + retreatDisplay + '</span>';
        }

        const cardThemeClass = isTrainer ? ('card-type-' + this.escape(card.category)) : ('card-type-' + this.escape(card.type || '無'));
        const textSizeClass = card.textSize === 'lg' ? 'text-size-lg' : card.textSize === 'xl' ? 'text-size-xl' : '';

        return "\n        <div class=\"orbital-card card-size-" +
          size + " " + cardThemeClass + " " + textSizeClass + " " + (isEx ? 'is-card-ex' : '') + " " + (isFullArt ? 'is-full-art' : '') + " " + (isWideArt ? 'is-wide-art' : '') + " " + (isMax ? 'is-max-count' : '') + "\" data-card-id=\"" + this.escape(card.id || '') + "\">\n          <!-- 左上にタイプとHP、右上に種類 -->\n          <div class=\"card-top-header\">\n            <div class=\"card-top-left\">\n              " +
          typeBadgeHtml + "\n              " +
          hpBadgeHtml + "\n            </div>\n            <div class=\"card-top-right\">\n              <span class=\"card-kind-badge " + (
            isEx ? 'ex-badge' : '') + "\">" + this.escape(card.category || 'たね') + "</span>\n              " +
          rarityBadgeHtml + "\n            </div>\n          </div>\n\n          <!-- 真ん中から上がテクスチャ -->\n          <div class=\"card-art-area\" " +
          heightStyle + ">\n            " +
          artHtml + "\n            " +
          inDeckBadge + "\n            " +
          preEvoMiniHtml + "\n          </div>\n\n          <!-- カード名バー -->\n          <div class=\"card-name-bar\">\n            <span class=\"card-name-text\">" +
          this.escape(card.name || '無名') + "</span>\n            " +
          preEvoSubHtml + "\n          </div>\n\n          <!-- 下部: 特性・ワザ配置 -->\n          <div class=\"card-bottom-rules\">\n            " +
          abilityHtml + "\n            " +
          attack1Html + "\n            " +
          attack2Html + "\n            " +
          descriptionHtml + "\n            " +
          exRuleHtml + "\n          </div>\n\n          <!-- フッター: 弱点・抵抗力・にげる (ポケモンの場合) / トレーナー情報 -->\n          <div class=\"card-footer-stats\">\n            " +
          footerStatsHtml + "\n          </div>\n        </div>\n      ";



      },

      tileHtml(card) {
        return this.createCardHtml(card, { size: 'normal' });
      },

      showDetail(card) {
        const cardHtml = this.createCardHtml(card, { size: 'lg' });

        let preCard = null;
        let preEvoName = '';
        if (card.preEvolution) {
          const pVal = String(card.preEvolution).trim();
          preCard = (window.App?.state?.cards || []).find((c) => String(c.id) === pVal || String(c.name) === pVal) || null;
          preEvoName = preCard ? preCard.name : pVal;
        }

      populatePreEvolutionSelect(selectedVal) {
        const select = document.getElementById('preEvolution');
        if (!select) return;
        const currentVal = selectedVal != null ? String(selectedVal).trim() : (select.value || '').trim();
        const currentCardId = App.state.editingCardId;

        const cards = (App.state.cards || []).filter((c) => {
          if (!c || !c.name) return false;
          if (currentCardId && String(c.id) === String(currentCardId)) return false;
          const cat = String(c.category || '');
          return cat !== 'グッズ' && cat !== 'サポート' && cat !== 'トレーナー' && cat !== 'エネルギー' && cat !== '基本エネルギー';
        });

        const groups = {
          'たねポケモン': [],
          '1進化ポケモン': [],
          'その他': []
        };

        cards.forEach((c) => {
          const cat = String(c.category || '');
          if (cat.includes('たね')) {
            groups['たねポケモン'].push(c);
          } else if (cat.includes('1進化')) {
            groups['1進化ポケモン'].push(c);
          } else {
            groups['その他'].push(c);
          }
        });

        let html = '<option value="">（進化前なし / 選択してください）</option>';

        Object.keys(groups).forEach((groupName) => {
          const list = groups[groupName];
          if (!list || list.length === 0) return;
          html += '<optgroup label="' + this.escape(groupName) + '">';
          list.forEach((c) => {
            const isSelected = (currentVal && (String(c.id) === currentVal || String(c.name) === currentVal)) ? 'selected' : '';
            const typeSym = this.typeSymbols[c.type] || c.type || '';
            html += '<option value="' + this.escape(c.id) + '" ' + isSelected + '>' +
              this.escape(c.name) + ' [' + this.escape(c.category || 'たね') + ' / ' + typeSym + ' ' + this.escape(c.type || '無') + ' / HP' + this.escape(c.hp || '?') + ']' +
              '</option>';
          });
          html += '</optgroup>';
        });

        select.innerHTML = html;
        if (currentVal) {
          select.value = currentVal;
        }
      },

        const isPokemon = !isTrainer && !isEnergy;

        if (attacksSec) attacksSec.style.display = isPokemon ? 'block' : 'none';
        if (combatSec) combatSec.style.display = isPokemon ? 'block' : 'none';

      edit(card) {
        if (!App.requireAdmin()) return;
        App.state.editingCardId = card.id;
        const titleEl = document.getElementById('editorTitle');
        if (titleEl) titleEl.textContent = 'カード編集';
        const set = (id, v) => {
          const el = document.getElementById(id);
          if (el) el.value = v == null ? '' : v;
        };
        set('cardId', card.id);
        set('name', card.name);
        set('category', card.category);
        set('preEvolution', card.preEvolution);
        set('type', card.type);
        set('rarity', card.rarity);
        set('hp', card.hp);
        set('image', card.image);
        set('imageScale', card.imageScale != null && card.imageScale !== '' ? card.imageScale : 100);
        set('imageFit', card.imageFit || 'cover');
        set('imageX', card.imageX != null && card.imageX !== '' ? card.imageX : 50);
        set('imageY', card.imageY != null && card.imageY !== '' ? card.imageY : 50);
        set('imageHeight', card.imageHeight || '');
        set('artLayout', card.artLayout || 'standard');
        set('textSize', card.textSize || 'standard');
        this.syncImageAdjustBadges();

        set('abilityName', card.abilityName);
        set('abilityText', card.abilityText);
        set('abilityCode', card.abilityCode);
        set('attack1Name', card.attack1Name);
        set('attack1Damage', card.attack1Damage);
        set('attack1Energy', card.attack1Energy);
        set('attack1Text', card.attack1Text);
        set('attack1Code', card.attack1Code);
        set('attack2Name', card.attack2Name);
        set('attack2Damage', card.attack2Damage);
        set('attack2Energy', card.attack2Energy);
        set('attack2Text', card.attack2Text);
        set('attack2Code', card.attack2Code);
        set('weakness', card.weakness);
        set('resistance', card.resistance);
        set('retreat', card.retreat);
        set('description', card.description);

        const updateSummary = (target, text, code) => {
          const el = document.getElementById(target + "EffectSummary");
          if (!el) return;
          const disp = text || this.makeEffectDisplayText(code);
          el.textContent = disp ? "✦ 設定効果: " + disp : code ? '✦ 設定効果: JavaScript効果設定済み' : '';
        };
        updateSummary('ability', card.abilityText, card.abilityCode);
        updateSummary('attack1', card.attack1Text, card.attack1Code);
        updateSummary('attack2', card.attack2Text, card.attack2Code);

        const isTrainer = card.category === 'グッズ' || card.category === 'サポート' || card.category === 'トレーナー';
        if (isTrainer) {
          const trDisp = card.attack1Text || card.description || this.makeEffectDisplayText(card.attack1Code);
          const trSummary = document.getElementById('trainerEffectSummary');
          if (trSummary) {
            trSummary.textContent = trDisp ? "✦ 設定効果: " + trDisp : card.attack1Code ? '✦ 設定効果: JavaScript効果設定済み' : '';
          }
        }

        this.syncCategoryForm();
        this.populatePreEvolutionSelect(card.preEvolution);
        const uploadStatus = document.getElementById('uploadStatus');
        if (uploadStatus) uploadStatus.textContent = '';
        this.updatePreview();
        App.showPage('create');
      },

      save() {
        if (!App.requireAdmin()) return;
        const card = this.getFormCard();
        if (!card.name.trim()) {
          App.toast('カード名を入力してください。', true);
          return;
        }
        const saveBtn = document.getElementById('saveCardButton');
        if (saveBtn) {
          saveBtn.disabled = true;
          saveBtn.textContent = '保存中…';
        }

        google.script.run.
          withSuccessHandler((res) => {
            if (saveBtn) {
              saveBtn.disabled = false;
              saveBtn.textContent = '保存する';
            }
            if (!res.ok) {
              App.toast(res.message || '保存できませんでした。', true);
              return;
            }
            App.toast(res.mode === 'created' ? 'カードを作成しました。' : 'カードを更新しました。');
            this.resetEditor();
            App.loadCards();
            App.showPage('cards');
          }).
          withFailureHandler((err) => {
            if (saveBtn) {
              saveBtn.disabled = false;
              saveBtn.textContent = '保存する';
            }
            App.toast("保存失敗: " + (err.message || err), true);
          }).
          saveCard(card, App.state.adminToken);
      },

      uploadImage() {
        if (!App.requireAdmin()) return;
        const fileInput = document.getElementById('imageFile');
        const file = fileInput && fileInput.files && fileInput.files[0];
        if (!file) {
          App.toast('画像ファイルを選択してください。', true);
          return;
        }
        const status = document.getElementById('uploadStatus');
        const uploadBtn = document.getElementById('uploadImageButton');
        if (uploadBtn) uploadBtn.disabled = true;
        if (status) status.textContent = 'アップロード中…';

        const reader = new FileReader();
        reader.onload = (e) => {
          const base64Data = e.target.result;
          google.script.run.
            withSuccessHandler((res) => {
              if (uploadBtn) uploadBtn.disabled = false;
              if (status) status.textContent = '保存完了';
              if (res.ok && res.url) {
                const imageEl = document.getElementById('image');
                if (imageEl) imageEl.value = res.url;
                CardSystem.updatePreview();
                App.toast('画像をDriveに保存しました。');
              }
            }).
            withFailureHandler((err) => {
              if (uploadBtn) uploadBtn.disabled = false;
              if (status) status.textContent = '失敗';
              App.toast("画像アップロード失敗: " + (err.message || err), true);
            }).
            uploadCardImage(file.name, file.type, base64Data, App.state.adminToken);
        };
        reader.readAsDataURL(file);
      },

      // ==========================================
      // 🎴 CARD COLLECTION SYSTEM IMPLEMENTATION
      // ==========================================
      getUserCollection() {
        try {
          const raw = localStorage.getItem('ORBITAL_USER_COLLECTION');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') return parsed;
          }
        } catch (e) {
          console.warn('Failed to parse ORBITAL_USER_COLLECTION:', e);
        }
        // 初回デフォルトコレクション: マスターカードの初期カード2枚ずつ所有状態にする
        const defaultCol = {};
        const allMaster = (window.App?.state?.cards || []);
        allMaster.forEach(c => {
          if (c && (c.id || c.name)) {
            defaultCol[c.id || c.name] = 2;
          }
        });
        try {
          localStorage.setItem('ORBITAL_USER_COLLECTION', JSON.stringify(defaultCol));
        } catch (e) { }
        return defaultCol;
      },

      saveUserCollection(colMap) {
        try {
          localStorage.setItem('ORBITAL_USER_COLLECTION', JSON.stringify(colMap));
        } catch (e) {
          console.error('Failed to save ORBITAL_USER_COLLECTION:', e);
        }

        // GASスプレッドシート DB へ保存
        if (window.google && google.script && google.script.run && !window._is_mock_gas) {
          try {
            var email = window.App?.state?.userProfile?.email || '';
            google.script.run
              .withSuccessHandler(res => console.log('✅ Collection saved to GAS DB:', res))
              .withFailureHandler(err => console.error('❌ Failed to save collection to GAS DB:', err))
              .saveUserCollection(email, colMap);
          } catch (err) {
            console.error('saveUserCollection GAS runner error:', err);
          }
        }
      },

      fetchCollectionFromGAS() {
        if (window.google && google.script && google.script.run && !window._is_mock_gas) {
          try {
            var email = window.App?.state?.userProfile?.email || '';
            google.script.run
              .withSuccessHandler(remoteCol => {
                if (remoteCol && typeof remoteCol === 'object' && Object.keys(remoteCol).length > 0) {
                  console.log('✅ Synchronized collection from GAS DB:', remoteCol);
                  const localCol = this.getUserCollection();
                  const merged = Object.assign({}, localCol, remoteCol);
                  try { localStorage.setItem('ORBITAL_USER_COLLECTION', JSON.stringify(merged)); } catch (e) { }
                  if (window.App && window.App.state && window.App.state.page === 'collection') {
                    this.renderCollectionPage();
                  }
                }
              })
              .getUserCollection(email);
          } catch (e) {
            console.error('fetchCollectionFromGAS error:', e);
          }
        }
      },

      getCardOwnedCount(cardId) {
        if (!cardId) return 0;
        const col = this.getUserCollection();
        return Number(col[cardId] || col[String(cardId)]) || 0;
      },

      addCardsToCollection(drawnCards) {
        if (!drawnCards) return;
        const cardsArr = Array.isArray(drawnCards) ? drawnCards : [drawnCards];
        const col = this.getUserCollection();

        if (!Array.isArray(this.customCards)) this.customCards = [];

        cardsArr.forEach(c => {
          if (!c) return;
          const key = c.id || c.name;
          col[key] = (Number(col[key]) || 0) + 1;

          if (window.App && Array.isArray(window.App.state?.cards)) {
            if (!window.App.state.cards.some(x => x.id === c.id || (x.name === c.name && x.id === c.id))) {
              window.App.state.cards.push(c);
            }
          }
          if (!this.customCards.some(x => x.id === c.id)) {
            this.customCards.push(c);
          }
        });

        this.saveUserCollection(col);
        try {
          localStorage.setItem('ORBITAL_CUSTOM_CARDS', JSON.stringify(this.customCards));
        } catch (e) { }

        if (window.App && window.App.state && window.App.state.page === 'collection') {
          this.renderCollectionPage();
        }
      },

      getAllCollectionCards() {
        const cardMap = new Map();
        const masterCards = (window.App?.state?.cards || []);
        masterCards.forEach(c => {
          if (c && (c.id || c.name)) cardMap.set(String(c.id || c.name), c);
        });
        if (Array.isArray(this.customCards)) {
          this.customCards.forEach(c => {
            if (c && (c.id || c.name)) cardMap.set(String(c.id || c.name), c);
          });
        }
        return Array.from(cardMap.values());
      },

      renderCollectionPage() {
        if (!this._hasFetchedGasCol) {
          this._hasFetchedGasCol = true;
          this.fetchCollectionFromGAS();
        }
        const allCards = this.getAllCollectionCards();
        const col = this.getUserCollection();

        let uniqueOwned = 0;
        let totalCardCount = 0;
        const rarityStats = { UR: { owned: 0, total: 0 }, SR: { owned: 0, total: 0 }, R: { owned: 0, total: 0 }, N: { owned: 0, total: 0 } };

        allCards.forEach(card => {
          const count = Number(col[card.id] || col[String(card.id)] || col[card.name]) || 0;
          const r = (card.rarity || 'N').toUpperCase();

          if (rarityStats[r]) {
            rarityStats[r].total++;
            if (count > 0) rarityStats[r].owned++;
          }

          if (count > 0) {
            uniqueOwned++;
            totalCardCount += count;
          }
        });

        const totalUnique = allCards.length;
        const percent = totalUnique > 0 ? ((uniqueOwned / totalUnique) * 100).toFixed(1) : '0.0';

        const pctEl = document.getElementById('collectionPercentText');
        if (pctEl) pctEl.textContent = `${percent}%`;

        const barFill = document.getElementById('collectionProgressBarFill');
        if (barFill) barFill.style.width = `${percent}%`;

        const countEl = document.getElementById('collectionCountText');
        if (countEl) countEl.textContent = `${uniqueOwned} / ${totalUnique} 種類コンプリート (総枚数: ${totalCardCount}枚)`;

        const urEl = document.getElementById('colCountUR');
        if (urEl) urEl.textContent = `${rarityStats.UR.owned}/${rarityStats.UR.total}`;
        const srEl = document.getElementById('colCountSR');
        if (srEl) srEl.textContent = `${rarityStats.SR.owned}/${rarityStats.SR.total}`;
        const rEl = document.getElementById('colCountR');
        if (rEl) rEl.textContent = `${rarityStats.R.owned}/${rarityStats.R.total}`;
        const nEl = document.getElementById('colCountN');
        if (nEl) nEl.textContent = `${rarityStats.N.owned}/${rarityStats.N.total}`;

        this.renderCollectionGrid();
      },

      renderCollectionGrid() {
        const root = document.getElementById('collectionGrid');
        if (!root) return;

        const search = (document.getElementById('collectionSearchInput')?.value || '').toLowerCase().trim();
        const cat = document.getElementById('colCategoryFilter')?.value || '';
        const typeFilter = document.getElementById('colTypeFilter')?.value || '';
        const rarityFilter = document.getElementById('colRarityFilter')?.value || '';
        const ownershipFilter = document.getElementById('colOwnershipFilter')?.value || 'all';
        const sortBy = document.getElementById('colSortSelect')?.value || 'id';

        const allCards = this.getAllCollectionCards();
        const col = this.getUserCollection();

        let filtered = allCards.filter(card => {
          const count = Number(col[card.id] || col[String(card.id)] || col[card.name]) || 0;

          if (ownershipFilter === 'owned' && count <= 0) return false;
          if (ownershipFilter === 'unowned' && count > 0) return false;

          if (cat) {
            if (cat === 'ex' && !String(card.category || '').includes('ex')) return false;
            else if (cat !== 'ex' && String(card.category || '') !== cat) return false;
          }

          if (typeFilter && String(card.type || '') !== typeFilter) return false;

          if (rarityFilter && String(card.rarity || 'N').toUpperCase() !== rarityFilter) return false;

          if (search) {
            const matchName = String(card.name || '').toLowerCase().includes(search);
            const matchAtk1 = String(card.attack1Name || '').toLowerCase().includes(search);
            const matchAtk2 = String(card.attack2Name || '').toLowerCase().includes(search);
            const matchAbil = String(card.abilityName || '').toLowerCase().includes(search);
            if (!matchName && !matchAtk1 && !matchAtk2 && !matchAbil) return false;
          }

          return true;
        });

        const rarityScore = { 'UR': 4, 'SR': 3, 'R': 2, 'N': 1 };
        filtered.sort((a, b) => {
          const countA = Number(col[a.id] || col[String(a.id)] || col[a.name]) || 0;
          const countB = Number(col[b.id] || col[String(b.id)] || col[b.name]) || 0;

          if (sortBy === 'rarityDesc') {
            const rA = rarityScore[(a.rarity || 'N').toUpperCase()] || 1;
            const rB = rarityScore[(b.rarity || 'N').toUpperCase()] || 1;
            if (rB !== rA) return rB - rA;
          } else if (sortBy === 'rarityAsc') {
            const rA = rarityScore[(a.rarity || 'N').toUpperCase()] || 1;
            const rB = rarityScore[(b.rarity || 'N').toUpperCase()] || 1;
            if (rA !== rB) return rA - rB;
          } else if (sortBy === 'countDesc') {
            if (countB !== countA) return countB - countA;
          } else if (sortBy === 'hpDesc') {
            const hpA = Number(a.hp) || 0;
            const hpB = Number(b.hp) || 0;
            if (hpB !== hpA) return hpB - hpA;
          }
          return String(a.id || a.name).localeCompare(String(b.id || b.name));
        });

        if (!filtered.length) {
          root.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: #94a3b8;">
            <div style="font-size: 40px; margin-bottom: 10px;">🔍</div>
            <div style="font-size: 16px; font-weight: 700;">条件に一致するカードが見つかりません</div>
            <div style="font-size: 13px; margin-top: 4px;">フィルター条件を変更するか、パックを開封してカードを獲得してください。</div>
          </div>
        `;
          return;
        }

        root.innerHTML = filtered.map(card => {
          const count = Number(col[card.id] || col[String(card.id)] || col[card.name]) || 0;
          const isOwned = count > 0;
          const rarity = (card.rarity || 'N').toUpperCase();

          if (isOwned) {
            const cardInnerHtml = this.createCardHtml(card, { size: 'normal' });
            return `
            <div class="collection-card-item collection-owned rarity-border-${rarity}" data-card-id="${this.escape(card.id)}" onclick="CardSystem.showCollectionDetail('${this.escape(card.id)}')">
              <div class="card-owned-badge">x${count}</div>
              ${cardInnerHtml}
            </div>
          `;
          } else {
            const symbol = this.typeSymbols[card.type] || '✦';
            return `
            <div class="collection-card-item collection-unowned rarity-border-${rarity}" data-card-id="${this.escape(card.id)}" onclick="CardSystem.showCollectionDetail('${this.escape(card.id)}')">
              <div class="unowned-lock-overlay">
                <div class="unowned-lock-icon">🔒</div>
                <div class="unowned-lock-text">未所持</div>
                <div class="unowned-rarity-tag ${rarity.toLowerCase()}">${rarity}</div>
              </div>
              <div class="unowned-card-silhouette">
                <div class="unowned-card-header">
                  <span class="unowned-card-name">${this.escape(card.name)}</span>
                  <span class="unowned-card-type">${symbol}</span>
                </div>
                <div class="unowned-card-body">
                  <div class="unowned-card-art-placeholder">???</div>
                </div>
              </div>
            </div>
          `;
          }
        }).join('');
      },

      showCollectionDetail(cardId) {
        const allCards = this.getAllCollectionCards();
        const card = allCards.find(c => String(c.id) === String(cardId) || String(c.name) === String(cardId));
        if (!card) return;

        const count = this.getCardOwnedCount(card.id);
        this.showDetail(card);

        setTimeout(() => {
          const modalCol = document.querySelector('.detail-info-col');
          if (modalCol) {
            const banner = document.createElement('div');
            banner.className = 'collection-modal-count-banner';
            banner.style.cssText = 'background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(129,140,248,0.15)); border: 1px solid rgba(255,215,0,0.4); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;';
            banner.innerHTML = `
            <div>
              <span style="font-weight:700; color:#ffd700;">🎴 コレクション所持枚数:</span>
              <span style="font-size:18px; font-weight:900; color:#fff; margin-left:8px;">${count > 0 ? count + ' 枚' : '🔒 未所持'}</span>
            </div>
            ${count === 0 ? `<button class="primary-button" style="padding:4px 10px; font-size:12px;" onclick="App.closeModal(); App.showPage('pack');">パックで引く</button>` : ''}
          `;
            modalCol.insertBefore(banner, modalCol.firstChild);
          }
        }, 50);
      }
    };

    window.CardSystem = CardSystem;
    if (window.EffectEditor) {
      Object.keys(window.EffectEditor).forEach((key) => {
        if (CardSystem[key] === undefined) {
          CardSystem[key] = typeof window.EffectEditor[key] === 'function'
            ? function () { return window.EffectEditor[key].apply(window.EffectEditor, arguments); }
            : window.EffectEditor[key];
        }
      });
    }
    console.log('[ORBITAL] CardSystem.js.html finished execution. window.CardSystem =', typeof window.CardSystem);
    if (window.__showDebugMsg) window.__showDebugMsg('CardSystem準備完了 (' + typeof window.CardSystem + ')');

    // グローバルイベント委譲: App.init()の完了成否に依存せず100%確実にプレビュー更新とエディター起動を保証
    document.addEventListener('input', function (e) {
      if (e.target && (e.target.closest('#cardForm') || e.target.form?.id === 'cardForm')) {
        if (window.CardSystem && window.CardSystem.updatePreview) {
          window.CardSystem.updatePreview();
        }
      }
    }, true);

    document.addEventListener('change', function (e) {
      if (e.target && (e.target.closest('#cardForm') || e.target.form?.id === 'cardForm')) {
        if (window.CardSystem && window.CardSystem.updatePreview) {
          window.CardSystem.updatePreview();
        }
      }
      if (e.target && e.target.id === 'category' && window.CardSystem) {
        CardSystem.syncCategoryForm();
        CardSystem.updatePreview();
      }
    }, true);

    document.addEventListener('click', function (e) {
      const effectBtn = e.target.closest('#attack1EffectButton, #attack2EffectButton, #abilityEffectButton, #trainerEffectButton, .effect-editor-open');
      if (effectBtn && window.CardSystem) {
        e.preventDefault();
        let target = 'attack1';
        if (effectBtn.id === 'abilityEffectButton') target = 'ability'; else
          if (effectBtn.id === 'attack2EffectButton') target = 'attack2'; else
            if (effectBtn.id === 'trainerEffectButton') target = 'trainer';
        CardSystem.openEffectEditor(target);
        return;
      }

      // スニペット挿入
      const insertBtn = e.target.closest('[data-effect-insert]');
      if (insertBtn && window.CardSystem) {
        e.preventDefault();
        CardSystem.insertEffectCode(insertBtn.dataset.effectInsert || '');
        return;
      }

      // タブ切替
      const tabBtn = e.target.closest('[data-effect-tab]');
      if (tabBtn && window.CardSystem) {
        e.preventDefault();
        CardSystem.switchEffectTab(tabBtn.dataset.effectTab);
        return;
      }

      // 効果反映
      const saveEffectBtn = e.target.closest('#saveEffectEditorButton');
      if (saveEffectBtn && window.CardSystem) {
        e.preventDefault();
        CardSystem.applyEffectEditor();
        return;
      }

      // 効果エディター閉じる
      const closeBtn = e.target.closest('#closeEffectEditorButton, #cancelEffectEditorButton');
      if (closeBtn && window.CardSystem) {
        e.preventDefault();
        CardSystem.closeEffectEditor();
        return;
      }

      // 補完トグルボタン
      const toggleBtn = e.target.closest('#toggleCompletionButton');
      if (toggleBtn && window.CardSystem) {
        e.preventDefault();
        const popup = document.getElementById('effectCompletion');
        if (popup) {
          const isHidden = popup.style.display === 'none' || !popup.style.display;
          if (isHidden) {
            CardSystem.updateCompletion(true);
          } else {
            popup.style.display = 'none';
          }
        }
        return;
      }

      // 関数データリスト パネル トグル
      const funcListToggleBtn = e.target.closest('#toggleFunctionListButton');
      if (funcListToggleBtn && window.CardSystem) {
        e.preventDefault();
        CardSystem.toggleFunctionList();
        return;
      }

      // 関数データリスト 閉じるボタン
      const funcListCloseBtn = e.target.closest('#closeFunctionListButton');
      if (funcListCloseBtn && window.CardSystem) {
        e.preventDefault();
        CardSystem.toggleFunctionList(false);
        return;
      }

      // 関数データリスト カテゴリフィルター
      const catBtn = e.target.closest('.func-cat-btn');
      if (catBtn && window.CardSystem) {
        e.preventDefault();
        document.querySelectorAll('.func-cat-btn').forEach((b) => b.classList.toggle('active', b === catBtn));
        const cat = catBtn.dataset.funcCat || catBtn.dataset.cat || 'all';
        CardSystem.activeFuncCat = cat;
        const searchInput = document.getElementById('funcListSearchInput');
        CardSystem.renderFunctionList(searchInput ? searchInput.value : '', cat);
        return;
      }

      // 関数データリスト スニペット挿入
      const insertSnippetBtn = e.target.closest('[data-insert-snippet]');
      if (insertSnippetBtn && window.CardSystem) {
        e.preventDefault();
        const snippet = insertSnippetBtn.getAttribute('data-insert-snippet') || '';
        CardSystem.insertEffectCode(snippet);
        const originalText = insertSnippetBtn.textContent;
        insertSnippetBtn.textContent = '✔ 挿入済';
        setTimeout(() => {
          insertSnippetBtn.textContent = originalText;
        }, 1200);
        return;
      }

      // 関数データリスト スニペットコピー
      const copySnippetBtn = e.target.closest('[data-copy-snippet]');
      if (copySnippetBtn) {
        e.preventDefault();
        const snippet = copySnippetBtn.getAttribute('data-copy-snippet') || '';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(snippet).then(() => {
            const orig = copySnippetBtn.textContent;
            copySnippetBtn.textContent = '✔ コピー済';
            setTimeout(() => {
              copySnippetBtn.textContent = orig;
            }, 1200);
          }).catch(() => { });
        }
        return;
      }

      // 自動補完ON/OFF切り替えボタン
      const autoToggleBtn = e.target.closest('#toggleAutoCompletionButton');
      if (autoToggleBtn && window.CardSystem) {
        e.preventDefault();
        const ed = window.CardSystem.effectEditor;
        ed.autoCompletionEnabled = !ed.autoCompletionEnabled;
        autoToggleBtn.textContent = ed.autoCompletionEnabled ? '⚡ 自動補完: ON' : '⚡ 自動補完: OFF';
        autoToggleBtn.classList.toggle('active', ed.autoCompletionEnabled);
        const popup = document.getElementById('effectCompletion');
        if (!ed.autoCompletionEnabled && popup) {
          popup.style.display = 'none';
        }
        return;
      }

      // 補完ずらしボタン
      const shiftBtn = e.target.closest('#shiftCompletionButton');
      if (shiftBtn && window.CardSystem) {
        e.preventDefault();
        CardSystem.toggleCompletionDock();
        return;
      }

      // エディター外クリックで補完ポップアップを閉じる (ツールバーやポップアップ内のクリックは除外)
      const popup = document.getElementById('effectCompletion');
      if (popup && !e.target.closest('.code-editor-wrapper') && !e.target.closest('.effect-code-toolbar') && !e.target.closest('#effectCompletion')) {
        popup.style.display = 'none';
      }
    }, true);

    // 日本語IME変換確定検知 (確定Enterでの誤爆防止)
    document.addEventListener('compositionend', function (e) {
      if (e.target && e.target.id === 'effectCodeEditor' && window.CardSystem) {
        window.CardSystem.effectEditor.lastCompositionEndTime = Date.now();
      }
    }, true);

    // エディターキーボード＆入力委譲
    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'effectCodeEditor' && window.CardSystem) {
        CardSystem.updateCodePreview();
        CardSystem.updateCompletion();
      }
      if (e.target && e.target.id === 'completionSearchInput' && window.CardSystem) {
        CardSystem.filterCompletionByQuery(e.target.value);
      }
      if (e.target && e.target.id === 'funcListSearchInput' && window.CardSystem) {
        CardSystem.renderFunctionList(e.target.value, CardSystem.activeFuncCat || 'all');
      }
    }, true);

    document.addEventListener('keydown', function (e) {
      if (e.target && e.target.id === 'effectCodeEditor' && window.CardSystem) {
        CardSystem.handleEditorKeydown(e);
      }
    }, true);
  })();
</script>
