<script>
console.log('[ORBITAL] ActionEngine.js.html started execution');
  (function () {
    'use strict';

    class EnergyList extends Array {
      constructor(...items) {
        super(...items);
        return new Proxy(this, {
          get(target, prop, receiver) {
            if (typeof prop === 'string' && !isNaN(prop) && prop !== '') {
              let num = Number(prop);
              if (!Number.isInteger(num) || num < 0) {
                num = Math.floor(num);
                if (num < 0) num = 0;
                if (num >= target.length && target.length > 0) num = target.length - 1;
                return target[num];
              }
            }
            return Reflect.get(target, prop, receiver);
          }
        });
      }
      [Symbol.toPrimitive](hint) {
        if (hint === 'string') return this.join(', ');
        return this.length;
      }
      valueOf() {
        return this.length;
      }
    }

    window.ORBITAL_EFFECT_API = {
      damage(ctx, target, amount) {
        const n = Math.max(0, Number(amount) || 0);
        const targets = Array.isArray(target) ? target : [target];
        const attacker = ctx?.self?.active;

        targets.forEach((t) => {
          if (!t || typeof t !== 'object') return;
          let actualDamage = n;
          let isWeakness = false;
          let weakText = '';

          // 次回ターン威力上昇ボーナス (nextTurnDamageBuffs) の適用判定
          let nextTurnBonusDmg = 0;
          const player = ctx?.self;
          if (player && Array.isArray(player.nextTurnDamageBuffs) && player.nextTurnDamageBuffs.length > 0) {
            const remainingBuffs = [];
            player.nextTurnDamageBuffs.forEach((buff) => {
              let applies = false;
              if (!buff.target) {
                // ターゲット未指定 → 誰でも適用（交代しても継続）
                applies = true;
              } else if (typeof buff.target === 'object' && (buff.target.hp !== undefined || buff.target.instanceId || buff.target.name)) {
                // 特定ポケモン指定 → そのポケモンが攻撃している場合のみ適用（交代してもそのポケモンに継続）
                if (attacker === buff.target || (attacker && buff.target && attacker.instanceId && attacker.instanceId === buff.target.instanceId) || (attacker && attacker.name === buff.target.name)) {
                  applies = true;
                }
              } else if (typeof buff.target === 'object' || typeof buff.target === 'function') {
                // 条件フィルター指定 (例: { type: "Fire" }, { category: "Basic" }, etc.)
                if (attacker && typeof matchesCardFilter === 'function' && matchesCardFilter(attacker, buff.target)) {
                  applies = true;
                }
              } else if (typeof buff.target === 'string') {
                // 文字列指定 (例: "fire", "basic")
                if (attacker && typeof matchesCardFilter === 'function' && matchesCardFilter(attacker, buff.target)) {
                  applies = true;
                }
              }

              if (applies) {
                nextTurnBonusDmg += (Number(buff.amount) || 0);
              } else {
                remainingBuffs.push(buff);
              }
            });
            player.nextTurnDamageBuffs = remainingBuffs;
          } else if (attacker && attacker.nextTurnDamage) {
            nextTurnBonusDmg += Number(attacker.nextTurnDamage) || 0;
            attacker.nextTurnDamage = 0;
          } else if (player && player.nextTurnDamage) {
            nextTurnBonusDmg += Number(player.nextTurnDamage) || 0;
            player.nextTurnDamage = 0;
          }

          if (nextTurnBonusDmg > 0) {
            actualDamage += nextTurnBonusDmg;
            if (ctx?.game?.logs) {
              ctx.game.logs.push('🔥 チャージボーナス発動！ワザの威力が +' + nextTurnBonusDmg + ' された！');
            }
          }

          // ポケモンのどうぐによるワザダメージ加算 (attacker.attachedTool)
          if (attacker && attacker.attachedTool) {
            const tool = attacker.attachedTool;
            let toolBonus = 0;
            if (tool.damageBonus) {
              toolBonus += Number(tool.damageBonus) || 0;
            }
            const isTargetEx = !!(t.isEx || String(t.category || '').includes('ex') || /[\s_・-]ex|ex/i.test(String(t.name || '')) || String(t.rarity || '').toLowerCase() === 'ex');
            if (isTargetEx) {
              if (tool.damageBonusEx) {
                toolBonus += Number(tool.damageBonusEx) || 0;
              } else if (tool.name && tool.name.includes('こだわりベルト')) {
                toolBonus += 30;
              } else if (tool.description && /ポケモンexへのダメージ.*(?:\+|＋)\s*(\d+)/.test(tool.description)) {
                const m = tool.description.match(/ポケモンexへのダメージ.*(?:\+|＋)\s*(\d+)/);
                if (m) toolBonus += parseInt(m[1], 10);
              }
            }
            if (tool.name && tool.name.includes('ちからのはちまき')) {
              toolBonus += 20;
            } else if (tool.name && tool.name.includes('げんきのハチマキ')) {
              toolBonus += 10;
            }
            if (toolBonus > 0) {
              actualDamage += toolBonus;
              if (ctx?.game?.logs) {
                ctx.game.logs.push('🧰 【' + tool.name + '】発動！ワザの威力が +' + toolBonus + ' された！');
              }
            }
          }

          // 次回ターン攻撃力低下デバフ (nextTurnAttackDebuffs) の適用判定 (相手の攻撃力を下げる効果)
          let nextTurnAttackDebuffDmg = 0;
          if (player && Array.isArray(player.nextTurnAttackDebuffs) && player.nextTurnAttackDebuffs.length > 0) {
            const remainingDebuffs = [];
            player.nextTurnAttackDebuffs.forEach((debuff) => {
              let applies = false;
              if (!debuff.target || debuff.target === player || debuff.target === 'self' || debuff.target === 'all') {
                applies = true;
              } else if (typeof debuff.target === 'object' && (debuff.target.hp !== undefined || debuff.target.instanceId || debuff.target.name)) {
                if (attacker === debuff.target || (attacker && debuff.target && attacker.instanceId && attacker.instanceId === debuff.target.instanceId) || (attacker && attacker.name === debuff.target.name)) {
                  applies = true;
                }
              } else if (typeof debuff.target === 'object' || typeof debuff.target === 'string') {
                if (attacker && typeof matchesCardFilter === 'function' && matchesCardFilter(attacker, debuff.target)) {
                  applies = true;
                }
              }

              if (applies) {
                nextTurnAttackDebuffDmg += (Number(debuff.amount) || 0);
              } else {
                remainingDebuffs.push(debuff);
              }
            });
            player.nextTurnAttackDebuffs = remainingDebuffs;
          } else if (attacker && attacker.nextTurnAttackDebuff) {
            nextTurnAttackDebuffDmg += Number(attacker.nextTurnAttackDebuff) || 0;
            attacker.nextTurnAttackDebuff = 0;
          } else if (player && player.nextTurnAttackDebuff) {
            nextTurnAttackDebuffDmg += Number(player.nextTurnAttackDebuff) || 0;
            player.nextTurnAttackDebuff = 0;
          }

          if (nextTurnAttackDebuffDmg > 0) {
            actualDamage = Math.max(0, actualDamage - nextTurnAttackDebuffDmg);
            if (ctx?.game?.logs) {
              ctx.game.logs.push('❄️ 攻撃力低下発動！ワザの威力が -' + nextTurnAttackDebuffDmg + ' 減少された！');
            }
          }

          // 次ターン被ダメージ軽減 (nextTurnDamageReduction) の適用判定
          if (t && t.nextTurnDamageReduction) {
            const nextRed = Number(t.nextTurnDamageReduction) || 0;
            if (nextRed > 0) {
              actualDamage = Math.max(0, actualDamage - nextRed);
              if (ctx?.game?.logs) {
                ctx.game.logs.push('🛡️ 次ターン軽減効果発動！ダメージが -' + nextRed + ' 減少された！');
              }
            }
            t.nextTurnDamageReduction = 0;
          }

          // 弱点・抵抗力計算 (バトルポケモンへのダメージ時)
          const isBattler = t === ctx?.opponent?.active || t === ctx?.self?.active;
          if (isBattler && attacker && attacker.type && t.hp !== undefined) {
            if (t.weakness && t.weakness === attacker.type) {
              actualDamage *= 2;
              isWeakness = true;
              weakText = '【弱点！x2】';
            } else if (t.resistance && t.resistance === attacker.type) {
              actualDamage = Math.max(0, actualDamage - 20);
              weakText = '【抵抗力 -20】';
            }
            if (t.damageReduction) {
              actualDamage = Math.max(0, actualDamage - t.damageReduction);
            }
            if (t.attachedTool && t.attachedTool.damageReduction) {
              const toolRed = Number(t.attachedTool.damageReduction) || 0;
              if (toolRed > 0) {
                actualDamage = Math.max(0, actualDamage - toolRed);
                if (ctx?.game?.logs) {
                  ctx.game.logs.push('🧰 【' + t.attachedTool.name + '】発動！受けるダメージが -' + toolRed + ' 減少された！');
                }
              }
            }
          }

          // 被ダメージ直前特性イベント (beforeDamage)
          const damageEvent = {
            attacker: attacker,
            defender: t,
            damage: actualDamage,
            cancel: false,
            preventDamage() { this.cancel = true; },
            cancelDamage() { this.cancel = true; }
          };

          if (t.abilityCode && window.executeCardEffectCode &&
              /event\s*\.\s*on\s*\(\s*['"]beforeDamage['"]/.test(t.abilityCode)) {
            try {
              window.executeCardEffectCode(
                t.abilityCode,
                { players: [ctx?.opponent, ctx?.self].filter(Boolean), logs: ctx?.game?.logs },
                ctx?.opponent || ctx?.self,
                'beforeDamage',
                damageEvent
              );
            } catch (e) {
              console.error('Defender beforeDamage effect error:', e);
            }
          }

          if (damageEvent.cancel) {
            actualDamage = 0;
            if (ctx?.game?.logs) {
              ctx.game.logs.push('🛡️ 【特性発動！】' + (t.name || 'ポケモン') + ' はワザのダメージを受けない！（無効化）');
            }
          } else {
            actualDamage = Math.max(0, Number(damageEvent.damage) || 0);
            t.hp -= actualDamage;
            if (ctx?.game?.logs) {
              ctx.game.logs.push('💥 【' + (t.name || 'ポケモン') + '】に ' + actualDamage + ' ダメージ！' + weakText + ' (残りHP: ' + Math.max(0, t.hp) + ')');
            }
            // 防御側ポケモンのどうぐの反撃効果 (ゴツゴツメット等)
            if (actualDamage > 0 && attacker && t.attachedTool && (t.attachedTool.name?.includes('ゴツゴツメット') || t.attachedTool.recoilDamageToAttacker)) {
              const recoil = Number(t.attachedTool.recoilDamageToAttacker) || 20;
              attacker.hp -= recoil;
              if (ctx?.game?.logs) {
                ctx.game.logs.push('🪖 【' + t.attachedTool.name + '】の反撃！ワザを使った【' + (attacker.name || 'ポケモン') + '】に ' + recoil + ' ダメージ！(残りHP: ' + Math.max(0, attacker.hp) + ')');
              }
            }
          }

          // スタジアム上のヒットエフェクト & フローティングダメージ表示
          if (window.BattleSystem && window.BattleSystem.state) {
            const isOppActive = t === window.BattleSystem.state.opponent?.active;
            const isPlayerActive = t === window.BattleSystem.state.player?.active;
            const slotEl = isOppActive ? document.getElementById('oppActiveSpot') : (isPlayerActive ? document.getElementById('playerActiveSpot') : null);
            if (slotEl && actualDamage > 0) {
              slotEl.classList.add('defender-hit-flash');
              setTimeout(() => slotEl.classList.remove('defender-hit-flash'), 400);
              const dmgEl = document.createElement('div');
              dmgEl.className = 'floating-damage-number' + (isWeakness ? ' weakness-damage' : '');
              dmgEl.textContent = (isWeakness ? '弱点！ -' : '-') + actualDamage;
              slotEl.appendChild(dmgEl);
              setTimeout(() => dmgEl.remove(), 1050);
            }
          }
        });
      },
      heal(ctx, target, amount) {
        const n = Math.max(0, Number(amount) || 0);
        const applyHeal = (t) => {
          if (!t) return;
          let max = t.maxHp;
          if (max == null || isNaN(max)) {
            const original = (window.App?.state?.cards || []).find((c) => String(c.id) === String(t.id) || c.name === t.name);
            max = original && original.hp ? Number(original.hp) : (Number(t.hp) || 70);
            t.maxHp = max;
          }
          const prev = Number(t.hp) || 0;
          t.hp = Math.min(Number(max), prev + n);
          const healed = t.hp - prev;
          if (ctx?.game?.logs) {
            ctx.game.logs.push("💚 【" + (t.name || 'ポケモン') + "】のHPを " + healed + " 回復しました。（現在HP: " + t.hp + "/" + t.maxHp + "）");
          }
          if (window.App && typeof window.App.toast === 'function') {
            window.App.toast((t.name || 'ポケモン') + " のHPを回復しました！(HP: " + t.hp + "/" + t.maxHp + ")");
          }
        };
        if (Array.isArray(target)) {
          target.forEach(applyHeal);
        } else if (target) {
          applyHeal(target);
        }
        if (window.BattleSystem && typeof window.BattleSystem.render === 'function') {
          window.BattleSystem.render();
        }
      },
      draw(ctx, player, amount) { for (let i = 0; i < (Number(amount) || 0); i++) { if (!player?.deck?.length) break; const c = player.deck.shift(); if (c != null) player.hand.push(c); } },
      attachEnergy(ctx, target, amount) {
        const n = Math.max(0, Number(amount) || 0);
        const applyTo = (t) => {
          if (!t) return;
          t.energy = (t.energy || 0) + n;
          t.attachedEnergies = t.attachedEnergies || [];
          for (let i = 0; i < n; i++) t.attachedEnergies.push(t.type || '無');
        };
        if (Array.isArray(target)) {
          target.forEach(applyTo);
        } else if (target) {
          applyTo(target);
        }
      },
      discardEnergy(ctx, target, amount) {
        const n = Math.max(0, Number(amount) || 0);
        const removeFrom = (t) => {
          if (!t) return;
          t.energy = Math.max(0, (t.energy || 0) - n);
          if (Array.isArray(t.attachedEnergies)) {
            for (let i = 0; i < n; i++) t.attachedEnergies.pop();
          }
        };
        if (Array.isArray(target)) {
          target.forEach(removeFrom);
        } else if (target) {
          removeFrom(target);
        }
      },
      getEnergy(ctx, target) {
        let t = target;
        if (!t && ctx?.self?.active) t = ctx.self.active;
        if (t && (t === ctx?.self || t === ctx?.opponent || t.active || t.bench)) {
          const all = new EnergyList();
          const pks = [t.active, ...(Array.isArray(t.bench) ? t.bench : [])].filter(Boolean);
          pks.forEach((pk) => {
            const sub = this.getEnergy(ctx, pk);
            all.push(...sub);
          });
          return all;
        }
        const list = new EnergyList();
        if (!t || typeof t !== 'object') return list;

        if (Array.isArray(t.attachedEnergies) && t.attachedEnergies.length > 0) {
          list.push(...t.attachedEnergies);
        } else if (Array.isArray(t.attachedCards)) {
          t.attachedCards.forEach((c) => {
            if (!c) return;
            const cat = String(c.category || '');
            if (cat.includes('エネルギー') || cat.toLowerCase().includes('energy') || !c.hp) {
              list.push(c.type || '無');
            }
          });
        }

        const totalNum = Number(t.energy || 0);
        while (list.length < totalNum) {
          list.push(t.type || '無');
        }
        return list;
      },
      hasEnergy(ctx, target, countOrType = 1) {
        const list = this.getEnergy(ctx, target);
        if (typeof countOrType === 'string') {
          const norm = countOrType.toLowerCase().trim();
          return list.some((e) => String(e || '').toLowerCase().trim() === norm);
        }
        if (typeof countOrType === 'object' && countOrType !== null) {
          const t = countOrType.type;
          const c = Number(countOrType.count || 1);
          if (t) {
            const matched = list.filter((e) => String(e || '').toLowerCase().trim() === String(t).toLowerCase().trim());
            return matched.length >= c;
          }
        }
        return list.length >= Number(countOrType || 1);
      },
      addEnergy(ctx, target, amount = 1) {
        const n = Math.max(0, Number(amount) || 1);
        const targets = Array.isArray(target) ? target : [target && typeof target === 'object' ? target : ctx?.self?.active];
        targets.forEach((t) => {
          if (t) {
            t.energy = (t.energy || 0) + n;
            if (ctx?.game?.logs) ctx.game.logs.push("⚡ 【" + (t.name || 'カード') + "】にエネルギーが " + n + " 個付けられました。(合計: " + t.energy + ")");
          }
        });
      },
      removeEnergy(ctx, target, amount = 1) {
        const n = Math.max(0, Number(amount) || 1);
        const targets = Array.isArray(target) ? target : [target && typeof target === 'object' ? target : ctx?.opponent?.active || ctx?.self?.active];
        targets.forEach((t) => {
          if (t) {
            t.energy = Math.max(0, (t.energy || 0) - n);
            if (ctx?.game?.logs) ctx.game.logs.push("⚡ 【" + (t.name || 'カード') + "】のエネルギーが " + n + " 個トラッシュされました。(残り: " + t.energy + ")");
          }
        });
      },
      getStadium(ctx) {
        return ctx?.game?.activeStadium || null;
      },
      setStadium(ctx, card) {
        if (!ctx || !ctx.game) return null;
        const oldStadium = ctx.game.activeStadium;
        if (oldStadium && oldStadium.owner) {
          const ownerPlayer = (ctx.game.players || []).find(p => p && p.id === oldStadium.owner);
          if (ownerPlayer && Array.isArray(ownerPlayer.discard)) {
            ownerPlayer.discard.push(oldStadium);
          }
        }
        ctx.game.activeStadium = card;
        if (card && ctx.self) {
          card.owner = ctx.self.id;
        }
        if (window.BattleSystem && typeof window.BattleSystem.updateStadiumUI === 'function') {
          window.BattleSystem.updateStadiumUI();
        }
        return card;
      },
      discardStadium(ctx) {
        if (!ctx || !ctx.game || !ctx.game.activeStadium) return null;
        const s = ctx.game.activeStadium;
        if (s && s.owner) {
          const ownerPlayer = (ctx.game.players || []).find(p => p && p.id === s.owner);
          if (ownerPlayer && Array.isArray(ownerPlayer.discard)) {
            ownerPlayer.discard.push(s);
          }
        }
        ctx.game.activeStadium = null;
        if (window.BattleSystem && typeof window.BattleSystem.updateStadiumUI === 'function') {
          window.BattleSystem.updateStadiumUI();
        }
        return s;
      },
      hasStadium(ctx, name) {
        const active = this.getStadium(ctx);
        if (!active) return false;
        if (!name) return true;
        return String(active.name || '').includes(name);
      },
      cancelDamage(ctx, event) {
        const e = event && typeof event === 'object' ? event : ctx?.currentEvent;
        if (e) {
          e.cancel = true;
          if (ctx?.game?.logs) ctx.game.logs.push('🛡️ ワザのダメージがキャンセル（無効化）されました！');
        }
        return true;
      },
      preventDamage(ctx, event) {
        return this.cancelDamage(ctx, event);
      },
      switchActive(ctx, player, target) {
        const p = player || ctx?.self;
        if (!p || !p.active) return;
        let newActive = target;
        if (Array.isArray(newActive)) newActive = newActive[0];
        if (newActive && Array.isArray(p.bench)) {
          const idx = p.bench.indexOf(newActive);
          if (idx >= 0) p.bench.splice(idx, 1);
        } else if (Array.isArray(p.bench) && p.bench.length > 0) {
          newActive = p.bench.shift();
        }
        if (newActive) {
          if (p.active) {
            p.active.usedLastTurn = false;
          }
          if (Array.isArray(p.bench)) p.bench.push(p.active);
          p.active = newActive;
          if (ctx?.game?.logs) {
            ctx.game.logs.push("🔄 【" + (p.name || 'プレイヤー') + "】がバトル場を【" + (newActive.name || 'カード') + "】に入れ替えました。");
          }
        }
      },
      _detachCardOrEnergy(ctx, player, item) {
        const p = player || ctx?.self;
        const allPks = [];
        const players = [p, ctx?.self, ctx?.opponent].filter(Boolean);
        players.forEach((pl) => {
          if (pl.active) allPks.push(pl.active);
          if (Array.isArray(pl.bench)) allPks.push(...pl.bench);
        });

        let detachedCard = null;
        let detachedType = null;
        let fromPokemon = null;

        if (typeof item === 'string') {
          const targetType = item.trim();
          for (let pk of allPks) {
            if (Array.isArray(pk.attachedEnergies)) {
              const idx = pk.attachedEnergies.indexOf(targetType);
              if (idx >= 0) {
                pk.attachedEnergies.splice(idx, 1);
                pk.energy = Math.max(0, (pk.energy || 0) - 1);
                detachedType = targetType;
                fromPokemon = pk;
                break;
              }
            }
          }
          if (fromPokemon && Array.isArray(fromPokemon.attachedCards)) {
            const cardIdx = fromPokemon.attachedCards.findIndex((c) => c && (c.type === targetType || c.category === 'Energy' || c.category === 'エネルギー'));
            if (cardIdx >= 0) {
              detachedCard = fromPokemon.attachedCards.splice(cardIdx, 1)[0];
            }
          }
          if (!detachedCard) {
            detachedCard = {
              name: (detachedType || targetType) + 'エネルギー',
              type: detachedType || targetType,
              category: 'Energy'
            };
          }
          return { card: detachedCard, fromPokemon: fromPokemon, type: detachedType || targetType };
        } else if (item && typeof item === 'object') {
          for (let pk of allPks) {
            if (Array.isArray(pk.attachedCards)) {
              const idx = pk.attachedCards.indexOf(item);
              if (idx >= 0) {
                pk.attachedCards.splice(idx, 1);
                if (Array.isArray(pk.attachedEnergies)) {
                  const eIdx = pk.attachedEnergies.indexOf(item.type || '無');
                  if (eIdx >= 0) pk.attachedEnergies.splice(eIdx, 1);
                }
                const cat = String(item.category || '');
                if (cat.includes('エネルギー') || cat.toLowerCase().includes('energy') || !item.hp) {
                  pk.energy = Math.max(0, (pk.energy || 0) - 1);
                }
                return { card: item, fromPokemon: pk, type: item.type || '無' };
              }
            }
          }
          return { card: item, fromPokemon: null, type: item.type };
        }
        return null;
      },
      toHand(ctx, player, cardOrCards) {
        let p = player;
        let cards = cardOrCards;
        if (p && (p.hp !== undefined || p.maxHp !== undefined)) {
          p = this._findCardOwner(ctx, p) || ctx?.self;
        } else if (p && (p.name || p.id) && !p.hand && !cards) {
          cards = p;
          p = ctx?.self;
        }
        if (!p) p = ctx?.self;
        if (!p || !Array.isArray(p.hand)) return;
        const arr = Array.isArray(cards) ? cards : [cards];
        arr.forEach((c) => {
          if (!c) return;
          const detached = this._detachCardOrEnergy(ctx, p, c);
          const cardObj = detached ? detached.card : c;
          if (!cardObj) return;

    function matchesCardFilter(card, filter) {
      if (!card) return false;
      if (!filter) return true;
      if (typeof filter === 'function') return filter(card);
      if (filter instanceof RegExp) {
        return filter.test(String(card.name || '')) || filter.test(String(card.category || '')) || filter.test(String(card.type || ''));
      }
      if (typeof filter === 'string') {
        const q = filter.toLowerCase().trim();
        if (q === 'pokemon' || q === 'ポケモン') {
          const cCat = String(card.category || '').toLowerCase();
          const isTrainerOrEnergy = ['グッズ', 'サポート', 'トレーナー', 'スタジアム', 'エネルギー', 'item', 'supporter', 'energy'].some((k) => cCat.includes(k));
          if (isTrainerOrEnergy) return false;
          return card.hp != null || ['たね', '進化', '1進化', '2進化', 'ex'].some((k) => cCat.includes(k));
        }
        const catNorm = BILINGUAL_CATEGORY_MAP[q] || [q];
        const typeNorm = BILINGUAL_TYPE_MAP[q] || [q];
        const cardCat = String(card.category || (card.hp != null ? 'たね' : '')).toLowerCase();
        const cardType = String(card.type || '').toLowerCase();
        const cardName = String(card.name || '').toLowerCase();
        if (catNorm.some((k) => cardCat.includes(k.toLowerCase()))) return true;
        if (typeNorm.some((k) => cardType.includes(k.toLowerCase()))) return true;
        return cardCat.includes(q) || cardType.includes(q) || cardName.includes(q);
      }
      if (typeof filter !== 'object') return true;
      if (filter.name) {
        if (filter.name instanceof RegExp) {
          if (!filter.name.test(String(card.name || ''))) return false;
        } else if (!String(card.name || '').toLowerCase().includes(String(filter.name).toLowerCase())) {
          return false;
        }
      }
      if (filter.category) {
        const fCat = String(filter.category).toLowerCase().trim();
        if (fCat === 'pokemon' || fCat === 'ポケモン') {
          const cCat = String(card.category || '').toLowerCase();
          const isTrainerOrEnergy = ['グッズ', 'サポート', 'トレーナー', 'スタジアム', 'エネルギー', 'item', 'supporter', 'energy'].some((k) => cCat.includes(k));
          if (isTrainerOrEnergy) return false;
          return card.hp != null || ['たね', '進化', '1進化', '2進化', 'ex'].some((k) => cCat.includes(k));
        }
        const catEquivs = BILINGUAL_CATEGORY_MAP[fCat] || [fCat];
        const cardCat = String(card.category || (card.hp != null ? 'たね' : '')).toLowerCase();
        const matched = catEquivs.some((k) => cardCat.includes(k.toLowerCase()));
        if (!matched) return false;
      }
      if (filter.type) {
        const fType = String(filter.type).toLowerCase().trim();
        const typeEquivs = BILINGUAL_TYPE_MAP[fType] || [fType];
        const cardType = String(card.type || '').toLowerCase();
        const matched = typeEquivs.some((k) => cardType.includes(k.toLowerCase()));
        if (!matched) return false;
      }
      if (filter.rarity && card.rarity !== filter.rarity) return false;
      if (filter.minHp != null) {
        if (!card.hp || Number(card.hp) < Number(filter.minHp)) return false;
      }
      if (filter.maxHp != null) {
        if (!card.hp || Number(card.hp) > Number(filter.maxHp)) return false;
      }
      return true;
    }
    window.matchesCardFilter = matchesCardFilter;
