<script>
console.log('[ORBITAL] DeckSystem.js.html started execution');
window.DeckSystem = function () {
  const CardSystem = new Proxy({}, {
    get(target, prop) {
      return window.CardSystem ? window.CardSystem[prop] : undefined;
    }
  });
  const App = new Proxy({}, {
    get(target, prop) {
      return window.App ? window.App[prop] : undefined;
    }
  });
  const state = {
    decks: [],
    activeDeck: null,
    cardPool: [],
    filter: { search: '', category: 'all', type: 'all', ownership: 'owned' },
    galleryTab: 'all', // 'all' | 'my' | 'sample'
    currentUser: { email: '', isLoggedIn: false },
    viewMode: 'gallery' // 'gallery' | 'editor'
  };

  function init() {
    bindEvents();
    fetchCurrentUser();
    syncCardPool();
  }

  function fetchCurrentUser(callback) {
    const localEmail = (function () {
      try { return localStorage.getItem('orbital_mock_user_email') || ''; } catch (e) { return ''; }
    })();

    const fallbackUser = () => {
      var email = localEmail || 'player@gmail.com';
      var users = [];
      try {
        var raw = localStorage.getItem('orbital_mock_users');
        if (raw) users = JSON.parse(raw);
      } catch (e) {}
      var u = users.find(x => String(x.email).toLowerCase() === email.toLowerCase());
      state.currentUser = {
        email: email,
        displayName: u && u.displayName ? u.displayName : email.split('@')[0],
        avatar: u && u.avatar ? u.avatar : '⚡',
        isLoggedIn: true
      };
      updateUserBadge();
      if (callback) callback(state.currentUser);
    };

    if (window.google && google.script && google.script.run) {
      try {
        google.script.run
          .withSuccessHandler(function (user) {
            state.currentUser = user || { email: 'player@gmail.com', displayName: 'プレイヤー', avatar: '⚡', isLoggedIn: true };
            updateUserBadge();
            if (callback) callback(state.currentUser);
          })
          .withFailureHandler(function (err) {
            console.warn('Failed to get current user:', err);
            fallbackUser();
          })
          .getUserProfile(localEmail);
      } catch (e) {
        console.warn('fetchCurrentUser error:', e);
        fallbackUser();
      }
    } else {
      fallbackUser();
    }
  }

  function updateUserBadge() {
    const avatarBadge = document.getElementById('userAvatarBadge');
    const nameBadge = document.getElementById('userDisplayNameBadge');
    const emailBadge = document.getElementById('userEmailBadge');
    const topbarUserAccount = document.getElementById('topbarUserAccount');

    const u = state.currentUser || {};
    const email = u.email || 'player@gmail.com';
    const name = u.displayName || email.split('@')[0] || 'ゲスト';
    const avatar = u.avatar || '⚡';

    if (avatarBadge) avatarBadge.textContent = avatar;
    if (nameBadge) nameBadge.textContent = name;
    if (emailBadge) emailBadge.textContent = '(' + email + ')';
    if (topbarUserAccount) {
      topbarUserAccount.title = 'ログイン中: ' + name + ' (' + email + ')\nクリックしてプロフ編集・アカウント切替';
    }
  }

  function setGalleryTab(tab) {
    state.galleryTab = tab;
    renderGallery();
  }

  function syncCardPool(callback) {
    if (window.App && window.App.state && Array.isArray(window.App.state.cards) && window.App.state.cards.length > 0) {
      state.cardPool = window.App.state.cards;
      if (callback) callback(state.cardPool);
      return;
    }
    if (window.CardSystem && window.CardSystem.state && Array.isArray(window.CardSystem.state.cards) && window.CardSystem.state.cards.length > 0) {
      state.cardPool = window.CardSystem.state.cards;
      if (callback) callback(state.cardPool);
      return;
    }

    const fallbackCardPool = () => {
      try {
        const raw = localStorage.getItem('orbital_cards_mock') || localStorage.getItem('orbital_cards');
        state.cardPool = raw ? JSON.parse(raw) : [];
      } catch (e) {
        state.cardPool = [];
      }
      if (window.App && window.App.state) window.App.state.cards = state.cardPool;
      if (callback) callback(state.cardPool);
      renderEditor();
    };

    if (window.google && google.script && google.script.run) {
      try {
        google.script.run
          .withSuccessHandler(function (cards) {
            state.cardPool = Array.isArray(cards) ? cards : [];
            if (window.App && window.App.state) window.App.state.cards = state.cardPool;
            if (callback) callback(state.cardPool);
            renderEditor();
          })
          .withFailureHandler(function (err) {
            console.warn('Failed to load card pool:', err);
            fallbackCardPool();
          })
          .getCards();
      } catch (e) {
        console.warn('syncCardPool runner error:', e);
        fallbackCardPool();
      }
    } else {
      fallbackCardPool();
    }
  }

  function bindEvents() {
    // 検索・フィルタ変更
    const searchInput = document.getElementById('deck-pool-search');
    const catSelect = document.getElementById('deck-pool-category');
    const typeSelect = document.getElementById('deck-pool-type');
        const ownSelect = document.getElementById('deck-pool-ownership');

    if (searchInput) {
      searchInput.addEventListener('input', function (e) {
        state.filter.search = e.target.value.toLowerCase().trim();
        renderPoolGallery();
      });
    }
    if (catSelect) {
      catSelect.addEventListener('change', function (e) {
        state.filter.category = e.target.value;
        renderPoolGallery();
      });
    }
    if (typeSelect) {
      typeSelect.addEventListener('change', function (e) {
        state.filter.type = e.target.value;
        renderPoolGallery();
      });
    }

    // デッキ属性のリアルタイム変更
    const nameInput = document.getElementById('deck-name-input');
    const descInput = document.getElementById('deck-desc-input');
    if (nameInput) {
      nameInput.addEventListener('input', function (e) {
        if (state.activeDeck) state.activeDeck.name = e.target.value;
      });
    }
    if (descInput) {
      descInput.addEventListener('input', function (e) {
        if (state.activeDeck) state.activeDeck.description = e.target.value;
      });
    }
  }

  function loadDecks(callback) {
    if (state.isLoadingDecks) {
      if (callback) callback(state.decks);
      return;
    }
    state.isLoadingDecks = true;
    syncCardPool();
    const userEmail = (state.currentUser && state.currentUser.email) || '';
    const parseLocalCards = function(raw) {
      if (Array.isArray(raw)) return raw;
      if (typeof raw === 'string' && raw.trim()) {
        try { return JSON.parse(raw); } catch (e) {}
      }
      return [];
    };

    const onLoaded = function (decks) {
      state.isLoadingDecks = false;
      if (Array.isArray(decks)) {
        state.decks = decks.map(d => {
          if (!d) return d;
          let cards = d.cards;
          if (!Array.isArray(cards) || cards.length === 0) {
            const raw = d.cardsJson || d.cards_json || d.cardsList || d.cardslist || d['カードリスト'] || d['デッキカード'] || d['内容'] || d['カード'];
            cards = parseLocalCards(raw);
          }
          let normCards = [];
          if (Array.isArray(cards)) {
            normCards = cards.map(c => {
              if (typeof c === 'string') return { id: c, count: 1 };
              if (c && typeof c === 'object') {
                return {
                  id: String(c.id || c.cardId || c.code || c.name || ''),
                  name: String(c.name || ''),
                  count: Number(c.count || c.qty || c.num || 1) || 1
                };
              }
              return null;
            }).filter(Boolean);
          }
          return {
            ...d,
            id: String(d.id || 'deck_' + Math.random().toString(36).substr(2, 6)),
            name: String(d.name || d.デッキ名 || '無題のデッキ'),
            description: String(d.description || d.説明 || ''),
            cards: normCards
          };
        });
      } else {
        state.decks = [];
      }
      renderGallery();
      if (window.BattleSystem) {
        if (typeof BattleSystem.populateDeckSelect === 'function') BattleSystem.populateDeckSelect();
        if (typeof BattleSystem.populateOnlineDeckSelect === 'function') BattleSystem.populateOnlineDeckSelect();
      }
      if (callback) callback(state.decks);
    };

    const fallbackDecks = () => {
      state.isLoadingDecks = false;
      loadLocalDecks();
      onLoaded(state.decks);
    };

    if (window.google && google.script && google.script.run) {
      try {
        console.log('📡 Requesting getDecks from Spreadsheet via GAS...');
        google.script.run
          .withSuccessHandler(function (decks) {
            console.log('✅ Received decks from Spreadsheet:', decks);
            onLoaded(decks);
          })
          .withFailureHandler(function (err) {
            console.error('❌ Failed to load decks from server:', err);
            fallbackDecks();
          })
          .getDecks(userEmail);
      } catch (e) {
        console.error('❌ loadDecks runner error:', e);
        fallbackDecks();
      }
    } else {
      fallbackDecks();
    }
  }

  function loadLocalDecks() {
    try {
      const raw = localStorage.getItem('orbital_decks_mock') || localStorage.getItem('orbital_decks');
      state.decks = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(state.decks)) state.decks = [];
    } catch (e) {
      state.decks = [];
    }
  }

  function getSampleDecks() {
    return [];
  }

  
      function getCardOwnedCount(card) {
        if (!card) return 0;
        // 基本エネルギーは公式ルール上無制限
        if (isNormalEnergy(card)) return 999;

        // 管理者が公式サンプルデッキを作成・編集している場合は制限なし
        const isAdmin = window.App && typeof window.App.isAdmin === 'function' && window.App.isAdmin();
        const isSampleDeck = state.activeDeck && (state.activeDeck.userEmail === 'sample' || state.activeDeck.isSample);
        if (isAdmin && isSampleDeck) return 999;

        const col = (window.App && typeof window.App.getUserCollection === 'function')
          ? window.App.getUserCollection()
          : ((window.CardSystem && typeof window.CardSystem.getUserCollection === 'function')
            ? window.CardSystem.getUserCollection()
            : {});

        const idKey = String(card.id || '');
        const nameKey = String(card.name || '');
        const byId = Number(col[idKey]) || 0;
        const byName = Number(col[nameKey]) || 0;
        return Math.max(byId, byName);
      }

      function isAceSpecCard(card) {
    if (!card) return false;
    return !!(
      card.isAceSpec ||
      card.aceSpec ||
      card.subCategory === 'ACESPEC' ||
      String(card.rarity || '').toUpperCase() === 'ACE' ||
          String(card.rarity || '').toUpperCase() === 'ACESPEC' ||
      /ACE\s*SPEC|エーススペック/i.test(String(card.category || '')) ||
      /ACE\s*SPEC|エーススペック/i.test(String(card.subCategory || '')) ||
      /ACE\s*SPEC|エーススペック/i.test(String(card.name || '')) ||
      /ACE\s*SPEC|エーススペック/i.test(String(card.description || ''))
    );
  }

  function isNormalEnergy(card) {
    if (!card) return false;
    const cat = String(card.category || '').toLowerCase();
    const name = String(card.name || '').toLowerCase();
    if (cat.includes('特殊') || cat.includes('special') || name.includes('特殊') || name.includes('special')) {
      return false;
    }
    if (cat.includes('基本エネルギー') || cat === 'エネルギー' || cat.includes('energy')) return true;
    if (name.includes('エネルギー') || card.type === 'エネルギー') return true;
    return false;
  }

  // --- ルール検証 ---
  function validateDeck(deck) {
        const cards = deck && Array.isArray(deck.cards) ? deck.cards : [];
        let totalCount = 0;
        let basicCount = 0;
        let aceSpecCount = 0;
        const aceSpecCards = [];
        const errors = [];
        const warnings = [];
        const overLimitCards = [];
        const unownedErrors = [];

        const poolMap = {};
        const pool = state.cardPool && state.cardPool.length ?
          state.cardPool :
          window.App && window.App.state && window.App.state.cards || [];
        pool.forEach((c) => { if (c && c.id) poolMap[c.id] = c; });

        cards.forEach((item) => {
          const card = poolMap[item.id] ||
            pool.find((c) => String(c.id) === String(item.id) || (item.name && c.name === item.name)) ||
            { id: item.id, name: item.name || '不明なカード', category: item.category || '' };
          const count = Number(item.count) || 0;
          totalCount += count;

          const isBasicEnergy = isNormalEnergy(card);
          const ownedCount = getCardOwnedCount(card);

          // 所持枚数チェック (基本エネルギー以外)
          if (!isBasicEnergy && count > ownedCount) {
            unownedErrors.push({ id: item.id, name: card.name, count: count, owned: ownedCount });
            if (ownedCount <= 0) {
              errors.push("「" + card.name + "」は未所持です (デッキ内: " + count + "枚)");
            } else {
              errors.push("「" + card.name + "」が所持枚数(" + ownedCount + "枚)を超過しています (デッキ内: " + count + "枚)");
            }
          }

          if (count > 4 && !isBasicEnergy) {
            overLimitCards.push({ id: item.id, name: card.name, count: count });
            errors.push("「" + card.name + "」が" + count + "枚（上限4枚）");
          }

          if (isAceSpecCard(card)) {
            aceSpecCount += count;
            aceSpecCards.push({ id: item.id, name: card.name, count: count });
          }

          const cat = String(card.category || '');
          if (cat.includes('たね') || cat.toLowerCase().includes('basic') || (cat.includes('ポケモン') && !cat.includes('進化'))) {
            basicCount += count;
          }
        });

        if (aceSpecCount > 1) {
          errors.push("ACE SPECカードはデッキに合計1枚までです（現在" + aceSpecCount + "枚: " + aceSpecCards.map(c => c.name).join(', ') + "）");
        }
        if (totalCount !== 60) {
          errors.push("デッキ枚数が" + totalCount + "枚です（公式ルールは60枚必須）");
        }
        if (basicCount < 1) {
          errors.push('「たねポケモン」が1枚以上必要です');
        }

        const isValid = errors.length === 0;

        return {
          isValid: isValid,
          totalCount: totalCount,
          basicCount: basicCount,
          errors: errors,
          overLimitCards: overLimitCards,
          unownedErrors: unownedErrors
        };
      }

  // --- ビュー切り替え ---
  function openGallery() {
    state.viewMode = 'gallery';
    const galView = document.getElementById('deck-gallery-view');
    const edtView = document.getElementById('deck-editor-view');
    if (galView) galView.style.display = 'block';
    if (edtView) edtView.style.display = 'none';
    renderGallery();
  }

  function openEditor(deckId) {
    syncCardPool();
    state.viewMode = 'editor';
    if (deckId) {
      const found = state.decks.find((d) => String(d.id) === String(deckId));
      if (found) {
        state.activeDeck = JSON.parse(JSON.stringify(found));
      } else {
        createNewDeck();
      }
    } else {
      createNewDeck();
    }

    const galView = document.getElementById('deck-gallery-view');
    const edtView = document.getElementById('deck-editor-view');
    if (galView) galView.style.display = 'none';
    if (edtView) edtView.style.display = 'block';

    const nameInput = document.getElementById('deck-name-input');
    const descInput = document.getElementById('deck-desc-input');
    if (nameInput) nameInput.value = state.activeDeck.name || '';
    if (descInput) descInput.value = state.activeDeck.description || '';
        const ownSelect = document.getElementById('deck-pool-ownership');
        if (ownSelect) ownSelect.value = state.filter.ownership || 'owned';

    renderEditor();
  }

  function duplicateDeck(deckId) {
    syncCardPool();
    const found = state.decks.find((d) => String(d.id) === String(deckId));
    if (!found) return;

    state.activeDeck = JSON.parse(JSON.stringify(found));
    state.activeDeck.id = '';
    state.activeDeck.name = (found.name || 'デッキ') + ' (コピー)';
    state.activeDeck.userEmail = (state.currentUser && state.currentUser.email) || '';
    state.viewMode = 'editor';

    const galView = document.getElementById('deck-gallery-view');
    const edtView = document.getElementById('deck-editor-view');
    if (galView) galView.style.display = 'none';
    if (edtView) edtView.style.display = 'block';

    const nameInput = document.getElementById('deck-name-input');
    const descInput = document.getElementById('deck-desc-input');
    if (nameInput) nameInput.value = state.activeDeck.name;
    if (descInput) descInput.value = state.activeDeck.description || '';

    renderEditor();
    if (window.CardSystem && window.CardSystem.showMessage) {
      window.CardSystem.showMessage('デッキを複製しました。編集して保存してください。', 'info');
    }
  }

  function createNewDeck() {
    state.activeDeck = {
      id: '',
      name: '新規デッキ',
      description: '',
      totalCount: 0,
      userEmail: (state.currentUser && state.currentUser.email) || '',
      cards: []
    };
  }

  // --- デッキ編集操作 ---
  function getUserOwnedCount(cardId, cardObj) {
    const card = cardObj || (state.cardPool || []).find((c) => String(c.id) === String(cardId)) ||
                 (window.App && window.App.state && window.App.state.cards || []).find((c) => String(c.id) === String(cardId));
    if (isNormalEnergy(card)) return 60;

    const col = (window.App && typeof window.App.getUserCollection === 'function') ? window.App.getUserCollection() :
                ((window.CardSystem && typeof window.CardSystem.getUserCollection === 'function') ? window.CardSystem.getUserCollection() : {});
    
    if (!col || typeof col !== 'object') return 0;

    const idKey = String(cardId || (card && card.id) || '');
    const nameKey = String((card && card.name) || '');

    if (idKey && col[idKey] != null) return Number(col[idKey]) || 0;
    if (nameKey && col[nameKey] != null) return Number(col[nameKey]) || 0;
    return 0;
  }

  function addCard(cardId) {
        if (!state.activeDeck) return;
        if (!Array.isArray(state.activeDeck.cards)) state.activeDeck.cards = [];

        const card = (state.cardPool || []).find((c) => String(c.id) === String(cardId)) ||
          (window.App && window.App.state && window.App.state.cards || []).find((c) => String(c.id) === String(cardId));
        if (!card) return;

        const isEnergy = isNormalEnergy(card);
        const ownedCount = getCardOwnedCount(card);

        // 未所持チェック (基本エネルギー以外)
        if (!isEnergy && ownedCount <= 0) {
          if (window.CardSystem && window.CardSystem.showMessage) {
            window.CardSystem.showMessage('「' + (card.name || 'このカード') + '」を所持していないためデッキに追加できません。パックやショップで獲得してください。', 'warning');
          }
          return;
        }

        const existing = state.activeDeck.cards.find((c) => String(c.id) === String(cardId));
        const currentCount = existing ? existing.count : 0;

        // 所持枚数上限チェック (基本エネルギー以外)
        if (!isEnergy && currentCount >= ownedCount) {
          if (window.CardSystem && window.CardSystem.showMessage) {
            window.CardSystem.showMessage('「' + (card.name || 'このカード') + '」の所持枚数（' + ownedCount + '枚）に達しています。', 'warning');
          }
          return;
        }

        // ACE SPEC チェック (デッキ全体で合計1枚制限)
        if (isAceSpecCard(card)) {
          const currentAceItems = state.activeDeck.cards.filter((item) => {
            const c = (state.cardPool || []).find((x) => String(x.id) === String(item.id)) ||
                      (window.App && window.App.state && window.App.state.cards || []).find((x) => String(x.id) === String(item.id));
            return isAceSpecCard(c);
          });
          const totalAceInDeck = currentAceItems.reduce((sum, item) => sum + (Number(item.count) || 0), 0);
          if (totalAceInDeck >= 1) {
            const existingItem = currentAceItems[0];
            const existingAce = (state.cardPool || []).find((x) => String(x.id) === String(existingItem?.id));
            const existingName = existingAce ? existingAce.name : 'ACE SPECカード';
            if (window.CardSystem && window.CardSystem.showMessage) {
              window.CardSystem.showMessage('ACE SPECカードはデッキに合計1枚しか入れられません（すでに「' + existingName + '」が入っています）。', 'warning');
            }
            return;
          }
        }

        // 同名4枚上限チェック
        if (currentCount >= 4 && !isEnergy) {
          if (window.CardSystem && window.CardSystem.showMessage) {
            window.CardSystem.showMessage('同名カードは1デッキに最大4枚までです。(通常エネルギーは無制限)', 'warning');
          }
          return;
        }

        // 60枚上限チェック
        const currentTotal = state.activeDeck.cards.reduce((sum, item) => sum + item.count, 0);
        if (currentTotal >= 60) {
          if (window.CardSystem && window.CardSystem.showMessage) {
            window.CardSystem.showMessage('デッキは最大60枚です。カードを減らしてから追加してください。', 'warning');
          }
          return;
        }

        if (existing) {
          existing.count += 1;
        } else {
          state.activeDeck.cards.push({ id: cardId, count: 1 });
        }

        renderEditor();
      }

  function removeCard(cardId) {
    if (!state.activeDeck || !Array.isArray(state.activeDeck.cards)) return;
    const index = state.activeDeck.cards.findIndex((c) => String(c.id) === String(cardId));
    if (index >= 0) {
      if (state.activeDeck.cards[index].count > 1) {
        state.activeDeck.cards[index].count -= 1;
      } else {
        state.activeDeck.cards.splice(index, 1);
      }
    }
    renderEditor();
  }

  function setCardCount(cardId, count) {
        if (!state.activeDeck || !Array.isArray(state.activeDeck.cards)) return;
        const card = (state.cardPool || []).find((c) => String(c.id) === String(cardId)) ||
          (window.App && window.App.state && window.App.state.cards || []).find((c) => String(c.id) === String(cardId));
        const isEnergy = isNormalEnergy(card);
        const ownedCount = getCardOwnedCount(card);
        const isAdmin = window.App && typeof window.App.isAdmin === 'function' && window.App.isAdmin();
        const isSampleDeck = state.activeDeck && (state.activeDeck.userEmail === 'sample' || state.activeDeck.isSample);
        const maxLimit = isEnergy ? 60 : ((isAdmin && isSampleDeck) ? 4 : Math.min(4, ownedCount));
        const targetCount = Math.max(0, Math.min(maxLimit, Number(count) || 0));
        const index = state.activeDeck.cards.findIndex((c) => String(c.id) === String(cardId));
        if (targetCount === 0) {
          if (index >= 0) state.activeDeck.cards.splice(index, 1);
        } else {
          if (index >= 0) {
            state.activeDeck.cards[index].count = targetCount;
          } else {
            state.activeDeck.cards.push({ id: cardId, count: targetCount });
          }
        }
        renderEditor();
      }

  function clearActiveDeck() {
    if (state.activeDeck) {
      state.activeDeck.cards = [];
      renderEditor();
    }
  }

  // --- 保存・削除 ---
  function saveActiveDeck() {
    if (!state.activeDeck) return;
    const nameInput = document.getElementById('deck-name-input');
    const descInput = document.getElementById('deck-desc-input');
    if (nameInput) state.activeDeck.name = nameInput.value.trim() || '無題のデッキ';
    if (descInput) state.activeDeck.description = descInput.value.trim();

    if (!state.activeDeck.userEmail && state.currentUser && state.currentUser.email) {
      state.activeDeck.userEmail = state.currentUser.email;
    }

    const validation = validateDeck(state.activeDeck);
    if (!validation.isValid) {
      const msg = '警告: ルール違反があります（下書きとして保存します）:\n・' + validation.errors.join('\n・');
      if (window.CardSystem && window.CardSystem.showMessage) {
        window.CardSystem.showMessage(msg, 'warning');
      }
    }

    const token = window.CardSystem ? window.CardSystem.getAdminToken() : '';
    const userEmail = (state.currentUser && state.currentUser.email) || '';

    const saveButtons = document.querySelectorAll('#deck-editor-view .primary-button');
    saveButtons.forEach((btn) => {
      btn.disabled = true;
      btn.textContent = '保存中…';
    });

    const resetButtons = () => {
      saveButtons.forEach((btn) => {
        btn.disabled = false;
        btn.textContent = '保存する';
      });
    };

    const handleSuccess = (res) => {
      resetButtons();
      if (res && res.deck && res.deck.id) {
        state.activeDeck.id = res.deck.id;
        state.activeDeck.updatedAt = res.deck.updatedAt;
      }
      if (window.CardSystem && window.CardSystem.showMessage) {
        window.CardSystem.showMessage('デッキを保存しました！', 'success');
      }
      loadDecks(function () {
        openGallery();
      });
    };

    const handleFailure = (errMsg) => {
      resetButtons();
      if (window.CardSystem && window.CardSystem.showMessage) {
        window.CardSystem.showMessage('保存失敗: ' + errMsg, 'error');
      } else {
        alert('保存失敗: ' + errMsg);
      }
    };

    if (window.google && google.script && google.script.run) {
      google.script.run.
      withSuccessHandler(function (res) {
        if (res && res.ok) {
          handleSuccess(res);
        } else {
          handleFailure((res && res.message) || '保存できませんでした。');
        }
      }).
      withFailureHandler(function (err) {
        handleFailure(err.message || err);
      }).
      saveDeck(state.activeDeck, token, userEmail);
    } else {
      // ローカル保存フォールバック
      if (!state.activeDeck.id) {
        state.activeDeck.id = 'deck_' + Date.now();
      }
      state.activeDeck.updatedAt = new Date().toLocaleString();
      const idx = state.decks.findIndex((d) => String(d.id) === String(state.activeDeck.id));
      if (idx >= 0) {
        state.decks[idx] = JSON.parse(JSON.stringify(state.activeDeck));
      } else {
        state.decks.unshift(JSON.parse(JSON.stringify(state.activeDeck)));
      }
      saveLocalDecks();
      handleSuccess({ ok: true, deck: state.activeDeck });
    }
  }

  
      function saveAsOfficialSample() {
        if (!window.App || !window.App.isAdmin()) {
          if (window.CardSystem && window.CardSystem.showMessage) {
            window.CardSystem.showMessage('管理者権限が必要です。', 'error');
          }
          return;
        }
        if (!state.activeDeck) return;
        if (!confirm('このデッキを「公式サンプルデッキ」として全ユーザーに公開しますか？')) return;
        saveActiveDeck(true);
      }

      function deleteDeck(deckId) {
    if (!confirm('本当にこのデッキを削除しますか？')) return;
    const token = window.CardSystem ? window.CardSystem.getAdminToken() : '';
    const userEmail = (state.currentUser && state.currentUser.email) || '';

    if (window.google && google.script && google.script.run) {
      google.script.run.
      withSuccessHandler(function (res) {
        if (res && res.ok) {
          if (window.CardSystem) window.CardSystem.showMessage('デッキを削除しました。', 'info');
          loadDecks();
        } else {
          if (window.CardSystem) window.CardSystem.showMessage(res.message || '削除できませんでした。', 'error');
        }
      }).
      withFailureHandler(function (err) {
        if (window.CardSystem) window.CardSystem.showMessage('エラー: ' + err.message, 'error');
      }).
      deleteDeck(deckId, token, userEmail);
    } else {
      state.decks = state.decks.filter((d) => String(d.id) !== String(deckId));
      saveLocalDecks();
      if (window.CardSystem) window.CardSystem.showMessage('デッキを削除しました。', 'info');
      renderGallery();
    }
  }

  // --- 描画関数 ---
  function renderGallery() {
    const grid = document.getElementById('deck-gallery-grid');
    if (!grid) return;

    const myEmail = (state.currentUser && state.currentUser.email) || '';

    let visibleDecks = state.decks;
    if (state.galleryTab === 'my') {
      visibleDecks = state.decks.filter((d) => !d.userEmail || !myEmail || d.userEmail === myEmail || d.userEmail === 'sample');
    } else if (state.galleryTab === 'sample') {
      visibleDecks = state.decks.filter((d) => !d.userEmail || d.userEmail === 'sample');
    }

    let tabControls = "\n      <div class=\"deck-tabs-bar\">\n        <button class=\"deck-tab-btn " +
    (state.galleryTab === 'all' ? 'active' : '') + "\" onclick=\"DeckSystem.setGalleryTab('all')\"><i class=\"fas fa-globe\"></i> すべて (" +
    state.decks.length + ")</button>\n        <button class=\"deck-tab-btn " +
    (state.galleryTab === 'my' ? 'active' : '') + "\" onclick=\"DeckSystem.setGalleryTab('my')\"><i class=\"fas fa-folder\"></i> 自分のデッキ (" +
    state.decks.filter((d) => d.userEmail && myEmail && d.userEmail === myEmail).length + ")</button>\n        <button class=\"deck-tab-btn " +
    (state.galleryTab === 'sample' ? 'active' : '') + "\" onclick=\"DeckSystem.setGalleryTab('sample')\"><i class=\"fas fa-star\"></i> 公式サンプル (" +
    state.decks.filter((d) => !d.userEmail || d.userEmail === 'sample').length + ")</button>\n      </div>\n    ";

    const tabsContainer = document.getElementById('deck-gallery-tabs-container');
    if (tabsContainer) {
      tabsContainer.innerHTML = tabControls;
    }

    if (visibleDecks.length === 0) {
      grid.innerHTML = "\n        <div class=\"empty-deck-notice\">\n          <div class=\"empty-icon\">🎴</div>\n          <p>" +
      (state.galleryTab === 'my' ? '作成した自分のデッキがまだありません。' : 'デッキが見つかりません。') + "</p>\n          <button class=\"btn btn-primary btn-lg\" onclick=\"DeckSystem.openEditor()\">＋ 新規デッキ作成</button>\n        </div>\n      ";
      return;
    }

    let html = '';
    visibleDecks.forEach((deck) => {
      const val = validateDeck(deck);
      const readyBadge = val.isValid ? "<span class=\"badge badge-success\"><i class=\"fas fa-check-circle\"></i> READY (60枚)</span>" : "<span class=\"badge badge-warning\"><i class=\"fas fa-exclamation-triangle\"></i> 制作中 (" +
      val.totalCount + "/60)</span>";

      const isMine = !!(deck.userEmail && myEmail && deck.userEmail === myEmail);
      const isSample = !deck.userEmail || deck.userEmail === 'sample';

      let ownerBadgeHtml = '';
      if (isMine) {
        ownerBadgeHtml = "<span class=\"deck-owner-badge my-deck\"><i class=\"fas fa-user\"></i> あなたのデッキ</span>";
      } else if (isSample) {
        ownerBadgeHtml = "<span class=\"deck-owner-badge sample-deck\"><i class=\"fas fa-star\"></i> 公式サンプル</span>";
      } else {
        ownerBadgeHtml = "<span class=\"deck-owner-badge\"><i class=\"fas fa-user-circle\"></i> " + escapeHtml(deck.userEmail) + "</span>";
      }

      // カバー画像取得
      let coverImg = '';
      if (deck.cards && deck.cards.length > 0) {
        const topCardId = deck.cards[0].id;
        const c = state.cardPool.find((x) => String(x.id) === String(topCardId));
        if (c && c.image) coverImg = c.image;
      }

      const coverHtml = coverImg ? "<img src=\"" +
      coverImg + "\" class=\"deck-card-cover-img\" alt=\"cover\">" : "<div class=\"deck-card-cover-placeholder\">🎴</div>";

      let actionButtons = '';
      if (isMine || (!isSample && !deck.userEmail)) {
        actionButtons = "\n          <button class=\"btn btn-secondary btn-sm\" onclick=\"DeckSystem.openEditor('" +
        deck.id + "')\"><i class=\"fas fa-edit\"></i> 編集</button>\n          <button class=\"btn btn-secondary btn-sm\" onclick=\"DeckSystem.duplicateDeck('" +
        deck.id + "')\" title=\"複製\"><i class=\"fas fa-copy\"></i> 複製</button>\n          <button class=\"btn btn-danger btn-sm\" onclick=\"DeckSystem.deleteDeck('" +
        deck.id + "')\"><i class=\"fas fa-trash\"></i> 削除</button>\n        ";
      } else {
        actionButtons = "\n          <button class=\"btn btn-primary btn-sm\" onclick=\"DeckSystem.duplicateDeck('" +
        deck.id + "')\"><i class=\"fas fa-copy\"></i> コピーして新規作成</button>\n          <button class=\"btn btn-secondary btn-sm\" onclick=\"DeckSystem.openEditor('" +
        deck.id + "')\"><i class=\"fas fa-eye\"></i> 閲覧</button>\n        ";
      }

      html += "\n        <div class=\"deck-gallery-card\">\n          <div class=\"deck-gallery-cover\">\n            " +
      coverHtml + "\n            <div class=\"deck-gallery-badge-overlay\">" +
      readyBadge + "</div>\n          </div>\n          <div class=\"deck-gallery-body\">\n            <div style=\"margin-bottom: 6px;\">" +
      ownerBadgeHtml + "</div>\n            <h3 class=\"deck-title\">" +
      escapeHtml(deck.name || '無題のデッキ') + "</h3>\n            <p class=\"deck-desc\">" +
      escapeHtml(deck.description || '説明なし') + "</p>\n            <div class=\"deck-meta\">\n              <span><i class=\"fas fa-layer-group\"></i> " +
      val.totalCount + "枚</span>\n              <span><i class=\"fas fa-clock\"></i> " + (
      deck.updatedAt || '更新日時不明') + "</span>\n            </div>\n            <div class=\"deck-actions\">\n              " +
      actionButtons + "\n            </div>\n          </div>\n        </div>\n      ";
    });

    grid.innerHTML = html;
  }

  function renderEditor() {
    if (!state.activeDeck) return;
    const val = validateDeck(state.activeDeck);

    // プログレスバー & ルールステータス
    const countEl = document.getElementById('deck-count-display');
    const barEl = document.getElementById('deck-progress-bar');
    const ruleStatusEl = document.getElementById('deck-rule-status');

    if (countEl) countEl.innerText = val.totalCount + " / 60";
    if (barEl) {
      const pct = Math.min(100, Math.round(val.totalCount / 60 * 100));
      barEl.style.width = pct + '%';
      barEl.className = 'deck-progress-fill ' + (val.totalCount === 60 ? 'bg-success' : val.totalCount > 60 ? 'bg-danger' : 'bg-primary');
    }

    if (ruleStatusEl) {
      let statusHtml = '';
      if (val.totalCount === 60) {
        statusHtml += "<span class=\"badge badge-success\"><i class=\"fas fa-check\"></i> 60枚ピッタリ</span> ";
      } else {
        statusHtml += "<span class=\"badge badge-warning\"><i class=\"fas fa-info-circle\"></i> " + (val.totalCount < 60 ? 'あと' + (60 - val.totalCount) + '枚' : val.totalCount - 60 + '枚超過') + "</span> ";
      }

      if (val.basicCount >= 1) {
        statusHtml += "<span class=\"badge badge-success\"><i class=\"fas fa-check\"></i> たねポケモン:" + val.basicCount + "枚</span> ";
      } else {
        statusHtml += "<span class=\"badge badge-danger\"><i class=\"fas fa-times\"></i> たねポケモン0枚</span> ";
      }

      if (val.overLimitCards.length > 0) {
        statusHtml += "<span class=\"badge badge-danger\"><i class=\"fas fa-times\"></i> 同名4枚超過あり</span>";
      } else {
        statusHtml += "<span class=\"badge badge-success\"><i class=\"fas fa-check\"></i> 同名4枚上限OK</span>";
      }
      ruleStatusEl.innerHTML = statusHtml;
    }

    renderDeckCardsList();
    renderPoolGallery();
  }

  function renderDeckCardsList() {
        const container = document.getElementById('deck-cards-list');
        if (!container || !state.activeDeck) return;

        const cards = state.activeDeck.cards || [];
        if (cards.length === 0) {
          container.innerHTML = "<div class=\"empty-list-notice\">右のカードプールからカードをクリックしてデッキに追加してください。</div>";
          return;
        }

        const poolMap = {};
        const pool = state.cardPool && state.cardPool.length ?
          state.cardPool :
          window.App && window.App.state && window.App.state.cards || [];
        pool.forEach((c) => { poolMap[c.id] = c; });

        // カテゴリ別グループ化
        const groups = {
          'たね': [],
          '1進化': [],
          '2進化': [],
          'トレーナーズ': [],
          'エネルギー': [],
          'その他': []
        };

        cards.forEach((item) => {
          const card = poolMap[item.id] ||
            pool.find((c) => String(c.id) === String(item.id) || (item.name && c.name === item.name)) ||
            { id: item.id, name: item.name || '不明なカード', category: item.category || 'その他', type: item.type || '無' };
          let catKey = 'その他';
          const cat = String(card.category || '');
          if (cat.includes('たね') || cat.includes('ポケモン') && !cat.includes('進化')) catKey = 'たね'; else
            if (cat.includes('1進化')) catKey = '1進化'; else
              if (cat.includes('2進化')) catKey = '2進化'; else
                if (cat.includes('グッズ') || cat.includes('サポート') || cat.includes('スタジアム') || cat.includes('ポケモンのどうぐ')) catKey = 'トレーナーズ'; else
                  if (cat.includes('エネルギー') || card.type === 'エネルギー') catKey = 'エネルギー';

          groups[catKey].push({ card: card, count: item.count });
        });

        let html = '';
        Object.keys(groups).forEach((cat) => {
          const list = groups[cat];
          if (list.length === 0) return;

          const groupTotal = list.reduce((sum, item) => sum + item.count, 0);
          html += "<div class=\"deck-group-header\"><span>" + cat + "</span> <span class=\"group-count\">(" + groupTotal + "枚)</span></div>";

          list.forEach(({ card, count }) => {
            const typeBadge = card.type ? "<span class=\"type-mini-badge type-" + card.type + "\">" + card.type + "</span>" : '';
            const isEnergy = isNormalEnergy(card);
            const ownedCount = getCardOwnedCount(card);
            const isOverOwned = !isEnergy && count > ownedCount;
            const isAdmin = window.App && typeof window.App.isAdmin === 'function' && window.App.isAdmin();
            const isSampleDeck = state.activeDeck && (state.activeDeck.userEmail === 'sample' || state.activeDeck.isSample);
            const maxAllowed = isEnergy ? 60 : ((isAdmin && isSampleDeck) ? 4 : Math.min(4, ownedCount));
            const isMaxCount = count >= maxAllowed;
            const warnBadge = isOverOwned
              ? ("<span class=\"deck-unowned-warning-badge\">" + (ownedCount <= 0 ? '⚠️ 未所持' : '⚠️ 所持:' + ownedCount + '枚') + "</span>")
              : ("<span style=\"font-size:11px; color:#94a3b8; margin-left:6px;\">" + (isEnergy ? '(無制限)' : '所持:' + ownedCount + '枚') + "</span>");

            html += '<div class="deck-item-row ' + (isOverOwned ? 'is-unowned-deck-item' : '') + '">' +
              '<div class="deck-item-info">' +
              typeBadge +
              '<span class="deck-item-name" title="' + escapeHtml(card.name) + '">' + escapeHtml(card.name) + '</span>' +
              warnBadge +
              '</div>' +
              '<div class="deck-item-controls">' +
              '<button class="btn-step" onclick="DeckSystem.removeCard(\'' + card.id + '\')">-</button>' +
              '<span class="deck-item-count">' + count + '</span>' +
              '<button class="btn-step" onclick="DeckSystem.addCard(\'' + card.id + '\')" ' + (isMaxCount ? 'disabled' : '') + '>+</button>' +
              '<button class="btn-remove-all" onclick="DeckSystem.setCardCount(\'' + card.id + '\', 0)" title="全削除"><i class="fas fa-trash-alt"></i></button>' +
              '</div>' +
              '</div>';
          });
        });

        container.innerHTML = html;
      }

  function renderPoolGallery() {
        const grid = document.getElementById('deck-pool-grid');
        if (!grid) return;

        let filtered = state.cardPool.filter((card) => {
          if (state.filter.search) {
            const q = state.filter.search;
            const matchName = String(card.name || '').toLowerCase().includes(q);
            const matchEffect = String(card.abilityText || '').toLowerCase().includes(q) || String(card.attack1Text || '').toLowerCase().includes(q);
            if (!matchName && !matchEffect) return false;
          }
          if (state.filter.category !== 'all') {
            if (state.filter.category === 'acespec') {
              if (!isAceSpecCard(card)) return false;
            } else if (card.category !== state.filter.category) {
              return false;
            }
          }
          if (state.filter.type !== 'all') {
            if (card.type !== state.filter.type) return false;
          }
          return true;
        });

        if (filtered.length === 0) {
          grid.innerHTML = "<div class=\"empty-pool-notice\">該当するカードが見つかりません。</div>";
          return;
        }

        const currentDeckCards = state.activeDeck && state.activeDeck.cards ? state.activeDeck.cards : [];
        const countMap = {};
        currentDeckCards.forEach((c) => { countMap[c.id] = c.count; });

        let html = '';
        filtered.forEach((card) => {
          const inDeckCount = countMap[card.id] || 0;
          const isEnergy = isNormalEnergy(card);
          const ownedCount = getCardOwnedCount(card);
          const isUnowned = !isEnergy && ownedCount <= 0;
          const isAdmin = window.App && typeof window.App.isAdmin === 'function' && window.App.isAdmin();
          const isSampleDeck = state.activeDeck && (state.activeDeck.userEmail === 'sample' || state.activeDeck.isSample);
          const isAce = isAceSpecCard(card);
          const currentAceTotal = currentDeckCards.reduce((sum, item) => {
            const c = (state.cardPool || []).find((x) => String(x.id) === String(item.id));
            return sum + (isAceSpecCard(c) ? (Number(item.count) || 0) : 0);
          }, 0);
          const maxLimit = isAce ? 1 : (isEnergy ? 60 : ((isAdmin && isSampleDeck) ? 4 : Math.min(4, ownedCount)));
          const isMax = (isAce && currentAceTotal >= 1) || inDeckCount >= maxLimit;

          // 所持フィルター適用
          if (state.filter.ownership === 'owned' && isUnowned) return;
          if (state.filter.ownership === 'unowned' && !isUnowned) return;

          const badgeHtml = isAce
            ? "<div class=\"pool-in-deck-badge pool-ace-badge\" style=\"top:6px; right:6px; z-index:10; font-size:10px; background:linear-gradient(135deg, #e11d48, #d946ef); color:#fff;\">ACE SPEC (1枚制限)</div>"
            : isEnergy
            ? "<div class=\"pool-in-deck-badge pool-energy-badge\" style=\"top:6px; right:6px; z-index:10; font-size:10px;\">基本エネ (無制限)</div>"
            : (isUnowned
              ? "<div class=\"pool-in-deck-badge pool-unowned-badge\" style=\"top:6px; right:6px; z-index:10; font-size:10px;\">未所持</div>"
              : "<div class=\"pool-in-deck-badge pool-owned-badge\" style=\"top:6px; right:6px; z-index:10; font-size:10px;\">所持: " + ownedCount + "枚" + (inDeckCount > 0 ? " (" + inDeckCount + "枚使用中)" : "") + "</div>");

          if (window.CardSystem && window.CardSystem.createCardHtml) {
            html += "\n          <div class=\"deck-pool-card-wrapper " + (isUnowned ? 'pool-card-unowned' : '') + " " + (isMax ? 'pool-card-max' : '') + "\" onclick=\"DeckSystem.addCard('" +
              card.id + "')\" title=\"" + (isUnowned ? '未所持（デッキに追加できません）' : (isMax ? '上限枚数に達しています' : 'クリックしてデッキに追加')) + "\">\n            " +
              badgeHtml + "\n            " +
              window.CardSystem.createCardHtml(card, { size: 'sm', inDeckCount: inDeckCount, isMax: isMax }) + "\n          </div>\n        ";
          }
        });

        if (!html) {
          grid.innerHTML = "<div class=\"empty-pool-notice\">該当する所持カードがありません。「すべてのカード」を選択して確認するか、パックを開封してカードを獲得してください。</div>";
          return;
        }

        grid.innerHTML = html;
      }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).
    replace(/&/g, '&amp;').
    replace(/</g, '&lt;').
    replace(/>/g, '&gt;').
    replace(/"/g, '&quot;').
    replace(/'/g, '&#039;');
  }

  return {
    state: state,
    init: init,
    fetchCurrentUser: fetchCurrentUser,
    updateUserBadge: updateUserBadge,
    setGalleryTab: setGalleryTab,
    loadDecks: loadDecks,
    saveAsOfficialSample: saveAsOfficialSample,
    openGallery: openGallery,
    openEditor: openEditor,
    duplicateDeck: duplicateDeck,
    addCard: addCard,
    removeCard: removeCard,
    setCardCount: setCardCount,
    clearActiveDeck: clearActiveDeck,
    saveActiveDeck: saveActiveDeck,
    deleteDeck: deleteDeck,
    renderGallery: renderGallery,
    renderEditor: renderEditor,
    validateDeck: validateDeck,
    isAceSpecCard: isAceSpecCard,
    getCardOwnedCount: getCardOwnedCount
  };
  console.log('[ORBITAL] DeckSystem.js.html finished execution. window.DeckSystem =', typeof window.DeckSystem);
}();
</script>
