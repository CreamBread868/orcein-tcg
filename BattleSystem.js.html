    openCardActionModal(card, isBench = false, benchIdx = null) {
      if (!card) return;
      this._currentActionCard = card;
      this._currentActionIsBench = isBench;
      this._currentActionBenchIdx = benchIdx;

      const modal = document.getElementById('battleCardActionModal');
      if (!modal) return;

      const symbol = window.CardSystem && window.CardSystem.typeSymbols && window.CardSystem.typeSymbols[card.type] || '✦';
      const symEl = document.getElementById('cardActionTypeSymbol');
      if (symEl) {
        symEl.textContent = symbol;
        symEl.className = "card-action-type-symbol type-" + this.escape(card.type || '無');
      }
      const nameEl = document.getElementById('cardActionName');
      if (nameEl) nameEl.textContent = card.name;
      const catEl = document.getElementById('cardActionCategory');
      if (catEl) catEl.textContent = card.category || (isBench ? 'ベンチ' : 'バトル場');

      const p = this.state.player;
      const isMyTurn = this.state.turnPlayer === 'player' && this.state.phase === 'battle';
      const isFirstTurnFirstPlayer = this.isFirstPlayerFirstTurn('player');
      const energyCount = card.energy || 0;

      const metaEl = document.getElementById('cardActionMeta');
      if (metaEl) {
        metaEl.textContent = "HP " + card.hp + "/" + card.maxHp + " • エネルギー: " + energyCount + "個 【" + (isBench ? 'ベンチ' : 'バトル場') + "】";
      }

      const listEl = document.getElementById('cardActionList');
      if (!listEl) return;

      let itemsHtml = '';

      // 1. 特性 (バトル場またはベンチ)
      if (card.abilityName) {
        const isAbilityBlocked = this.isBlocked('ability', card, p);
        const maxUses = this.getAbilityMaxUses(card);
        const remaining = this.getAbilityRemainingUses(card);
        const canUseAbility = isMyTurn && remaining > 0 && !isAbilityBlocked;

        let btnLabel = '✨ 特性を発動する';
        if (!isMyTurn) {
          btnLabel = '相手の番です';
        } else if (isAbilityBlocked) {
          btnLabel = '🚫 特性禁止中';
        } else if (remaining === 0) {
          btnLabel = maxUses === 1 ? '使用済み (1ターン1回)' : '使用済み (1ターン' + maxUses + '回)';
        } else if (maxUses === Infinity) {
          btnLabel = '✨ 特性を発動する (何度でも使用可)';
        } else if (maxUses > 1) {
          btnLabel = '✨ 特性を発動する (残り' + remaining + '回)';
        }

        itemsHtml += "\n          <div class=\"card-act-item is-ability\">\n            <div class=\"act-item-content\">\n              <div class=\"act-item-header\">\n                <span class=\"act-badge ability\">特性</span>\n                <span class=\"act-item-name\">" +
        this.escape(card.abilityName) + "</span>\n              </div>\n              <div class=\"act-item-text\">" +
        this.escape(card.abilityText || '特殊効果を発揮します。') + "</div>\n            </div>\n            <button type=\"button\" class=\"primary-button card-act-btn ability-btn\" data-action=\"ability\" " + (
        canUseAbility ? '' : 'disabled') + ">\n              " +
        btnLabel + "\n            </button>\n          </div>\n        ";
      }

      // 2. ワザ1
      if (card.attack1Name) {
        const energyCheck = this.checkEnergyRequirement(card, card.attack1Energy);
        const hasEnergy = energyCheck.canAttack;
        const isAtkBlocked = this.isBlocked('attack', card, p);
        const canAttack = !isBench && isMyTurn && !isFirstTurnFirstPlayer && hasEnergy && !isAtkBlocked;

        let btnLabel = '⚔ ワザを使う';
        if (isBench) btnLabel = 'バトル場で使用可';else
        if (!isMyTurn) btnLabel = '相手の番です';else
        if (isFirstTurnFirstPlayer) btnLabel = '先攻1ターン目不可';else
        if (isAtkBlocked) btnLabel = '🚫 ワザ使用禁止中';else
        if (!hasEnergy) btnLabel = energyCheck.reason === 'type' ? energyCheck.missingDesc : "エネ不足 (" + energyCount + "/" + energyCheck.reqCount + ")";

        itemsHtml += "\n          <div class=\"card-act-item is-attack\">\n            <div class=\"act-item-content\">\n              <div class=\"act-item-header\">\n                <span class=\"act-badge atk\">ワザ1</span>\n                <span class=\"act-item-name\">" +
        this.escape(card.attack1Name) + "</span>\n                <span class=\"act-item-dmg\">" +
        this.escape(card.attack1Damage != null && card.attack1Damage !== '' ? card.attack1Damage + ' ダメージ' : '') + "</span>\n              </div>\n              <div class=\"act-item-text\">" +
        this.escape(card.attack1Text || '') + "</div>\n              <div class=\"act-item-cost\">必要: " +
        this.renderCostText(card.attack1Energy) + " (現在: " + energyCount + "個)</div>\n            </div>\n            <button type=\"button\" class=\"primary-button card-act-btn\" data-action=\"attack1\" " + (
        canAttack ? '' : 'disabled') + ">\n              " +
        btnLabel + "\n            </button>\n          </div>\n        ";
      }

      // 3. ワザ2
      if (card.attack2Name) {
        const energyCheck = this.checkEnergyRequirement(card, card.attack2Energy);
        const hasEnergy = energyCheck.canAttack;
        const isAtkBlocked = this.isBlocked('attack', card, p);
        const canAttack = !isBench && isMyTurn && !isFirstTurnFirstPlayer && hasEnergy && !isAtkBlocked;

        let btnLabel = '⚔ ワザを使う';
        if (isBench) btnLabel = 'バトル場で使用可';else
        if (!isMyTurn) btnLabel = '相手の番です';else
        if (isFirstTurnFirstPlayer) btnLabel = '先攻1ターン目不可';else
        if (isAtkBlocked) btnLabel = '🚫 ワザ使用禁止中';else
        if (!hasEnergy) btnLabel = energyCheck.reason === 'type' ? energyCheck.missingDesc : "エネ不足 (" + energyCount + "/" + energyCheck.reqCount + ")";

        itemsHtml += "\n          <div class=\"card-act-item is-attack\">\n            <div class=\"act-item-content\">\n              <div class=\"act-item-header\">\n                <span class=\"act-badge atk\">ワザ2</span>\n                <span class=\"act-item-name\">" +
        this.escape(card.attack2Name) + "</span>\n                <span class=\"act-item-dmg\">" +
        this.escape(card.attack2Damage != null && card.attack2Damage !== '' ? card.attack2Damage + ' ダメージ' : '') + "</span>\n              </div>\n              <div class=\"act-item-text\">" +
        this.escape(card.attack2Text || '') + "</div>\n              <div class=\"act-item-cost\">必要: " +
        this.renderCostText(card.attack2Energy) + " (現在: " + energyCount + "個)</div>\n            </div>\n            <button type=\"button\" class=\"primary-button card-act-btn\" data-action=\"attack2\" " + (
        canAttack ? '' : 'disabled') + ">\n              " +
        btnLabel + "\n            </button>\n          </div>\n        ";
      }

      // 4. にげる (バトル場のみ)
      if (!isBench) {
        const retreatCost = Number(card.retreat) || 0;
        const hasBench = p.bench && p.bench.length > 0;
        const hasEnergy = energyCount >= retreatCost;
        const isRetreatBlocked = this.isBlocked('retreat', card, p);
        const canRetreat = isMyTurn && !p.retreated && hasBench && hasEnergy && !isRetreatBlocked;

        let btnLabel = '🏃 にげる (交代)';
        if (!isMyTurn) btnLabel = '相手の番です';else
        if (isRetreatBlocked) btnLabel = '🚫 にげる禁止中';else
        if (p.retreated) btnLabel = '今番既ににげました';else
        if (!hasBench) btnLabel = '交代ベンチなし';else
        if (!hasEnergy) btnLabel = "エネ不足 (" + energyCount + "/" + retreatCost + ")";

        itemsHtml += "\n          <div class=\"card-act-item is-retreat\">\n            <div class=\"act-item-content\">\n              <div class=\"act-item-header\">\n                <span class=\"act-badge retreat\">交代</span>\n                <span class=\"act-item-name\">にげる</span>\n                <span class=\"act-item-dmg\">要 " +
        retreatCost + " エネ</span>\n              </div>\n              <div class=\"act-item-text\">ベンチのポケモンと交代します（エネルギーを" +
        retreatCost + "個消費）。</div>\n            </div>\n            <button type=\"button\" class=\"secondary-button card-act-btn\" data-action=\"retreat\" " + (
        canRetreat ? '' : 'disabled') + ">\n              " +
        btnLabel + "\n            </button>\n          </div>\n        ";
      }

      // 5. 手札からエネルギーを付ける
      const handEnergyIndices = [];
      p.hand.forEach((c, idx) => {
        if (this.isEnergy(c)) handEnergyIndices.push(idx);
      });
      const isEnergyBlocked = handEnergyIndices.length > 0 && this.isBlocked('energy', p.hand[handEnergyIndices[0]], p);
      const canAttachEnergyFromHand = isMyTurn && !p.energyAttached && handEnergyIndices.length > 0 && !isEnergyBlocked;

      let energyBtnLabel = '⚡ 手札からエネルギーを付ける';
      if (!isMyTurn) energyBtnLabel = '相手の番です';
      else if (p.energyAttached) energyBtnLabel = '今番既に手札から付けました';
      else if (handEnergyIndices.length === 0) energyBtnLabel = '手札にエネルギーなし';
      else if (isEnergyBlocked) energyBtnLabel = '🚫 エネルギー手札付け禁止中';

      itemsHtml += `
        <div class="card-act-item is-energy">
          <div class="act-item-content">
            <div class="act-item-header">
              <span class="act-badge energy" style="background:#00b4db;">手札付け</span>
              <span class="act-item-name">エネルギー装着</span>
            </div>
            <div class="act-item-text">手札のエネルギーカードをこのポケモンに付けます（1ターン1回まで）。</div>
          </div>
          <button type="button" class="primary-button card-act-btn energy-btn" data-action="attach_hand_energy" ${canAttachEnergyFromHand ? '' : 'disabled'}>
            ${energyBtnLabel}
          </button>
        </div>
      `;

      // 6. 手札から進化させる
      const validEvos = [];
      p.hand.forEach((c, idx) => {
        if (this.isEvolution(c) && this.canEvolveFrom(c, card).can && !this.isBlocked('evolution', c, p)) {
          validEvos.push({ handIdx: idx, card: c });
        }
      });

      validEvos.forEach(item => {
        itemsHtml += `
          <div class="card-act-item is-evo">
            <div class="act-item-content">
              <div class="act-item-header">
                <span class="act-badge evo" style="background:#ff9900;">進化</span>
                <span class="act-item-name">「${this.escape(item.card.name)}」へ進化</span>
              </div>
              <div class="act-item-text">手札の「${this.escape(item.card.name)}」を重ねて進化させます。</div>
            </div>
            <button type="button" class="primary-button card-act-btn evo-btn" data-action="evolve_hand" data-hand-idx="${item.handIdx}" ${isMyTurn ? '' : 'disabled'}>
              🌟 【${this.escape(item.card.name)}】に進化
            </button>
          </div>
        `;
      });

      if (!itemsHtml) {
        itemsHtml = '<div class="muted" style="text-align:center; padding: 20px;">現在実行可能なアクションはありません。</div>';
      }

      listEl.innerHTML = itemsHtml;

      // アクションボタンクリック設定
      listEl.querySelectorAll('[data-action]').forEach((btn) => {
        btn.onclick = () => {
          const act = btn.dataset.action;
          this.closeCardActionModal();
          if (act === 'attack1') {
            this.declareAttack(1);
          } else if (act === 'attack2') {
            this.declareAttack(2);
          } else if (act === 'ability') {
            this.activateAbility(card, isBench, benchIdx);
          } else if (act === 'retreat') {
            this.retreatActive();
          } else if (act === 'attach_hand_energy') {
            const targetSlotEl = isBench ?
              document.querySelectorAll('#playerBenchRow .bench-slot-occupied')[benchIdx] :
              document.getElementById('playerActiveSpot');
            if (handEnergyIndices.length === 1) {
              this.applyEnergyAttachment(handEnergyIndices[0], card, targetSlotEl);
            } else {
              this.showChoiceModal(handEnergyIndices.map(i => ({ name: p.hand[i].name, type: p.hand[i].type, category: '手札エネルギー' })), {
                title: 'つけるエネルギーを選択',
                desc: card.name + ' にどのエネルギーを付けますか？'
              }, (chosenIdx) => {
                const hIdx = handEnergyIndices[chosenIdx];
                this.applyEnergyAttachment(hIdx, card, targetSlotEl);
              });
            }
          } else if (act === 'evolve_hand') {
            const hIdx = Number(btn.dataset.handIdx);
            const targetSlotEl = isBench ?
              document.querySelectorAll('#playerBenchRow .bench-slot-occupied')[benchIdx] :
              document.getElementById('playerActiveSpot');
            this.executeEvolution(hIdx, card, targetSlotEl);
          }
        };
      });

      modal.style.display = 'flex';
    },

    closeCardActionModal() {
      const modal = document.getElementById('battleCardActionModal');
      if (modal) modal.style.display = 'none';
      this._currentActionCard = null;
    },

    renderCostText(energyStr) {
      const list = this.parseEnergyList(energyStr);
      if (!list || list.length === 0) return 'なし (0個)';
      return list.map((e) => {
        const sym = window.CardSystem && window.CardSystem.typeSymbols && window.CardSystem.typeSymbols[e] || e;
        return "" + sym + e;
      }).join(' ');
    },

    getAbilityMaxUses(card) {
      if (!card) return 1;
      if (card._abilityMaxUses !== undefined && card._abilityMaxUses !== null) {
        return Number(card._abilityMaxUses);
      }
      const code = String(card.abilityCode || '');
      if (/useLimit\s*\(\s*(?:Infinity|999|'infinite'|"infinite")\s*\)/i.test(code)) {
        return Infinity;
      }
      const match = code.match(/(?:useLimit|limitPerTurn|timesPerTurn|limit)\s*\(\s*(\d+)\s*\)/i);
      if (match) {
        return Number(match[1]);
      }
      return 1;
    },

    getAbilityRemainingUses(card) {
      if (!card) return 0;
      const maxUses = this.getAbilityMaxUses(card);
      if (maxUses === Infinity) return Infinity;
      const used = Number(card._abilityUseCount || 0);
      return Math.max(0, maxUses - used);
    },

    async activateAbility(card, isBench = false, benchIdx = null) {
      if (this.state.turnPlayer !== 'player') {
        App.toast('あなたの番にのみ特性を使えます。', true);
        return;
      }
      if (this.isBlocked('ability', card, this.state.player)) {
        App.toast('効果により特性の使用は禁止されています。', true);
        return;
      }
      const maxUses = this.getAbilityMaxUses(card);
      const remaining = this.getAbilityRemainingUses(card);
      if (remaining <= 0) {
        App.toast(maxUses === 1 ? "特性【" + card.abilityName + "】は自分の番に1回しか使えません。" : "特性【" + card.abilityName + "】は自分の番に" + maxUses + "回までしか使えません。", true);
        return;
      }

      card._abilityUseCount = (card._abilityUseCount || 0) + 1;
      card._abilityUsedThisTurn = card._abilityUseCount >= maxUses;
      this.log("✨ 【特性発動！】" + card.name + " の特性「" + card.abilityName + "」を発動しました！" + (maxUses > 1 && maxUses !== Infinity ? " (この番 " + card._abilityUseCount + "/" + maxUses + " 回目)" : ""));

      // 特性発動前のスナップショット（cant()時の盤面復元用）
      const snapshot = this.createBoardSnapshot();

      let execCtx = null;
      if (card.abilityCode && window.executeCardEffectCode) {
        try {
          execCtx = await window.executeCardEffectCode(card.abilityCode, { players: [this.state.player, this.state.opponent], logs: this.state.logs }, this.state.player, 'onActivateAbility', { card });
        } catch (e) {
          if (e && e.isEffectAbort) {
            execCtx = { isCancelled: true, cancelReason: e.message ? e.message.replace(/^EFFECT_ABORTED:\s*/, '') : '' };
          } else {
            console.error('Ability code execution error:', e);
          }
        }
      } else {
        const text = card.abilityText || '';
        if (text.includes('引く') || text.includes('ドロー')) {
          if (this.state.player.deck.length > 0) {
            const drawn = this.state.player.deck.shift();
            this.state.player.hand.push(drawn);
            this.log("✨ 特性効果で山札から1枚引きました。（" + drawn.name + "）");
          }
        } else if (text.includes('回復')) {
          card.hp = Math.min(card.maxHp, card.hp + 20);
          this.log("✨ 特性効果でHPを20回復しました。（現在HP: " + card.hp + "/" + card.maxHp + "）");
        }
      }

      if (execCtx && execCtx.isCancelled) {
        // 効果がキャンセル（cant()）された場合は盤面を復元し、使用回数を戻す
        this.restoreBoardSnapshot(snapshot);
        card._abilityUseCount = Math.max(0, (card._abilityUseCount || 1) - 1);
        card._abilityUsedThisTurn = card._abilityUseCount >= maxUses;
        this.render();
        return;
      }

      App.toast("特性「" + card.abilityName + "」を発動しました！");
      if (this.state.mode === 'online') {
        this.broadcastOnlineAction('use_ability', { card: card });
      }

      // もしバトル場が空になった場合（特性で自身をトラッシュした場合など）、ベンチから交代
      if (this.state.player.active === null) {
        if (this.state.player.bench.length > 0) {
          this.log("🔄 バトルポケモンがいなくなったため、ベンチから新しいバトルポケモンを出します。");
          this.showChoiceModal(this.state.player.bench.map((b) => ({ name: b.name, type: b.type, hp: b.hp, category: 'バトル場へ' })), {
            title: 'バトルポケモンの交代',
            desc: '新しいバトルポケモンを選択してください。'
          }, (idx) => {
            this.state.player.active = this.state.player.bench.splice(idx, 1)[0];
            this.log("🔄 プレイヤーは " + this.state.player.active.name + " をバトル場に出しました。");
            this.render();
          });
        } else {
          this.finishBattle(this.state.opponent.id, '自分の場にポケモンがいなくなりました！');
        }
      }

      this.render();
    },

    renderHand() {
      const root = document.getElementById('playerHandRow');
      if (!root) return;

      const hand = this.state.player.hand;
      if (!hand.length) {
        root.innerHTML = '<div class="muted hand-empty-msg">手札がありません</div>';
        return;
      }

      root.innerHTML = hand.map((c, i) => {
        let actionLabel = '使用';
        const isEn = this.isEnergy(c);
        const isBas = this.isBasic(c);
        const isEvo = this.isEvolution(c);
        const cat = String(c.category || '');
        const isSupp = cat.includes('サポート') || cat.toLowerCase().includes('supporter');
        const isFirstTurnFirstPlayer = this.isFirstPlayerFirstTurn('player');
        if (isBas) actionLabel = '場に出す (DnD)';
        else if (isEn) actionLabel = '⚡ エネ付け (DnD)';
        else if (isEvo) {
          actionLabel = this.isFirstTurn('player') ? '初番進化不可' : '進化 (DnD)';
        }
        else if (isSupp && isFirstTurnFirstPlayer) actionLabel = '先攻不可';
        else if (isSupp && this.state.player.supporterUsed) actionLabel = '今番使用済';
        else actionLabel = '発動 (DnD)';

        const isMyTurn = this.state.turnPlayer === 'player' && this.state.phase === 'battle';
        const draggableAttr = isMyTurn ? ' draggable="true"' : '';
        const cardKindClass = isEn ? ' is-energy-card' : isBas ? ' is-basic-card' : isEvo ? ' is-evo-card' : ' is-trainer-card';

        const cardHtml = window.CardSystem && window.CardSystem.createCardHtml ?
        window.CardSystem.createCardHtml(c, { size: 'hand' }) :
        '<div class="card-fallback">' + this.escape(c.name) + '</div>';

        return "\n          <div class=\"hand-card-wrapper" +
        cardKindClass + "\" data-hand-idx=\"" + i + "\"" + draggableAttr + " title=\"" + this.escape(c.name) + " (" + this.escape(c.category) + ")\">\n            <div class=\"hand-actual-card\">\n              " +

        cardHtml + "\n            </div>\n            <button type=\"button\" class=\"hand-play-pill-btn\">" +

        actionLabel + "</button>\n          </div>\n        ";


      }).join('');

      root.querySelectorAll('[data-hand-idx]').forEach((el) => {
        const idx = Number(el.dataset.handIdx);
        const card = hand[idx];

        // 全カード対応ドラッグイベント
        el.addEventListener('dragstart', (e) => {
          if (this.state.turnPlayer !== 'player' || this.state.phase !== 'battle') {
            e.preventDefault();
            return;
          }
          this.draggedHandIndex = idx;
          this.draggedCard = card;
          if (e.dataTransfer) {
            e.dataTransfer.setData('text/plain', String(idx));
            e.dataTransfer.effectAllowed = 'copyMove';
          }
          el.classList.add('is-dragging-card');

          // フィールド全体のハイライト (全カード共通でフィールドへのドロップを受け付ける)
          const stadium = document.querySelector('.battle-stadium');
          if (stadium) stadium.classList.add('drop-target-active');

          const isEn = this.isEnergy(card);
          const isBas = this.isBasic(card);
          const isEvo = this.isEvolution(card);

          if (isBas) {
            // たねポケモン: バトル場が空ならバトル場、および空きベンチをハイライト
            if (!this.state.player.active) {
              const activeSlot = document.getElementById('playerActiveSpot');
              if (activeSlot) activeSlot.classList.add('drop-target-active');
            }
            document.querySelectorAll('#playerBenchRow .bench-slot-empty').forEach((b) => {
              b.classList.add('drop-target-active');
            });
          } else if (isEvo) {
            // 進化: canEvolveFrom で有効なスロットのみハイライト
            const activeSlot = document.getElementById('playerActiveSpot');
            if (this.state.player.active && this.canEvolveFrom(card, this.state.player.active).can) {
              if (activeSlot) activeSlot.classList.add('drop-target-active');
            }
            document.querySelectorAll('#playerBenchRow .bench-slot-occupied').forEach((b) => {
              const bIdx = Number(b.dataset.benchIdx);
              const benchPoke = this.state.player.bench[bIdx];
              if (benchPoke && this.canEvolveFrom(card, benchPoke).can) {
                b.classList.add('drop-target-active');
              }
            });
          } else if (isEn) {
            // エネルギー: バトル場とベンチのポケモンをハイライト
            if (this.state.player.active) {
              const activeSlot = document.getElementById('playerActiveSpot');
              if (activeSlot) activeSlot.classList.add('drop-target-active');
            }
            document.querySelectorAll('#playerBenchRow .bench-slot-occupied').forEach((b) => {
              b.classList.add('drop-target-active');
            });
          } else {
            // トレーナー/グッズ/サポート: フィールド中央、バトル場、ベンチをハイライト
            const divider = document.querySelector('.arena-center-divider');
            if (divider) divider.classList.add('drop-target-field', 'drop-target-active');
            const activeSlot = document.getElementById('playerActiveSpot');
            if (activeSlot && this.state.player.active) activeSlot.classList.add('drop-target-active');
            document.querySelectorAll('#playerBenchRow .bench-slot-occupied').forEach((b) => {
              b.classList.add('drop-target-active');
            });
          }
        });

        el.addEventListener('dragend', () => {
          el.classList.remove('is-dragging-card');
          document.querySelectorAll('.drop-target-active, .drop-target-field, .drag-hover, .field-drag-hover').forEach((target) => {
            target.classList.remove('drop-target-active', 'drop-target-field', 'drag-hover', 'field-drag-hover');
          });
          setTimeout(() => {
            this.draggedHandIndex = null;
            this.draggedCard = null;
          }, 100);
        });

        // クリックイベント (フォールバック)
        el.addEventListener('click', () => {
          this.handleHandCardClick(idx);
        });
      });
    },

    escape(v) {
      return String(v == null ? '' : v).
      replace(/&/g, '&amp;').
      replace(/</g, '&lt;').
      replace(/>/g, '&gt;').
      replace(/"/g, '&quot;').
      replace(/'/g, '&#039;');
    }
  };

  window.BattleSystem = BattleSystem;
  console.log('[ORBITAL] BattleSystem.js.html finished execution. window.BattleSystem = object');
})();
</script>
