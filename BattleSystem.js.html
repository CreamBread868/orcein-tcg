        if (!el) return;
        el.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
          el.classList.add('drag-hover');
        });
        el.addEventListener('dragleave', (e) => {
          if (!el.contains(e.relatedTarget)) {
            el.classList.remove('drag-hover');
          }
        });

    stripFunctions(obj, seen) {
      if (obj === null || obj === undefined) return obj;
      if (typeof obj === 'function') return undefined;
      if (typeof obj !== 'object') return obj;

      if (!seen) seen = new WeakSet();
      if (seen.has(obj)) return null;
      seen.add(obj);

      if (Array.isArray(obj)) {
        return obj.map(item => this.stripFunctions(item, seen)).filter(item => item !== undefined);
      }

      const clean = {};
      for (const key in obj) {
        if (key === 'getCards' || key === 'prototype' || key === '__proto__') continue;
        let val;
        try {
          val = obj[key];
        } catch (e) {
          continue;
        }
        if (typeof val === 'function') continue;
        if (typeof val === 'string' && val.length > 500 && val.startsWith('data:')) {
          clean[key] = '';
          continue;
        }
        if (val && typeof val === 'object') {
          clean[key] = this.stripFunctions(val, seen);
        } else {
          clean[key] = val;
        }
      }

      try {
        return JSON.parse(JSON.stringify(clean, function (k, v) {
          if (k === 'getCards' || typeof v === 'function') return undefined;
          return v;
        }));
      } catch (e) {
        return clean;
      }
    },

    callGas(fnName, args, onSuccess, onFailure) {
      const cleanArgs = (args || []).map(arg => this.stripFunctions(arg));

      if (window.google && google.script && google.script.run && !window._is_mock_gas) {
        try {
          console.log('📡 [GAS Call]', fnName, cleanArgs);
          const self = this;
          const runner = google.script.run
            .withSuccessHandler(function (res) {
              console.log('✅ [GAS Success for ' + fnName + ']:', res);
              if (typeof onSuccess === 'function') onSuccess(res);
            })
            .withFailureHandler(function (err) {
              console.warn('⚠️ [GAS Failure for ' + fnName + '], switching to Cloud State Engine:', err);
              self.executeClientOnlineEngine(fnName, cleanArgs, onSuccess, onFailure);
            });

          if (typeof runner[fnName] === 'function') {
            runner[fnName].apply(runner, cleanArgs);
            return;
          }
        } catch (e) {
          console.warn('❌ [GAS Exception for ' + fnName + '], fallback to Cloud State Engine:', e);
        }
      }

      this.executeClientOnlineEngine(fnName, cleanArgs, onSuccess, onFailure);
    },

    executeClientOnlineEngine(fnName, args, onSuccess, onFailure) {
      console.log('⚡ [Cloud State Engine]', fnName, args);
      if (fnName === 'createOnlineRoom') {
        this.cloudCreateOnlineRoom(args[0], args[1], args[2], args[3], onSuccess, onFailure);
      } else if (fnName === 'joinOnlineRoom') {

    cloudPollOnlineRoom(roomId, playerRole, lastSeq, onSuccess, onFailure) {
      const cleanRoomId = String(roomId).trim().toUpperCase();
      const self = this;

      fetch('https://ntfy.sh/orbital_tcg_state_' + cleanRoomId + '/json?poll=1&since=24h')
        .then(res => res.text())
        .then(text => {
          let cloudRoom = null;
          const lines = text.trim().split('\n').filter(Boolean);
          for (let i = lines.length - 1; i >= 0; i--) {
            try {
              const parsed = JSON.parse(lines[i]);
              if (parsed.message) {
                const inner = JSON.parse(parsed.message);
                if (inner && inner.room && inner.room.roomId === cleanRoomId) {
                  cloudRoom = inner.room;
                  break;
                }
              }
            } catch (e) {}
          }

          const localRooms = self.getClientRooms();
          let room = localRooms.find(r => r.roomId === cleanRoomId);

          if (cloudRoom) {
            if (!room) {
              room = cloudRoom;
              localRooms.unshift(room);
            } else {
              if (cloudRoom.guest && !room.guest) room.guest = cloudRoom.guest;
              if (cloudRoom.status && cloudRoom.status !== room.status) room.status = cloudRoom.status;
              if (Array.isArray(cloudRoom.actions)) {
                if (!room.actions) room.actions = [];
                cloudRoom.actions.forEach(act => {
                  if (!room.actions.some(a => a.seq === act.seq)) {
                    room.actions.push(act);
                  }
                });
                room.actions.sort((a, b) => a.seq - b.seq);
                if (room.actions.length > 20) room.actions = room.actions.slice(-20);
                room.lastSeq = Math.max(room.lastSeq || 0, cloudRoom.lastSeq || 0);
              }
            }
          }

          if (!room) {
            room = {
              roomId: cleanRoomId,
              name: '対戦ルーム (' + cleanRoomId + ')',
              status: 'waiting',
              host: { role: 'host', email: 'host@gmail.com', name: 'ホスト', deck: [] },
              guest: null,
              actions: [],
              lastSeq: 0
            };
            localRooms.unshift(room);
          }

          const now = Date.now();
          if (playerRole === 'host') {
            room.hostConnectedAt = now;
            room.hostReady = true;
          } else if (playerRole === 'guest') {
            room.guestConnectedAt = now;
            room.guestReady = true;
          }

          const isHostLive = !!(room.hostReady || room.hostConnectedAt);
          const isGuestLive = !!(room.guestReady || room.guest || room.guestConnectedAt);

          let stateUpdated = false;
          if (playerRole === 'host' && (room.status === 'connecting' || room.status === 'waiting') && isHostLive && isGuestLive && room.guest) {
            room.status = 'active';
            if (!room.actions) room.actions = [];
            if (!room.actions.some(a => a.type === 'game_start')) {
              const firstPlayer = Math.random() < 0.5 ? 'host' : 'guest';
              const seed = Math.floor(Math.random() * 1000000000);
              room.turnPlayer = firstPlayer;
              room.turnNumber = 1;
              room.lastSeq = (room.lastSeq || 0) + 1;
              const startAct = {
                seq: room.lastSeq,
                by: 'system',
                type: 'game_start',
                payload: {
                  firstPlayer: firstPlayer,
                  seed: seed,
                  hostDeck: (room.host && room.host.deck || []).map(c => self.sanitizeCardForNetwork(c)),
                  guestDeck: (room.guest && room.guest.deck || []).map(c => self.sanitizeCardForNetwork(c)),
                  rules: room.rules,
                  hostName: room.host ? room.host.name : 'ホスト',
                  guestName: room.guest ? room.guest.name : 'ゲスト'
                },
                time: now
              };
              room.actions.push(startAct);
            }
            stateUpdated = true;
          }

          self.saveClientRooms(localRooms);

          if (stateUpdated) {
            if (room.actions && room.actions.length > 20) room.actions = room.actions.slice(-20);
            const statePayload = JSON.stringify({ type: 'room_state', room: room });
            fetch('https://ntfy.sh/orbital_tcg_state_' + cleanRoomId, { method: 'POST', body: statePayload }).catch(() => {});
          }

          const fromSeq = Number(lastSeq) || 0;
          const actions = (room.actions || []).filter(a => a.seq > fromSeq);

          if (typeof onSuccess === 'function') {
            onSuccess({
              ok: true,
              status: room.status,
              roomId: room.roomId,
              name: room.name,
              hostConnected: isHostLive,
              guestConnected: isGuestLive,
              host: room.host ? { name: room.host.name, email: room.host.email } : null,
              guest: room.guest ? { name: room.guest.name, email: room.guest.email } : null,
              actions: actions,
              lastSeq: room.lastSeq || 0,
              updatedAt: room.updatedAt
            });
          }
        })
        .catch(err => {
          console.warn('Cloud poll fetch error:', err);
          const localRes = self.clientPollOnlineRoom(cleanRoomId, playerRole, lastSeq);
          if (typeof onSuccess === 'function') onSuccess(localRes);
        });
    },

    cloudGetOnlineRoomList(onSuccess, onFailure) {
      const self = this;
      fetch('https://ntfy.sh/orbital_tcg_lobby_state/json?poll=1&since=24h')
        .then(res => res.text())
        .then(text => {
          const lines = text.trim().split('\n').filter(Boolean);

          lines.forEach(line => {
            try {
              const parsed = JSON.parse(line);
              if (parsed.message) {
                const inner = JSON.parse(parsed.message);

                  cloudRooms.push(inner.room);
                }
              }
            } catch (e) {}
          });

          const localRooms = self.getClientRooms();
          const merged = [...cloudRooms, ...localRooms];
          const uniqueRooms = [];
          const seenIds = new Set();
          merged.forEach(r => {
            if (r && r.roomId && !seenIds.has(r.roomId) && r.status === 'waiting' && (now - (r.timestamp || 0)) < 7200000) {
              seenIds.add(r.roomId);
              uniqueRooms.push(r);
            }
          });

          if (typeof onSuccess === 'function') onSuccess(uniqueRooms);
        })
        .catch(err => {
          console.warn('Cloud lobby fetch error:', err);
          if (typeof onSuccess === 'function') onSuccess(self.clientGetOnlineRoomList());

        }
      } catch (e) {}
      return [];

    saveClientRooms(rooms) {
      try {
        localStorage.setItem('orbital_online_rooms', JSON.stringify(rooms));
        if (window.BroadcastChannel) {
          if (!this._onlineChannel) {
            this._onlineChannel = new BroadcastChannel('orbital_online_bus');
            const self = this;
            this._onlineChannel.onmessage = function (evt) {
              if (evt && evt.data && evt.data.type === 'sync_rooms') {
                if (self.state.phase === 'battle' || (self.state.mode === 'online' && self.state.online.roomId)) {
                  self.pollRoomImmediate();
                } else {
                  self.refreshRoomList();
                }
              }
            };
          }
          this._onlineChannel.postMessage({ type: 'sync_rooms', rooms: rooms });
        }
        if (!this._storageListenerAdded && typeof window !== 'undefined') {
          this._storageListenerAdded = true;
          const self = this;
          window.addEventListener('storage', function (e) {
            if (e.key === 'orbital_online_rooms') {
              if (self.state.phase === 'battle' || (self.state.mode === 'online' && self.state.online.roomId)) {
                self.pollRoomImmediate();
              } else {
                self.refreshRoomList();
              }
            }
          });
        }
      } catch (e) {}
    },

    clientJoinOnlineRoom(roomId, deck, userEmail) {
      const cleanRoomId = String(roomId).trim().toUpperCase();
      const rooms = this.getClientRooms();
      let room = rooms.find(r => r.roomId === cleanRoomId);

      if (!room) {
        // Cross-device / cross-account direct join via PeerJS P2P
        room = {
          roomId: cleanRoomId,
          name: '対戦ルーム (' + cleanRoomId + ')',
          status: 'waiting',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          timestamp: Date.now(),
          hostConnectedAt: Date.now(),
          hostReady: true,
          guestConnectedAt: null,
          guestReady: false,
          rules: { prizeCount: 6 },
          host: { role: 'host', email: 'host@gmail.com', name: 'ホスト', deck: [] },
          guest: null,
          actions: [],
          lastSeq: 0
        };
        rooms.unshift(room);
      }
      if (room.status !== 'waiting' && room.status !== 'connecting') {
        return { ok: false, message: 'このルームはすでに対戦中か終了しています。' };
      }

      const guestEmail = userEmail || (window.DeckSystem && DeckSystem.state && DeckSystem.state.currentUser ? DeckSystem.state.currentUser.email : '') || 'guest@gmail.com';

        role: 'guest',
        email: guestEmail,
        name: guestName,
        deck: deck
      };
      room.guestConnectedAt = now;
      room.guestReady = true;
      if (!room.hostConnectedAt) {
        room.hostConnectedAt = now;
        room.hostReady = true;
      }
      room.status = 'connecting';
      room.updatedAt = new Date().toISOString();

      this.saveClientRooms(rooms);
      this.initPeerJsGuest(cleanRoomId, room);

      return {
        ok: true,
        roomId: cleanRoomId,
        role: 'guest',
        status: room.status,
        room: {
          roomId: cleanRoomId,
          name: room.name,
          status: room.status,
          host: { name: room.host ? room.host.name : 'ホスト', email: room.host ? room.host.email : '' },
          guest: { name: guestName, email: guestEmail },
          rules: room.rules
        }
      };
    },

    clientPollOnlineRoom(roomId, playerRole, lastSeq) {
      const cleanRoomId = String(roomId).trim().toUpperCase();
      const rooms = this.getClientRooms();
      const room = rooms.find(r => r.roomId === cleanRoomId);

      if (!room) {
        return { ok: false, status: 'closed', message: 'ルームが存在しないか終了しました。' };
      }

      const now = Date.now();
      if (playerRole === 'host') {
        room.hostConnectedAt = now;
        room.hostReady = true;
      } else if (playerRole === 'guest') {
        room.guestConnectedAt = now;
        room.guestReady = true;
      }

      const isHostLive = !!(room.hostReady && room.hostConnectedAt && (now - room.hostConnectedAt < 30000));
      const isGuestLive = !!(room.guestReady && room.guestConnectedAt && (now - room.guestConnectedAt < 30000));

      if ((room.status === 'connecting' || room.status === 'waiting') && isHostLive && isGuestLive && room.guest) {
        room.status = 'active';
        const firstPlayer = Math.random() < 0.5 ? 'host' : 'guest';
        const seed = Math.floor(Math.random() * 1000000000);
        room.turnPlayer = firstPlayer;
        room.turnNumber = 1;
        room.lastSeq = (room.lastSeq || 0) + 1;
        if (!room.actions) room.actions = [];
        room.actions.push({
          seq: room.lastSeq,
          by: 'system',
          type: 'game_start',
          payload: {
            firstPlayer: firstPlayer,
            seed: seed,
            hostDeck: room.host ? room.host.deck : [],
            guestDeck: room.guest ? room.guest.deck : [],
            rules: room.rules,
            hostName: room.host ? room.host.name : 'ホスト',
            guestName: room.guest ? room.guest.name : 'ゲスト'
          },
          time: now
        });
        this.saveClientRooms(rooms);
      }

      const fromSeq = Number(lastSeq) || 0;
      const actions = (room.actions || []).filter(a => a.seq > fromSeq);

      return {
        ok: true,
        status: room.status,
        roomId: room.roomId,
        name: room.name,
        hostConnected: isHostLive,
        guestConnected: isGuestLive,
        host: room.host ? { name: room.host.name, email: room.host.email } : null,
        guest: room.guest ? { name: room.guest.name, email: room.guest.email } : null,
        actions: actions,
        lastSeq: room.lastSeq || 0,
        updatedAt: room.updatedAt
      };
    },

    clientSubmitOnlineAction(roomId, playerRole, action) {
      const cleanRoomId = String(roomId).trim().toUpperCase();
      const rooms = this.getClientRooms();
      const room = rooms.find(r => r.roomId === cleanRoomId);
      if (!room) return { ok: false, message: 'ルームが見つかりません。' };

      room.lastSeq = (room.lastSeq || 0) + 1;
      const actionEntry = {
        seq: room.lastSeq,
        by: playerRole,
        type: action.type,
        payload: action.payload || null,
        time: Date.now()
      };

      if (!room.actions) room.actions = [];
      room.actions.push(actionEntry);
      if (room.actions.length > 50) {
        room.actions = room.actions.slice(-50);
      }

      if (action.type === 'surrender' || action.type === 'game_over') {
        room.status = 'finished';
      }

      room.updatedAt = new Date().toISOString();
      this.saveClientRooms(rooms);

      if (this._p2pConn && this._p2pConn.open) {
        try {
          this._p2pConn.send({ type: 'online_action', actionEntry: actionEntry });
        } catch (e) {}
      }

      return { ok: true, lastSeq: room.lastSeq };
    },

    clientGetOnlineRoomList() {
      const rooms = this.getClientRooms();
      const now = Date.now();
      return rooms.filter(r => (now - (r.timestamp || 0)) < 7200000 && r.status === 'waiting');
    },

    clientLeaveOnlineRoom(roomId, playerRole) {
      const cleanRoomId = String(roomId).trim().toUpperCase();
      const rooms = this.getClientRooms();
      const room = rooms.find(r => r.roomId === cleanRoomId);
      if (room) {
        room.status = 'finished';
        this.saveClientRooms(rooms);
      }
      return { ok: true };
    },

    initPeerJsHost(roomId, roomObj) {
      const self = this;
      this.ensurePeerJsLoaded(function () {
        if (!window.Peer) return;
        try {
          const peerId = 'orbital-room-' + roomId.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
          if (self._peer) { try { self._peer.destroy(); } catch (e) {} }
          self._peer = new window.Peer(peerId);

          self._peer.on('connection', function (conn) {
            self._p2pConn = conn;
            conn.on('data', function (data) {
              if (data && data.type === 'online_action' && data.actionEntry) {
                self.injectRemoteAction(roomId, data.actionEntry);
              }
            });
          });
        } catch (e) {
          console.warn('PeerJS host init warning:', e);
        }
      });
    },

    initPeerJsGuest(roomId, roomObj) {
      const self = this;
      this.ensurePeerJsLoaded(function () {
        if (!window.Peer) return;
        try {
          const hostPeerId = 'orbital-room-' + roomId.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
          if (self._peer) { try { self._peer.destroy(); } catch (e) {} }
          self._peer = new window.Peer();

          self._peer.on('open', function () {
            const conn = self._peer.connect(hostPeerId);
            self._p2pConn = conn;
            conn.on('data', function (data) {
              if (data && data.type === 'online_action' && data.actionEntry) {
                self.injectRemoteAction(roomId, data.actionEntry);
              }
            });
          });
        } catch (e) {
          console.warn('PeerJS guest init warning:', e);
        }
      });
    },

    injectRemoteAction(roomId, actionEntry) {
      const cleanRoomId = String(roomId).trim().toUpperCase();
      const rooms = this.getClientRooms();
      const room = rooms.find(r => r.roomId === cleanRoomId);
      if (!room) return;

      if (!room.actions) room.actions = [];
      if (!room.actions.some(a => a.seq === actionEntry.seq)) {
        room.actions.push(actionEntry);
        room.lastSeq = Math.max(room.lastSeq || 0, actionEntry.seq);
        this.saveClientRooms(rooms);
      }
      if (this.state.mode === 'online') {
        this.pollRoomImmediate();
      }
    },

    ensurePeerJsLoaded(callback) {
      if (window.Peer) {
        if (callback) callback();
        return;
      }
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
      script.onload = () => {
        console.log('🟢 PeerJS loaded for P2P Online Battles');
        if (callback) callback();
      };
      script.onerror = () => {
        console.warn('PeerJS script failed to load.');
        if (callback) callback();
      };
      document.head.appendChild(script);
    },

    createRoom() {
      const deckVal = document.getElementById('battle-online-deck-select')?.value || 'preset_starter';
      const roomName = document.getElementById('online-room-name-input')?.value.trim() || '';
      const prizeCount = Number(document.getElementById('online-prize-count-select')?.value) || 6;
      const userEmail = window.DeckSystem && DeckSystem.state && DeckSystem.state.currentUser ? DeckSystem.state.currentUser.email : '';

      const rawDeck = this.resolveDeckCards(deckVal);
      if (!rawDeck || rawDeck.length === 0) {
        App.toast('対戦デッキを選択してください。', true);
        return;
      }
      const cleanDeck = rawDeck.map(c => this.sanitizeCardForNetwork(c));

      const self = this;
      this.callGas('createOnlineRoom', [cleanDeck, roomName, userEmail, { prizeCount: prizeCount }], function (res) {
        if (res && res.ok) {
          App.toast('🟢 通信成功: ルーム「' + res.roomId + '」の作成が完了しました！');
          self.openWaitingRoom(res.roomId, rawDeck, prizeCount, 'host');
        } else {
          App.toast((res && res.message) || '部屋の作成に失敗しました。', true);
        }
      }, function (err) {
        App.toast('エラー: ' + err.message, true);
      });
    },

    openWaitingRoom(roomId, myDeck, prizeCount, role) {
      this.state.mode = 'online';
      this.state.online.roomId = roomId;
      this.state.online.role = role || 'host';
      this.state.online.myDeck = myDeck;
      this.state.online.prizeCount = prizeCount;
      this.state.online.lastSeq = 0;

      document.getElementById('battle-select-view').style.display = 'none';
      document.getElementById('battle-online-waiting-view').style.display = 'block';
      const codeEl = document.getElementById('waitingRoomIdDisplay');
      if (codeEl) codeEl.textContent = roomId;

      this.startWaitingRoomPolling();
    },

    startWaitingRoomPolling() {
      this.stopPolling();
      const self = this;
      this.state.online.matchStarted = false;
      this.state.online.pollTimer = setInterval(function () {
        if (!self.state.online.roomId || self.state.online.matchStarted) return;
        self.callGas('pollOnlineRoom', [self.state.online.roomId, self.state.online.role, self.state.online.lastSeq], function (res) {
          if (res && res.ok) {
            if (res.status === 'connecting' || res.status === 'active') {
              self.showConnectingModal(res);
            }

            if (res.actions && res.actions.length > 0) {
              const startAct = res.actions.find(function (a) { return a.type === 'game_start'; });
              if (startAct && !self.state.online.matchStarted) {
                self.state.online.matchStarted = true;
                self.stopPolling();
                self.closeConnectingModal();
                const payload = startAct.payload;
                const isHost = self.state.online.role === 'host';
                const myDeck = self.state.online.myDeck;
                const oppDeck = isHost ? payload.guestDeck : payload.hostDeck;
                const myName = isHost ? payload.hostName : payload.guestName;
                const oppName = isHost ? payload.guestName : payload.hostName;

                App.toast('🟢 双方向接続を完了！試合を開始します！');
                self.startOnlineMatch(
                  myDeck,
                  oppDeck,
                  payload.firstPlayer,
                  (payload.rules && payload.rules.prizeCount) || 6,
                  myName || 'あなた',
                  oppName || '対戦相手',
                  payload.seed,
                  startAct.seq
                );
              }
            }
          }
        }, function (err) {
          console.warn('Waiting room poll error:', err);
        });
      }, 1200);
    },

    showConnectingModal(res) {
      const modal = document.getElementById('onlineConnectingModal');
      if (!modal) return;
      modal.classList.remove('hidden');

      const hostNameEl = document.getElementById('connectingHostName');
      const guestNameEl = document.getElementById('connectingGuestName');
      const hostBadgeEl = document.getElementById('connectingHostBadge');
      const guestBadgeEl = document.getElementById('connectingGuestBadge');
      const statusMsgEl = document.getElementById('connectingStatusMsg');

      if (res && res.host) {
        if (hostNameEl) hostNameEl.textContent = res.host.name || 'ホスト';
      }
      if (res && res.guest) {
        if (guestNameEl) guestNameEl.textContent = res.guest.name || 'ゲスト';
      }

      const hostOk = !!(res && (res.hostConnected || res.status === 'active' || res.host));
      const guestOk = !!(res && (res.guestConnected || res.status === 'active' || res.guest));

      if (hostBadgeEl) {
        hostBadgeEl.textContent = hostOk ? '接続完了 🟢' : '確認中 🟡';
        hostBadgeEl.style.color = hostOk ? 'var(--accent2)' : 'var(--muted)';
      }
      if (guestBadgeEl) {
        guestBadgeEl.textContent = guestOk ? '接続完了 🟢' : '確認中 🟡';
        guestBadgeEl.style.color = guestOk ? 'var(--accent2)' : 'var(--muted)';
      }

      if (statusMsgEl) {
        if (hostOk && guestOk) {
          statusMsgEl.textContent = '🟢 双方の接続が確認されました！試合を開始します...';
          statusMsgEl.style.color = 'var(--accent2)';
        } else {
          statusMsgEl.textContent = '⚡ 双方の通信状態を確認しています...';
          statusMsgEl.style.color = 'var(--accent)';
        }
      }
    },

    closeConnectingModal() {
      const modal = document.getElementById('onlineConnectingModal');
      if (modal) modal.classList.add('hidden');
    },

    cancelOnlineConnection() {
      this.closeConnectingModal();
      this.cancelWaitingRoom();
    },

    copyWaitingRoomId() {
      const code = this.state.online.roomId;
      if (!code) return;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(() => {
          App.toast('ルームID「' + code + '」をクリップボードにコピーしました！');
        });
      } else {
        App.toast('ルームID: ' + code);
      }
    },

    cancelWaitingRoom() {
      this.stopPolling();
      const roomId = this.state.online.roomId;
      if (roomId) {
        this.callGas('leaveOnlineRoom', [roomId, this.state.online.role || 'host']);
      }
      this.state.online.roomId = '';
      this.closeConnectingModal();
      document.getElementById('battle-online-waiting-view').style.display = 'none';
      document.getElementById('battle-select-view').style.display = 'block';
      this.refreshRoomList();
    },

      const rawDeck = this.resolveDeckCards(deckVal);

    stopPolling() {
      if (this.state.online.pollTimer) {
        clearInterval(this.state.online.pollTimer);
        this.state.online.pollTimer = null;
      }
    },

    createSeededRandom(seed) {
      let s = (Number(seed) || 123456789) >>> 0;
      return function () {
        s = (s + 0x6d2b79f5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },

    shuffleSeeded(arr, rng) {
      const list = (arr || []).slice();
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    },

    startOnlineMatch(myDeckRaw, oppDeckRaw, firstPlayerRole, prizeCount, myName, oppName, seed, startSeq) {
      const matchSeed = Number(seed) || Math.floor(Math.random() * 1000000000);
      const isHost = (this.state.online.role === 'host');

      const hostDeckRaw = isHost ? myDeckRaw : oppDeckRaw;
      const guestDeckRaw = isHost ? oppDeckRaw : myDeckRaw;

      const rngHost = this.createSeededRandom(matchSeed);
      const rngGuest = this.createSeededRandom(matchSeed + 777777);

      const hostDeck = this.shuffleSeeded(hostDeckRaw, rngHost).map(c => this.createRuntimeCard(c));
      const guestDeck = this.shuffleSeeded(guestDeckRaw, rngGuest).map(c => this.createRuntimeCard(c));

      const myDeck = isHost ? hostDeck : guestDeck;
      const oppDeck = isHost ? guestDeck : hostDeck;

      this.state.mode = 'online';
      this.state.phase = 'battle';
      this.state.turnNumber = 1;
      this.state.prizeCountRule = prizeCount || 6;
      this.state.online.lastSeq = Number(startSeq) || 1;
      this.state.logs = [];

      this.state.firstPlayer = (firstPlayerRole === this.state.online.role) ? 'player' : 'opponent';
      this.state.turnPlayer = this.state.firstPlayer;

      this.state.player = {
        id: 'player',
        name: myName || 'あなた',
        deck: myDeck,
        hand: [],
        active: null,
        bench: [],
        prizes: [],
        discard: [],
        energyAttached: false,
        supporterUsed: false,
        retreated: false,
        turnCount: 0
      };

      this.state.opponent = {
        id: 'opponent',
        name: oppName || '対戦相手',
        deck: oppDeck,
        hand: [],
        active: null,
        bench: [],
        prizes: [],
        discard: [],
        energyAttached: false,
        supporterUsed: false,
        retreated: false,
        turnCount: 0
      };

      // 手札ドロー
      this.drawInitialHand(this.state.player);
      this.drawInitialHand(this.state.opponent);

      // 初期配置
      this.setupInitialBoard(this.state.player);
      this.setupInitialBoard(this.state.opponent);

      // サイドカード配置
      for (let i = 0; i < this.state.prizeCountRule; i++) {
        if (this.state.player.deck.length) this.state.player.prizes.push(this.state.player.deck.shift());
        if (this.state.opponent.deck.length) this.state.opponent.prizes.push(this.state.opponent.deck.shift());
      }

      // UI切り替え
      document.getElementById('battle-select-view').style.display = 'none';
      document.getElementById('battle-online-waiting-view').style.display = 'none';
      document.getElementById('battle-arena-view').style.display = 'block';

      this.closeResultModal();
      this.log('🌐 オンライン対戦開始！ ルーム: ' + this.state.online.roomId);
      this.log('先攻は【' + (this.state.firstPlayer === 'player' ? this.state.player.name : this.state.opponent.name) + '】です。');

      this.render();
      this.playMatchIntro(this.state.player.name, this.state.opponent.name);
      this.startOnlineBattlePolling();
      this.startTurn(this.state.turnPlayer);
    },

    pollRoomImmediate() {
      if (this.state.mode !== 'online' || !this.state.online.roomId) return;
      if (this.state.online.pollInFlight) return;
      this.state.online.pollInFlight = true;
      const self = this;
      const currentSeq = this.state.online.lastSeq || 0;
      // console.log('🔄 [Online Poll Req]', 'Room:', this.state.online.roomId, 'Role:', this.state.online.role, 'CurrentLastSeq:', currentSeq);
      this.callGas('pollOnlineRoom', [this.state.online.roomId, this.state.online.role, currentSeq], function (res) {
        self.state.online.pollInFlight = false;
        if (!res) {
          console.warn('⚠️ [Online Poll Empty Response]');
          return;
        }
        if (!res.ok) {
          console.warn('⚠️ [Online Poll Warning Response]', res.message || 'Unknown error');
        }
        if (res.status === 'closed' || res.status === 'finished') {
          if (self.state.phase === 'battle') {
            self.stopPolling();
            App.toast('🏆 対戦相手が退出・切断しました。あなたの不戦勝です！');
            self.log('🏆 対戦相手が退出したため不戦勝となりました！');
            self.finishBattle('player', '対戦相手が退出・切断しました。あなたの勝利です！');
          }
          return;
        }

        const isOppConnected = (self.state.online.role === 'host') ? res.guestConnected : res.hostConnected;
        if (isOppConnected === false && self.state.phase === 'battle') {
          self.state.online.missedOpponentPolls = (self.state.online.missedOpponentPolls || 0) + 1;
          if (self.state.online.missedOpponentPolls >= 4) {
            self.stopPolling();
            App.toast('🏆 対戦相手の通信が切断されたため、あなたの不戦勝となりました！');
            self.log('🏆 対戦相手の通信切断により不戦勝！');
            self.finishBattle('player', '対戦相手の通信が切断されました。あなたの勝利です！');
            return;
          }
        } else {
          self.state.online.missedOpponentPolls = 0;
        }
        if (res.ok && Array.isArray(res.actions)) {
          if (res.actions.length > 0) {
            console.log('📥 [Online Poll Ack]', 'New Actions Count:', res.actions.length, 'ServerLastSeq:', res.lastSeq);
          }
          res.actions.forEach(function (act) {
            if (act.seq > self.state.online.lastSeq) {
              self.state.online.lastSeq = act.seq;
              if (act.by !== self.state.online.role) {
                self.applyRemoteAction(act);
              } else {
                console.log('ℹ️ [Online Skip Packet] Own action echoed back seq:', act.seq, 'type:', act.type);
              }
            } else {
              console.log('ℹ️ [Online Skip Packet] Already applied seq:', act.seq, 'currentLastSeq:', self.state.online.lastSeq);
            }
          });
        }
      }, function(err) {
        self.state.online.pollInFlight = false;
        console.warn('❌ [Online Poll Error] Retrying...', err);
      });
    },

    startOnlineBattlePolling() {
      this.stopPolling();
      const self = this;
      this.pollRoomImmediate();
      this.state.online.pollTimer = setInterval(function () {
        if (self.state.phase !== 'battle' || !self.state.online.roomId) return;
        self.pollRoomImmediate();
      }, 1500);
    },

    sanitizeCardForNetwork(c) {
      if (!c) return null;
      const cleanAttached = Array.isArray(c.attachedEnergies)
        ? c.attachedEnergies.map(item => (typeof item === 'object' ? { name: item.name, type: item.type } : item))
        : [];
      return {
        id: c.id || '',
        name: c.name || '',
        category: c.category || '',
        type: c.type || '',
        hp: Number(c.hp) || 0,
        maxHp: Number(c.maxHp) || Number(c.hp) || 70,
        energy: Number(c.energy) || 0,
        attachedEnergies: cleanAttached,
        status: c.status || null,
        isEx: !!c.isEx
      };
    },

    sanitizePayloadForNetwork(obj) {
      if (!obj || typeof obj !== 'object') return obj;
      if (Array.isArray(obj)) return obj.map(item => this.sanitizePayloadForNetwork(item));
      const clean = {};
      for (const key in obj) {
        if (!Object.prototype.hasOwnProperty.call(obj, key)) continue;
        if (key === 'boardState') {
          clean[key] = obj[key];
          continue;
        }
        const val = obj[key];
        if (typeof val === 'function') continue;
        if (val && typeof val === 'object' && (val.name || val.hp != null || val.category)) {
          clean[key] = this.sanitizeCardForNetwork(val);
        } else if (val && typeof val === 'object') {
          clean[key] = this.sanitizePayloadForNetwork(val);
        } else if (typeof val === 'string' && val.length > 500 && val.startsWith('data:')) {
          clean[key] = '';
        } else {
          clean[key] = val;
        }
      }
      return clean;
    },

    getBoardSnapshot() {
      const sanitizeCard = (c) => this.sanitizeCardForNetwork(c);

      return {
        active: sanitizeCard(this.state.player.active),
        bench: (this.state.player.bench || []).map(sanitizeCard),
        prizesCount: this.state.player.prizes ? this.state.player.prizes.length : 0,
        handCount: this.state.player.hand ? this.state.player.hand.length : 0,
        discardCount: this.state.player.discard ? this.state.player.discard.length : 0
      };
    },

    syncOpponentSnapshot(snapshot) {
      if (!snapshot) return;
      const opp = this.state.opponent;
      if (!opp) return;

      if (snapshot.active) {
        if (!opp.active || opp.active.name !== snapshot.active.name) {
          opp.active = this.createRuntimeCard(snapshot.active);
        } else {
          opp.active.hp = snapshot.active.hp;
          opp.active.maxHp = snapshot.active.maxHp;
          opp.active.energy = snapshot.active.energy;
          opp.active.attachedEnergies = snapshot.active.attachedEnergies || [];
          opp.active.status = snapshot.active.status;
          if (snapshot.active.image) opp.active.image = snapshot.active.image;
        }
      } else {
        opp.active = null;
      }

      if (Array.isArray(snapshot.bench)) {
        opp.bench = snapshot.bench.map((b, i) => {
          if (!b) return null;
          const existing = opp.bench[i];
          if (!existing || existing.name !== b.name) {
            return this.createRuntimeCard(b);
          }
          existing.hp = b.hp;
          existing.maxHp = b.maxHp;
          existing.energy = b.energy;
          existing.attachedEnergies = b.attachedEnergies || [];
          existing.status = b.status;
          if (b.image) existing.image = b.image;
          return existing;
        }).filter(Boolean);
      }

      if (typeof snapshot.prizesCount === 'number') {
        while (opp.prizes.length < snapshot.prizesCount) opp.prizes.push({ name: 'サイドカード' });
        while (opp.prizes.length > snapshot.prizesCount) opp.prizes.pop();
      }

      if (typeof snapshot.handCount === 'number') {
        while (opp.hand.length < snapshot.handCount) opp.hand.push({ name: '手札カード' });
        while (opp.hand.length > snapshot.handCount) opp.hand.pop();
      }
    },

    broadcastOnlineAction(type, payload) {
      if (this.state.mode !== 'online' || !this.state.online.roomId) return;
      const sanitizedPayload = this.sanitizePayloadForNetwork(payload || {});
      const fullPayload = this.stripFunctions({
        ...sanitizedPayload,
        boardState: this.getBoardSnapshot()
      });
      
      let payloadStr = '';
      try {
        payloadStr = JSON.stringify(fullPayload);
      } catch (e) {
        console.error('❌ [Online Packet Error] Failed to stringify payload:', e);
      }

      console.log('📤 [Online Outgoing Packet]', type, '| Size:', payloadStr.length, 'bytes | Room:', this.state.online.roomId, '| Role:', this.state.online.role, fullPayload);
      if (payloadStr.length > 50000) {
        console.warn('⚠️ [Online Packet Warning] Outgoing packet size is unusually large (' + payloadStr.length + ' bytes). Check payload for oversized data.');
      }

      const self = this;
      this.callGas('submitOnlineAction', [
        this.state.online.roomId,
        this.state.online.role,
        { type: type, payload: fullPayload }
      ], function(res) {
        if (res && res.ok && res.lastSeq) {
          console.log('✅ [Online Packet Ack]', type, '| Returned lastSeq:', res.lastSeq);
          self.state.online.lastSeq = res.lastSeq;
          App.toast('📡 通信成功: 操作「' + type + '」を送信しました。');
          self.pollRoomImmediate();
        } else {
          console.error('❌ [Online Packet Rejected]', type, '| Error:', res ? res.message : 'No response from server');
        }
      }, function(err) {
        console.error('❌ [Online Packet Network Error]', type, '| Error:', err);
      });
    },

    applyRemoteAction(action) {
      if (!action || !action.type) return;
      console.log('📥 [Online Incoming Packet Applied]', 'Seq:', action.seq, '| By:', action.by, '| Type:', action.type, action.payload);
      App.toast('🟢 通信成功: 相手の操作「' + action.type + '」を受信・反映しました！');
      try {
        const opp = this.state.opponent;
        const p = this.state.player;
        const payload = action.payload || {};

        if (payload.boardState && typeof this.syncOpponentSnapshot === 'function') {
          console.log('🔄 [Online Syncing Opponent Snapshot] Seq:', action.seq);
          this.syncOpponentSnapshot(payload.boardState);
        }

      switch (action.type) {
        case 'draw_card': {
          const count = Number(payload.count) || 1;
          this.log('🎴 相手がカードを' + count + '枚引きました。');
          this.animateDrawCard(false);
          this.render();
          break;
        }
        case 'play_basic': {
          let rawCard = payload.card || { name: 'たねポケモン', hp: 70 };
          let card = null;
          if (rawCard.id && window.CardSystem && typeof window.CardSystem.findCardById === 'function') {
            const master = window.CardSystem.findCardById(rawCard.id);
            if (master) card = this.createRuntimeCard(master);
          }
          if (!card) card = this.createRuntimeCard(rawCard);

          if (!payload.boardState) {
            if (payload.slotType === 'active') {
              opp.active = card;
            } else {
              opp.bench.push(card);
            }
          }
          this.log('✦ 相手が【' + card.name + '】を' + (payload.slotType === 'active' ? 'バトル場' : 'ベンチ') + 'に出しました。');
          this.render();
          const targetSlotEl = payload.slotType === 'active' ? document.getElementById('oppActiveSpot') : document.getElementById('oppBenchSpot' + Math.max(0, opp.bench.length - 1));
          if (targetSlotEl) this.animateCardPlacement(targetSlotEl);
          break;
        }
        case 'promote_active': {
          const bIdx = Number(payload.benchIdx);
          if (!payload.boardState && !isNaN(bIdx) && opp.bench && opp.bench[bIdx]) {
            opp.active = opp.bench.splice(bIdx, 1)[0];
          }
          this.log('🔄 相手が【' + (opp.active ? opp.active.name : 'ポケモン') + '】をバトル場に出しました。');
          this.render();
          const targetSlotEl = document.getElementById('oppActiveSpot');
          if (targetSlotEl) this.animateCardPlacement(targetSlotEl);
          break;
        }
        case 'evolve': {
          const rawEvo = payload.evoCard;
          let evoCard = null;
          if (rawEvo && rawEvo.id && window.CardSystem && typeof window.CardSystem.findCardById === 'function') {
            const master = window.CardSystem.findCardById(rawEvo.id);
            if (master) evoCard = this.createRuntimeCard(master);
          }
          if (!evoCard && rawEvo) evoCard = this.createRuntimeCard(rawEvo);

          let target = null;
          if (payload.targetSlotType === 'active' || payload.benchIdx === -1) {
            target = opp.active;
          } else if (payload.benchIdx >= 0 && opp.bench[payload.benchIdx]) {
            target = opp.bench[payload.benchIdx];
          } else {
            target = opp.active;
          }
          if (!payload.boardState && target && evoCard) {
            target.attachedCards = target.attachedCards || [];
            target.attachedCards.unshift({ ...target });
            target.name = evoCard.name;
            target.maxHp = Number(evoCard.hp) || (target.maxHp + 40);
            target.hp = Math.min(target.maxHp, target.hp + 40);
            target.image = evoCard.image || target.image || (window.CardSystem && window.CardSystem.findCardImage ? window.CardSystem.findCardImage(evoCard.name) : '');
            target.attack1Name = evoCard.attack1Name;
            target.attack1Damage = evoCard.attack1Damage;
            target.attack1Energy = evoCard.attack1Energy;
            target.attack1Code = evoCard.attack1Code;
            target.attack2Name = evoCard.attack2Name;
            target.attack2Damage = evoCard.attack2Damage;
            target.attack2Energy = evoCard.attack2Energy;
            target.attack2Code = evoCard.attack2Code;
            target.abilityName = evoCard.abilityName;
            target.abilityCode = evoCard.abilityCode;
          }
          this.log('🌟 相手の【' + (target ? target.name : 'ポケモン') + '】が進化した！');
          this.render();
          const targetSlotEl = (payload.targetSlotType === 'active' || payload.benchIdx === -1) ? document.getElementById('oppActiveSpot') : document.getElementById('oppBenchSpot' + payload.benchIdx);
          if (targetSlotEl) this.animateEvolveFlash(targetSlotEl);
          break;
        }
        case 'attach_energy': {
          let rawEnergy = payload.energyCard || { name: 'エネルギー', type: '無' };
          let energyCard = null;
          if (rawEnergy && rawEnergy.id && window.CardSystem && typeof window.CardSystem.findCardById === 'function') {
            const master = window.CardSystem.findCardById(rawEnergy.id);
            if (master) energyCard = this.createRuntimeCard(master);
          }
          if (!energyCard) energyCard = this.createRuntimeCard(rawEnergy);

          let target = null;
          if (payload.targetSlotType === 'active' || payload.benchIdx === -1) {
            target = opp.active;
          } else if (payload.benchIdx >= 0 && opp.bench[payload.benchIdx]) {
            target = opp.bench[payload.benchIdx];
          } else {
            target = opp.active;
          }
          if (!payload.boardState && target) {
            target.energy = (target.energy || 0) + 1;
            target.attachedEnergies = target.attachedEnergies || [];
            target.attachedEnergies.push(energyCard.type || '無');
            target.attachedCards = target.attachedCards || [];
            target.attachedCards.push(energyCard);
          }
          this.log('⚡ 相手が【' + (target ? target.name : 'ポケモン') + '】にエネルギーを付けました。');
          this.render();
          const targetSlotEl = (payload.targetSlotType === 'active' || payload.benchIdx === -1) ? document.getElementById('oppActiveSpot') : document.getElementById('oppBenchSpot' + payload.benchIdx);
          const oppHandEl = document.getElementById('oppHandArea') || document.getElementById('oppDeckSpot');
          if (oppHandEl && targetSlotEl) {
            this.animateEnergyFly(oppHandEl, targetSlotEl, energyCard.type);
          }
          break;
        }
        case 'play_trainer': {
          const card = payload.card || { name: 'トレーナーカード' };
          const kind = payload.kind || 'グッズ';
          this.log('📜 相手が【' + kind + '】「' + card.name + '」を使用しました！');
          this.animateTrainerCardPlay(card, kind);
          this.render();
          break;
        }
        case 'use_ability': {
          const card = payload.card || { name: '特性ポケモン' };
          this.log('✨ 相手が【' + card.name + '】の特性「' + (card.abilityName || '特性') + '」を発動しました！');
          this.render();
          break;
        }
        case 'cancel_trainer': {
          const card = payload.card || { name: 'トレーナーカード' };
          const kind = payload.kind || 'グッズ';
          this.log('↩️ 相手の【' + kind + '】「' + card.name + '」は発動条件を満たさなかったため手札に戻りました。');
          this.render();
          break;
        }
        case 'retreat': {
          if (!payload.boardState && opp.bench.length > 0) {
            const bIdx = Math.max(0, Math.min(opp.bench.length - 1, Number(payload.benchIdx) || 0));
            const cost = Number(payload.retreatCost) || 0;
            if (opp.active) {
              opp.active.energy = Math.max(0, (opp.active.energy || 0) - cost);
              const nextActive = opp.bench.splice(bIdx, 1)[0];
              opp.bench.push(opp.active);
              opp.active = nextActive;
            }
          }
          this.log('🏃 相手がにげるを選択！【' + (opp.active ? opp.active.name : 'ポケモン') + '】がバトル場に出ました。');
          this.render();
          break;
        }
        case 'attack': {
          const attacker = opp.active;
          const defender = p.active;
          const atkName = payload.atkName || (attacker ? attacker.attack1Name : 'ワザ');
          const numericDmg = payload.actualDamage != null ? Number(payload.actualDamage) : (parseInt(String(payload.damage || '').replace(/[^\d]/g, ''), 10) || 0);

          this.log('⚔️ 相手の【' + (attacker ? attacker.name : 'バトルポケモン') + '】の「' + atkName + '」！');

          const oppEl = document.getElementById('oppActiveSpot');
          const playerEl = document.getElementById('playerActiveSpot');
          this.animateAttack(oppEl, playerEl, false, numericDmg, false);

          if (defender) {
            if (payload.defenderHp != null) {
              defender.hp = payload.defenderHp;
            } else if (numericDmg > 0) {
              defender.hp = Math.max(0, (defender.hp || 0) - numericDmg);
            }
            if (payload.status != null) defender.status = payload.status;
          }
          if (attacker && payload.attackerHp != null) {
            attacker.hp = payload.attackerHp;
          }

          setTimeout(() => {
            if (defender && defender.hp <= 0) {
              this.handleKnockout(opp, p);
            } else {
              this.render();
            }
          }, 500);
          break;
        }
        case 'end_turn': {
          this.log('相手がターンを終了しました。あなたの番です！');
          const secondPlayer = this.state.firstPlayer === 'player' ? 'opponent' : 'player';
          if (this.state.turnPlayer === secondPlayer) {
            this.state.turnNumber++;
          }
          this.startTurn('player');
          break;
        }
        case 'surrender':
        case 'player_left': {
          this.finishBattle('player', '対戦相手が降伏または退出しました。あなたの勝利です！');
          break;
        }
      }
      } catch (e) {
        console.error('❌ [Online Incoming Packet Exception] Failed to apply action:', action, '| Error:', e);
      }
    },

    handleStartClick() {
      if (this.state.mode === 'online') {
        this.createRoom();
        return;
      }
      const playerDeckVal = document.getElementById('battle-player-deck-select')?.value || 'preset_starter';
      const aiDeckKey = document.getElementById('battle-ai-deck-select')?.value || 'electric';
      const prizeCount = Number(document.getElementById('battle-prize-count-select')?.value) || 6;

      this.startBattle(playerDeckVal, aiDeckKey, prizeCount);

    resolveDeckCards(deckVal) {
      if (deckVal === 'preset_starter') {
        return this.expandAiDeck(this.aiDecks.electric);
      }
      const decks = window.DeckSystem && DeckSystem.state && DeckSystem.state.decks || [];
      const deck = decks.find((d) => String(d.id) === String(deckVal));
      if (!deck || !deck.cards || !deck.cards.length) {
        return this.expandAiDeck(this.aiDecks.electric);
      }

      const allCards = [
        ...(window.App && App.state && App.state.cards || []),
        ...(window.CardSystem && CardSystem.state && CardSystem.state.cards || []),
        ...(window.DeckSystem && DeckSystem.state && DeckSystem.state.cardPool || [])
      ];
      const expanded = [];
      deck.cards.forEach((entry) => {
        if (!entry) return;
        const key = String(entry.id || entry.name || entry.cardId || '').toLowerCase();
        let c = allCards.find((card) => String(card.id).toLowerCase() === key || String(card.name).toLowerCase() === key) ||
                  (entry.name && entry.category ? entry : null);
        if (!c) {
          c = {
            id: entry.id || key,
            name: entry.name || entry.id || key,
            category: entry.category || 'たね',
            type: entry.type || '無',
            hp: Number(entry.hp) || 70,
            image: entry.image || '',
            attack1Name: entry.attack1Name || 'たいあたり',
            attack1Damage: entry.attack1Damage || '20',
            attack1Energy: entry.attack1Energy || '無'
          };
        }
        const count = Number(entry.count || entry.qty || entry.num || 1) || 1;
        for (let i = 0; i < count; i++) {
          expanded.push(JSON.parse(JSON.stringify(c)));
        }
      });

      return expanded.length > 0 ? expanded : this.expandAiDeck(this.aiDecks.electric);
    },

    expandAiDeck(preset) {
      const list = [];
      preset.cards.forEach((c) => {
        const count = c.count || 1;
        for (let i = 0; i < count; i++) {
          list.push(JSON.parse(JSON.stringify(c)));
        }
      });
      return list;
    },

      if (cat.includes('たね') || cat.toLowerCase().includes('basic')) return true;
      if (cat.includes('ポケモン') && !cat.includes('進化')) return true;
      return false;

    getPreEvolutionName(card) {
      if (!card) return 'たねポケモン';
      if (card.preEvolution) {
        const pVal = String(card.preEvolution).trim();
        const preCard = (window.App?.state?.cards || []).find((c) => String(c.id) === pVal || String(c.name) === pVal);
        return preCard ? preCard.name : pVal;
      }
      const textBlob = (card.description || '') + " " + (card.attack1Text || '') + " " + (card.attack2Text || '');
      const match = textBlob.match(/[「【](.*?)[」】]から進化/) || textBlob.match(/([^\s]+)から進化/);
      if (match && match[1]) return match[1].trim();

      const cleanName = String(card.name || '').replace(/ex|EX|\[EX\]|VMAX|VSTAR|V|\s+/g, '');
      const bases = this.POKEMON_EVO_MAP[cleanName] || this.POKEMON_EVO_MAP[card.name];
      if (bases && bases.length) return bases[0];
      return 'たねポケモン';
    },

    isFirstPlayerFirstTurn(playerWho) {
      const who = playerWho || this.state.turnPlayer;
      const p = who === 'player' ? this.state.player : this.state.opponent;
      if (p && p.turnCount != null) {
        return who === this.state.firstPlayer && p.turnCount === 1;
      }
      return this.state.turnNumber === 1 && who === this.state.firstPlayer;
    },

    isFirstTurn(playerWho) {
      const who = playerWho || this.state.turnPlayer;
      const p = who === 'player' ? this.state.player : this.state.opponent;
      if (p && p.turnCount != null) {
        return p.turnCount === 1;
      }
      return this.state.turnNumber === 1;
    },

    matchesEvolutionLine(evoCard, basePokemon) {
      if (!evoCard || !basePokemon) return false;
      const evoName = String(evoCard.name || '').trim();
      const baseName = String(basePokemon.name || '').trim();
      const baseId = String(basePokemon.id || '').trim();

      if (evoCard.preEvolution) {
        const pVal = String(evoCard.preEvolution).trim();
        const preCard = (window.App?.state?.cards || []).find((c) => String(c.id) === pVal || String(c.name) === pVal);
        const preName = preCard ? preCard.name : pVal;
        const bLower = baseName.toLowerCase();
        const pLower = preName.toLowerCase();
        if (baseId === pVal || bLower === pLower || bLower.includes(pLower) || pLower.includes(bLower)) {
          return true;
        }
        return false;
      }

      const textBlob = (evoCard.description || '') + " " + (evoCard.attack1Text || '') + " " + (evoCard.attack2Text || '');
      const match = textBlob.match(/[「【](.*?)[」】]から進化/) || textBlob.match(/([^\s]+)から進化/);
      if (match && match[1]) {
        const req = match[1].trim().toLowerCase();
        const b = baseName.toLowerCase();
        if (b === req || b.includes(req) || req.includes(b)) {
          return true;
        }
        return false;
      }

      const cleanEvo = evoName.replace(/ex|EX|\[EX\]|VMAX|VSTAR|V|\s+/g, '');
      const cleanBase = baseName.replace(/ex|EX|\[EX\]|VMAX|VSTAR|V|\s+/g, '');
      if (cleanEvo === cleanBase) {
        return true;
      }

      const validBases = this.POKEMON_EVO_MAP[cleanEvo] || this.POKEMON_EVO_MAP[evoName];
      if (validBases) {
        const matches = validBases.some((vb) => {
          const cleanVb = vb.replace(/ex|EX|\s+/g, '');
          return cleanBase === cleanVb || cleanBase.includes(cleanVb) || cleanVb.includes(cleanBase);
        });
        if (matches) {
          return true;
        }
        return false;
      }

      const evoCat = String(evoCard.category || '');
      const baseCat = String(basePokemon.category || '');
      const isEvo1 = evoCat.includes('1進化');
      const isEvo2 = evoCat.includes('2進化');
      const isBaseBasic = this.isBasic(basePokemon);
      const isBaseEvo1 = baseCat.includes('1進化');

      if (isEvo1 && !isBaseBasic) return false;
      if (isEvo2 && !(isBaseEvo1 || isBaseBasic)) return false;
      if (evoCard.type && basePokemon.type && evoCard.type !== '無' && basePokemon.type !== '無' && evoCard.type !== basePokemon.type) {
        return false;
      }

      return true;
    },

    canEvolveFrom(evoCard, basePokemon) {
      if (!evoCard || !basePokemon) return { can: false, reason: '対象ポケモンが存在しません。' };
      if (!this.isEvolution(evoCard)) return { can: false, reason: evoCard.name + " は進化ポケモンではありません。" };
      if (this.isBasic(evoCard)) return { can: false, reason: 'たねポケモンを別のポケモンに重ねることはできません。' };

      // 最初の番（先攻・後攻ともに自分の最初の番）は進化不可
      if (this.isFirstTurn('player')) {
        return { can: false, reason: '最初の番は進化できません。' };
      }

      // 場に出したターン（出したばかり）は進化できない（次の自分の番から進化可能）
      if (basePokemon._turnPlayed != null && basePokemon._turnPlayed === this.state.turnNumber) {
        return { can: false, reason: "【" + basePokemon.name + "】は今場に出たばかりなので進化できません。（次の自分の番から進化可能）" };
      }

      if (!this.matchesEvolutionLine(evoCard, basePokemon)) {
        const preEvoName = this.getPreEvolutionName(evoCard);
        return { can: false, reason: "【" + evoCard.name + "】は「" + preEvoName + "」からしか進化できません。（" + basePokemon.name + "には重ねられません）" };
      }

      return { can: true };
    },

    canRareCandyEvolve(stage2Card, basicPoke) {
      if (!stage2Card || !basicPoke) return false;
      if (!this.isBasic(basicPoke)) return false;
      if (basicPoke._turnPlayed != null && basicPoke._turnPlayed === this.state.turnNumber) {
        return false;
      }

      const cleanEvo = String(stage2Card.name || '').replace(/ex|EX|\[EX\]|VMAX|VSTAR|V|\s+/g, '');
      const cleanBase = String(basicPoke.name || '').replace(/ex|EX|\[EX\]|VMAX|VSTAR|V|\s+/g, '');

      // 1. POKEMON_EVO_MAP (例: リザードン -> ['リザード', 'ヒトカゲ'])
      const validBases = this.POKEMON_EVO_MAP[cleanEvo] || this.POKEMON_EVO_MAP[stage2Card.name];
      if (validBases && validBases.some(vb => {
        const cvb = vb.replace(/ex|EX|\s+/g, '');
        return cleanBase === cvb || cleanBase.includes(cvb) || cvb.includes(cleanBase);
      })) {
        return true;
      }

      // 2. preEvolution の連鎖検索
      if (stage2Card.preEvolution) {
        const pVal = String(stage2Card.preEvolution).trim();
        if (cleanBase === pVal || basicPoke.id === pVal) return true;
        const allCards = window.App?.state?.cards || [];
        const stage1 = allCards.find(c => String(c.id) === pVal || String(c.name) === pVal);
        if (stage1 && stage1.preEvolution) {
          const s1Pre = String(stage1.preEvolution).trim();
          if (cleanBase === s1Pre || basicPoke.id === s1Pre) return true;
        }
      }

      // 3. 説明文チェック
      const textBlob = (stage2Card.description || '') + " " + (stage2Card.attack1Text || '') + " " + (stage2Card.attack2Text || '');
      if (textBlob.includes(cleanBase)) return true;

      // 4. 同属性フォールバック（オリジナルカード）
      if (stage2Card.type && basicPoke.type && stage2Card.type === basicPoke.type && stage2Card.type !== '無') {
        return true;
      }
      return false;
    },

    isEnergy(c) {
      if (!c) return false;
      const cat = String(c.category || '');
      return cat.includes('エネルギー') || cat.toLowerCase().includes('energy');
    },

    isTrainer(c) {
      if (!c) return false;
      const cat = String(c.category || '');
      return cat.includes('グッズ') || cat.includes('サポート') || cat.includes('スタジアム') || cat.toLowerCase().includes('trainer');
    },

    isPokemon(c) {
      if (!c) return false;
      if (this.isEnergy(c) || this.isTrainer(c)) return false;
      return Number(c.hp) > 0 || this.isBasic(c) || this.isEvolution(c);
    },

    createRuntimeCard(card) {
      if (!card) card = {};
      const hp = Number(card.hp) || (this.isBasic(card) || this.isEvolution(card) ? 70 : 0);
      let img = card.image ? String(card.image).trim() : '';
      if (!img && window.CardSystem && typeof window.CardSystem.findCardImage === 'function') {
        img = window.CardSystem.findCardImage(card.name, card.id);
      }
      return {
        ...card,
        image: img || card.image || '',
        instanceId: 'inst_' + Math.random().toString(36).substring(2, 9),
        maxHp: hp,
        hp: hp,
        energy: Number(card.energy) || 0,
        attachedEnergies: Array.isArray(card.attachedEnergies) ? [...card.attachedEnergies] : [],
        attachedCards: Array.isArray(card.attachedCards) ? [...card.attachedCards] : [],
        getCards(filter) {
          const cards = this.attachedCards || [];
          if (!filter) return [...cards];
          if (typeof window.matchesCardFilter === 'function') {
            return cards.filter((c) => window.matchesCardFilter(c, filter));
          }
          return [...cards];
        },
        status: card.status || null,
        damageReduction: Number(card.damageReduction) || 0
      };
    },

    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    },

    expandAiDeck(deckObj) {
      if (!deckObj || !Array.isArray(deckObj.cards)) return [];
      const result = [];
      deckObj.cards.forEach((c) => {
        const cnt = Number(c.count) || 1;
        for (let i = 0; i < cnt; i++) {
          result.push({ ...c });
        }
      });
      return result;
    },

    resolveDeckCards(deckVal) {
      if (!deckVal || deckVal === 'preset_starter' || deckVal === 'electric') {
        return this.expandAiDeck(this.aiDecks.electric);
      }
      if (this.aiDecks && this.aiDecks[deckVal]) {
        return this.expandAiDeck(this.aiDecks[deckVal]);
      }

      const decks = (window.DeckSystem && DeckSystem.state && DeckSystem.state.decks) || [];
      const deck = decks.find((d) => String(d.id) === String(deckVal));

      if (deck && Array.isArray(deck.cards) && deck.cards.length > 0) {
        const cardPool = (window.DeckSystem && DeckSystem.state && DeckSystem.state.cardPool) ||
                         (window.App && App.state && App.state.cards) || [];
        const flat = [];
        deck.cards.forEach((item) => {
          const cardId = typeof item === 'object' ? item.id : item;
          const count = typeof item === 'object' ? (Number(item.count) || 1) : 1;
          const def = cardPool.find((c) => String(c.id) === String(cardId));
          if (def) {
            for (let i = 0; i < count; i++) {
              flat.push({ ...def });
            }
          }
        });
        if (flat.length > 0) return flat;
      }

      return this.expandAiDeck(this.aiDecks.electric);
    },

    playMatchIntro(myName, oppName) {
      const overlay = document.getElementById('battleMatchIntroOverlay');
      if (!overlay) return;

      const myNameEl = document.getElementById('introMyName');
      const oppNameEl = document.getElementById('introOppName');
      const myRoleBadge = document.getElementById('introMyRoleBadge');
      const oppRoleBadge = document.getElementById('introOppRoleBadge');
      const coinTossText = document.getElementById('introCoinTossText');
      const myAvatar = document.getElementById('introMyAvatarImg');
      const oppAvatar = document.getElementById('introOppAvatarImg');

      if (myNameEl) myNameEl.textContent = myName || 'プレイヤー';
      if (oppNameEl) oppNameEl.textContent = oppName || 'ライバル';

      const isFirst = (this.state.firstPlayer === 'player');
      if (myRoleBadge) {
        myRoleBadge.textContent = isFirst ? '⚔️ 先攻 (1st)' : '🛡️ 後攻 (2nd)';
        myRoleBadge.className = isFirst ? 'intro-role-badge first-role' : 'intro-role-badge second-role';
      }
      if (oppRoleBadge) {
        oppRoleBadge.textContent = isFirst ? '🛡️ 後攻 (2nd)' : '⚔️ 先攻 (1st)';
        oppRoleBadge.className = isFirst ? 'intro-role-badge second-role' : 'intro-role-badge first-role';
      }

      if (coinTossText) {
        coinTossText.textContent = `COIN TOSS: ${isFirst ? 'あなたが先攻！' : '相手が先攻！'}`;
      }

      // アバター画像設定
      const playerProfile = window.UserSystem ? window.UserSystem.getProfile() : null;
      if (myAvatar) {
        myAvatar.src = playerProfile?.avatarUrl || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + encodeURIComponent(myName || 'player');
      }
      if (oppAvatar) {
        oppAvatar.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=' + encodeURIComponent(oppName || 'rival');
      }

      // Overlay アニメーション開始
      overlay.style.display = 'flex';
      overlay.classList.remove('introOverlayOut');
      overlay.classList.add('introOverlayIn');

      setTimeout(() => {
        overlay.classList.remove('introOverlayIn');
        overlay.classList.add('introOverlayOut');
        setTimeout(() => {
          overlay.style.display = 'none';
          overlay.classList.remove('introOverlayOut');
        }, 500);
      }, 1800);
    },

    startBattle(playerDeckVal, aiDeckKey, prizeCount) {
      const rawPlayerDeck = this.resolveDeckCards(playerDeckVal);
      const rawAiDeck = this.expandAiDeck(this.aiDecks[aiDeckKey] || this.aiDecks.electric);

      const playerDeck = this.shuffle(rawPlayerDeck.map((c) => this.createRuntimeCard(c)));
      const oppDeck = this.shuffle(rawAiDeck.map((c) => this.createRuntimeCard(c)));

      this.state.mode = 'ai';
      this.state.phase = 'battle';
      this.state.turnNumber = 1;
      this.state.prizeCountRule = prizeCount;
      this.state.logs = [];

      // コインフリップで先攻決定
      const coin = Math.random() >= 0.5 ? 1 : 0;
      this.state.firstPlayer = coin === 1 ? 'player' : 'opponent';
      this.state.turnPlayer = this.state.firstPlayer;

      this.state.player = {
        id: 'player',
        name: 'プレイヤー',
        deck: playerDeck,
        hand: [],
        active: null,
        bench: [],
        prizes: [],
        discard: [],
        energyAttached: false,
        supporterUsed: false,
        retreated: false,
        turnCount: 0
      };

      this.state.opponent = {
        id: 'opponent',
        name: this.aiDecks[aiDeckKey]?.name || 'AIライバル',
        deck: oppDeck,
        hand: [],
        active: null,
        bench: [],
        prizes: [],
        discard: [],
        energyAttached: false,
        supporterUsed: false,
        retreated: false,
        turnCount: 0
      };

      // 手札7枚ドロー (たねポケモンを確実に引くまで)
      this.drawInitialHand(this.state.player);
      this.drawInitialHand(this.state.opponent);

      // バトル場とベンチの初期配置
      this.setupInitialBoard(this.state.player);
      this.setupInitialBoard(this.state.opponent);

      // サイドカード配置
      for (let i = 0; i < prizeCount; i++) {
        if (this.state.player.deck.length) this.state.player.prizes.push(this.state.player.deck.shift());
        if (this.state.opponent.deck.length) this.state.opponent.prizes.push(this.state.opponent.deck.shift());
      }

      // UI切り替え
      document.getElementById('battle-select-view').style.display = 'none';
      document.getElementById('battle-arena-view').style.display = 'block';

      this.closeResultModal();
      this.log('⚔ バトル開始！ 先攻は【' + (this.state.firstPlayer === 'player' ? 'プレイヤー' : 'AIライバル') + '】です。');

      this.render();
      this.playMatchIntro(this.state.player.name, this.state.opponent.name);

      // 先攻のターン開始
      this.startTurn(this.state.turnPlayer);
    },

    drawInitialHand(p) {
      let attempts = 0;
      while (attempts < 10) {
        attempts++;
        p.hand = [];
        for (let i = 0; i < 7; i++) {
          if (p.deck.length) p.hand.push(p.deck.shift());
        }
        const hasBasic = p.hand.some((c) => this.isBasic(c));
        if (hasBasic) break;
        // マリガン: 山札に戻してシャッフル
        p.deck.push(...p.hand);
        p.hand = [];
        this.shuffle(p.deck);
      }
      // もし10回の引き直しでもたねが見つからなかった場合の安全フォールバック
      if (!p.hand.some((c) => this.isBasic(c)) && p.deck.length > 0) {
        const basicInDeckIdx = p.deck.findIndex((c) => this.isBasic(c));
        if (basicInDeckIdx >= 0) {
          p.hand.push(p.deck.splice(basicInDeckIdx, 1)[0]);
        }
      }
    },

    setupInitialBoard(p) {
      // 最初のたねポケモンをバトル場へ
      let basicIdx = p.hand.findIndex((c) => this.isBasic(c));
      if (basicIdx < 0) {
        // ポケモンらしきカードをフォールバックとして使用
        basicIdx = p.hand.findIndex((c) => this.isPokemon(c));
      }
      if (basicIdx >= 0) {
        p.active = p.hand.splice(basicIdx, 1)[0];
      } else if (p.hand.length > 0) {
        p.active = p.hand.shift();
      }
      if (p.active) {
        if (!p.active.hp) p.active.hp = 70;
        if (!p.active.maxHp) p.active.maxHp = Number(p.active.hp) || 70;
        p.active._turnPlayed = 0;
      }

      // 残りのたねポケモンを最大2匹までベンチへ
      for (let i = p.hand.length - 1; i >= 0; i--) {
        if (this.isBasic(p.hand[i]) && p.bench.length < 2) {
          const card = p.hand.splice(i, 1)[0];
          card._turnPlayed = 0;
          if (!card.maxHp) card.maxHp = Number(card.hp) || 70;
          p.bench.push(card);
        }
      }
    },

    isBlocked(actionType, target = null, player = null) {
      if (window.ORBITAL_EFFECT_API && window.ORBITAL_EFFECT_API.isBlocked) {
        return window.ORBITAL_EFFECT_API.isBlocked({ game: this.state, self: player || (this.state.turnPlayer === 'player' ? this.state.player : this.state.opponent), opponent: player === this.state.opponent ? this.state.player : this.state.opponent }, actionType, target, player);
      }
      return false;
    },

    updateLocksOnTurnChange(curTurnWho) {
      if (!Array.isArray(this.state.activeLocks) || this.state.activeLocks.length === 0) return;

      const actLabels = {
        ability: '特性',
        attack: 'ワザ',
        effect: 'ワザの効果',
        retreat: 'にげる(交代)',
        item: 'グッズ',
        supporter: 'サポート',
        trainer: 'トレーナーズ',
        energy: 'エネルギー手貼り',
        evolution: '進化',
        all: 'すべてのアクション'
      };

      const remainingLocks = [];
      for (let lock of this.state.activeLocks) {
        if (lock.always) {
          if (lock.sourceCard) {
            const players = [this.state.player, this.state.opponent].filter(Boolean);
            let alive = false;
            for (let p of players) {
              if (p.active === lock.sourceCard || (Array.isArray(p.bench) && p.bench.includes(lock.sourceCard))) {
                if (lock.sourceCard.hp === undefined || lock.sourceCard.hp > 0) {
                  alive = true;
                  break;
                }
              }
            }
            if (!alive) {
              this.log('✦ 【' + (lock.sourceCard.name || 'カード') + '】が場を離れたため、' + (actLabels[lock.actionType] || lock.actionType) + 'の常時ロック効果が解除されました。');
              continue;
            }
          }
          remainingLocks.push(lock);
          continue;
        }

        let shouldDecrement = false;
        const prevTurnWho = curTurnWho === 'player' ? 'opponent' : 'player';
        const isCreatedTurn = (lock.createdTurn != null && lock.createdTurn === this.state.turnNumber);

        if (!isCreatedTurn) {
          if (lock.countBy === 'opponent' || !lock.countBy) {
            const isOpponentFinished = (lock.sourcePlayer === 'player' && prevTurnWho === 'opponent') ||
                                       (lock.sourcePlayer === 'opponent' && prevTurnWho === 'player');
            if (isOpponentFinished) shouldDecrement = true;
          } else if (lock.countBy === 'self') {
            const isSelfFinished = (lock.sourcePlayer === 'player' && prevTurnWho === 'player') ||
                                   (lock.sourcePlayer === 'opponent' && prevTurnWho === 'opponent');
            if (isSelfFinished) shouldDecrement = true;
          } else if (lock.countBy === 'both' || lock.countBy === 'turn') {
            shouldDecrement = true;
          }
        }

        if (shouldDecrement) {
          lock.turnsRemaining--;
        }

        if (lock.turnsRemaining > 0) {
          remainingLocks.push(lock);
        } else {
          this.log('🔓 【' + (actLabels[lock.actionType] || lock.actionType) + '】の禁止効果が終了しました。');
        }
      }
      this.state.activeLocks = remainingLocks;
    },

    startTurn(turnWho) {
      this.state.turnPlayer = turnWho;
      const cur = turnWho === 'player' ? this.state.player : this.state.opponent;

      cur.turnCount = (cur.turnCount || 0) + 1;
      cur.energyAttached = false;
      cur.supporterUsed = false;
      cur.retreated = false;
      [cur.active, ...(cur.bench || [])].filter(Boolean).forEach((c) => {
        c._abilityUsedThisTurn = false;
        c._abilityUseCount = 0;
      });

      this.updateLocksOnTurnChange(turnWho);

      // ターン開始時 (turnStart / start) の自動・強制発動
      // ※ event.on('turnStart', ...) または event.on('start', ...) を明示的に宣言しているコードのみ実行する
      // ※ useLimit() 等の起動型特性（上位コードがイベント登録なし）は絶対に自動実行しない
      const activePokemons = [cur.active, ...(cur.bench || [])].filter(Boolean);
      const TURN_START_EVENT_REGEX = /event\s*\.\s*on\s*\(\s*['"`](?:turnStart|start)['"`]/;
      activePokemons.forEach((pk) => {
        const code = String(pk.abilityCode || '');
        if (code && window.executeCardEffectCode && TURN_START_EVENT_REGEX.test(code)) {
          try {
            window.executeCardEffectCode(
              pk.abilityCode,
              { players: [this.state.player, this.state.opponent], logs: this.state.logs },
              cur,
              'turnStart',
              { card: pk, pokemon: pk, turnNumber: this.state.turnNumber }
            );
          } catch (e) {
            console.error('turnStart ability error:', e);
          }
        }
      });

      // ドロー（先攻の最初のターンはドローなし）
      const isVeryFirstTurn = (this.state.turnNumber === 1 && turnWho === this.state.firstPlayer);
      if (isVeryFirstTurn) {
        // 先攻1ターン目はドローなし（ポケモンカードのルール）
        this.log("【" + cur.name + "】の番（TURN " + this.state.turnNumber + "）: 先攻1ターン目のためドローなし。");
      } else {
        if (cur.deck.length === 0) {
          this.finishBattle(turnWho === 'player' ? 'opponent' : 'player', '山札がなくなりました (ライブラリアウト)');
          return;
        }
        const drawn = cur.deck.shift();
        if (drawn != null) {
          cur.hand.push(drawn);
          this.log("【" + cur.name + "】の番（TURN " + this.state.turnNumber + "）: カードを1枚引きました。");
          this.animateDrawCard(turnWho === 'player');
          if (turnWho === 'player' && this.state.mode === 'online') {
            this.broadcastOnlineAction('draw_card', { count: 1 });
          }
        } else {
          this.log("【" + cur.name + "】の番（TURN " + this.state.turnNumber + "）: ドロー失敗（山札が空）。");
        }
      }

      // 特殊状態処理（どく: 10ダメージ）
      if (cur.active && cur.active.status === 'どく') {
        cur.active.hp -= 10;
        this.log("☠ どくのダメージ！ " + cur.active.name + " は10ダメージを受けた。(残りHP: " + cur.active.hp + ")");
        if (cur.active.hp <= 0) {
          this.handleKnockout(cur === this.state.player ? this.state.opponent : this.state.player, cur);
        }
      }

      this.render();

      if (turnWho === 'opponent') {
        if (this.state.mode === 'ai') {
          setTimeout(() => this.runAiTurn(), 800);
        }
      }
    },

    endTurn() {
      if (this.state.phase === 'ended') return;
      const turnWhoName = this.state.turnPlayer === 'player' ? (this.state.player.name || 'プレイヤー') : (this.state.opponent.name || '対戦相手');
      this.log("【" + turnWhoName + "】がターンを終了しました。");

      if (this.state.turnPlayer === 'player' && this.state.mode === 'online') {
        this.broadcastOnlineAction('end_turn', {});
      }

      const secondPlayer = this.state.firstPlayer === 'player' ? 'opponent' : 'player';
      if (this.state.turnPlayer === secondPlayer) {
        this.state.turnNumber++;
      }
      const nextPlayer = this.state.turnPlayer === 'player' ? 'opponent' : 'player';
      this.startTurn(nextPlayer);
    },

    surrender() {
      if (!confirm('本当に降参しますか？')) return;
      if (this.state.mode === 'online') {
        this.broadcastOnlineAction('surrender', {});
      }
      this.finishBattle('opponent', 'プレイヤーが降参しました。');
    },

    exitToSelectView() {
      this.stopPolling();
      if (this.state.mode === 'online' && this.state.online.roomId) {
        if (window.google && google.script && google.script.run) {
          google.script.run.leaveOnlineRoom(this.state.online.roomId, this.state.online.role);
        }
      }
      this.closeResultModal();
      this.state.phase = 'select';
      document.getElementById('battle-arena-view').style.display = 'none';
      document.getElementById('battle-select-view').style.display = 'block';
      if (this.state.mode === 'online') {
        this.populateOnlineDeckSelect();
        this.refreshRoomList();
      } else {
        this.populateDeckSelect();
      }
    },

    // プレイヤーが手札のカードをクリックした時のアクション
    handleHandCardClick(index) {
      if (this.state.turnPlayer !== 'player' || this.state.phase !== 'battle') return;
      const card = this.state.player.hand[index];
      if (!card) return;

      const p = this.state.player;

      // 1. たねポケモン
      if (this.isBasic(card)) {
        if (this.isBlocked('playBasic', card, p)) {
          App.toast('効果によりたねポケモンの場出しは禁止されています。', true);
          return;
        }
        if (!p.active) {
          const placed = p.hand.splice(index, 1)[0];
          placed._turnPlayed = this.state.turnNumber;
          if (!placed.maxHp) placed.maxHp = Number(placed.hp) || 70;
          p.active = placed;
          this.log("✦ " + card.name + " をバトル場に出しました。");
          this.broadcastOnlineAction('play_basic', { card: placed, slotType: 'active' });
          this.render();
          return;
        }
        if (p.bench.length < 5) {
          const placed = p.hand.splice(index, 1)[0];
          placed._turnPlayed = this.state.turnNumber;
          if (!placed.maxHp) placed.maxHp = Number(placed.hp) || 70;
          p.bench.push(placed);
          this.log("✦ " + card.name + " をベンチに出しました。");
          this.broadcastOnlineAction('play_basic', { card: placed, slotType: 'bench' });
          this.render();
          return;
        }
        App.toast('ベンチがいっぱいです（最大5匹）。', true);
        return;
      }

      // 2. 進化ポケモン
      if (this.isEvolution(card)) {
        if (this.isBlocked('evolution', card, p)) {
          App.toast('効果によりポケモンの進化は禁止されています。', true);
          return;
        }
        this.promptEvolution(index, card);
        return;
      }

      // 3. エネルギーカード
      if (this.isEnergy(card)) {
        if (this.isBlocked('energy', card, p)) {
          App.toast('効果によりエネルギーの手札付けは禁止されています。', true);
          return;
        }
        if (p.energyAttached) {
          App.toast('エネルギーの手札付けは1ターンに1回までです。', true);
          return;
        }
        this.promptEnergyAttachment(index, card);
        return;
      }

      // 4. グッズ
      const cat = String(card.category || '');
      if (cat.includes('グッズ') || cat.toLowerCase().includes('item')) {
        if (this.isBlocked('item', card, p) || this.isBlocked('trainer', card, p)) {
          App.toast('効果によりグッズの使用は禁止されています。', true);
          return;
        }
        this.playTrainerCard(index, card, 'グッズ');
        return;
      }

      // 5. サポート
      if (cat.includes('サポート') || cat.includes('トレーナー') || cat.toLowerCase().includes('supporter')) {
        if (this.isBlocked('supporter', card, p) || this.isBlocked('trainer', card, p)) {
          App.toast('効果によりサポートの使用は禁止されています。', true);
          return;
        }
        if (this.isFirstPlayerFirstTurn('player')) {
          App.toast('先攻の最初の番はサポートカードを使用できません。', true);
          return;
        }
        if (p.supporterUsed) {
          App.toast('サポートカードは1ターンに1枚までしか使えません。', true);
          return;
        }
        this.playTrainerCard(index, card, 'サポート');
        return;
      }

      App.toast("「" + card.name + "」を選択しました。");
    },

    promptEnergyAttachment(handIndex, energyCard) {
      const p = this.state.player;
      const targets = [];
      if (p.active) targets.push({ label: "バトル場: " + p.active.name + " (エネ: " + (p.active.energy || 0) + ")", target: p.active, isBench: false });
