      p.bench.forEach((b, i) => {
        targets.push({ label: "ベンチ" + (i + 1) + ": " + b.name + " (エネ: " + (b.energy || 0) + ")", target: b, isBench: true, benchIdx: i });
      });

      if (!targets.length) {
        App.toast('エネルギーを付けるポケモンがいません。', true);
        return;
      }

      // 対象が1匹のみなら即座に直接付加！
      if (targets.length === 1) {
        const chosen = targets[0].target;
        const targetSlotEl = targets[0].isBench ?
        document.querySelectorAll('#playerBenchRow .bench-slot-occupied')[targets[0].benchIdx] :
        document.getElementById('playerActiveSpot');
        this.applyEnergyAttachment(handIndex, chosen, targetSlotEl);
        return;
      }

      this.showChoiceModal(targets.map((t) => ({ name: t.label, category: '対象ポケモン', type: t.target.type, hp: t.target.hp })), {
        title: 'エネルギーを付けるポケモンを選択',
        desc: energyCard.name + " を誰に付けますか？（手札からドラッグ＆ドロップでも直接付けられます）"
      }, (selectedIndex) => {
        const chosenItem = targets[selectedIndex];
        if (chosenItem) {
          const targetSlotEl = chosenItem.isBench ?
          document.querySelectorAll('#playerBenchRow .bench-slot-occupied')[chosenItem.benchIdx] :
          document.getElementById('playerActiveSpot');
          this.applyEnergyAttachment(handIndex, chosenItem.target, targetSlotEl);
        }
      });
    },

    applyEnergyAttachment(handIndex, targetPokemon, targetSlotEl) {
      const p = this.state.player;
      if (this.state.turnPlayer !== 'player' || this.state.phase !== 'battle') return;
      if (p.energyAttached) {
        App.toast('エネルギーの手札付けは1ターンに1回までです。', true);
        return;
      }
      const energyCard = p.hand[handIndex];
      if (!energyCard || !this.isEnergy(energyCard)) return;

      const sourceHandEl = document.querySelector("[data-hand-idx=\"" + handIndex + "\"]");

      p.hand.splice(handIndex, 1);
      targetPokemon.energy = (targetPokemon.energy || 0) + 1;
      targetPokemon.attachedEnergies = targetPokemon.attachedEnergies || [];
      targetPokemon.attachedEnergies.push(energyCard.type || '無');
      targetPokemon.attachedCards = targetPokemon.attachedCards || [];
      targetPokemon.attachedCards.push(energyCard);
      p.energyAttached = true;

      this.log("⚡ " + targetPokemon.name + " に " + energyCard.name + " を付けました。(合計エネルギー: " + targetPokemon.energy + ")");
      App.toast(targetPokemon.name + " にエネルギーを付けました！");

      this.broadcastOnlineAction('attach_energy', {
        energyCard: energyCard,
        targetSlotType: targetPokemon === p.active ? 'active' : 'bench',
        benchIdx: targetPokemon === p.active ? -1 : p.bench.indexOf(targetPokemon)
      });

      const stadiumTicker = document.getElementById('stadiumTicker');
      if (stadiumTicker) stadiumTicker.textContent = "あなた: " + targetPokemon.name + " にエネルギーをチャージ！";

      // エネルギー飛来アニメーション
      if (sourceHandEl && targetSlotEl) {
        this.animateEnergyFly(sourceHandEl, targetSlotEl, energyCard.type);
      }

      setTimeout(() => {
        this.render();
      }, 500);
    },

    animateEnergyFly(sourceEl, targetEl, energyType) {
      if (!sourceEl || !targetEl) return;
      try {
        const sRect = sourceEl.getBoundingClientRect();
        const tRect = targetEl.getBoundingClientRect();

        const orb = document.createElement('div');
        orb.className = 'flying-energy-orb type-' + (energyType || '無');
        orb.textContent = energyType || '✦';
        orb.style.left = sRect.left + sRect.width / 2 - 16 + 'px';
        orb.style.top = sRect.top + sRect.height / 2 - 16 + 'px';
        document.body.appendChild(orb);

        void orb.offsetHeight; // force layout

        const dx = tRect.left + tRect.width / 2 - (sRect.left + sRect.width / 2);
        const dy = tRect.top + tRect.height / 2 - (sRect.top + sRect.height / 2);
        orb.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(1.15)';

        setTimeout(() => {
          orb.remove();
          targetEl.classList.add('energy-absorb-pulse');
          setTimeout(() => {
            targetEl.classList.remove('energy-absorb-pulse');
          }, 500);
        }, 650);
      } catch (err) {
        console.error('animateEnergyFly error:', err);
      }
    },

    animateAttack(attackerSlotEl, defenderSlotEl, isPlayer, damage, isWeakness) {
      try {
        if (attackerSlotEl) {
          attackerSlotEl.classList.add(isPlayer ? 'lunge-player' : 'lunge-opp');
          setTimeout(() => {
            attackerSlotEl.classList.remove(isPlayer ? 'lunge-player' : 'lunge-opp');
          }, 650);
        }

        setTimeout(() => {
          const stadium = document.querySelector('.battle-stadium');
          if (stadium) {
            stadium.classList.add('stadium-screen-shake');
            setTimeout(() => stadium.classList.remove('stadium-screen-shake'), 450);
          }

          if (defenderSlotEl) {
            defenderSlotEl.classList.add('defender-hit-flash');
            setTimeout(() => defenderSlotEl.classList.remove('defender-hit-flash'), 400);

            const slash = document.createElement('div');
            slash.className = 'attack-slash-overlay';
            defenderSlotEl.appendChild(slash);
            setTimeout(() => slash.remove(), 400);

            if (damage > 0) {
              const dmgEl = document.createElement('div');
              dmgEl.className = 'floating-damage-number' + (isWeakness ? ' weakness-damage' : '');
              dmgEl.textContent = (isWeakness ? '弱点！ -' : '-') + damage;
              defenderSlotEl.appendChild(dmgEl);
              setTimeout(() => dmgEl.remove(), 1050);
            }
          }
        }, 240);
      } catch (err) {
        console.error('animateAttack error:', err);
      }
    },

    animateDrawCard(isPlayer) {
      try {
        const deckSpot = document.getElementById(isPlayer ? 'playerActiveSpot' : 'oppActiveSpot') || document.querySelector(isPlayer ? '.player-arena' : '.opp-arena');
        const deckEl = document.getElementById(isPlayer ? 'playerDeckSpot' : 'oppDeckSpot') || deckSpot;
        const handEl = document.getElementById(isPlayer ? 'playerHandArea' : 'oppHandArea') || document.body;
        if (!deckEl || !handEl) return;

        const sRect = deckEl.getBoundingClientRect();
        const tRect = handEl.getBoundingClientRect();

        const flying = document.createElement('div');
        flying.className = 'flying-draw-card';
        flying.style.position = 'fixed';
        flying.style.left = (sRect.left + sRect.width / 2 - 24) + 'px';
        flying.style.top = (sRect.top + sRect.height / 2 - 32) + 'px';
        flying.style.width = '48px';
        flying.style.height = '64px';
        flying.style.background = 'linear-gradient(135deg, #1e293b, #0f172a)';
        flying.style.border = '2px solid #38bdf8';
        flying.style.borderRadius = '6px';
        flying.style.boxShadow = '0 4px 15px rgba(56, 189, 248, 0.5)';
        flying.style.zIndex = '99999';
        flying.style.transition = 'transform 0.48s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.48s ease';
        flying.style.pointerEvents = 'none';

        const inner = document.createElement('div');
        inner.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:18px;font-weight:bold;';
        inner.textContent = '✦';
        flying.appendChild(inner);

        document.body.appendChild(flying);

        void flying.offsetHeight; // layout trigger

        const dx = (tRect.left + tRect.width / 2) - (sRect.left + sRect.width / 2);
        const dy = (tRect.top + tRect.height / 2) - (sRect.top + sRect.height / 2);
        flying.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(0.65) rotate(180deg)';
        flying.style.opacity = '0.2';

        setTimeout(() => {
          flying.remove();
        }, 500);
      } catch (err) {
        console.error('animateDrawCard error:', err);
      }
    },

    animateEvolveFlash(targetEl) {
      if (!targetEl) return;
      try {
        targetEl.classList.add('evolve-flash-effect');
        const burst = document.createElement('div');
        burst.style.cssText = 'position:absolute;inset:-10px;border-radius:12px;background:radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(56,189,248,0.6) 50%, transparent 80%);z-index:10;pointer-events:none;animation:evolveBurst 0.6s ease-out forwards;';
        targetEl.style.position = 'relative';
        targetEl.appendChild(burst);
        setTimeout(() => {
          targetEl.classList.remove('evolve-flash-effect');
          burst.remove();
        }, 650);
      } catch (e) {}
    },

    animateCardPlacement(targetEl) {
      if (!targetEl) return;
      targetEl.classList.add('card-placement-slam');
      setTimeout(() => targetEl.classList.remove('card-placement-slam'), 450);
    },

    wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    },

    placeBasicPokemon(handIndex, targetSlotType, targetEl) {
      const p = this.state.player;
      if (this.state.turnPlayer !== 'player' || this.state.phase !== 'battle') return;
      const card = p.hand[handIndex];
      if (!card || !this.isBasic(card)) return;

      if (targetSlotType === 'active') {
        if (p.active) {
          App.toast('バトル場には既にポケモンがいます。', true);
          return;
        }
        const placed = p.hand.splice(handIndex, 1)[0];
        placed._turnPlayed = this.state.turnNumber;
        if (!placed.maxHp) placed.maxHp = Number(placed.hp) || 70;
        p.active = placed;
        this.log('✦ ' + card.name + ' をバトル場に出しました。');
        App.toast(card.name + ' をバトル場に出しました！');
        this.animateCardPlacement(targetEl || document.getElementById('playerActiveSpot'));
        this.broadcastOnlineAction('play_basic', { card: placed, slotType: 'active' });
        this.render();
        return;
      }

      if (targetSlotType === 'bench') {
        if (p.bench.length >= 5) {
          App.toast('ベンチがいっぱいです（最大5匹）。', true);
          return;
        }
        const placed = p.hand.splice(handIndex, 1)[0];
        placed._turnPlayed = this.state.turnNumber;
        if (!placed.maxHp) placed.maxHp = Number(placed.hp) || 70;
        p.bench.push(placed);
        this.log('✦ ' + card.name + ' をベンチに出しました。');
        App.toast(card.name + ' をベンチに出しました！');
        this.animateCardPlacement(targetEl);
        this.broadcastOnlineAction('play_basic', { card: placed, slotType: 'bench' });
        this.render();
        return;
      }
    },

    executeEvolution(handIndex, targetPokemon, targetSlotEl, player) {
      const p = player || this.state.player;
      if (this.state.phase && this.state.phase !== 'battle') return;
      const evo = p.hand.splice(handIndex, 1)[0];
      if (!evo || !targetPokemon) return;

      targetPokemon.attachedCards = targetPokemon.attachedCards || [];
      targetPokemon.attachedCards.unshift({
        name: targetPokemon.name,
        category: targetPokemon.category,
        type: targetPokemon.type,
        hp: targetPokemon.maxHp || targetPokemon.hp,
        maxHp: targetPokemon.maxHp || targetPokemon.hp,
        preEvolution: targetPokemon.preEvolution,
        image: targetPokemon.image,
        isEx: targetPokemon.isEx
      });

      const damageTaken = (targetPokemon.maxHp || 70) - (targetPokemon.hp || 70);
      targetPokemon.name = evo.name;
      targetPokemon.category = evo.category;
      targetPokemon.type = evo.type || targetPokemon.type;
      targetPokemon.maxHp = Number(evo.hp) || targetPokemon.maxHp + 50;
      targetPokemon.hp = Math.max(10, targetPokemon.maxHp - damageTaken);
      targetPokemon.attack1Name = evo.attack1Name;
      targetPokemon.attack1Damage = evo.attack1Damage;
      targetPokemon.attack1Energy = evo.attack1Energy;
      targetPokemon.attack1Text = evo.attack1Text;
      targetPokemon.attack1Code = evo.attack1Code;
      targetPokemon.attack2Name = evo.attack2Name;
      targetPokemon.attack2Damage = evo.attack2Damage;
      targetPokemon.attack2Energy = evo.attack2Energy;
      targetPokemon.attack2Text = evo.attack2Text;
      targetPokemon.attack2Code = evo.attack2Code;
      targetPokemon.abilityName = evo.abilityName || targetPokemon.abilityName;
      targetPokemon.abilityText = evo.abilityText || targetPokemon.abilityText;
      targetPokemon.abilityCode = evo.abilityCode || targetPokemon.abilityCode;
      targetPokemon.image = evo.image || targetPokemon.image;
      targetPokemon.isEx = evo.isEx || targetPokemon.isEx;
      targetPokemon.preEvolution = evo.preEvolution;
      targetPokemon.weakness = evo.weakness || targetPokemon.weakness;
      targetPokemon.resistance = evo.resistance || targetPokemon.resistance;
      targetPokemon.retreat = evo.retreat != null ? evo.retreat : targetPokemon.retreat;
      targetPokemon.status = null;
      targetPokemon._turnPlayed = this.state.turnNumber;

      this.log('✨ 進化！ ' + targetPokemon.name + ' に進化しました！(HP: ' + targetPokemon.hp + '/' + targetPokemon.maxHp + ')');
      if (window.App && typeof window.App.toast === 'function') App.toast(targetPokemon.name + ' に進化しました！');

      const isTargetActive = targetPokemon === p.active;
      const targetBenchIdx = isTargetActive ? -1 : (p.bench ? p.bench.indexOf(targetPokemon) : -1);
      if (typeof this.broadcastOnlineAction === 'function') {
        this.broadcastOnlineAction('evolve', {
          evoCard: evo,
          targetSlotType: isTargetActive ? 'active' : 'bench',
          benchIdx: targetBenchIdx
        });
      }

      if (targetSlotEl) {
        targetSlotEl.classList.add('evolution-flash');
        setTimeout(() => targetSlotEl.classList.remove('evolution-flash'), 750);
      }

      if (typeof this.render === 'function') this.render();
    },

    handleDropOnPokemon(handIndex, targetPokemon, targetSlotEl, isBench, benchIdx) {
      if (handIndex == null) return;
      const p = this.state.player;
      const card = p.hand[handIndex];
      if (!card) return;

      if (this.isEnergy(card)) {
        if (!targetPokemon) {
          App.toast('エネルギーを付けるポケモンがいません。', true);
          return;
        }
        this.applyEnergyAttachment(handIndex, targetPokemon, targetSlotEl);
        return;
      }

      if (this.isEvolution(card)) {
        if (!targetPokemon) {
          App.toast('進化させる対象ポケモンがいません。', true);
          return;
        }
        const check = this.canEvolveFrom(card, targetPokemon);
        if (!check.can) {
          App.toast(check.reason || "【" + card.name + "】は " + targetPokemon.name + " には進化できません。", true);
          return;
        }
        this.executeEvolution(handIndex, targetPokemon, targetSlotEl);
        return;
      }

      if (this.isBasic(card)) {
        if (!targetPokemon && !isBench) {
          this.placeBasicPokemon(handIndex, 'active', targetSlotEl);
          return;
        }
        if (targetPokemon === p.active && p.bench.length < 5) {
          this.placeBasicPokemon(handIndex, 'bench');
          return;
        }
        App.toast('たねポケモンは空いているスロット（ベンチ空など）に出してください。', true);
        return;
      }

      // トレーナー/グッズ/サポートカード
      const cat = String(card.category || '');
      const isSupp = cat.includes('サポート') || cat.includes('トレーナー') || cat.toLowerCase().includes('supporter');
      if (isSupp) {
        if (this.isFirstPlayerFirstTurn('player')) {
          App.toast('先攻の最初の番はサポートカードを使用できません。', true);
          return;
        }
        if (p.supporterUsed) {
          App.toast('サポートカードは1ターンに1枚までしか使えません。', true);
          return;
        }
      }
      this.playTrainerCard(handIndex, card, isSupp ? 'サポート' : 'グッズ', targetPokemon);
    },

    handleDropOnEmptyBench(handIndex, targetSlotEl, benchIdx) {
      if (handIndex == null) return;
      const p = this.state.player;
      const card = p.hand[handIndex];
      if (!card) return;

      if (this.isBasic(card)) {
        this.placeBasicPokemon(handIndex, 'bench', targetSlotEl);
        return;
      }
      App.toast('空のベンチスロットにはたねポケモンのみ出せます。', true);
    },

    handleDropOnField(handIndex) {
      if (handIndex == null) return;
      const p = this.state.player;
      const card = p.hand[handIndex];
      if (!card) return;

      if (this.isBasic(card)) {
        if (!p.active) {
          this.placeBasicPokemon(handIndex, 'active');
        } else if (p.bench.length < 5) {
          this.placeBasicPokemon(handIndex, 'bench');
        } else {
          App.toast('ベンチがいっぱいです。', true);
        }
        return;
      }

      if (this.isEvolution(card)) {
        this.promptEvolution(handIndex, card);
        return;
      }

      if (this.isEnergy(card)) {
        this.promptEnergyAttachment(handIndex, card);
        return;
      }

      // トレーナーカード
      const cat = String(card.category || '');
      const isSupp = cat.includes('サポート') || cat.includes('トレーナー') || cat.toLowerCase().includes('supporter');
      if (isSupp) {
        if (this.isFirstPlayerFirstTurn('player')) {
          App.toast('先攻の最初の番はサポートカードを使用できません。', true);
          return;
        }
        if (p.supporterUsed) {
          App.toast('サポートカードは1ターンに1枚までしか使えません。', true);
          return;
        }
      }
      this.playTrainerCard(handIndex, card, isSupp ? 'サポート' : 'グッズ');
    },

    promptEvolution(handIndex, evoCard) {
      const p = this.state.player;
      const allTargets = [];
      if (p.active) allTargets.push({ target: p.active, where: 'バトル場' });
      p.bench.forEach((b) => allTargets.push({ target: b, where: 'ベンチ' }));

      // canEvolveFrom でフィルタリング
      const eligible = allTargets.filter((e) => this.canEvolveFrom(evoCard, e.target).can);

      if (!eligible.length) {
        const matchingBase = allTargets.find((e) => this.matchesEvolutionLine(evoCard, e.target));
        if (matchingBase) {
          const check = this.canEvolveFrom(evoCard, matchingBase.target);
          App.toast(check.reason || '進化できません。', true);
          return;
        }
        const preEvoName = this.getPreEvolutionName(evoCard);
        App.toast("【" + evoCard.name + "】は「" + preEvoName + "」が場にいないと進化できません。", true);
        return;
      }

      // もし対象が1匹のみなら即座に進化！
      if (eligible.length === 1) {
        this.executeEvolution(handIndex, eligible[0].target);
        return;
      }

      this.showChoiceModal(eligible.map((e) => ({ name: e.where + ': ' + e.target.name, type: e.target.type, hp: e.target.hp, category: e.target.category })), {
        title: '進化させる対象を選択',
        desc: evoCard.name + ' をどのポケモンに重ねて進化させますか？'
      }, (idx) => {
        const chosen = eligible[idx]?.target;
        if (chosen) {
          this.executeEvolution(handIndex, chosen);
        }
      });
    },

    // トレーナーカードを「場に出した」ように見せるアニメーション
    animateTrainerCardPlay(card, kind) {
      return new Promise((resolve) => {
        try {
          // カードのHTMLを生成
          const cardHtml = window.CardSystem && window.CardSystem.createCardHtml ?
          window.CardSystem.createCardHtml(card, { size: 'hand' }) :
          '<div style="background:rgba(255,209,102,0.2);border:2px solid #ffd166;border-radius:12px;width:110px;height:154px;display:flex;align-items:center;justify-content:center;color:#ffd166;font-weight:900;font-size:13px;">' + this.escape(card.name) + '</div>';

          // 種別バッジ色
          const kindColor = kind === 'サポート' ? '#a29bfe' : kind === 'グッズ' ? '#2ec4b6' : '#ffd166';
          const kindBg = kind === 'サポート' ? 'rgba(162,155,254,0.2)' : kind === 'グッズ' ? 'rgba(46,196,182,0.2)' : 'rgba(255,209,102,0.2)';

          // オーバーレイ生成
          const overlay = document.createElement('div');
          overlay.className = 'trainer-card-play-overlay';
          overlay.innerHTML =
          '<div class="trainer-card-play-card">' +
          '<div class="trainer-card-play-label">' +
          '<span class="trainer-kind-badge" style="background:' + kindBg + ';color:' + kindColor + ';border-color:' + kindColor + '50;">' + this.escape(kind) + '</span>' +
          this.escape(card.name) +
          '</div>' +
          cardHtml +
          '</div>';
          document.body.appendChild(overlay);

          // 効果テキストバナー
          const banner = document.createElement('div');
          banner.className = 'trainer-effect-banner';
          const effectText = card.attack1Text || card.description || kind + 'カードを使用！';
          const shortText = effectText.length > 40 ? effectText.slice(0, 40) + '…' : effectText;
          banner.textContent = shortText;
          document.body.appendChild(banner);

          // アニメーション完了後にクリーンアップ & resolve
          setTimeout(() => {
            overlay.remove();
            banner.remove();
            resolve();
          }, 900);
        } catch (err) {
          console.error('animateTrainerCardPlay error:', err);
          resolve(); // エラーでも続行
        }
      });
    },

    createBoardSnapshot() {
      const snapPlayer = (pl) => {
        if (!pl) return null;
        return {
          hand: [...(pl.hand || [])],
          discard: [...(pl.discard || [])],
          deck: [...(pl.deck || [])],
          bench: [...(pl.bench || [])],
          prizes: [...(pl.prizes || [])],
          active: pl.active,
          supporterUsed: !!pl.supporterUsed,
          energyAttached: !!pl.energyAttached,
          retreated: !!pl.retreated
        };
      };
      return {
        player: snapPlayer(this.state.player),
        opponent: snapPlayer(this.state.opponent)
      };
    },

    restoreBoardSnapshot(snapshot) {
      if (!snapshot) return;
      const restoreP = (target, saved) => {
        if (!target || !saved) return;
        target.hand = [...saved.hand];
        target.discard = [...saved.discard];
        target.deck = [...saved.deck];
        target.bench = [...saved.bench];
        target.prizes = [...saved.prizes];
        target.active = saved.active;
        target.supporterUsed = saved.supporterUsed;
        target.energyAttached = saved.energyAttached;
        target.retreated = saved.retreated;
      };
      restoreP(this.state.player, snapshot.player);
      restoreP(this.state.opponent, snapshot.opponent);
    },

    playTrainerCard(handIndex, card, kind, targetPokemon) {
      const p = this.state.player;
      // 効果中断(cant等)時の復元用スナップショット
      const snapshot = this.createBoardSnapshot();

      p.hand.splice(handIndex, 1);
      p.discard.push(card);

      if (kind === 'サポート') {
        p.supporterUsed = true;
      }

      this.log('📜 【' + kind + '】「' + card.name + '」を使用しました！');

      this.broadcastOnlineAction('play_trainer', {
        card: card,
        kind: kind
      });

      // 手札表示を即座に更新（カードが消えるように見せる）
      this.render();

      // アニメーション → 効果実行
      this.animateTrainerCardPlay(card, kind).then(async () => {
        let execCtx = null;
        // ActionEngine で効果実行
        const code = card.attack1Code || card.abilityCode;
        if (code && window.executeCardEffectCode) {
          try {
            execCtx = await window.executeCardEffectCode(
              code,
              { players: [this.state.player, this.state.opponent], logs: this.state.logs },
              p,
              'trainer',
              { card: card, pokemon: targetPokemon || p.active }
            );
          } catch (e) {
            if (e && e.isEffectAbort) {
              execCtx = { isCancelled: true, cancelReason: e.message ? e.message.replace(/^EFFECT_ABORTED:\s*/, '') : '' };
            } else {
              console.error('Trainer card effect error:', e);
              this.log("⚠️ 効果実行エラー: " + e.message);
            }
          }
        } else {
          // デフォルト効果フォールバック
          if (card.name.includes('アメ')) {
            const ok = await this.executeRareCandy(p);
            if (ok === false) {
              execCtx = { isCancelled: true, cancelReason: '発動条件を満たさなかったため' };
            }
          } else if (card.name.includes('博士')) {
            p.discard.push(...p.hand);
            p.hand = [];
            for (let i = 0; i < 7; i++) if (p.deck.length) p.hand.push(p.deck.shift());
            this.log("手札をトラッシュし、山札から7枚引きました。");
          } else if (card.name.includes('きずぐすり')) {
            const healTarget = targetPokemon || p.active;
            if (healTarget) {
              const oldHp = healTarget.hp;
              healTarget.hp = Math.min(healTarget.maxHp, healTarget.hp + 30);
              this.log(healTarget.name + "のHPを30回復しました。(" + oldHp + " → " + healTarget.hp + ")");
            }
          } else if (card.name.includes('いれかえ') && p.bench.length) {
            const n = p.bench.shift();
            p.bench.push(p.active);
            p.active = n;
            this.log("バトルポケモンを交代しました。(新しいバトルポケモン: " + p.active.name + ")");
          }
        }

        if (execCtx && execCtx.isCancelled) {
          // cant()または不発時のロールバック: 盤面と手札を復元
          this.restoreBoardSnapshot(snapshot);

          // 安全策: 手札に含まれていなければ確実に手札に戻す
          if (!p.hand.includes(card)) {
            const discIdx = p.discard.lastIndexOf(card);
            if (discIdx >= 0) p.discard.splice(discIdx, 1);
            const insertIdx = (typeof handIndex === 'number' && handIndex >= 0) ? Math.min(handIndex, p.hand.length) : p.hand.length;
            p.hand.splice(insertIdx, 0, card);
          }
          if (kind === 'サポート') {
            p.supporterUsed = false;
          }

          this.broadcastOnlineAction('cancel_trainer', {
            card: card,
            kind: kind
          });

          this.log('↩️ 【' + card.name + '】を手札に戻しました。');
          this.render();
          return;
        }

        this.render();
      });
    },


    retreatActive() {
      const p = this.state.player;
      if (this.state.turnPlayer !== 'player') return;
      if (!p.active) return;
      if (this.isBlocked('retreat', p.active, p)) {
        App.toast('効果によりにげることは禁止されています。', true);
        return;
      }
      if (p.retreated) {
        App.toast('にげるは1ターンに1回のみ行えます。', true);
        return;
      }
      if (!p.bench.length) {
        App.toast('ベンチに交代できるポケモンがいません。', true);
        return;
      }
      const retreatCost = Number(p.active.retreat) || 0;
      if ((p.active.energy || 0) < retreatCost) {
        App.toast("にげるエネルギーが足りません (必要: " + retreatCost + "個 / 現在: " + (p.active.energy || 0) + "個)", true);
        return;
      }

      this.showChoiceModal(p.bench.map((b) => ({ name: b.name, type: b.type, hp: b.hp, category: '交代先' })), {
        title: 'バトル場に出すポケモンを選択',
        desc: "エネルギーを" + retreatCost + "個トラッシュして交代します。"
      }, (idx) => {
        p.active.energy -= retreatCost;
        if (p.active.attachedEnergies) {
          for (let i = 0; i < retreatCost; i++) p.active.attachedEnergies.pop();
        }
        if (p.active) {
          p.active.usedLastTurn = false;
        }
        const nextActive = p.bench.splice(idx, 1)[0];
        p.bench.push(p.active);
        p.active = nextActive;
        p.retreated = true;

        this.log("🏃 にげる！ " + nextActive.name + " がバトル場に出ました。");
        this.broadcastOnlineAction('retreat', {
          benchIdx: idx,
          retreatCost: retreatCost
        });
        this.render();
      });
    },

    declareAttack(attackIndex) {
      if (this.state.turnPlayer !== 'player') return;
      const attacker = this.state.player.active;
      const defender = this.state.opponent.active;

      if (!attacker || !defender) return;

      if (this.isBlocked('attack', attacker, this.state.player)) {
        App.toast('効果によりワザの使用は禁止されています。', true);
        return;
      }

      // 先攻第1ターンは攻撃不可ルール
      if (this.isFirstPlayerFirstTurn('player')) {
        App.toast('先攻の最初の番はワザを使うことができません。', true);
        return;
      }

      const atkName = attackIndex === 1 ? attacker.attack1Name : attacker.attack2Name;
      const atkDamage = attackIndex === 1 ? attacker.attack1Damage : attacker.attack2Damage;
      const atkEnergy = attackIndex === 1 ? attacker.attack1Energy : attacker.attack2Energy;
      const atkCode = attackIndex === 1 ? attacker.attack1Code : attacker.attack2Code;

      // エネルギーコストチェック
      const energyCheck = this.checkEnergyRequirement(attacker, atkEnergy);
      if (!energyCheck.canAttack) {
        if (energyCheck.reason === 'type') {
          App.toast("必要エネルギーの属性が足りません (" + energyCheck.missingDesc + ")", true);
        } else {
          App.toast("エネルギーが足りません (必要: " + energyCheck.reqCount + "個 / 現在: " + energyCheck.currentCount + "個)", true);
        }
        return;
      }

      const stadiumTicker = document.getElementById('stadiumTicker');
      if (stadiumTicker) stadiumTicker.textContent = "あなた: 「" + atkName + "」を発動！";

      // 突進アニメーション発火
      const attackerEl = document.getElementById('playerActiveSpot');
      if (attackerEl) {
        attackerEl.classList.add('lunge-player');
        setTimeout(() => attackerEl.classList.remove('lunge-player'), 650);
      }

      setTimeout(async () => {
        // awaitで処理が止まる間に状態が変わる可能性があるため、最新の参照を安全に取得
        const currentAttacker = this.state.player?.active;
        const currentDefender = this.state.opponent?.active;
        if (!currentAttacker || !currentDefender) {
          console.warn('[declareAttack] attacker or defender became null before attack resolved.');
          this.render();
          return;
        }

        const defHpBefore = Number(currentDefender.hp) || 0;
        this.log("⚔️ " + currentAttacker.name + " の「" + atkName + "」！");

        let execCtx = null;
        // 処理は全部効果エディター (atkCode)
        if (atkCode && atkCode.trim() && window.executeCardEffectCode) {
          try {
            execCtx = await window.executeCardEffectCode(
              atkCode,
              { players: [this.state.player, this.state.opponent], logs: this.state.logs },
              this.state.player,
              'attack',
              { card: currentAttacker, pokemon: currentAttacker, attackIndex: attackIndex }
            );
          } catch (e) {
            if (e && e.isEffectAbort) {
              execCtx = { isCancelled: true, cancelReason: e.message };
            } else {
              console.error('Attack effect error:', e);
              this.log("⚠️ ワザ効果コード実行エラー: " + e.message);
            }
          }
        } else {
          // 効果コード未設定カードのフォールバック（表示用ダメージ文字列から数値を抽出）
          const numericDmg = parseInt(String(atkDamage || '').replace(/[^\d]/g, ''), 10) || 0;
          if (numericDmg > 0 && window.ORBITAL_EFFECT_API) {
            window.ORBITAL_EFFECT_API.damage(
              { self: this.state.player, opponent: this.state.opponent, game: this.state },
              currentDefender,
              numericDmg
            );
          }
        }

        // cant() による中断判定（ワザを使っていない扱いとし、番を終了しない）
        if (execCtx && execCtx.isCancelled) {
          this.log("⚠️ 条件を満たさなかったため、ワザは使用されませんでした。（自分の番は継続します）");
          this.render();
          return;
        }

        // await後の最新参照を再取得（コイントス等のUI待機でポインタが変わる可能性あり）
        const postAtk = this.state.player?.active;
        const postDef = this.state.opponent?.active;
        const defHpAfter = postDef ? Number(postDef.hp) || 0 : 0;
        const actualDamage = Math.max(0, defHpBefore - defHpAfter);

        this.broadcastOnlineAction('attack', {
          atkName: atkName,
          damage: atkDamage,
          actualDamage: actualDamage,
          attackIndex: attackIndex,
          defenderHp: defHpAfter,
          attackerHp: postAtk ? postAtk.hp : 0,
          status: postDef ? postDef.status : null
        });

        // きぜつ判定
        if (postDef && postDef.hp <= 0) {
          this.handleKnockout(this.state.player, this.state.opponent);
        } else if (postAtk && postAtk.hp <= 0) {
          this.handleKnockout(this.state.opponent, this.state.player);
        } else {
          this.render();
          // 攻撃宣言後はターン終了
          setTimeout(() => this.endTurn(), 800);
        }
      }, 350);
    },

    normalizeType(t) {
      if (!t) return '無';
      const s = String(t).trim().toLowerCase();
      if (s === '無色' || s === '無' || s === 'colorless' || s === 'any' || s === 'normal') return '無';
      if (s === '炎' || s === '火' || s === 'fire') return '炎';
      if (s === '水' || s === 'water') return '水';
      if (s === '雷' || s === '電気' || s === 'lightning' || s === 'electric') return '雷';
      if (s === '草' || s === 'grass') return '草';
      if (s === '超' || s === 'エスパー' || s === 'psychic') return '超';
      if (s === '闘' || s === '格闘' || s === 'fighting') return '闘';
      if (s === '悪' || s === '闇' || s === 'dark' || s === 'darkness') return '悪';
      if (s === '鋼' || s === 'メタル' || s === 'metal' || s === 'steel') return '鋼';
      if (s === 'ドラゴン' || s === '竜' || s === 'dragon') return 'ドラゴン';
      if (s === '光' || s === 'light') return '光';
      if (s === '風' || s === 'wind') return '風';
      if (s === '土' || s === 'earth') return '土';
      return s;
    },

    parseEnergyList(energyStr) {
      if (window.CardSystem && typeof window.CardSystem.parseEnergyList === 'function') {
        return window.CardSystem.parseEnergyList(energyStr);
      }
      if (energyStr == null) return [];
      if (typeof energyStr === 'number') {
        return Array(Math.max(0, Math.floor(energyStr))).fill('無');
      }
      const raw = String(energyStr).trim();
      if (!raw || /^(0|なし|0個|不要|none|free|-|ー|—)$/i.test(raw)) {
        return [];
      }
      if (/^\d+$/.test(raw)) {
        return Array(Number(raw)).fill('無');
      }

      let normalized = raw.replace(/(ドラゴン|無色|colorless|lightning|fighting|darkness|psychic|dragon|grass|metal|water|fire|[草炎火水雷超闘悪鋼無光闇風土])\s*(?:[×*x]|個|\s)\s*(\d+)個?/gi, '$1$2');
      const chunks = normalized.split(/[\s,、，/／・+＋|｜]+/).filter(Boolean);
      const result = [];
      const tokenRegex = /(ドラゴン|無色|colorless|lightning|fighting|darkness|psychic|dragon|grass|metal|water|fire|[草炎火水雷超闘悪鋼無光闇風土])(?:\s*[×*x]?\s*(\d+))?/gi;

      for (let i = 0; i < chunks.length; i++) {
        const chunk = chunks[i];
        if (/^\d+個?$/.test(chunk)) {
          const num = parseInt(chunk, 10) || 0;
          for (let k = 0; k < num; k++) result.push('無');
          continue;
        }
        let matchFound = false;
        tokenRegex.lastIndex = 0;
        let m;
        while ((m = tokenRegex.exec(chunk)) !== null) {
          matchFound = true;
          const type = m[1];
          const count = m[2] ? parseInt(m[2], 10) : 1;
          for (let k = 0; k < count; k++) {
            result.push(type);
          }
        }
        if (!matchFound && chunk.length === 1 && !/\s/.test(chunk)) {
          result.push(chunk);
        }
      }
      return result;
    },

    parseEnergyCount(energyStr) {
      return this.parseEnergyList(energyStr).length;
    },

    checkEnergyRequirement(attacker, energyReq) {
      const currentCount = Number(attacker?.energy || 0);
      const reqList = this.parseEnergyList(energyReq);
      const reqCount = reqList.length;

      if (reqCount === 0) {
        return { canAttack: true, reason: '', reqCount: 0, currentCount: currentCount, reqList: [], missingTypes: [], missingDesc: '' };
      }

      if (currentCount < reqCount) {
        return {
          canAttack: false,
          reason: 'count',
          reqCount: reqCount,
          currentCount: currentCount,
          reqList: reqList,
          missingTypes: [],
          missingDesc: `エネ不足 (${currentCount}/${reqCount})`
        };
      }

      // 場のポケモンに付いているエネルギー属性一覧の取得
      let attached = [];
      if (Array.isArray(attacker?.attachedEnergies) && attacker.attachedEnergies.length > 0) {
        attached = [...attacker.attachedEnergies];
      } else if (Array.isArray(attacker?.attachedCards)) {
        attacker.attachedCards.forEach((c) => {
          if (c && (String(c.category || '').includes('エネルギー') || !c.hp)) {
            attached.push(c.type || '無');
          }
        });
      }
      while (attached.length < currentCount) {
        attached.push(attacker?.type || '無');
      }

      const avail = attached.map((e) => this.normalizeType(e));

      const reqSpecific = [];
      let reqColorlessCount = 0;
      reqList.forEach((t) => {
        const norm = this.normalizeType(t);
        if (norm === '無') {
          reqColorlessCount++;
        } else {
          reqSpecific.push(norm);
        }
      });

      const remainingAvail = [...avail];
      const missingTypes = [];
      for (const reqType of reqSpecific) {
        const idx = remainingAvail.indexOf(reqType);
        if (idx >= 0) {
          remainingAvail.splice(idx, 1);
        } else {
          missingTypes.push(reqType);
        }
      }

      if (missingTypes.length > 0) {
        const symMap = (window.CardSystem && window.CardSystem.typeSymbols) || {};
        const missingFormatted = missingTypes.map((t) => (symMap[t] || '') + t).join(', ');
        return {
          canAttack: false,
          reason: 'type',
          reqCount: reqCount,
          currentCount: currentCount,
          reqList: reqList,
          missingTypes: missingTypes,
          missingDesc: `属性不一致 (${missingFormatted})`
        };
      }

      if (remainingAvail.length < reqColorlessCount) {
        return {
          canAttack: false,
          reason: 'count',
          reqCount: reqCount,
          currentCount: currentCount,
          reqList: reqList,
          missingTypes: [],
          missingDesc: `エネ不足 (${currentCount}/${reqCount})`
        };
      }

      return {
        canAttack: true,
        reason: '',
        reqCount: reqCount,
        currentCount: currentCount,
        reqList: reqList,
        missingTypes: [],
        missingDesc: ''
      };
    },

    handleKnockout(scorer, victim) {
      const koPokemon = victim.active;
      // nullガード: 既にきぜつ処理済み or 状態が変わっていた場合はスキップ
      if (!koPokemon) {
        console.warn('[handleKnockout] victim.active is null, skipping duplicate knockout.');
        return;
      }
      this.log("💀 " + (koPokemon.name || 'ポケモン') + " はきぜつした！");
      victim.discard.push(koPokemon);
      victim.active = null;

      // ex判定 (ポケモンexがきぜつしたとき、相手はサイドを2枚とる)
      const isEx = !!(koPokemon.isEx || String(koPokemon.category || '').includes('ex') || /[\s_・-]ex|ex/i.test(String(koPokemon.name || '')) || String(koPokemon.rarity || '').toLowerCase() === 'ex');

      const prizeCount = isEx ? Math.min(2, scorer.prizes.length) : Math.min(1, scorer.prizes.length);
      for (let i = 0; i < prizeCount; i++) {
        if (scorer.prizes.length > 0) {
          const prize = scorer.prizes.shift();
          scorer.hand.push(prize);
        }
      }

      if (isEx) {
        this.log("🌟 【exルール適用！】相手のポケモンex（" + (koPokemon.name || 'ポケモン') + "）がきぜつしたため、" + (scorer.name || '相手') + " はサイドを【2枚】とりました！（残りサイド: " + scorer.prizes.length + "枚）");
      } else {
        this.log("🏆 【" + (scorer.name || '相手') + "】がサイドを1枚獲得！（残りサイド: " + scorer.prizes.length + "枚）");
      }

      // きぜつしたポケモン自身の onKnockout イベントの発火
      if (koPokemon?.abilityCode && window.executeCardEffectCode) {
        try {
          window.executeCardEffectCode(koPokemon.abilityCode, { players: [victim, scorer] }, victim, 'onKnockout', { koPokemon, isEx, pokemon: koPokemon, card: koPokemon });
        } catch (e) {
          console.error('onKnockout ability error:', e);
        }
      }

      // 相手撃破時イベント onKnockoutOpponent の発火
      if (scorer.active?.abilityCode && window.executeCardEffectCode) {
        try {
          window.executeCardEffectCode(scorer.active.abilityCode, { players: [scorer, victim] }, scorer, 'onKnockoutOpponent', { koPokemon, isEx });
        } catch (e) {
          console.error('onKnockoutOpponent ability error:', e);
        }
      }

      // 自身の仲間（味方）きぜつ時イベント allyKnockedOut / 味方気絶 の発火
      const ALLY_KO_REGEX = /event\s*\.\s*on\s*\(\s*['"`](allyKnockedOut|onAllyKnockout|allyKnockout|ally_knocked_out|allyFainted|味方気絶|仲間気絶|自分のポケモン気絶|自分の仲間が気絶したら|仲間が気絶したら|味方が気絶したら)['"`]/;
      const victimAllies = [...(victim.bench || [])];
      if (victim.active) victimAllies.push(victim.active);
      victimAllies.forEach((allyPk) => {
        if (allyPk?.abilityCode && ALLY_KO_REGEX.test(allyPk.abilityCode) && window.executeCardEffectCode) {
          try {
            window.executeCardEffectCode(allyPk.abilityCode, { players: [victim, scorer] }, victim, 'allyKnockedOut', { koPokemon, isEx, pokemon: allyPk, card: allyPk });
          } catch (e) {
            console.error('allyKnockedOut ability error:', e);
          }
        }
      });

      // 勝利判定 1: サイドをすべて取り切った
      if (scorer.prizes.length === 0) {
        this.finishBattle(scorer.id, 'すべてのサイドカードを取り切りました！');
        return;
      }

      // 勝利判定 2: 相手のベンチが全滅
      if (!victim.bench.length) {
        this.finishBattle(scorer.id, '相手の場にポケモンがいなくなりました！');
        return;
      }

      // 交代ポケモンの選出
      if (victim.id === 'player') {
        this.showChoiceModal(victim.bench.map((b) => ({ name: b.name, type: b.type, hp: b.hp, category: 'バトル場へ' })), {
          title: 'きぜつによるバトルポケモン交代',
          desc: 'バトル場に出すベンチポケモンを選択してください。'
        }, (idx) => {
          victim.active = victim.bench.splice(idx, 1)[0];
          this.log("🔄 プレイヤーは " + victim.active.name + " をバトル場に出しました。");
          if (this.state.mode === 'online') {
            this.broadcastOnlineAction('promote_active', { benchIdx: idx });
          }
          this.render();
          if (this.state.mode !== 'online') {
            setTimeout(() => this.endTurn(), 600);
          }
        });
      } else if (this.state.mode === 'online') {
        // オンライン対戦時、相手の交代はリモートアクション 'promote_active' を待つ
        this.log("⏳ 相手がバトル場に出すポケモンを選択中...");
        this.render();
      } else {
        // AI はHPが一番高いポケモンをバトル場へ昇格
        victim.bench.sort((a, b) => b.hp - a.hp);
        victim.active = victim.bench.shift();
        this.log("🔄 AIライバルは " + victim.active.name + " をバトル場に出しました。");
        this.render();
        setTimeout(() => this.endTurn(), 600);
      }
    },

    async runAiTurn() {
      if (this.state.mode !== 'ai' || this.state.phase !== 'battle' || this.state.turnPlayer !== 'opponent') return;
      const ai = this.state.opponent;
      const oppTicker = document.getElementById('stadiumTicker');

      // 0. AI思考開始
      if (oppTicker) oppTicker.textContent = '相手が次の行動を思考中...';
      await this.wait(600);

      // 1. ベンチ出し
      const basicIdx = ai.hand.findIndex((c) => this.isBasic(c));
      if (basicIdx >= 0 && ai.bench.length < 3) {
        const basic = ai.hand.splice(basicIdx, 1)[0];
        basic._turnPlayed = this.state.turnNumber;
        ai.bench.push(basic);
        this.log("🤖 AIライバルは " + basic.name + " をベンチに出しました。");
        if (oppTicker) oppTicker.textContent = "相手: " + basic.name + " をベンチに召喚！";
        this.render();
        const newBenchEl = document.querySelectorAll('#oppBenchRow .bench-slot-occupied')[ai.bench.length - 1];
        if (newBenchEl) this.animateCardPlacement(newBenchEl);
        await this.wait(750);
      }

      // 1.5. AI進化 (有効な進化先がある場合のみ)
      const evoIdx = ai.hand.findIndex((c) => this.isEvolution(c));
      if (evoIdx >= 0) {
        const evoCard = ai.hand[evoIdx];
        const targets = [
        ...(ai.active ? [ai.active] : []),
        ...ai.bench];

        const validTarget = targets.find((t) => {
          const check = this.canEvolveFrom(evoCard, t);
          // AIは先攻1ターン目制限を適用 (失敗しないようフォールバックなし)
          return check.can;
        });
        if (validTarget) {
          const evo = ai.hand.splice(evoIdx, 1)[0];
          validTarget.attachedCards = validTarget.attachedCards || [];
          validTarget.attachedCards.unshift({
            name: validTarget.name,
            category: validTarget.category,
            type: validTarget.type,
            hp: validTarget.maxHp || validTarget.hp,
            maxHp: validTarget.maxHp || validTarget.hp,
            preEvolution: validTarget.preEvolution,
            image: validTarget.image,
            isEx: validTarget.isEx
          });
          const damageTaken = (validTarget.maxHp || 70) - (validTarget.hp || 70);
          validTarget.name = evo.name;
          validTarget.category = evo.category;
          validTarget.type = evo.type || validTarget.type;
          validTarget.maxHp = Number(evo.hp) || validTarget.maxHp + 50;
          validTarget.hp = Math.max(10, validTarget.maxHp - damageTaken);
          validTarget.attack1Name = evo.attack1Name;
          validTarget.attack1Damage = evo.attack1Damage;
          validTarget.attack1Energy = evo.attack1Energy;
          validTarget.attack1Text = evo.attack1Text;
          validTarget.attack1Code = evo.attack1Code;
          validTarget.attack2Name = evo.attack2Name;
          validTarget.attack2Damage = evo.attack2Damage;
          validTarget.attack2Energy = evo.attack2Energy;
          validTarget.attack2Text = evo.attack2Text;
          validTarget.attack2Code = evo.attack2Code;
          validTarget.abilityName = evo.abilityName || validTarget.abilityName;
          validTarget.abilityText = evo.abilityText || validTarget.abilityText;
          validTarget.abilityCode = evo.abilityCode || validTarget.abilityCode;
          validTarget.isEx = evo.isEx || validTarget.isEx;
          validTarget.preEvolution = evo.preEvolution;
          validTarget.weakness = evo.weakness || validTarget.weakness;
          validTarget.resistance = evo.resistance || validTarget.resistance;
          validTarget.retreat = evo.retreat != null ? evo.retreat : validTarget.retreat;
          validTarget.status = null;
          validTarget._turnPlayed = this.state.turnNumber;
          this.log("🤖 AIライバルの " + validTarget.name + " に進化しました！");
          if (oppTicker) oppTicker.textContent = "相手: " + validTarget.name + " に進化！";
          this.render();
          await this.wait(800);
        }
      }

      // 2. エネルギー付加
      const energyIdx = ai.hand.findIndex((c) => c.category === 'エネルギー' || c.category === '基本エネルギー');
      if (energyIdx >= 0 && !ai.energyAttached && ai.active) {
        const nrg = ai.hand.splice(energyIdx, 1)[0];
        ai.active.energy = (ai.active.energy || 0) + 1;
        ai.active.attachedEnergies = ai.active.attachedEnergies || [];
        ai.active.attachedEnergies.push(nrg.type || '無');
        ai.active.attachedCards = ai.active.attachedCards || [];
        ai.active.attachedCards.push(nrg);
        ai.energyAttached = true;
        this.log("🤖 AIライバルは " + ai.active.name + " にエネルギーを付けました。(エネ: " + ai.active.energy + ")");
        if (oppTicker) oppTicker.textContent = "相手: " + ai.active.name + " にエネルギーをチャージ！";

        const oppActiveEl = document.getElementById('oppActiveSpot');
        const oppDeckEl = document.getElementById('oppDeckCount');
        if (oppActiveEl) {
          this.animateEnergyFly(oppDeckEl || oppActiveEl, oppActiveEl, nrg.type);
        }
        await this.wait(650);
        this.render();
        await this.wait(500);
      }

      // 3. サポート/グッズ使用
      const isAiFirstPlayerTurn = this.isFirstPlayerFirstTurn('opponent');
      const trainerIdx = ai.hand.findIndex((c) => {
        const cat = String(c.category || '');
        const isSupp = cat.includes('サポート') || cat.toLowerCase().includes('supporter');
        if (isSupp && (isAiFirstPlayerTurn || ai.supporterUsed)) return false;
        return (c.category === 'グッズ' || isSupp) && c.name.includes('きずぐすり');
      });
      if (trainerIdx >= 0 && ai.active && ai.active.hp <= ai.active.maxHp - 30) {
        const tr = ai.hand.splice(trainerIdx, 1)[0];
        ai.discard.push(tr);
        const trCat = String(tr.category || '');
        if (trCat.includes('サポート') || trCat.toLowerCase().includes('supporter')) {
          ai.supporterUsed = true;
        }
        ai.active.hp = Math.min(ai.active.maxHp, ai.active.hp + 30);
        this.log("🤖 AIライバルは「" + tr.name + "」を使用！ HPを回復しました。(HP: " + ai.active.hp + ")");
        if (oppTicker) oppTicker.textContent = "相手: 「" + tr.name + "」でHPを30回復！";
        this.render();
        await this.wait(700);
      }

      // 4. ワザ宣言・攻撃
      if (!ai.active || !this.state.player.active) {
        this.endTurn();
        return;
      }

      // 先攻1ターン目攻撃不可
      if (this.isFirstPlayerFirstTurn('opponent')) {
        this.log("🤖 AIライバル: 先攻の最初の番のためワザを使えません。ターン終了します。");
        if (oppTicker) oppTicker.textContent = '相手: 先攻のためワザを使わずターン終了';
        await this.wait(700);
        this.endTurn();
        return;
      }

      // ワザ選択
      const atk2Check = this.checkEnergyRequirement(ai.active, ai.active.attack2Energy);
      const atk1Check = this.checkEnergyRequirement(ai.active, ai.active.attack1Energy);

      let attackChoice = 0;
      if (ai.active.attack2Name && atk2Check.canAttack) {
        attackChoice = 2;
      } else if (ai.active.attack1Name && atk1Check.canAttack) {
        attackChoice = 1;
      }

      if (attackChoice > 0) {
        const atkName = attackChoice === 1 ? ai.active.attack1Name : ai.active.attack2Name;
        const atkDamage = attackChoice === 1 ? ai.active.attack1Damage : ai.active.attack2Damage;
        const atkCode = attackChoice === 1 ? ai.active.attack1Code : ai.active.attack2Code;
        const defender = this.state.player.active;

        if (oppTicker) oppTicker.textContent = "相手: 「" + atkName + "」を宣言！！";
        await this.wait(400);

        // 突進演出
        const attackerEl = document.getElementById('oppActiveSpot');
        if (attackerEl) {
          attackerEl.classList.add('lunge-opp');
          setTimeout(() => attackerEl.classList.remove('lunge-opp'), 650);
        }
        await this.wait(400);

        this.log("⚔️ AIライバル " + (ai.active?.name || 'ポケモン') + " の「" + atkName + "」！");

        let execCtx = null;
        // 処理は全部効果エディター (atkCode)
        if (atkCode && atkCode.trim() && window.executeCardEffectCode) {
          try {
            execCtx = await window.executeCardEffectCode(
              atkCode,
              { players: [this.state.opponent, this.state.player], logs: this.state.logs },
              this.state.opponent,
              'attack',
              { card: ai.active, pokemon: ai.active }
            );
          } catch (e) {
            if (e && e.isEffectAbort) {
              execCtx = { isCancelled: true, cancelReason: e.message };
            } else {
              console.error('AI Attack effect error:', e);
              this.log("⚠️ AIワザ効果コードエラー: " + e.message);
            }
          }
        } else {
          const numericDmg = parseInt(String(atkDamage || '').replace(/[^\d]/g, ''), 10) || 0;
          if (numericDmg > 0 && window.ORBITAL_EFFECT_API) {
            const currentDefender = this.state.player?.active;
            if (currentDefender) {
              window.ORBITAL_EFFECT_API.damage(
                { self: this.state.opponent, opponent: this.state.player, game: this.state },
                currentDefender,
                numericDmg
              );
            }
          }
        }

        if (execCtx && execCtx.isCancelled) {
          this.log("🤖 AIライバル: ワザの条件を満たさなかったため攻撃しませんでした。");
          await this.wait(700);
          this.endTurn();
          return;
        }

        this.render();

        // await後の最新参照を再取得（コイントス等のUI待機でポインタが変わる可能性あり）
        const postDef = this.state.player?.active;
        const postAi = this.state.opponent?.active;

        if (postDef && postDef.hp <= 0) {
          await this.wait(400);
          this.handleKnockout(this.state.opponent, this.state.player);
        } else if (postAi && postAi.hp <= 0) {
          await this.wait(400);
          this.handleKnockout(this.state.player, this.state.opponent);
        } else {
          await this.wait(800);
          this.endTurn();
        }
      } else {
        this.log("🤖 AIライバル: エネルギーが不足しているため攻撃せずターン終了します。");
        if (oppTicker) oppTicker.textContent = '相手: 攻撃エネルギー不足のためターン終了';
        await this.wait(700);
        this.endTurn();
      }
    },

    finishBattle(winnerId, reason) {
      this.stopPolling();
      this.state.phase = 'ended';
      const isWin = winnerId === 'player';

      const banner = document.getElementById('resultBanner');
      const title = document.getElementById('resultTitle');
      const msg = document.getElementById('resultMessage');
      const stats = document.getElementById('resultStats');

      if (banner) {
        banner.textContent = isWin ? 'VICTORY!' : 'DEFEAT...';
        banner.className = "result-banner " + (isWin ? 'win' : 'lose');
      }
      if (title) title.textContent = isWin ? '🎉 あなたの勝利！' : '💀 敗北…';
      if (msg) msg.textContent = reason || (isWin ? '対戦相手を圧倒しました！' : '再挑戦してリベンジしましょう！');

      if (stats) {
        stats.innerHTML = "\n          <div>対戦ターン数: <strong>" +
        this.state.turnNumber + " ターン</strong></div>\n          <div>あなたの残りサイド: <strong>" +
        this.state.player.prizes.length + " 枚</strong></div>\n          <div>相手の残りサイド: <strong>" +
        this.state.opponent.prizes.length + " 枚</strong></div>\n        ";

      }

      const modal = document.getElementById('battleResultModal');
      if (modal) modal.classList.remove('hidden');
    },

    closeResultModal() {
      const modal = document.getElementById('battleResultModal');
      if (modal) modal.classList.add('hidden');
    },

    openDiscardModal(target = 'player') {
      this._activeDiscardTarget = target === 'opponent' ? 'opponent' : 'player';
      this._activeDiscardFilter = 'all';

      const modal = document.getElementById('battleDiscardModal');
      if (modal) modal.classList.remove('hidden');

      this.renderDiscardGrid();
    },

    closeDiscardModal() {
      const modal = document.getElementById('battleDiscardModal');
      if (modal) modal.classList.add('hidden');
    },

    switchDiscardTab(target) {
      this._activeDiscardTarget = target === 'opponent' ? 'opponent' : 'player';
      this.renderDiscardGrid();
    },

    setDiscardFilter(filter) {
      this._activeDiscardFilter = filter || 'all';
      this.renderDiscardGrid();
    },

    renderDiscardGrid() {
      const modal = document.getElementById('battleDiscardModal');
      if (!modal) return;

      const pCount = this.state.player?.discard?.length || 0;
      const oCount = this.state.opponent?.discard?.length || 0;

      const tabPCount = document.getElementById('discardTabPlayerCount');
      if (tabPCount) tabPCount.textContent = pCount;
      const tabOCount = document.getElementById('discardTabOppCount');
      if (tabOCount) tabOCount.textContent = oCount;

      const isPlayer = this._activeDiscardTarget !== 'opponent';
      const tabP = document.getElementById('discardTabPlayer');
      const tabO = document.getElementById('discardTabOpponent');

      if (tabP) tabP.classList.toggle('active', isPlayer);
      if (tabO) tabO.classList.toggle('active', !isPlayer);

      const filter = this._activeDiscardFilter || 'all';
      document.querySelectorAll('.discard-filter-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.discardFilter === filter);
      });

      const cards = (isPlayer ? this.state.player?.discard : this.state.opponent?.discard) || [];

      // フィルタリング
      const filtered = cards.filter((card) => {
        if (!card) return false;
        if (filter === 'all') return true;
        const cat = String(card.category || '');
        const isTrainer = cat === 'グッズ' || cat === 'サポート' || cat === 'トレーナー';
        const isEnergy = cat === 'エネルギー' || cat === '基本エネルギー' || cat.includes('エネルギー');
        const isPokemon = !isTrainer && !isEnergy;

        if (filter === 'pokemon') return isPokemon;
        if (filter === 'trainer') return isTrainer;
        if (filter === 'energy') return isEnergy;
        return true;
      });

      const countLabel = document.getElementById('discardVisibleCount');
      if (countLabel) {
        countLabel.textContent = filtered.length + "枚表示中 (" + cards.length + "枚中)";
      }

      const grid = document.getElementById('battleDiscardGrid');
      if (!grid) return;

      if (filtered.length === 0) {
        const ownerName = isPlayer ? 'あなた' : '相手';
        const emptyMsg = cards.length === 0 ?
          ownerName + "のトラッシュにはまだカードがありません。" :
          "該当するカテゴリ（" + filter + "）のカードはありません。";
        grid.innerHTML = `
          <div class="discard-empty-state">
            <div class="discard-empty-icon">🗑️</div>
            <div class="discard-empty-title">${ownerName}のトラッシュ</div>
            <div class="discard-empty-sub">${emptyMsg}</div>
          </div>
        `;
        return;
      }

      // 新しい順（最後にトラッシュされたものが手前）にするためコピーして反転
      const reversedList = filtered.slice().reverse();

      grid.innerHTML = reversedList.map((card, idx) => {
        let cardHtml = '';
        if (window.CardSystem && typeof window.CardSystem.createCardHtml === 'function') {
          cardHtml = window.CardSystem.createCardHtml(card, { size: 'sm' });
        } else {
          cardHtml = `
            <div class="card-fallback" style="padding:10px; background:#1e293b; border-radius:8px;">
              <strong>${this.escape(card.name)}</strong>
              <div>${this.escape(card.category || '')}</div>
            </div>
          `;
        }

        return `
          <div class="discard-grid-item" data-discard-idx="${idx}" title="クリックして【${this.escape(card.name)}】の詳細を拡大表示">
            <span class="discard-grid-zoom-pill">🔍 拡大</span>
            ${cardHtml}
          </div>
        `;
      }).join('');

      // クリックで CardSystem.showDetail を呼び出してフル拡大表示
      grid.querySelectorAll('.discard-grid-item').forEach((item, i) => {
        item.addEventListener('click', () => {
          const targetCard = reversedList[i];
          if (targetCard && window.CardSystem && typeof window.CardSystem.showDetail === 'function') {
            window.CardSystem.showDetail(targetCard);
          }
        });
      });
    },

    showChoiceModal(cards, options, onSelect, onCancel) {
      const modal = document.getElementById('battleChoiceModal');
      const title = document.getElementById('battleChoiceTitle');
      const desc = document.getElementById('battleChoiceDesc');
      const grid = document.getElementById('battleChoiceGrid');
      const cancelBtn = document.getElementById('cancelBattleChoiceBtn');
      const closeBtn = document.getElementById('closeBattleChoiceModal');

      if (!modal || !grid) {
        if (typeof onSelect === 'function') onSelect(0);
        return;
      }

      if (title) title.textContent = options?.title || 'カード選択';
      if (desc) desc.textContent = options?.desc || '対象を選択してください。';

      grid.innerHTML = cards.map((c, i) => {
        const typeHtml = c.type ? '【' + this.escape(c.type) + '】' : '';
        const hpHtml = c.hp ? '<span>HP ' + c.hp + '</span>' : '';
        return `
          <div class="choice-card-item" data-choice-idx="${i}">
            <div class="choice-card-title">${this.escape(c.name)}</div>
            <div class="choice-card-meta">
              <span>${this.escape(c.category || '')}</span>
              <span>${typeHtml}</span>
              ${hpHtml}
            </div>
          </div>
        `;
      }).join('');

      modal.classList.remove('hidden');

      const cleanup = () => {
        modal.classList.add('hidden');
        if (cancelBtn) cancelBtn.onclick = null;
        if (closeBtn) closeBtn.onclick = null;
      };

      if (cancelBtn) {
        cancelBtn.onclick = () => {
          cleanup();
          if (typeof onCancel === 'function') onCancel();
        };
      }
      if (closeBtn) {
        closeBtn.onclick = () => {
          cleanup();
          if (typeof onCancel === 'function') onCancel();
        };
      }

      grid.querySelectorAll('[data-choice-idx]').forEach((el) => {
        el.addEventListener('click', () => {
          const idx = Number(el.dataset.choiceIdx);
          cleanup();
          if (typeof onSelect === 'function') onSelect(idx);
        });
      });
    },

    closeChoiceModal() {
      const modal = document.getElementById('battleChoiceModal');
      if (modal) modal.classList.add('hidden');
    },

    showChoiceModalPromise(cards, options) {
      return new Promise((resolve) => {
        if (!cards || !cards.length) return resolve(null);
        if (options && options.autoPick && cards.length === 1) return resolve(cards[0]);
        this.showChoiceModal(cards, options || {}, (idx) => {
          resolve(cards[idx]);
        }, () => {
          resolve(null);
        });
      });
    },

    async executeRareCandy(player) {
      const p = player || this.state.player;
      const isFirstTurn = (this.state.firstPlayer === 'player' && this.state.turnNumber === 1) ||
                          (this.state.firstPlayer !== 'player' && this.state.turnNumber === 2);
      if (isFirstTurn) {
        if (p === this.state.player && window.App && typeof window.App.toast === 'function') App.toast('最初の自分の番には使えません。', true);
        this.log('⚠️ 最初の自分の番のため、ふしぎなアメは使えませんでした。');
        return false;
      }

      const hand = p.hand || [];
      const stage2List = hand.filter((c) => {
        const cat = String(c.category || '');
        return cat.includes('2進化') || (cat.includes('進化') && !cat.includes('1進化'));
      });

      if (!stage2List.length) {
        if (p === this.state.player && window.App && typeof window.App.toast === 'function') App.toast('手札に2進化ポケモンがありません。', true);
        this.log('⚠️ 手札に2進化ポケモンがいないため、ふしぎなアメは使えませんでした。');
        return false;
      }

      const fieldBasics = [];
      if (p.active && this.isBasic(p.active) && p.active._turnPlayed !== this.state.turnNumber) {
        fieldBasics.push({ target: p.active, where: 'バトル場' });
      }
      (p.bench || []).forEach((b, i) => {
        if (this.isBasic(b) && b._turnPlayed !== this.state.turnNumber) {
          fieldBasics.push({ target: b, where: 'ベンチ' + (i + 1), benchIdx: i });
        }
      });

      if (!fieldBasics.length) {
        if (p === this.state.player && window.App && typeof window.App.toast === 'function') App.toast('場に進化できるたねポケモンがいません。（出したばかりのポケモンには使えません）', true);
        this.log('⚠️ 場に進化できるたねポケモンがいない（または出したばかり）ため使えませんでした。');
        return false;
      }

      const validStage2s = stage2List.filter((s2) => fieldBasics.some((b) => this.canRareCandyEvolve(s2, b.target)));
      if (!validStage2s.length) {
        if (p === this.state.player && window.App && typeof window.App.toast === 'function') App.toast('手札の2進化ポケモンと進化ラインが一致するたねポケモンが場にいません。', true);
        this.log('⚠️ 進化ラインが一致するたねポケモンが場にいませんでした。');
        return false;
      }

      let chosenS2 = null;
      if (p === this.state.player) {
        chosenS2 = await this.showChoiceModalPromise(validStage2s, {
          title: '進化させる2進化ポケモンを手札から選択',
          desc: 'どの2進化ポケモンに進化させますか？'
        });
        if (!chosenS2) {
          this.log('ふしぎなアメの進化をキャンセルしました。');
          return false;
        }
      } else {
        chosenS2 = validStage2s[0];
      }

      const matchingBasics = fieldBasics.filter((b) => this.canRareCandyEvolve(chosenS2, b.target));
      if (!matchingBasics.length) {
        if (p === this.state.player && window.App && typeof window.App.toast === 'function') App.toast('進化ラインが一致するたねポケモンが場にいません。', true);
        return false;
      }

      let chosenBasicItem = null;
      if (p === this.state.player) {
        const modalBasics = matchingBasics.map((b) => ({
          name: b.where + ': ' + b.target.name,
          hp: b.target.hp,
          type: b.target.type,
          category: b.target.category,
          _orig: b
        }));
        const selected = await this.showChoiceModalPromise(modalBasics, {
          title: '進化させるたねポケモンを選択',
          desc: chosenS2.name + ' に進化させるたねポケモンを選んでください。'
        });
        if (!selected) {
          this.log('ふしぎなアメの進化をキャンセルしました。');
          return false;
        }
        chosenBasicItem = selected._orig || matchingBasics[0];
      } else {
        chosenBasicItem = matchingBasics[0];
      }

      const targetPokemon = chosenBasicItem.target;
      const handIndex = p.hand.indexOf(chosenS2);
      if (handIndex < 0) return false;

      this.executeEvolution(handIndex, targetPokemon);
      this.log('🍬 「ふしぎなアメ」の効果で、1進化をとばして【' + targetPokemon.name + '】へ進化しました！');
      if (window.App && typeof window.App.toast === 'function') App.toast(targetPokemon.name + ' に進化しました！(ふしぎなアメ)');
      return true;
    },
