    getTodayDateStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    },

    normalizeDateStr(val) {
      if (!val) return '';
      if (val instanceof Date) {
        if (isNaN(val.getTime())) return '';
        const y = val.getFullYear();
        const m = String(val.getMonth() + 1).padStart(2, '0');
        const d = String(val.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + d;
      }
      const str = String(val).trim();
      const mat = str.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
      if (mat) {
        const mo = mat[2].length === 1 ? '0' + mat[2] : mat[2];
        const da = mat[3].length === 1 ? '0' + mat[3] : mat[3];
        return mat[1] + '-' + mo + '-' + da;
      }
      const dt = new Date(str);
      if (!isNaN(dt.getTime())) {
        const y = dt.getFullYear();
        const mo = String(dt.getMonth() + 1).padStart(2, '0');
        const d = String(dt.getDate()).padStart(2, '0');
        return y + '-' + mo + '-' + d;
      }
      return str.slice(0, 10);
    },

    getLoginStreakInfo() {
      const today = this.getTodayDateStr();
      const email = this.getUserEmail();

      let rawClaim = this.state.userProfile?.lastBonusDate || '';
      if (!rawClaim) {
        try {
          rawClaim = localStorage.getItem('ORBITAL_LAST_DAILY_BONUS_' + email) ||
                     localStorage.getItem('ORBITAL_LAST_DAILY_BONUS') || '';
        } catch(e) {}
      }
      const lastClaim = this.normalizeDateStr(rawClaim);

      let streakDay = Number(this.state.userProfile?.streakDay);
      if (!streakDay || isNaN(streakDay)) {
        try {
          streakDay = Number(localStorage.getItem('ORBITAL_LOGIN_STREAK_DAY_' + email) ||
                             localStorage.getItem('ORBITAL_LOGIN_STREAK_DAY')) || 1;
        } catch(e) {}
      }
      if (isNaN(streakDay) || streakDay < 1) streakDay = 1;

      const isClaimedToday = Boolean(lastClaim && lastClaim === today);

      if (!isClaimedToday && lastClaim) {
        // 前回取得から1日経過したかのチェック
        const lastParts = lastClaim.split('-').map(Number);
        const currParts = today.split('-').map(Number);
        const lastDate = new Date(lastParts[0], lastParts[1] - 1, lastParts[2]);
        const currDate = new Date(currParts[0], currParts[1] - 1, currParts[2]);
        const diffDays = Math.round((currDate.getTime() - lastDate.getTime()) / (1000 * 60 * 60 * 24));

        if (diffDays === 1) {
          // 連続ログイン成功
          streakDay = (streakDay % 7) + 1;
        } else if (diffDays > 1) {
          // リセット (2日以上経過)
          streakDay = 1;
        }
      }

      return { today, lastClaim, isClaimedToday, streakDay };
    },

    openDailyBonusModal() {
      if (!this.requireLogin('ログインボーナス')) return;
      const modal = this.el('dailyBonusModal');
      if (modal) modal.classList.remove('hidden');
      this.renderDailyBonusStreak();
    },

    renderDailyBonusStreak() {
      const { today, lastClaim, isClaimedToday, streakDay } = this.getLoginStreakInfo();
      const rewards = this.getDailyBonusRewards();
      const grid = this.el('dailyBonusStreakGrid');
      const curReward = rewards[streakDay - 1] || rewards[0];

      const heroIcon = this.el('dailyBonusHeroIcon');
      if (heroIcon) heroIcon.textContent = curReward.icon;

      const amtText = this.el('dailyBonusAmountText');
      if (amtText) amtText.textContent = '+' + curReward.nmt.toLocaleString() + ' NMT' + (curReward.pack > 0 ? ' ＋ 🎁' + curReward.pack + 'パック' : '');

      const subtext = this.el('dailyBonusSubtext');
      if (subtext) subtext.textContent = curReward.desc || 'ゲーム内通貨 NMT ＆ 特典拡張パックで強力なカードをゲット！';

      const btn = this.el('claimBigDailyBonusBtn');
      if (btn) {
        if (isClaimedToday) {
          btn.textContent = '✅ 本日の受取完了 (Day ' + streakDay + ': ' + curReward.label + ')';
          btn.style.opacity = '0.6';
          btn.style.cursor = 'not-allowed';
          btn.disabled = true;
        } else {
          btn.textContent = '🎁 Day ' + streakDay + ' ボーナスを受け取る！ (' + curReward.label + ')';
          btn.style.opacity = '1';
          btn.style.cursor = 'pointer';
          btn.disabled = false;
        }
      }

      if (!grid) return;
      grid.innerHTML = rewards.map((r, idx) => {
        const dNum = r.day;
        const isPastClaimed = (dNum < streakDay) || (dNum === streakDay && isClaimedToday);
        const isActiveToday = (dNum === streakDay && !isClaimedToday);
        const isSpecial = r.special;
        const isPack = r.pack > 0;
        const boxClass = isPack ? 'pack-box' : 'coin-box';

        let statusClass = '';
        if (isPastClaimed) statusClass = 'claimed';
        else if (isActiveToday) statusClass = 'active-today';
        if (isSpecial) statusClass += ' special-day';

        const statusPill = isPastClaimed ? '✓ 受取完了' : (isActiveToday ? 'TODAY!' : '未解放');

        return '<div class="streak-day-card ' + statusClass + '">' +
          '<div class="streak-day-top-tag">DAY ' + dNum + (isSpecial ? ' ★' : '') + '</div>' +
          '<div class="streak-day-graphic-box ' + boxClass + '">' +
            '<div class="graphic-icon-emblem">' + r.icon + '</div>' +
            '<div class="graphic-amount-text">+' + r.nmt + '</div>' +
            (isPack ? ('<div class="graphic-pack-text">🎁 +' + r.pack + ' PACK</div>') : '') +
          '</div>' +
          '<div class="streak-day-status-pill">' + statusPill + '</div>' +
        '</div>';
      }).join('');
    },

    closeDailyBonusModal() {
      const modal = this.el('dailyBonusModal');
      if (modal) modal.classList.add('hidden');
    },

    claimDailyBonus() {
      if (!this.requireLogin('ログインボーナス')) return;
      const { today, isClaimedToday, streakDay } = this.getLoginStreakInfo();
      if (isClaimedToday) {
        this.toast('ℹ️ 本日のログインボーナスは取得済みです！明日またご来店ください。');
        this.renderDailyBonusStreak();
        return;
      }

      // 二重クリック連打を即座に防御
      const btn = this.el('claimBigDailyBonusBtn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '処理中...';
        btn.style.opacity = '0.5';
      }

      const email = this.getUserEmail();
      const rewards = this.getDailyBonusRewards();
      const curReward = rewards[streakDay - 1] || rewards[0];
      const newNmt = this.getUserNmt() + curReward.nmt;

      // 1. メモリと状態を即時更新 (確実に「本日取得済み」フラグを確定)
      if (!this.state.userProfile) this.state.userProfile = {};
      this.state.userProfile.lastBonusDate = today;
      this.state.userProfile.streakDay = streakDay;
      this.state.userProfile.nmtBalance = newNmt;
      this.state.userProfile.nmt = newNmt;
      this.state.nmt = newNmt;
      this.state.nmtBalance = newNmt;

      // 2. localStorage へ確実に保存 (全体キーおよびアカウント別キー)
      try {
        localStorage.setItem('ORBITAL_LAST_DAILY_BONUS', today);
        localStorage.setItem('ORBITAL_LAST_DAILY_BONUS_' + email, today);
        localStorage.setItem('ORBITAL_LOGIN_STREAK_DAY', String(streakDay));
        localStorage.setItem('ORBITAL_LOGIN_STREAK_DAY_' + email, String(streakDay));
        localStorage.setItem('ORBITAL_NMT_BALANCE', String(newNmt));
        if (this.state.userProfile) {
          localStorage.setItem('ORBITAL_LOGGED_IN_USER', JSON.stringify(this.state.userProfile));
        }
      } catch (e) {}

      // 3. UI表示を即座に受取完了状態に更新
      this.updateNmtDisplays();
      this.updateNmtBadge();
      this.renderDailyBonusStreak();

      // 金コインエフェクト表示
      this.triggerCoinBurst();

      // 4. バックエンド (GAS / Mock) への同期保存
      // ※ setUserNmt を呼ぶと saveUserNmtBalance と競合して lastBonusDate が上書きされる恐れがあるため、
      // 　 claimDailyBonusInDb 単独で残高・日付・ストリークを同時に安全更新！
      const self = this;
      if (window.google && google.script && google.script.run) {
        try {
          google.script.run
            .withSuccessHandler((res) => {
              console.log('✅ [DailyBonus Sync] claimDailyBonusInDb success:', res);
              if (res && res.profile) {
                self.state.userProfile = Object.assign(self.state.userProfile || {}, res.profile);
                try { localStorage.setItem('ORBITAL_LOGGED_IN_USER', JSON.stringify(self.state.userProfile)); } catch(e) {}
              }
            })
            .withFailureHandler((err) => {
              console.warn('⚠️ [DailyBonus Sync] claimDailyBonusInDb error:', err);
            })
            .claimDailyBonusInDb(email, today);
        } catch(e) {
          console.warn('claimDailyBonusInDb call warning:', e);
        }
      }

      if (curReward.pack > 0) {
        this.toast('🎉 Day ' + streakDay + ' ボーナス (+' + curReward.nmt + ' NMT ＆ 特典パック ' + curReward.pack + '個) を獲得しました！');
        // 無料パック即時開封体験
        setTimeout(() => {
          this.closeDailyBonusModal();
          this.addFreePackTickets(curReward.pack);
          this.showPage('pack');
        }, 1500);
      } else {
        this.toast('🎉 Day ' + streakDay + ' ボーナス (+' + curReward.nmt + ' NMT) を獲得しました！');
        setTimeout(() => this.closeDailyBonusModal(), 1600);
      }
    },

      burst.style.cssText = 'position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:64px; z-index:10000; pointer-events:none; animation:coinBurstAnim 1.2s ease-out forwards;';
      burst.innerHTML = '💰✨ 🎁✨ 💰✨';

        const unitPrice = p.price || 100;

        return '\n          <div class="pack-card">\n            <div class="pack-cover-wrapper">\n              ' + (coverArt) + '\n            </div>\n            <div class="pack-title">' + (this.escapeHtml(p.title)) + '</div>\n            <div class="pack-desc">' + (this.escapeHtml(p.description || '5枚のカードを収録')) + '</div>\n            <div class="pack-price-tag">✨ 1パック: ' + unitPrice + ' NMT / 10連: ' + tenPrice + ' NMT</div>\n            <div style="display:flex; flex-direction:column; gap:6px; width:100%; margin-top:8px;">\n              <button class="pack-buy-btn" type="button" onclick="App.buyAndOpenPack(\'' + (p.id) + '\', false, false, 1)">🎁 1パック開封 (' + unitPrice + ' NMT)</button>\n              <button class="pack-buy-btn pack-buy-10ren-btn" type="button" onclick="App.buyAndOpenPack(\'' + (p.id) + '\', false, false, 10)">🔥 10連開封 (' + tenPrice + ' NMT)<span class="ten-ren-sub-tag">★ ex以上2枚確定！</span></button>\n            </div>\n            <button class="pack-rates-btn" type="button" onclick="App.openPackRatesModal(\'' + (p.id) + '\')">📊 排出率を見る</button>\n          </div>\n        ';
      }).join('');

    getCardTypeEmblem(type) {
      const t = String(type || '').trim();
      if (t.includes('雷') || t.includes('電')) return '⚡';
      if (t.includes('炎') || t.includes('火')) return '🔥';
      if (t.includes('水')) return '💧';
      if (t.includes('草') || t.includes('葉')) return '🌿';
      if (t.includes('超') || t.includes('エスパー')) return '👁️';
      if (t.includes('闘') || t.includes('格闘')) return '👊';
      if (t.includes('悪') || t.includes('闇')) return '💀';
      if (t.includes('鋼') || t.includes('鉄')) return '⚙️';
      return '◇';
    },

    getPackEmissionRates(packId) {
      const allCards = this.getAllCards();
      let pack = null;
      if (packId === 'logbo') {
        const packs = (this.state.packs && this.state.packs.length > 0) ? this.state.packs : [];
        const packTitles = packs.map(p => p.title).filter(Boolean);
        const packNamesStr = packTitles.length > 0 ? packTitles.join(' / ') : '全拡張パック';

        // 収録プール: 既存パックのカードプールを統合（未設定パックがあれば全カード）
        let combinedPool = [];
        let hasUnrestrictedPack = false;
        packs.forEach(p => {
          if (Array.isArray(p.cardPool) && p.cardPool.length > 0) {
            combinedPool.push(...p.cardPool);
          } else {
            hasUnrestrictedPack = true;
          }
        });
        const targetPoolIds = (hasUnrestrictedPack || combinedPool.length === 0 || packs.length === 0)
          ? []
          : Array.from(new Set(combinedPool));

        pack = {
          id: 'logbo',
          title: '🎁 ログインボーナス特別パック (既存パックからランダム抽選)',
          description: `既存のパック（${packNamesStr}）の中から毎回等確率でランダムに1つのパックが選出されて開封されます！`,
          cardPool: targetPoolIds
        };
      } else {
        pack = (this.state.packs || []).find(p => p.id === packId) || (this.state.packs && this.state.packs[0]) || {
          id: packId,
          title: '拡張パック',
          cardPool: []
        };
      }

      let targetPool = allCards;
      if (pack && Array.isArray(pack.cardPool) && pack.cardPool.length > 0) {
        const filtered = allCards.filter(c => pack.cardPool.includes(c.id) || pack.cardPool.includes(c.name));
        if (filtered.length > 0) targetPool = filtered;
      }

      // レアリティ別基本排出比重 (左から順に高く: N:57.7%, R:25.5%, AR:10%, RR(ex):4.0%, SR:2.5%, ACESPEC:0.3%)
      const BASE_WEIGHTS = {
        'N': 57.7,
        'R': 25.5,
        'AR': 10.0,
        'RR': 4.0,
        'SR': 2.5,
        'ACESPEC': 0.3
      };

      const groups = {};
      targetPool.forEach(card => {
        let r = String(card.rarity || 'N').toUpperCase().trim();
        const isAce = !!(
          card.isAceSpec ||
          card.aceSpec ||
          card.subCategory === 'ACESPEC' ||
          r === 'ACE' ||
          r === 'ACESPEC' ||
          r === 'ACE SPEC' ||
          /ACE\s*SPEC|エーススペック/i.test(String(card.category || ''))
        );
        const isEx = !!(
          card.isEx ||
          String(card.category || '').includes('ex') ||
          /[\s_・-]ex|ex$/i.test(String(card.name || '')) ||
          r === 'EX' ||
          r === 'DOUBLE RARE' ||
          r === 'RR'
        );
        if (isAce) {
          r = 'ACESPEC';
        } else if (r === 'SR' || r === 'UR' || r === 'SUPER RARE' || r === 'ULTRA RARE') {
          r = 'SR';
        } else if (isEx) {
          r = 'RR';
        } else if (!BASE_WEIGHTS[r]) {
          if (r === 'C' || r === 'UC' || r === 'COMMON' || r === 'NORMAL' || !r) r = 'N';
          else if (r === 'RARE') r = 'R';
          else if (r === 'ART RARE') r = 'AR';
          else r = 'N';
        }
        if (!groups[r]) groups[r] = [];
        groups[r].push(card);
      });

      const rarityKeys = ['N', 'R', 'AR', 'RR', 'SR', 'ACESPEC'];
      let activeWeightSum = 0;
      rarityKeys.forEach(r => {
        if (groups[r] && groups[r].length > 0) {
          activeWeightSum += BASE_WEIGHTS[r];
        }
      });
      if (activeWeightSum <= 0) activeWeightSum = 100;

      const raritySummaries = [];
      const cardList = [];

      rarityKeys.forEach(r => {
        const cards = groups[r] || [];
        if (cards.length === 0) return;
        const groupPct = (BASE_WEIGHTS[r] / activeWeightSum) * 100;
        const perCardPct = groupPct / cards.length;

        raritySummaries.push({
          rarity: r,
          cardCount: cards.length,
          groupPercent: groupPct,
          perCardPercent: perCardPct
        });

        cards.forEach(card => {
          cardList.push({
            card: card,
            rarity: r,
            percent: perCardPct
          });
        });
      });

      return {
        pack: pack,
        targetPool: targetPool,
        totalCards: targetPool.length,
        raritySummaries: raritySummaries,
        cardList: cardList
      };
    },

    isExOrHigherCard(card) {
      if (!card) return false;
      const r = String(card.rarity || '').toUpperCase().trim();
      if (r === 'RR' || r === 'SR' || r === 'UR' || r === 'ACESPEC' || r === 'ACE' || r === 'DOUBLE RARE' || r === 'SUPER RARE' || r === 'ULTRA RARE') {
        return true;
      }
      if (card.isAceSpec || card.aceSpec || card.isEx) {
        return true;
      }
      const cat = String(card.category || '');
      if (cat.includes('ex') || /ACE\s*SPEC|エーススペック/i.test(cat)) {
        return true;
      }
      const name = String(card.name || '');
      if (/[\s_・-]ex|ex$/i.test(name)) {
        return true;
      }
      return false;
    },

    buyAndOpenPack(packId, isFree = false, isLogbo = false, pullCount = 1) {
      const pack = (this.state.packs || []).find(p => p.id === packId) || (this.state.packs && this.state.packs[0]);
      if (!pack) {
        this.toast('指定されたパックが見つかりません', true);
        return;
      }

      const count = pack.cardCount || 5;
      const is10Ren = (pullCount === 10);
      const totalPacks = is10Ren ? 10 : 1;
      const unitPrice = pack.price || 100;
      const totalPrice = isFree ? 0 : (unitPrice * totalPacks);

      if (!isFree) {
        const curNmt = this.getUserNmt();
        if (curNmt < totalPrice) {
          this.toast('❌ NMTが足りません！ (必要: ' + totalPrice + ' NMT / 所持: ' + curNmt + ' NMT) 毎日ログインボーナスを取得してください。', true);
          return;
        }
        this.setUserNmt(curNmt - totalPrice);
      }

      this.state.currentOpeningPackId = packId;

      // 排出率設定に基づき確率重み付け抽選を行う
      const ratesData = this.getPackEmissionRates(packId);
      const cardList = ratesData.cardList;
      const allDrawnCards = [];
      const packsDrawn = [];

      for (let pIdx = 0; pIdx < totalPacks; pIdx++) {
        const currentPackCards = [];
        if (cardList && cardList.length > 0) {
          for (let i = 0; i < count; i++) {
            let poolToUse = cardList.filter(cand => !currentPackCards.some(d => String(d.id) === String(cand.card.id) || (d.name && cand.card.name && d.name === cand.card.name)));
            if (poolToUse.length === 0) poolToUse = cardList;

            const totalWeight = poolToUse.reduce((sum, item) => sum + item.percent, 0);
            let randVal = Math.random() * totalWeight;
            let selected = poolToUse[0].card;
            for (let j = 0; j < poolToUse.length; j++) {
              randVal -= poolToUse[j].percent;
              if (randVal <= 0) {
                selected = poolToUse[j].card;
                break;
              }
            }
            const copyCard = JSON.parse(JSON.stringify(selected));
            currentPackCards.push(copyCard);
            allDrawnCards.push(copyCard);
          }
        } else {
          // デフォルトサンプルカード生成
          for (let i = 0; i < count; i++) {
            const cardObj = {
              id: 'drawn_' + Date.now() + '_' + pIdx + '_' + i,
              name: 'キラカード ' + (i + 1) + '号',
              category: 'たね',
              type: '無色',
              hp: 80,
              attack1Name: 'スターバースト',
              attack1Damage: 40,
              rarity: (i === 4 ? 'SR' : (i === 3 ? 'RR' : (i === 2 ? 'AR' : (i === 1 ? 'R' : 'N'))))
            };
            currentPackCards.push(cardObj);
            allDrawnCards.push(cardObj);
          }
        }
        packsDrawn.push(currentPackCards);
      }

      // ★ 10連特典: ex以上2枚確定保証
      if (is10Ren) {
        const currentExCount = allDrawnCards.filter(c => this.isExOrHigherCard(c)).length;
        if (currentExCount < 2) {
          const needed = 2 - currentExCount;
          let exPool = (cardList || []).filter(cand => this.isExOrHigherCard(cand.card));
          if (exPool.length === 0) {
            // 万が一プールにexがない場合のフェイルセーフ
            exPool = (this.getAllCards() || []).filter(c => this.isExOrHigherCard(c)).map(c => ({ card: c, percent: 1 }));
          }
          if (exPool.length > 0) {
            for (let k = 0; k < needed; k++) {
              const totalExWeight = exPool.reduce((sum, item) => sum + item.percent, 0);
              let randVal = Math.random() * totalExWeight;
              let chosenEx = exPool[0].card;
              for (let j = 0; j < exPool.length; j++) {
                randVal -= exPool[j].percent;
                if (randVal <= 0) {
                  chosenEx = exPool[j].card;
                  break;
                }
              }
              // 非exカードを後ろのパックから優先して置換
              let replaceIdx = -1;
              for (let rev = allDrawnCards.length - 1; rev >= 0; rev--) {
                if (!this.isExOrHigherCard(allDrawnCards[rev])) {
                  replaceIdx = rev;
                  break;
                }
              }
              if (replaceIdx >= 0) {
                const guaranteedCard = JSON.parse(JSON.stringify(chosenEx));
                allDrawnCards[replaceIdx] = guaranteedCard;
                const p = Math.floor(replaceIdx / count);
                const c = replaceIdx % count;
                if (packsDrawn[p]) {
                  packsDrawn[p][c] = guaranteedCard;
                }
              }
            }
          }
        }
      }

      this.state.is10RenPull = is10Ren;
      this.state.tenRenPacks = packsDrawn;
      this.state.tenRenCurrentPackIndex = 0;
      this.state.all10RenDrawnCards = allDrawnCards;
      this.state.activeDrawnCards = is10Ren ? packsDrawn[0] : allDrawnCards;

      // 獲得したカードをCardSystemのカスタムカードに登録し、所持状態にする
      if (window.CardSystem && typeof CardSystem.addCardsToCollection === 'function') {
        CardSystem.addCardsToCollection(allDrawnCards);
      }
      if (window.CardSystem && Array.isArray(CardSystem.customCards)) {
        let customChanged = false;
        const allKnown = this.getAllCards();
        allDrawnCards.forEach(c => {
          if (c && !allKnown.some(x => x && String(x.id || x.name) === String(c.id || c.name))) {
            CardSystem.customCards.push(c);
            customChanged = true;
          }
        });
        if (customChanged) {
          try { localStorage.setItem('ORBITAL_CUSTOM_CARDS', JSON.stringify(CardSystem.customCards)); } catch(e) {}
        }
      }
      // バックエンドDBへ確実にキュー保存
      this.saveUserCollectionToGas();

      this.openPackOpeningModal(pack, isLogbo, is10Ren);
    },

    openPackOpeningModal(pack, isLogbo = false, is10Ren = false) {
      const is10 = is10Ren || this.state.is10RenPull;
      const titleEl = this.el('packFoilTitle');
      if (titleEl) titleEl.textContent = (pack.title || '拡張パック') + (is10 ? ' (10連パック)' : '');
      const headerEl = this.el('packFoilHeader');
      if (headerEl) headerEl.textContent = isLogbo ? '🎁 ログボ特典 (ランダム当選)' : (is10 ? '🔥 10連 BOOSTER' : 'ORCEIN BOOSTER');
      const subEl = this.el('packFoilSub');

      const stageVis = this.el('packStageVisual');

      if (stageVis) stageVis.style.display = 'flex';
