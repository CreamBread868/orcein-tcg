<script>
console.log('[ORBITAL] App.js.html started execution');
(() => {
  'use strict';

  const CardSystem = new Proxy({}, {
    get(target, prop) {
      if (window.CardSystem && typeof window.CardSystem[prop] === 'function') {
        return function (...args) {return window.CardSystem[prop].apply(window.CardSystem, args);};
      }
      if (window.CardSystem && prop in window.CardSystem) {
        return window.CardSystem[prop];
      }
      return function () {
        console.warn('[Proxy] CardSystem.' + String(prop) + ' called before CardSystem ready');
      };
    }
  });
  const DeckSystem = new Proxy({}, {
    get(target, prop) {
      return window.DeckSystem ? window.DeckSystem[prop] : undefined;
    }
  });
  const BattleSystem = new Proxy({}, {
    get(target, prop) {
      return window.BattleSystem ? window.BattleSystem[prop] : undefined;
    }
  });

  function safeGetSession(key) {
    try {return window.sessionStorage ? window.sessionStorage.getItem(key) || '' : '';} catch (e) {return '';}
  }
  function safeSetSession(key, val) {
    try {if (window.sessionStorage) window.sessionStorage.setItem(key, val);} catch (e) {}
  }
  function safeRemoveSession(key) {
    try {if (window.sessionStorage) window.sessionStorage.removeItem(key);} catch (e) {}
  }

  const App = {
    state: {
      page: 'home',
      cards: [],
      editingCardId: null,
      adminToken: safeGetSession('orbital_admin_token'),
      currentVersion: (function() { try { return localStorage.getItem('orbital_app_version') || 'v1.0.0'; } catch(e) { return 'v1.0.0'; } })(),
      latestUpdate: null,
      nmtBalance: (function() { try { var b = localStorage.getItem('ORBITAL_NMT_BALANCE'); return b !== null ? Number(b) : 100; } catch(e) { return 100; } })(),
      packs: [],
      activeDrawnCards: []
    },

    init() {
      const safe = (name, fn) => {
        try {fn();}
        catch (e) {console.error('[App.init] ' + name + ' failed:', e);}
      };
      safe('initStartupLoader', () => this.initStartupLoader());
      safe('bindNavigation', () => this.bindNavigation());
      safe('initFontSize', () => this.initFontSize());
      safe('initNmtAndPacks', () => this.initNmtAndPacks());
      safe('bindHome', () => this.bindHome());
      safe('bindEditor', () => this.bindEditor());
      safe('bindFilters', () => this.bindFilters());
      safe('bindModal', () => this.bindModal());
      safe('bindAdmin', () => this.bindAdmin());
      safe('bindAccountProfileModal', () => this.bindAccountProfileModal());
      safe('loadCards', () => this.loadCards());
      safe('loadShopAndTradeItemsFromGas', () => this.loadShopAndTradeItemsFromGas());
      safe('checkForUpdates', () => this.checkForUpdates());
      safe('checkCamouflageAccess', () => this.checkCamouflageAccess());
      safe('CardSystem.init', () => {
        if (window.CardSystem && window.CardSystem.init) CardSystem.init();
      });
      safe('DeckSystem.init', () => {
        if (window.DeckSystem && window.DeckSystem.init) {
          DeckSystem.init();
          DeckSystem.loadDecks();
        }
      });
      safe('BattleSystem.init', () => {
        if (window.BattleSystem && window.BattleSystem.init) BattleSystem.init();
      });
      safe('showPage', () => {
        let initialPage = 'home';
        try {
          initialPage = new URLSearchParams(window.location.search).get('page') ||
            window.location.hash.replace('#', '') ||
            'home';
        } catch (e) { initialPage = 'home'; }
        this.showPage(initialPage);
      });
      try {
        const loaderScreen = document.getElementById('gas-loader-screen');
        if (loaderScreen) {
          loaderScreen.style.display = 'none';
          if (loaderScreen.parentNode) loaderScreen.parentNode.removeChild(loaderScreen);
        }
        const startupOverlay = document.getElementById('startupLoadingOverlay');
        if (startupOverlay) {
          startupOverlay.style.display = 'none';
          startupOverlay.classList.add('hidden');
          if (startupOverlay.parentNode) startupOverlay.parentNode.removeChild(startupOverlay);
        }
      } catch (e) {}
    },

    checkCamouflageAccess() {
      try {
        const hasLoggedIn = localStorage.getItem('ORBITAL_HAS_LOGGED_IN');
        const camouPage = document.getElementById('camouflagePage');
        const appContainer = document.getElementById('app');

        if (!hasLoggedIn || hasLoggedIn !== 'true') {
          if (camouPage) camouPage.classList.remove('hidden');
          if (appContainer) appContainer.classList.add('hidden');
          return false;
        } else {
          if (camouPage) camouPage.classList.add('hidden');
          if (appContainer) appContainer.classList.remove('hidden');
          return true;
        }
      } catch (e) {
        console.error('checkCamouflageAccess error:', e);
        return true;
      }
    },

    openCamouflageLoginModal() {
      const modal = document.getElementById('camouLoginModal');
      const input = document.getElementById('camouPasswordInput');
      const err = document.getElementById('camouPasswordError');
      if (err) err.style.display = 'none';
      if (input) input.value = '';
      if (modal) modal.classList.remove('hidden');
      if (input) setTimeout(() => input.focus(), 100);
    },

    closeCamouflageLoginModal() {
      const modal = document.getElementById('camouLoginModal');
      if (modal) modal.classList.add('hidden');
    },

        submitCamouflageLogin() {
      const emailInput = document.getElementById('camouEmailInput');
      const passInput = document.getElementById('camouPasswordInput');
      const err = document.getElementById('camouPasswordError');

      const email = (emailInput ? emailInput.value : '').trim().toLowerCase();
      const pass = (passInput ? passInput.value : '').trim();

      if (!email || !email.includes('@')) {
        if (err) { err.textContent = '有効なGmailアドレスを入力してください。'; err.style.display = 'block'; }
        return;
      }
      if (!pass) {
        if (err) { err.textContent = 'パスワードを入力してください。'; err.style.display = 'block'; }
        return;
      }

      try {
        localStorage.setItem('orbital_mock_user_email', email);
        localStorage.setItem('orbital_mock_user_password', pass);
        localStorage.setItem('ORBITAL_HAS_LOGGED_IN', 'true');
      } catch(e) {}

      const displayName = email.split('@')[0];
      const userProfile = { email, displayName, avatar: '👤', isLoggedIn: true };
      this.state.userProfile = userProfile;
      if (window.DeckSystem && window.DeckSystem.state) {
        window.DeckSystem.state.currentUser = userProfile;
        if (typeof window.DeckSystem.updateUserBadge === 'function') window.DeckSystem.updateUserBadge();
        if (typeof window.DeckSystem.loadDecks === 'function') window.DeckSystem.loadDecks();
      }

      this.closeCamouflageLoginModal();
      const camouPage = document.getElementById('camouflagePage');
      const appContainer = document.getElementById('app');
      if (camouPage) camouPage.classList.add('hidden');
      if (appContainer) appContainer.classList.remove('hidden');

      this.toast('🔑 ログイン成功: 酢酸オルセイン TCG へようこそ！');
    },

    unlockCamouflageAndLogin() {
      this.openCamouflageLoginModal();
    },

    initFontSize() {
      let mode = 'normal';
      try {
        mode = localStorage.getItem('orbital_font_scale') || 'normal';
      } catch (e) {}
      this.setFontSizeMode(mode, false);
      const btn = this.el('fontSizeToggleBtn');
      if (btn) {
        btn.addEventListener('click', () => {
          let current = 'normal';
          try {
            current = localStorage.getItem('orbital_font_scale') || 'normal';
          } catch (e) {}
          const next = current === 'normal' ? 'large' : (current === 'large' ? 'xlarge' : 'normal');
          this.setFontSizeMode(next, true);
        });
      }
    },

    setFontSizeMode(mode, showToast) {
      if (document.body) {
        document.body.classList.remove('font-size-large', 'font-size-xlarge');
        if (mode === 'large') {
          document.body.classList.add('font-size-large');
        } else if (mode === 'xlarge') {
          document.body.classList.add('font-size-xlarge');
        }
      }
      let label = 'Aa 文字サイズ: 標準';
      if (mode === 'large') label = 'Aa 文字サイズ: 大';
      else if (mode === 'xlarge') label = 'Aa 文字サイズ: 特大';
      try {
        localStorage.setItem('orbital_font_scale', mode);
      } catch (e) {}
      const btn = this.el('fontSizeToggleBtn');
      if (btn) btn.textContent = label;
      if (showToast) {
        this.toast('文字サイズを「' + (mode === 'large' ? '大' : (mode === 'xlarge' ? '特大' : '標準')) + '」に変更しました。');
      }
    },

    el(id) {
      return document.getElementById(id);
    },

    showPage(page) {
      if (page === 'create' && !this.isAdmin()) {
        this.requireAdmin();
        return;
      }
      document.querySelectorAll('.page').forEach((el) => el.classList.remove('active'));
      const target = this.el("page-" + page);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-button').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.page === page);
      });

      this.state.page = page;
      const sidebar = this.el('sidebar');
      if (sidebar) sidebar.classList.remove('open');

      if (page === 'deck' && window.DeckSystem) {
        DeckSystem.init();
        DeckSystem.loadDecks();
      }
      if (page === 'battle' && window.BattleSystem) {
        BattleSystem.init();
      }
      if (page === 'create' && window.CardSystem) {
        CardSystem.syncCategoryForm();
        CardSystem.updatePreview();
      }
      if (page === 'collection' && window.CardSystem && typeof CardSystem.renderCollectionPage === 'function') {
        CardSystem.renderCollectionPage();
      }
      if (page === 'pack') {
        this.loadPacks();
      }
      if (page === 'single-shop') {
        this.renderSingleShopGrid();
      }
    },

    toast(message, isError = false) {
      const toast = this.el('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.style.borderColor = isError ? 'var(--danger)' : '';
      toast.classList.add('show');
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    },

    bindNavigation() {
      document.querySelectorAll('.nav-button').forEach((btn) => {
        btn.addEventListener('click', () => this.showPage(btn.dataset.page));
      });

      const menuBtn = this.el('mobileMenuButton');
      if (menuBtn) {
        menuBtn.addEventListener('click', () => {
          const sb = this.el('sidebar');
          if (sb) sb.classList.toggle('open');
        });
      }
    },

    bindHome() {
      const onEl = (id, fn) => {const el = this.el(id);if (el) el.addEventListener('click', fn);};
      onEl('heroCreateButton', () => {if (!this.requireAdmin()) return;CardSystem.resetEditor();this.showPage('create');});
      onEl('heroCardsButton', () => this.showPage('collection'));
      onEl('homeRefreshButton', () => this.loadCards());
      onEl('homeGitHubSyncButton', () => this.promptGitHubSync());
      onEl('newCardButton', () => {if (!this.requireAdmin()) return;CardSystem.resetEditor();this.showPage('create');});
    },

    promptGitHubSync() {
      const current = localStorage.getItem('ORBITAL_GITHUB_REPO') || '';
      const input = prompt(
        '🐙 GitHubリポジトリからシステム全体（最新プログラムコード・カード・デッキ・パック設定）を読み込み・同期します。\n\n' +
        '・リポジトリ名 (例: owner/repository) または Raw URL を入力してください。\n' +
        '・同期を解除してローカルに戻す場合は「reset」と入力するか空欄でOKを押してください:',
        current || 'owner/repository'
      );
      if (input !== null) {
        const trimmed = input.trim();
        if (trimmed === '' || trimmed.toLowerCase() === 'reset') {
          try { localStorage.removeItem('ORBITAL_GITHUB_REPO'); } catch (e) {}
          this.toast('🧹 GitHub同期を解除し、ローカルデータに戻しました。');
          this.loadDefaultLocalCards();
        } else {
          this.loadFromGitHub(trimmed, true);
        }
      }
    },

    bindEditor() {
      const on = (id, event, handler) => {
        const node = this.el(id);
        if (node) node.addEventListener(event, handler);
      };

      on('saveCardButton', 'click', () => CardSystem.save());
      on('resetEditorButton', 'click', () => CardSystem.resetEditor());
      on('uploadImageButton', 'click', () => CardSystem.uploadImage());
      on('abilityEffectButton', 'click', () => CardSystem.openEffectEditor('ability'));
      on('attack1EffectButton', 'click', () => CardSystem.openEffectEditor('attack1'));
      on('attack2EffectButton', 'click', () => CardSystem.openEffectEditor('attack2'));
      on('trainerEffectButton', 'click', () => CardSystem.openEffectEditor('trainer'));
      on('category', 'change', () => {
        CardSystem.syncCategoryForm();
        CardSystem.updatePreview();
      });
      on('closeEffectEditorButton', 'click', () => CardSystem.closeEffectEditor());
      on('cancelEffectEditorButton', 'click', () => CardSystem.closeEffectEditor());
      on('saveEffectEditorButton', 'click', () => CardSystem.applyEffectEditor());

      const effectModal = this.el('effectEditorModal');
      if (effectModal) {
        const backdrop = effectModal.querySelector('.modal-backdrop');
        if (backdrop) backdrop.addEventListener('click', () => CardSystem.closeEffectEditor());
      }

      on('cardForm', 'input', () => CardSystem.updatePreview());
      on('cardForm', 'change', () => CardSystem.updatePreview());

      // 効果エディター内のボタンはイベント委譲で確実に処理する
      document.addEventListener('click', (e) => {
        const tab = e.target.closest('[data-effect-tab]');
        if (tab) {
          e.preventDefault();
          CardSystem.switchEffectTab(tab.dataset.effectTab);
          return;
        }
        const insert = e.target.closest('[data-effect-insert]');
        if (insert) {
          e.preventDefault();
          CardSystem.insertEffectCode(insert.dataset.effectInsert || '');
          return;
        }
      });

      // effectCodeEditor のキー操作・入力イベントは CardSystem 側で一元管理されています
    },

    bindFilters() {
      ['searchInput', 'categoryFilter', 'typeFilter', 'rarityFilter'].forEach((id) => {
        const el = this.el(id);
        if (!el) return;
        el.addEventListener('input', () => CardSystem.renderList());
        el.addEventListener('change', () => CardSystem.renderList());
      });
      ['collectionSearchInput', 'collectionCategoryFilter', 'collectionRarityFilter', 'collectionOwnedFilter'].forEach((id) => {
        const el = this.el(id);
        if (!el) return;
        el.addEventListener('input', () => CardSystem.renderCollectionPage());
        el.addEventListener('change', () => CardSystem.renderCollectionPage());
      });
    },

    bindModal() {
      const closeBtn = this.el('closeModalButton');
      if (closeBtn) closeBtn.addEventListener('click', () => this.closeModal());
      const modal = this.el('detailModal');
      if (modal) {
        const backdrop = modal.querySelector('.modal-backdrop');
        if (backdrop) backdrop.addEventListener('click', () => this.closeModal());
      }
    },

    openModal(html) {
      this.el('detailContent').innerHTML = html;
      this.el('detailModal').classList.remove('hidden');
    },

    closeModal() {
      this.el('detailModal').classList.add('hidden');
    },

    bindAdmin() {
      this.updateAdminStatus();
      const onEl = (id, fn) => {const el = this.el(id);if (el) el.addEventListener('click', fn);};
      onEl('adminLoginButton', () => {if (this.isAdmin()) this.logoutAdmin();else this.openAdminLogin();});
      onEl('closeAdminLoginButton', () => this.closeAdminLogin());
      onEl('adminLoginSubmit', () => this.loginAdmin());
      const modal = this.el('adminLoginModal');
      if (modal) {
        const backdrop = modal.querySelector('.modal-backdrop');
        if (backdrop) backdrop.addEventListener('click', () => this.closeAdminLogin());
      }
      const pwd = this.el('adminPassword');
      if (pwd) pwd.addEventListener('keydown', (e) => {if (e.key === 'Enter') this.loginAdmin();});
    },

    isAdmin() {return !!this.state.adminToken;},

    requireAdmin() {
      if (this.isAdmin()) return true;
      this.openAdminLogin();
      this.toast('カード作成には管理者ログインが必要です。', true);
      return false;
    },

    openAdminLogin() {this.el('adminLoginModal').classList.remove('hidden');this.el('adminPassword').focus();},
    closeAdminLogin() {this.el('adminLoginModal').classList.add('hidden');},

    loginAdmin() {
      const password = (this.el('adminPassword') ? this.el('adminPassword').value : '').trim();
      if (!password) { this.toast('パスワードを入力してください。', true); return; }
      const btn = this.el('adminLoginSubmit');
      if (btn) btn.disabled = true;

      if (window.google && google.script && google.script.run && typeof google.script.run.loginAdmin === 'function' && !window._is_mock_gas) {
        google.script.run.withSuccessHandler((result) => {
          if (btn) btn.disabled = false;
          this.state.adminToken = result ? result.token : 'admin_token';
          safeSetSession('orbital_admin_token', this.state.adminToken);
          if (this.el('adminPassword')) this.el('adminPassword').value = '';
          this.closeAdminLogin();
          this.updateAdminStatus();
          this.toast('🔑 管理者としてログインしました。');
        }).withFailureHandler((err) => {
          if (btn) btn.disabled = false;
          this.toast('ログイン失敗: ' + (err.message || err), true);
        }).loginAdmin(password);
      } else {
        setTimeout(() => {
          if (btn) btn.disabled = false;
          const token = 'mock_admin_token_' + Date.now();
          this.state.adminToken = token;
          safeSetSession('orbital_admin_token', token);
          if (this.el('adminPassword')) this.el('adminPassword').value = '';
          this.closeAdminLogin();
          this.updateAdminStatus();
          this.toast('🔑 管理者としてログインしました (ローカルモード)');
        }, 200);
      }
    },

    logoutAdmin() {
      const token = this.state.adminToken;
      this.state.adminToken = '';
      safeRemoveSession('orbital_admin_token');
      this.updateAdminStatus();
      google.script.run.withFailureHandler(() => {}).logoutAdmin(token);
      this.toast('ログアウトしました。');
    },

    updateAdminStatus() {
      const status = this.el('adminStatus');
      const button = this.el('adminLoginButton');
      const pubBtn = this.el('publishUpdateBtn');
      const adminUis = document.querySelectorAll('.admin-only-ui');

      if (this.isAdmin()) {
        if (status) status.textContent = '管理者モード';
        if (button) button.textContent = 'ログアウト';
        if (pubBtn) pubBtn.classList.remove('hidden');
        adminUis.forEach((el) => el.classList.remove('hidden'));
      } else {
        if (status) status.textContent = '閲覧モード';
        if (button) button.textContent = '管理者ログイン';
        if (pubBtn) pubBtn.classList.add('hidden');
        adminUis.forEach((el) => el.classList.add('hidden'));

        if (this.state.page === 'create') {
          this.showPage('home');
        }
      }
    },

    /* ---------- アプデ配信・通知機能 ---------- */

    checkForUpdates() {
      if (!window.google || !google.script || !google.script.run || window._is_mock_gas) return;
      try {
        google.script.run
          .withSuccessHandler((res) => {
            if (!res || !res.ok || !res.update) return;
            const update = res.update;
            this.state.latestUpdate = update;
            const currentVer = this.state.currentVersion || 'v1.0.0';
            if (update.version && update.version !== currentVer) {
              const banner = this.el('appUpdateTopBanner');
              const bannerText = this.el('appUpdateTopBannerText');
              if (bannerText) {
        bannerText.textContent = '🚀 新しいアップデート (' + update.version + ': ' + update.title + ') が配信されました！';
              }
              if (banner) banner.classList.remove('hidden');
            }
          })
          .getLatestAppUpdate();
      } catch (e) {
        console.warn('checkForUpdates warning:', e);
      }
    },

    openUpdatePublishModal() {
      if (!this.requireAdmin()) return;
      const modal = this.el('appUpdatePublishModal');
      if (!modal) return;
      const verInput = this.el('updateVersionInput');
      if (verInput && !verInput.value) {
        verInput.value = 'v1.1.0';
      }
      modal.classList.remove('hidden');
    },

    closeUpdatePublishModal() {
      const modal = this.el('appUpdatePublishModal');
      if (modal) modal.classList.add('hidden');
    },

    submitAppUpdate() {
      if (!this.requireAdmin()) return;
      const verInput = this.el('updateVersionInput');
      const titleInput = this.el('updateTitleInput');
      const notesInput = this.el('updateNotesInput');
      const syncCheck = this.el('updateSyncCardsCheckbox');

      const version = verInput ? verInput.value.trim() : '';
      const title = titleInput ? titleInput.value.trim() : '';
      const notes = notesInput ? notesInput.value.trim() : '';
      const syncCards = syncCheck ? syncCheck.checked : true;

      if (!version || !title) {
        this.toast('バージョン番号とタイトルを入力してください。', true);
        return;
      }

      const btn = this.el('submitAppUpdateBtn');
      if (btn) btn.disabled = true;

      google.script.run.withSuccessHandler((res) => {
        if (btn) btn.disabled = false;
        if (!res || !res.ok) {
          this.toast('配信に失敗しました: ' + (res?.message || '不明なエラー'), true);
          return;
        }
        this.closeUpdatePublishModal();
        this.toast('🎉 アプデ (' + version + ') の配信が完了しました！');
        this.state.currentVersion = version;
        try { localStorage.setItem('orbital_app_version', version); } catch(e) {}
        if (titleInput) titleInput.value = '';
        if (notesInput) notesInput.value = '';
        this.checkForUpdates();
      }).withFailureHandler((err) => {
        if (btn) btn.disabled = false;
        this.toast('配信失敗: ' + (err.message || err), true);
      }).publishAppUpdate({ version, title, notes, syncCards }, this.state.adminToken);
    },

    openUpdateNoticeModal() {
      const update = this.state.latestUpdate;
      if (!update) return;
      const modal = this.el('appUpdateNoticeModal');
      if (!modal) return;

      const titleEl = this.el('updateNoticeTitleDisplay');
      const verBadge = this.el('updateNoticeVersionBadge');
      const dateBadge = this.el('updateNoticeDateBadge');
      const notesEl = this.el('updateNoticeNotesDisplay');

      if (titleEl) titleEl.textContent = '🚀 ' + (update.title || '新しいアップデートが配信されました！');
      if (verBadge) verBadge.textContent = update.version || 'v1.0.0';
      if (dateBadge) dateBadge.textContent = update.publishedAt || '';
      if (notesEl) notesEl.textContent = update.notes || '詳細なアップデート内容はありません。';

      modal.classList.remove('hidden');
    },

    closeUpdateNoticeModal() {
      const modal = this.el('appUpdateNoticeModal');
      if (modal) modal.classList.add('hidden');
    },

    applyAppUpdate() {
      const update = this.state.latestUpdate;
      if (!update) {
        this.closeUpdateNoticeModal();
        return;
      }
      const version = update.version || 'v1.0.0';
      try { localStorage.setItem('orbital_app_version', version); } catch(e) {}
      this.state.currentVersion = version;

      const banner = this.el('appUpdateTopBanner');
      if (banner) banner.classList.add('hidden');

      this.closeUpdateNoticeModal();

      if (window.CardSystem && window.CardSystem.loadCards) {
        window.CardSystem.loadCards(true);
      } else {
        this.loadCards();
      }
      if (window.DeckSystem && window.DeckSystem.loadDecks) {
        window.DeckSystem.loadDecks();
      }

        this.toast('🎉 バージョン ' + version + ' へ更新を適用しました！');
    },

    initStartupLoader() {
      const overlay = this.el('startupLoadingOverlay');
      const bar = this.el('startupProgressBar');
      const text = this.el('startupStatusText');

      const hideAllLoaders = () => {
        try {
          if (overlay) {
            overlay.style.display = 'none';
            overlay.classList.add('hidden');
            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          }
          const gasLoader = document.getElementById('gas-loader-screen');
          if (gasLoader) {
            gasLoader.style.display = 'none';
            if (gasLoader.parentNode) gasLoader.parentNode.removeChild(gasLoader);
          }
        } catch (e) {}
      };

      // ハードセーフティタイムアウト（最大3.5秒でローディング画面を強制削除）
      const safetyTimeout = setTimeout(hideAllLoaders, 3500);

      if (!overlay || !bar) {
        clearTimeout(safetyTimeout);
        hideAllLoaders();
        return;
      }

      let progress = 0;
      const updateProgress = (target, statusText) => {
        progress = Math.max(progress, target);
        bar.style.width = progress + '%';
        if (statusText && text) text.textContent = statusText;
      };

      updateProgress(20, 'システムコンポーネント初期化中…');

      setTimeout(async () => {
        try {
          updateProgress(50, 'GitHubリポジトリからデータ・モジュールを検出中…');
          const savedRepo = localStorage.getItem('ORBITAL_GITHUB_REPO');

          if (window.google && google.script && google.script.run && !window._is_mock_gas) {
            updateProgress(80, 'スプレッドシートからカードデータを読み込み中…');
            this.loadCards();
          } else if (savedRepo) {
            updateProgress(75, 'GitHub (' + savedRepo + ') から最新データを取得中…');
            const success = await this.loadFromGitHub(savedRepo, false);
            if (!success) {
              updateProgress(85, 'ローカルデータに復帰中…');
              this.loadDefaultLocalCards();
            }
          } else {
            updateProgress(80, 'カードライブラリをロード中…');
            this.loadCards();
          }
          updateProgress(100, '起動完了！');
        } catch (err) {
          console.warn('Startup loader warning:', err);
          this.loadDefaultLocalCards();
        } finally {
          clearTimeout(safetyTimeout);
          setTimeout(hideAllLoaders, 150);
        }
      }, 100);
    },

    getAllCards() {
      if (window.CardSystem && window.CardSystem.state && Array.isArray(window.CardSystem.state.cards) && window.CardSystem.state.cards.length > 0) {
        return window.CardSystem.state.cards;
      }
      if (window.CardSystem && typeof window.CardSystem.getCards === 'function') {
        const res = window.CardSystem.getCards();
        if (Array.isArray(res) && res.length > 0) return res;
      }
      if (window.CardSystem && Array.isArray(window.CardSystem.customCards) && window.CardSystem.customCards.length > 0) {
        return window.CardSystem.customCards;
      }
      if (this.state && Array.isArray(this.state.cards) && this.state.cards.length > 0) {
        return this.state.cards;
      }
      return [];
    },

    loadCards() {
      const countEl = this.el('homeCardCount');
      if (countEl) countEl.textContent = '読み込み中…';

      if (window.google && google.script && google.script.run && !window._is_mock_gas) {
        try {
          console.log('📡 Requesting getCards from Spreadsheet via GAS...');
          google.script.run
            .withSuccessHandler((cards) => {
              console.log('✅ Received cards from Spreadsheet:', cards);
              this.state.cards = this.normalizeCardData(cards);
              const el = this.el('homeCardCount');
              if (el) el.textContent = this.state.cards.length + '枚のカード';
              if (window.CardSystem) {
                if (typeof CardSystem.renderList === 'function') CardSystem.renderList();
                if (typeof CardSystem.renderRecent === 'function') CardSystem.renderRecent();
              }
              if (window.DeckSystem && typeof DeckSystem.syncCardPool === 'function') {
                DeckSystem.syncCardPool();
              }
            })
            .withFailureHandler((err) => {
              console.error('❌ GAS getCards error:', err);
              this.loadDefaultLocalCards();
            })
            .getCards();
        } catch (e) {
          console.error('❌ Exception in getCards runner:', e);
          this.loadDefaultLocalCards();
        }
        return;
      }

      const savedGitHubRepo = localStorage.getItem('ORBITAL_GITHUB_REPO');
      if (savedGitHubRepo) {
        this.loadFromGitHub(savedGitHubRepo);
        return;
      }

      this.loadDefaultLocalCards();
    },

    normalizeCardData(rawCards) {
      if (!Array.isArray(rawCards)) return [];
      return rawCards.map((c, i) => {
        if (!c) return c;

        // 全プロパティキーを小文字・記号除去でインデックス化
        const normKeyMap = {};
        Object.keys(c).forEach(k => {
          if (k != null) {
            const cleanKey = String(k).trim().toLowerCase().replace(/[\s_ー-]+/g, '');
            normKeyMap[cleanKey] = c[k];
          }
        });

        const getVal = (candidates) => {
          for (let cand of candidates) {
            if (c[cand] !== undefined && c[cand] !== null && String(c[cand]).trim() !== '') {
              return c[cand];
            }
            const cleanCand = String(cand).trim().toLowerCase().replace(/[\s_ー-]+/g, '');
            if (normKeyMap[cleanCand] !== undefined && normKeyMap[cleanCand] !== null && String(normKeyMap[cleanCand]).trim() !== '') {
              return normKeyMap[cleanCand];
            }
          }
          return '';
        };

        const image = String(getVal(['image', 'imageUrl', 'image_url', '画像url', '画像URL', '画像', 'イラスト', '写真', 'url', 'img', 'src']) || '').trim();
        const attack1Name = String(getVal(['attack1Name', 'attack1name', 'attack1', 'ワザ1', 'ワザ1名', '技1', '技1名']) || '').trim();
        const attack1Damage = getVal(['attack1Damage', 'attack1damage', 'ワザ1ダメージ', '技1ダメージ', 'ダメージ1']);
        const attack1Energy = String(getVal(['attack1Energy', 'attack1energy', 'ワザ1エネ', 'ワザ1エネルギー', '技1エネ', 'コスト1']) || '').trim();
        const attack1Text = String(getVal(['attack1Text', 'attack1text', 'ワザ1説明', 'ワザ1効果', 'ワザ1テキスト', '技1効果']) || '').trim();

        const attack2Name = String(getVal(['attack2Name', 'attack2name', 'attack2', 'ワザ2', 'ワザ2名', '技2', '技2名']) || '').trim();
        const attack2Damage = getVal(['attack2Damage', 'attack2damage', 'ワザ2ダメージ', '技2ダメージ', 'ダメージ2']);
        const attack2Energy = String(getVal(['attack2Energy', 'attack2energy', 'ワザ2エネ', 'ワザ2エネルギー', '技2エネ', 'コスト2']) || '').trim();
        const attack2Text = String(getVal(['attack2Text', 'attack2text', 'ワザ2説明', 'ワザ2効果', 'ワザ2テキスト', '技2効果']) || '').trim();

        const abilityName = String(getVal(['abilityName', 'abilityname', 'ability', '特性', '特性名', 'とくせい']) || '').trim();
        const abilityText = String(getVal(['abilityText', 'abilitytext', '特性説明', '特性効果', '特性テキスト']) || '').trim();

        const weakness = String(getVal(['weakness', '弱点', 'じゃくてん', '弱点タイプ']) || '').trim();
        const resistance = String(getVal(['resistance', '抵抗力', '抵抗', 'ていこう', '抵抗タイプ']) || '').trim();
        const retreat = getVal(['retreat', 'にげる', '逃げる', '逃げ', '逃げエネ', '逃げコスト', 'にげるコスト', 'にげるエネルギー']);

        let description = String(getVal(['description', '説明', '説明文', 'テキスト', 'フレーバー', 'text', 'info']) || '').trim();

        // 【自動修復】もし image が空で、description に URL (http/https) が入っている場合、画像URLとして自動修復
        if (!image && /^https?:\/\//i.test(description)) {
          image = description;
          description = '';
        }

        const category = String(c.category || 'たね');
        const isTrainerCategory = category === 'グッズ' || category === 'サポート' || category === 'トレーナー' || category === 'スタジアム';
        const cardType = isTrainerCategory ? '' : String(c.type || '無');

        return {
          ...c,
          id: String(c.id || 'card_' + (i + 1)),
          name: String(c.name || 'カード'),
          type: cardType,
          category: category,
          rarity: String(c.rarity || 'C'),
          hp: c.hp !== '' && c.hp != null ? Number(c.hp) : '',
          image: image,
          abilityName: abilityName,
          abilityText: abilityText,
          attack1Name: attack1Name,
          attack1Damage: attack1Damage !== undefined && attack1Damage !== null ? String(attack1Damage) : '',
          attack1Energy: attack1Energy,
          attack1Text: attack1Text,
          attack2Name: attack2Name,
          attack2Damage: attack2Damage !== undefined && attack2Damage !== null ? String(attack2Damage) : '',
          attack2Energy: attack2Energy,
          attack2Text: attack2Text,
          weakness: weakness,
          resistance: resistance,
          retreat: retreat !== '' && retreat != null ? Number(retreat) : '',
          description: description
        };
      });
    },

    loadDefaultLocalCards() {
      if (!Array.isArray(this.state.cards) || this.state.cards.length === 0) {
        try {
          const raw = localStorage.getItem('orbital_cards_mock') || localStorage.getItem('orbital_cards');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              this.state.cards = parsed;
            }
          }
        } catch (e) {}
      }

      this.state.cards = Array.isArray(this.state.cards) ? this.state.cards : [];
      const el = this.el('homeCardCount');
      if (el) el.textContent = this.state.cards.length + '枚のカード';
      if (window.CardSystem) {
        if (typeof CardSystem.renderList === 'function') CardSystem.renderList();
        if (typeof CardSystem.renderRecent === 'function') CardSystem.renderRecent();
      }
      if (window.DeckSystem) {
        if (typeof DeckSystem.syncCardPool === 'function') DeckSystem.syncCardPool();
      }
    },

    parseGitHubRawBaseUrl(inputStr) {
      if (!inputStr) return null;
      let clean = String(inputStr).trim();
      if (!clean) return null;

      // https://raw.githubusercontent.com/owner/repo/branch/
      if (clean.includes('raw.githubusercontent.com')) {
        return clean.endsWith('/') ? clean : clean + '/';
      }

      // https://github.com/owner/repo or owner/repo
      clean = clean.replace(/^https?:\/\/github\.com\//i, '');
      clean = clean.replace(/\/$/, '');
      const parts = clean.split('/');
      if (parts.length >= 2) {
        const owner = parts[0];
        const repo = parts[1];
        const branch = parts[3] || 'main';
        return 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/' + branch + '/';
      }
      return null;
    },

    loadFromGitHub: async function(repoInput, showToast = true) {
      const baseUrl = this.parseGitHubRawBaseUrl(repoInput);
      if (!baseUrl) {
        if (showToast) this.toast('有効なGitHubリポジトリURL（例: owner/repository）を入力してください。', true);
        return false;
      }

      if (showToast) this.toast('🐙 GitHubリポジトリからデータを同期中…');
      const countEl = this.el('homeCardCount');
      if (countEl) countEl.textContent = 'GitHub同期中…';

      const fetchWithTimeout = async (url, timeoutMs = 4000) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(timer);
          return res;
        } catch (e) {
          clearTimeout(timer);
          throw e;
        }
      };

      try {
        const cardsUrl = baseUrl + 'cards.json';
        const cardsRes = await fetchWithTimeout(cardsUrl, 4000);
        if (!cardsRes.ok) {
          throw new Error('cards.json の取得に失敗しました (HTTP ' + cardsRes.status + ')');
        }
        let cardsData = await cardsRes.json();
        if (!Array.isArray(cardsData) && cardsData && Array.isArray(cardsData.cards)) {
          cardsData = cardsData.cards;
        }

        if (Array.isArray(cardsData) && cardsData.length > 0) {
          cardsData = cardsData.map(c => {
            if (!c) return c;
            let img = String(c.image || '').trim();
            if (img && !img.startsWith('http') && !img.startsWith('data:')) {
              img = baseUrl + img.replace(/^\//, '');
            }
            return { ...c, image: img };
          });

          this.state.cards = this.normalizeCardData(cardsData);
          localStorage.setItem('ORBITAL_GITHUB_REPO', repoInput);
          if (countEl) countEl.textContent = this.state.cards.length + '枚 (GitHub同期)';

          if (window.CardSystem) {
            if (typeof CardSystem.renderList === 'function') CardSystem.renderList();
            if (typeof CardSystem.renderRecent === 'function') CardSystem.renderRecent();
            if (typeof CardSystem.renderCollectionPage === 'function' && this.state.page === 'collection') CardSystem.renderCollectionPage();
          }
          if (window.DeckSystem && typeof DeckSystem.syncCardPool === 'function') {
            DeckSystem.syncCardPool();
          }
        } else {
          throw new Error('cards.json のデータ形式が無効です');
        }

        // デッキデータ (decks.json) の同期
        try {
          const decksUrl = baseUrl + 'decks.json';
          const decksRes = await fetchWithTimeout(decksUrl, 3000);
          if (decksRes.ok) {
            let decksData = await decksRes.json();
            if (!Array.isArray(decksData) && decksData && Array.isArray(decksData.decks)) {
              decksData = decksData.decks;
            }
            if (Array.isArray(decksData) && window.DeckSystem) {
              window.DeckSystem.state.decks = decksData;
              if (typeof window.DeckSystem.renderDeckList === 'function') window.DeckSystem.renderDeckList();
            }
          }
        } catch (e) {
          console.warn('decks.json fetch info:', e);
        }

        // パック設定 (packs.json) の同期
        try {
          const packsUrl = baseUrl + 'packs.json';
          const packsRes = await fetchWithTimeout(packsUrl, 3000);
          if (packsRes.ok) {
            let packsData = await packsRes.json();
            if (!Array.isArray(packsData) && packsData && Array.isArray(packsData.packs)) {
              packsData = packsData.packs;
            }
            if (Array.isArray(packsData) && packsData.length > 0) {
              this.state.packs = packsData;
              try { localStorage.setItem('ORBITAL_CUSTOM_PACKS', JSON.stringify(packsData)); } catch(e) {}
              if (typeof this.renderPackGrid === 'function') this.renderPackGrid();
            }
          }
        } catch (e) {
          console.warn('packs.json fetch info:', e);
        }

        // 最新システムスタイル (CSS.html) の動的適用
        try {
          const cssUrl = baseUrl + 'CSS.html';
          const cssRes = await fetchWithTimeout(cssUrl, 3000);
          if (cssRes.ok) {
            const cssText = await cssRes.text();
            let styleTag = document.getElementById('github-dynamic-system-css');
            if (!styleTag) {
              styleTag = document.createElement('style');
              styleTag.id = 'github-dynamic-system-css';
              document.head.appendChild(styleTag);
            }
            const cleanCss = cssText.replace(/<\/?script[^>]*>/gi, '').replace(/<\/?style[^>]*>/gi, '');
            styleTag.textContent = cleanCss;
            console.log('✅ GitHubからの最新CSSシステムスタイルの動的適用に成功しました');
          }
        } catch (e) {
          console.warn('CSS.html dynamic sync info:', e);
        }

        if (showToast) this.toast('✅ GitHubからのシステム・データ全体同期に成功しました！');
        return true;
      } catch (err) {
        console.error('loadFromGitHub error:', err);
        // エラー時は壊れたリポジトリ設定をlocalStorageから自動消去し、無限ループを回避
        try { localStorage.removeItem('ORBITAL_GITHUB_REPO'); } catch (e) {}

        if (showToast) {
          this.toast('❌ GitHub同期エラー: ' + err.message + ' (ローカルデータに復帰)', true);
        }
        this.loadDefaultLocalCards();
        return false;
      }
    },

    bindAccountProfileModal() {

      const closeBtn = this.el('closeAccountModalBtn');
      const saveBtn = this.el('saveAccountProfileBtn');
      const createOrSwitchBtn = this.el('createOrSwitchAccountBtn');

        topbarBadge.addEventListener('click', () => this.openAccountProfileModal());
      }
      if (closeBtn) {
        closeBtn.addEventListener('click', () => this.closeAccountProfileModal());
      }

          if (e.target === modal || e.target.classList.contains('modal-backdrop')) {
            this.closeAccountProfileModal();
          }

        });

          e.preventDefault();
          this.saveAccountProfile();

      }

      modal.style.display = 'grid';

      const saveBtn = this.el('saveAccountProfileBtn');

        saveAccountProfile() {
      const email = (this.el('accEmailInput')?.value || '').trim().toLowerCase();
      const password = (this.el('accPasswordInput')?.value || '').trim();
      const displayName = (this.el('accDisplayNameInput')?.value || '').trim();
      const activeAvatarBtn = this.el('avatarSelectorGrid')?.querySelector('.avatar-opt.active');
      const avatar = activeAvatarBtn ? (activeAvatarBtn.dataset.avatar || activeAvatarBtn.getAttribute('data-avatar') || activeAvatarBtn.textContent.trim() || '👤') : '👤';

      if (!email || !email.includes('@')) {
        this.toast('有効なGmailアドレスを入力してください。', true);
        return;
      }
      if (!displayName) {
        this.toast('アカウント表示名を入力してください。', true);
        return;
      }

      const saveBtn = this.el('saveAccountProfileBtn');
      if (saveBtn) saveBtn.disabled = true;

      try {
        localStorage.setItem('orbital_mock_user_email', email);
        if (password) localStorage.setItem('orbital_mock_user_password', password);
        localStorage.setItem('ORBITAL_HAS_LOGGED_IN', 'true');
      } catch (e) {}

      const profileObj = { email, displayName, avatar, password };

      const self = this;
      const applyProfile = (prof) => {
        if (saveBtn) saveBtn.disabled = false;
        self.state.userProfile = prof;
        if (window.DeckSystem && window.DeckSystem.state) {
          window.DeckSystem.state.currentUser = prof;
          if (typeof window.DeckSystem.updateUserBadge === 'function') {
            window.DeckSystem.updateUserBadge();
          }
          if (typeof window.DeckSystem.loadDecks === 'function') {
            window.DeckSystem.loadDecks();
          }
        }
        self.toast('アカウント情報を更新・ログインしました！ (' + (prof.displayName || displayName) + ')');
        self.closeAccountProfileModal();
      };

      if (window.google && google.script && google.script.run && !window._is_mock_gas && typeof google.script.run.saveUserProfile === 'function') {
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.ok && res.profile) {
              applyProfile(res.profile);
            } else {
              applyProfile(profileObj);
            }
          })
          .withFailureHandler((err) => {
            applyProfile(profileObj);
          })
          .saveUserProfile(profileObj);
      } else {
        applyProfile(profileObj);
      }
    },

    renderAccountSwitchList() {

        });

    createOrSwitchAccount() {

    switchToAccount(targetEmail) {
      const email = String(targetEmail || '').trim().toLowerCase();
      if (!email) return;

      try {
        localStorage.setItem('orbital_mock_user_email', email);
      } catch (e) {}

      const self = this;
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler((prof) => {
          if (window.DeckSystem && window.DeckSystem.state) {
            window.DeckSystem.state.currentUser = prof;
            if (typeof window.DeckSystem.updateUserBadge === 'function') {
              window.DeckSystem.updateUserBadge();
            }
            if (typeof window.DeckSystem.loadDecks === 'function') {
              window.DeckSystem.loadDecks();
            }
          }
          self.toast('アカウントを「' + (prof.displayName || email) + '」に切り替えました！');
          self.closeAccountProfileModal();
        }).getUserProfile(email);
      } else {
        try {
          var raw = localStorage.getItem('orbital_mock_users');
          var users = raw ? JSON.parse(raw) : [];
          var u = users.find(x => String(x.email).toLowerCase() === email);
          if (!u) {
            u = { email: email, displayName: email.split('@')[0], avatar: '👤', createdAt: new Date().toISOString() };
            users.push(u);
            localStorage.setItem('orbital_mock_users', JSON.stringify(users));
          }
          const prof = { email: u.email, displayName: u.displayName, avatar: u.avatar || '👤', isLoggedIn: true };
          if (window.DeckSystem && window.DeckSystem.state) {
            window.DeckSystem.state.currentUser = prof;
            if (typeof window.DeckSystem.updateUserBadge === 'function') {
              window.DeckSystem.updateUserBadge();
            }
            if (typeof window.DeckSystem.loadDecks === 'function') {
              window.DeckSystem.loadDecks();
            }
          }
          self.toast('アカウントを「' + (prof.displayName || email) + '」に切り替えました！');
          self.closeAccountProfileModal();
        } catch (e) {
          self.toast('アカウント切替失敗: ' + e.message, true);
        }
      }
    },

    initNmtAndPacks() {
      this.updateNmtBadge();
      this.loadPacks();
      // 今日のログインボーナスが未取得の場合、自動的に大型モータルをポップアップ表示！
      const today = new Date().toISOString().slice(0, 10);
      let lastClaim = '';
      try { lastClaim = localStorage.getItem('ORBITAL_LAST_DAILY_BONUS') || ''; } catch(e) {}
      if (lastClaim !== today) {
        setTimeout(() => {
          this.openDailyBonusModal();
        }, 800);
      }
    },

    updateNmtBadge() {
      try {
        localStorage.setItem('ORBITAL_NMT_BALANCE', String(this.state.nmtBalance));
      } catch (e) {}
      const valEl = this.el('nmtBalanceVal');
      if (valEl) {
        valEl.textContent = this.state.nmtBalance + ' NMT';
      }
      const today = new Date().toISOString().slice(0, 10);
      let lastClaim = '';
      try { lastClaim = localStorage.getItem('ORBITAL_LAST_DAILY_BONUS') || ''; } catch(e) {}
      const claimBtn = this.el('dailyBonusClaimBtn');
      if (claimBtn) {
        if (lastClaim === today) {
          claimBtn.textContent = '取得済み';
          claimBtn.style.opacity = '0.6';
        } else {
          claimBtn.textContent = 'デイリーボーナス!';
          claimBtn.style.opacity = '1';
        }
      }
    },

    getDailyBonusRewards() {
      return [
        { day: 1, nmt: 1000, pack: 0, icon: '💰', label: '+1000 NMT', desc: '1日目報酬' },
        { day: 2, nmt: 1000, pack: 0, icon: '💰', label: '+1000 NMT', desc: '2日目報酬' },
        { day: 3, nmt: 1000, pack: 1, icon: '🎁', label: '+1000 NMT & 1パック', desc: '3日目パック特典！', special: true },
        { day: 4, nmt: 1000, pack: 0, icon: '💰', label: '+1000 NMT', desc: '4日目報酬' },
        { day: 5, nmt: 1000, pack: 0, icon: '💰', label: '+1000 NMT', desc: '5日目報酬' },
        { day: 6, nmt: 1000, pack: 0, icon: '💰', label: '+1000 NMT', desc: '6日目報酬' },
        { day: 7, nmt: 3000, pack: 2, icon: '🌟', label: '+3000 NMT & 2パック', desc: '7日目豪華大売出し！', special: true }
      ];
    },

    getLoginStreakInfo() {
      const today = new Date().toISOString().slice(0, 10);
      let lastClaim = '';
      let streakDay = 1;
      try {
        lastClaim = localStorage.getItem('ORBITAL_LAST_DAILY_BONUS') || '';
        streakDay = Number(localStorage.getItem('ORBITAL_LOGIN_STREAK_DAY')) || 1;
      } catch(e) {}

      const isClaimedToday = (lastClaim === today);

      if (!isClaimedToday && lastClaim) {
        // 前回取得から1日経過したかのチェック
        const lastDate = new Date(lastClaim);
        const currDate = new Date(today);
        const diffDays = Math.floor((currDate - lastDate) / (1000 * 60 * 60 * 24));

        if (diffDays === 1) {
          // 連続ログイン成功
          streakDay = (streakDay % 7) + 1;
        } else if (diffDays > 1) {
          // リセット
          streakDay = 1;
        }
      }

      return { today, lastClaim, isClaimedToday, streakDay };
    },

    openDailyBonusModal() {
      const modal = this.el('dailyBonusModal');
      if (modal) modal.classList.remove('hidden');
      this.renderDailyBonusStreak();
    },

    renderDailyBonusStreak() {
      const { today, lastClaim, isClaimedToday, streakDay } = this.getLoginStreakInfo();
      const rewards = this.getDailyBonusRewards();
      const grid = this.el('dailyBonusStreakGrid');
      const curReward = rewards[streakDay - 1] || rewards[0];

      const heroIcon = this.el('dailyBonusHeroIcon');
      if (heroIcon) heroIcon.textContent = curReward.icon;

      const amtText = this.el('dailyBonusAmountText');
      if (amtText) amtText.textContent = '+' + curReward.nmt.toLocaleString() + ' NMT' + (curReward.pack > 0 ? ' ＋ 🎁' + curReward.pack + 'パック' : '');

      const subtext = this.el('dailyBonusSubtext');
      if (subtext) subtext.textContent = curReward.desc || 'ゲーム内通貨 NMT ＆ 特典拡張パックで強力なカードをゲット！';

      const btn = this.el('claimBigDailyBonusBtn');
      if (btn) {
        if (isClaimedToday) {
          btn.textContent = '✅ Day ' + streakDay + ' 本日の受取完了 (' + curReward.label + ')';
          btn.style.opacity = '0.6';
          btn.disabled = true;
        } else {
          btn.textContent = '🎁 Day ' + streakDay + ' ボーナスを受け取る！ (' + curReward.label + ')';
          btn.style.opacity = '1';
          btn.disabled = false;
        }
      }

      if (!grid) return;
      grid.innerHTML = rewards.map((r, idx) => {
        const dNum = r.day;
        const isPastClaimed = (dNum < streakDay) || (dNum === streakDay && isClaimedToday);
        const isActiveToday = (dNum === streakDay && !isClaimedToday);
        const isSpecial = r.special;
        const isPack = r.pack > 0;
        const boxClass = isPack ? 'pack-box' : 'coin-box';

        let statusClass = '';
        if (isPastClaimed) statusClass = 'claimed';
        else if (isActiveToday) statusClass = 'active-today';
        if (isSpecial) statusClass += ' special-day';

        const statusPill = isPastClaimed ? '✓ 受取完了' : (isActiveToday ? 'TODAY!' : '未解放');

        return '<div class="streak-day-card ' + statusClass + '">' +
          '<div class="streak-day-top-tag">DAY ' + dNum + (isSpecial ? ' ★' : '') + '</div>' +
          '<div class="streak-day-graphic-box ' + boxClass + '">' +
            '<div class="graphic-icon-emblem">' + r.icon + '</div>' +
            '<div class="graphic-amount-text">+' + r.nmt + '</div>' +
            (isPack ? ('<div class="graphic-pack-text">🎁 +' + r.pack + ' PACK</div>') : '') +
          '</div>' +
          '<div class="streak-day-status-pill">' + statusPill + '</div>' +
        '</div>';
      }).join('');
    },

    closeDailyBonusModal() {
      const modal = this.el('dailyBonusModal');
      if (modal) modal.classList.add('hidden');
    },

    claimDailyBonus() {
      const { today, isClaimedToday, streakDay } = this.getLoginStreakInfo();
      if (isClaimedToday) {
        this.toast('ℹ️ 本日のログインボーナスは取得済みです！明日またご来店ください。');
        return;
      }

      const rewards = this.getDailyBonusRewards();
      const curReward = rewards[streakDay - 1] || rewards[0];

      this.state.nmtBalance += curReward.nmt;
      try {
        localStorage.setItem('ORBITAL_LAST_DAILY_BONUS', today);
        localStorage.setItem('ORBITAL_LOGIN_STREAK_DAY', String(streakDay));
      } catch (e) {}
      this.updateNmtBadge();
      
      this.renderDailyBonusStreak();

      // 金コインエフェクト表示
      this.triggerCoinBurst();

      if (curReward.pack > 0) {
        this.toast('🎉 Day ' + streakDay + ' ボーナス (+' + curReward.nmt + ' NMT ＆ 特典パック ' + curReward.pack + '個) を獲得しました！');
        // 無料パック即時開封体験
        setTimeout(() => {
          this.closeDailyBonusModal();
          const packToOpen = (this.state.packs && this.state.packs.length > 0) ? this.state.packs[0].id : 'pack_standard';
          this.addFreePackTickets(curReward.pack);
          this.showPage('pack');
        }, 1500);
      } else {
        this.toast('🎉 Day ' + streakDay + ' ボーナス (+' + curReward.nmt + ' NMT) を獲得しました！');
        setTimeout(() => this.closeDailyBonusModal(), 1600);
      }
    },

    triggerCoinBurst() {
      const burst = document.createElement('div');
      burst.style.cssText = 'position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:64px; z-index:10000; pointer-events:none; animation:coinBurstAnim 1.2s ease-out forwards;';
      burst.innerHTML = '💰✨ 🎁✨ 💰✨';
      document.body.appendChild(burst);
      setTimeout(() => { if (burst.parentNode) burst.parentNode.removeChild(burst); }, 1300);
    },

    loadPacks() {
      const self = this;
      const defaultPacks = [
        {
          id: 'pack_standard',
          title: '第1弾: 星界の覚醒 (Standard)',
          description: 'たne・進化ポケモンと基本エネルギー、汎用グッズ・サポートが封入された基本拡張パック！',
          price: 100,
          cardCount: 5,
          image: ''
        },
        {
          id: 'pack_legend',
          title: '第2弾: 時空の覇者 (Legend)',
          description: '強力な伝説のポケモンと強力ワザを持つ進化カード、特殊トレーナーズが封入された特別パック！',
          price: 150,
          cardCount: 5,
          image: ''
        }
      ];

      try {
        var rawLocal = localStorage.getItem('ORBITAL_CUSTOM_PACKS');
        if (rawLocal) {
          var customPacks = JSON.parse(rawLocal);
          if (Array.isArray(customPacks) && customPacks.length > 0) {
            this.state.packs = customPacks;
            this.renderPackGrid();
          }
        }
      } catch (e) {}

      if (!this.state.packs || this.state.packs.length === 0) {
        this.state.packs = defaultPacks;
        this.renderPackGrid();
      }

      if (window.google && google.script && google.script.run && typeof google.script.run.getPacks === 'function') {
        try {
          google.script.run.withSuccessHandler((serverPacks) => {
            if (Array.isArray(serverPacks) && serverPacks.length > 0) {
              self.state.packs = serverPacks;
              try { localStorage.setItem('ORBITAL_CUSTOM_PACKS', JSON.stringify(serverPacks)); } catch(e) {}
              self.renderPackGrid();
            }
          }).withFailureHandler((err) => {
            console.warn('getPacks from server failed, using local packs:', err);
          }).getPacks();
        } catch (e) {
          console.warn('getPacks call warning:', e);
        }
      }
    },

    getUserFreePackTickets() {
      if (this.state.freePackTickets != null) return Number(this.state.freePackTickets);
      try {
        const stored = localStorage.getItem('ORBITAL_FREE_PACK_TICKETS');
        if (stored != null) {
          const val = Number(stored);
          this.state.freePackTickets = val;
          return val;
        }
      } catch(e) {}
      this.state.freePackTickets = 1;
      return 1;
    },

    setUserFreePackTickets(val) {
      val = Math.max(0, Number(val) || 0);
      this.state.freePackTickets = val;
      try { localStorage.setItem('ORBITAL_FREE_PACK_TICKETS', String(val)); } catch(e) {}
      const logboBadge = this.el('packShopLogboTicketVal');
      if (logboBadge) logboBadge.textContent = 'ログボパック: ' + val + '個';
    },

    addFreePackTickets(count = 1) {
      const current = this.getUserFreePackTickets();
      this.setUserFreePackTickets(current + count);
    },

    openLogboPack() {
      const tickets = this.getUserFreePackTickets();
      if (tickets <= 0) {
        this.toast('ログボパックの所持チケットがありません。ログインボーナスで獲得してください！', true);
        this.openDailyBonusModal();
        return;
      }
      this.setUserFreePackTickets(tickets - 1);
      const targetPackId = (this.state.packs && this.state.packs.length > 0) ? this.state.packs[0].id : 'pack_standard';
      this.toast('🎁 ログインボーナス特別パックを開封します！');
      this.buyAndOpenPack(targetPackId, true);
      this.renderPackGrid();
    },

    renderPackGrid() {
      const grid = this.el('packListGrid');
      if (!grid) return;
      const packs = this.state.packs || [];
      if (packs.length === 0) {
        grid.innerHTML = '<div class="muted" style="text-align:center; padding:30px;">パックが登録されていません</div>';
        return;
      }

      const freeTickets = this.getUserFreePackTickets();
      const logboBadge = this.el('packShopLogboTicketVal');
      if (logboBadge) logboBadge.textContent = 'ログボパック: ' + freeTickets + '個';

      const logboCardHtml =
        '<div class="pack-card" style="border: 2px solid #fbbf24; background: linear-gradient(135deg, rgba(251,191,36,0.18), rgba(217,70,239,0.18)); box-shadow: 0 0 25px rgba(251,191,36,0.35); position:relative;">' +
          '<div class="single-shop-tag" style="background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; font-weight:900;">🎁 ログボ特典</div>' +
          '<div class="pack-cover-wrapper" style="border-color: rgba(251,191,36,0.6);">' +
            '<div class="pack-foil-art" style="color:#fbbf24; filter:drop-shadow(0 0 10px rgba(251,191,36,0.8));">🌟</div>' +
            '<div class="pack-foil-header" style="color:#fbbf24;">ログインボーナス</div>' +
          '</div>' +
          '<div class="pack-title" style="color:#fbbf24; font-weight:900;">🎁 ログインボーナス特別パック</div>' +
          '<div class="pack-desc">ログインボーナスで獲得した特別無料パック！激レアカードをゲットしよう！</div>' +
          '<div class="pack-price-tag" style="color:#fbbf24;">✨ 所持チケット: <strong>' + freeTickets + '</strong> 個</div>' +
          (freeTickets > 0 ? (
            '<button class="pack-buy-btn" type="button" style="background: linear-gradient(135deg, #fbbf24, #f59e0b); color:#0b0f19; font-weight:900; box-shadow:0 6px 20px rgba(251,191,36,0.5);" onclick="App.openLogboPack()">' +
              '✨ 無料でパック開封！ (残り ' + freeTickets + '個)' +
            '</button>'
          ) : (
            '<button class="pack-buy-btn" type="button" style="opacity: 0.7; cursor: pointer; background: rgba(255,255,255,0.12);" onclick="App.openDailyBonusModal()">' +
              '🔒 チケットなし (ログボでGET)' +
            '</button>'
          )) +
        '</div>';

      const customPacksHtml = packs.map(p => {
      const coverArt = p.image ? ('<img src="' + this.escapeHtml(p.image) + '" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">') : ('<div class="pack-foil-art">✦</div><div class="pack-foil-header">' + this.escapeHtml(p.title) + '</div>');
        return '\n          <div class="pack-card">\n            <div class="pack-cover-wrapper">\n              ' + (coverArt) + '\n            </div>\n            <div class="pack-title">' + (this.escapeHtml(p.title)) + '</div>\n            <div class="pack-desc">' + (this.escapeHtml(p.description || '5枚のカードを収録')) + '</div>\n            <div class="pack-price-tag">✨ ' + (p.price || 100) + ' NMT</div>\n            <button class="pack-buy-btn" type="button" onclick="App.buyAndOpenPack(\'' + (p.id) + '\')">🎁 ' + (p.price || 100) + ' NMT で開封</button>\n          </div>\n        ';
      }).join('');
      grid.innerHTML = logboCardHtml + customPacksHtml;
    },

    getCardTypeEmblem(type) {
      const t = String(type || '').trim();
      if (t.includes('雷') || t.includes('電')) return '⚡';
      if (t.includes('炎') || t.includes('火')) return '🔥';
      if (t.includes('水')) return '💧';
      if (t.includes('草') || t.includes('葉')) return '🌿';
      if (t.includes('超') || t.includes('エスパー')) return '👁️';
      if (t.includes('闘') || t.includes('格闘')) return '👊';
      if (t.includes('悪') || t.includes('闇')) return '💀';
      if (t.includes('鋼') || t.includes('鉄')) return '⚙️';
      return '◇';
    },

    buyAndOpenPack(packId, isFree = false) {
      const pack = (this.state.packs || []).find(p => p.id === packId) || (this.state.packs && this.state.packs[0]);
      if (!pack) {
        this.toast('指定されたパックが見つかりません', true);
        return;
      }

      if (!isFree) {
        if (this.state.nmtBalance < pack.price) {
        this.toast('❌ NMTが足りません！ (必要: ' + pack.price + ' NMT / 所持: ' + this.state.nmtBalance + ' NMT) 毎日ログインボーナスを取得してください。', true);
          return;
        }

        this.state.nmtBalance -= pack.price;
        this.updateNmtBadge();
      }

      // カードプールからランダムにカードを抽選 (パック設定済みの収録対象カードプールを優先)
      const allCards = this.getAllCards();
      let targetPool = allCards;
      if (Array.isArray(pack.cardPool) && pack.cardPool.length > 0) {
        const filtered = allCards.filter(c => pack.cardPool.includes(c.id) || pack.cardPool.includes(c.name));
        if (filtered.length > 0) targetPool = filtered;
      }

      const count = pack.cardCount || 5;
      const drawnCards = [];

      if (targetPool.length > 0) {
        for (let i = 0; i < count; i++) {
          const randCard = targetPool[Math.floor(Math.random() * targetPool.length)];
          drawnCards.push(JSON.parse(JSON.stringify(randCard)));
        }
      } else {
        // デフォルトサンプルカード生成
        for (let i = 0; i < count; i++) {
          drawnCards.push({
            id: 'drawn_' + Date.now() + '_' + i,
            name: 'キラカード ' + (i + 1) + '号',
            category: 'たね',
            type: '無色',
            hp: 80,
            attack1Name: 'スターバースト',
            attack1Damage: 40,
            rarity: (i === 4 ? 'UR' : (i === 3 ? 'SR' : (i === 2 ? 'R' : 'N')))
          });
        }
      }

      this.state.activeDrawnCards = drawnCards;

      // 獲得したカードをCardSystemのカスタムカードに登録し、所持状態にする
      if (window.CardSystem && typeof CardSystem.addCardsToCollection === 'function') {
        CardSystem.addCardsToCollection(drawnCards);
      } else if (window.CardSystem && Array.isArray(CardSystem.customCards)) {
        drawnCards.forEach(c => {
          if (!CardSystem.customCards.some(x => x.id === c.id)) {
            CardSystem.customCards.push(c);
          }
        });
        try { localStorage.setItem('ORBITAL_CUSTOM_CARDS', JSON.stringify(CardSystem.customCards)); } catch(e) {}
      }

      this.openPackOpeningModal(pack);
    },

    openPackOpeningModal(pack) {
      const titleEl = this.el('packFoilTitle');
      if (titleEl) titleEl.textContent = pack.title || '拡張パック';
      const stageVis = this.el('packStageVisual');
      const revealStage = this.el('packRevealStage');
      if (stageVis) stageVis.style.display = 'flex';
      if (revealStage) revealStage.classList.add('hidden');
      const modal = this.el('packOpeningOverlay');
      if (modal) modal.classList.remove('hidden');
    },

    triggerPackTear() {
      const stageVis = this.el('packStageVisual');
      const revealStage = this.el('packRevealStage');
      if (stageVis) stageVis.style.display = 'none';
      if (revealStage) revealStage.classList.remove('hidden');

      const container = this.el('pokepokeCardsFanContainer');
      if (!container) return;

      const drawn = this.state.activeDrawnCards || [];
      container.innerHTML = drawn.map((card, idx) => {
        const rarityClass = card.rarity ? 'rarity-aura-' + (card.rarity) : '';
        const rot = (idx - 2) * 6;
        const transY = Math.abs(idx - 2) * 8;
        const cardHtml = (window.CardSystem && typeof window.CardSystem.createCardHtml === 'function') ?
          window.CardSystem.createCardHtml(card, { size: 'normal' }) :
          ('<div style="padding:10px; color:#fff; text-align:center;">' + this.escapeHtml(card.name) + '</div>');

        return `
          <div class="pokepoke-card-item ${rarityClass}" style="transform: rotate(${rot}deg) translateY(${transY}px); z-index:${10 + idx};" onclick="App.flipPokepokeCard(this, ${idx})">
            <div class="pokepoke-card-inner">
              <div class="pokepoke-card-back">
                <div style="font-size:36px; color:#ffd700;">◇</div>
                <div style="font-size:10px; color:#ffd700; font-weight:800; margin-top:6px; letter-spacing:1px;">ORCEIN CARD</div>
              </div>
              <div class="pokepoke-card-front" style="padding:0; border:none; background:transparent;">
                ${cardHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');
    },

    flipPokepokeCard(el, idx) {
      if (!el) return;
      const inner = el.querySelector('.pokepoke-card-inner');
      const card = (this.state.activeDrawnCards || [])[idx];
      if (!inner) return;

      if (inner.classList.contains('flipped')) {
        if (card && window.CardSystem && typeof window.CardSystem.showDetail === 'function') {
          window.CardSystem.showDetail(card);
        }
        return;
      }

      inner.classList.add('flipped');
      if (!card) return;

      if (card.rarity === 'UR' || card.rarity === 'SR') {
        const glow = document.createElement('div');
        glow.className = 'ur-glow-effect';
        document.body.appendChild(glow);
        setTimeout(() => { if (glow.parentNode) glow.parentNode.removeChild(glow); }, 1500);
        this.toast('🌟 ULTRA RARE！【' + card.name + '】を引き当てました！');
      } else if (card.rarity === 'R') {
        this.toast('✨ RARE！【' + card.name + '】を手に入れました！');
      }
    },

      if (e && e.preventDefault) e.preventDefault();

      const title = this.el('adminPackTitle').value.trim();
      const price = Number(this.el('adminPackPrice').value) || 100;
      const description = this.el('adminPackDesc').value.trim();
      const image = this.el('adminPackImage').value.trim();
      const cardCount = Number(this.el('adminPackCardCount').value) || 5;

      const sel = this.el('adminPackCardPool');
      const cardPool = sel ? Array.from(sel.selectedOptions).map(o => o.value) : [];

      if (!title) {
        this.toast('パックタイトルを入力してください', true);
        return;
      }

      const newPack = { id, title, price, description, image, cardCount, cardPool };
      let packs = this.state.packs || [];
      const idx = packs.findIndex(p => p.id === id);
      if (idx >= 0) packs[idx] = newPack;
      else packs.push(newPack);

      this.state.packs = packs;
      try { localStorage.setItem('ORBITAL_CUSTOM_PACKS', JSON.stringify(packs)); } catch(err) {}

      if (window.google && google.script && google.script.run && !window._is_mock_gas) {
        google.script.run.withSuccessHandler(() => {
          App.toast('✅ パックをスプレッドシートDBに保存しました！');
        }).savePack(newPack, this.state.adminToken);

      this.toast('🎁 パックを保存しました！');
      this.resetPackForm();
      this.renderAdminPackTable();
      this.renderPackGrid();

    _tempShopItemCardId: null,

    getDefaultSingleShopItems() {
      return [
        { id: 'shop_1', cardId: 'pk_pika_ex', price: 500, tag: '人気EX' },
        { id: 'shop_2', cardId: 'pk_charizard_ex', price: 1000, tag: '超強力' },

        loadShopAndTradeItemsFromGas() {
      if (!window.google || !google.script || !google.script.run || window._is_mock_gas) return;
      const self = this;
      try {
        if (typeof google.script.run.getSingleShopItems === 'function') {
          google.script.run.withSuccessHandler((items) => {
            if (Array.isArray(items) && items.length > 0) {
              self.state.singleShopItems = items;
              try { localStorage.setItem('ORBITAL_SINGLE_SHOP_ITEMS', JSON.stringify(items)); } catch(e) {}
              self.renderSingleShopGrid();
            }
          }).getSingleShopItems();
        }
        if (typeof google.script.run.getPlayerTradeItems === 'function') {
          google.script.run.withSuccessHandler((items) => {
            if (Array.isArray(items) && items.length > 0) {
              self.state.playerTradeItems = items;
              try { localStorage.setItem('ORBITAL_PLAYER_TRADE_ITEMS', JSON.stringify(items)); } catch(e) {}
              self.updateTradeCountBadge(items.length);
              self.renderPlayerTradeGrid();
            }
          }).getPlayerTradeItems();
        }
      } catch(e) {
        console.warn('loadShopAndTradeItemsFromGas error:', e);
      }
    },

    getSingleShopItems() {
      if (Array.isArray(this.state.singleShopItems)) {
        return this.state.singleShopItems;
      }
      try {
        const stored = localStorage.getItem('ORBITAL_SINGLE_SHOP_ITEMS');
        if (stored !== null) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed)) {
            this.state.singleShopItems = parsed;
            return parsed;
          }
        }
      } catch(e) {}
      const defaults = this.getDefaultSingleShopItems();
      this.state.singleShopItems = defaults;
      try { localStorage.setItem('ORBITAL_SINGLE_SHOP_ITEMS', JSON.stringify(defaults)); } catch(e) {}
      return defaults;
    },

    filterSingleShop(cat, el) {
      this._shopCatFilter = cat;
      document.querySelectorAll('#page-single-shop .card-picker-tab').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');
      this.renderSingleShopGrid();
    },

    renderSingleShopGrid() {
      const container = this.el('singleShopGrid');
      if (!container) return;

      const shopItems = this.getSingleShopItems();
      const allCards = this.getAllCards();
      const searchInput = this.el('singleShopSearchInput');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const catFilter = this._shopCatFilter || 'all';

      const nmtVal = this.getUserNmt();
      const nmtEl = this.el('singleShopNmtVal');
      if (nmtEl) nmtEl.textContent = nmtVal + ' NMT';

      const filtered = shopItems.filter(item => {
        const card = allCards.find(c => c.id === item.cardId) || { id: item.cardId, name: item.cardId, category: 'ポケモン' };
        if (catFilter !== 'all') {
          const cat = (card.category || '').toLowerCase();
          if (catFilter === 'pokemon' && !cat.includes('ポケモン')) return false;
          if (catFilter === 'trainer' && !cat.includes('トレーナー') && !cat.includes('サポート') && !cat.includes('グッズ')) return false;
          if (catFilter === 'energy' && !cat.includes('エネルギー')) return false;
        }
        if (query) {
          const nameMatch = (card.name || '').toLowerCase().includes(query);
          const idMatch = (card.id || '').toLowerCase().includes(query);
          return nameMatch || idMatch;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:60px; color:var(--muted); grid-column:1/-1;">販売中のカードはありません</div>';
        return;
      }

      const isAdmin = this.isAdmin();

      container.innerHTML = filtered.map(item => {
        const card = allCards.find(c => c.id === item.cardId) || { id: item.cardId, name: item.cardId, category: 'ポケモン', rarity: '★' };
        const cardHtml = window.CardSystem && CardSystem.createCardHtml ? CardSystem.createCardHtml(card, { size: 'normal' }) : ('<div>' + this.escapeHtml(card.name) + '</div>');

        const canAfford = nmtVal >= item.price;
        const tagHtml = item.tag ? ('<div class="single-shop-tag">' + this.escapeHtml(item.tag) + '</div>') : '';

        const adminBtns = isAdmin ? (
          '<div class="single-shop-admin-controls">' +
            '<button type="button" class="secondary-button compact-btn" style="flex:1;" onclick="App.openAdminShopItemModal(\'' + this.escapeHtml(item.id) + '\')">編集</button>' +
            '<button type="button" class="secondary-button compact-btn danger-btn" style="flex:1;" onclick="App.deleteShopItem(\'' + this.escapeHtml(item.id) + '\')">削除</button>' +
          '</div>'
        ) : '';

        return '<div class="single-shop-card-item">' +
          tagHtml +
          '<div style="width:100%; display:flex; justify-content:center; margin-top:8px;">' +
            cardHtml +
          '</div>' +
          '<div class="single-shop-price-badge">' +
            '<span>✨</span><span>' + item.price + ' NMT</span>' +
          '</div>' +
          '<button type="button" class="single-shop-buy-btn" ' + (canAfford ? '' : 'disabled style="opacity:0.5; cursor:not-allowed;"') + ' onclick="App.buySingleCard(\'' + this.escapeHtml(item.id) + '\')">' +
            (canAfford ? '🛒 NMTで購入' : 'NMT不足 (' + item.price + ' NMT)') +
          '</button>' +
          adminBtns +
        '</div>';
      }).join('');
    },

    buySingleCard(itemId) {
      const shopItems = this.getSingleShopItems();
      const item = shopItems.find(i => i.id === itemId);
      if (!item) return;

      const nmtVal = this.getUserNmt();
      if (nmtVal < item.price) {
        this.toast('NMTが足りません！ (必要: ' + item.price + ' NMT)', true);
        return;
      }

      const allCards = this.getAllCards();
      const card = allCards.find(c => c.id === item.cardId) || { id: item.cardId, name: item.cardId };

      if (!confirm('「' + card.name + '」を ' + item.price + ' NMT で購入しますか？')) return;

      // Deduct NMT
      this.setUserNmt(nmtVal - item.price);

      // Add to collection
      this.addCardToCollection(item.cardId);

      this.toast('✨ 「' + card.name + '」を ' + item.price + ' NMT で購入し、コレクションに追加しました！');
      this.renderSingleShopGrid();
      this.updateNmtDisplays();
    },

    getUserNmt() {
      if (this.state.userProfile && this.state.userProfile.nmt != null) return Number(this.state.userProfile.nmt);
      if (this.state.nmt != null) return Number(this.state.nmt);
      try {
        const stored = localStorage.getItem('ORBITAL_NMT_BALANCE');
        if (stored) return Number(stored);
      } catch(e) {}
      return 1000;
    },

    setUserNmt(val) {
      val = Math.max(0, Number(val) || 0);
      if (!this.state.userProfile) this.state.userProfile = {};
      this.state.userProfile.nmt = val;
      this.state.nmt = val;
      try { localStorage.setItem('ORBITAL_NMT_BALANCE', String(val)); } catch(e) {}
      this.updateNmtDisplays();

      if (window.google && google.script && google.script.run && !window._is_mock_gas) {
        try {
          const email = (this.state.userProfile && this.state.userProfile.email) ? this.state.userProfile.email : (localStorage.getItem('orbital_mock_user_email') || 'player@gmail.com');
          google.script.run.saveUserNmtBalance(email, val);
        } catch(e) {}
      }
    },

    updateNmtDisplays() {
      const val = this.getUserNmt();
      const valText = val + ' NMT';
      ['nmtBalanceVal', 'singleShopNmtVal'].forEach(id => {
        const el = this.el(id);
        if (el) el.textContent = valText;
      });
    },

    addCardToCollection(cardId) {
      let col = this.state.userCollection || {};
      col[cardId] = (col[cardId] || 0) + 1;
      this.state.userCollection = col;
      try { localStorage.setItem('ORBITAL_USER_COLLECTION', JSON.stringify(col)); } catch(e) {}

      if (window.google && google.script && google.script.run && !window._is_mock_gas) {
        try {
          const email = (this.state.userProfile && this.state.userProfile.email) ? this.state.userProfile.email : (localStorage.getItem('orbital_mock_user_email') || 'player@gmail.com');
          google.script.run.saveUserCollection(col, email);
        } catch(e) {}
      }
    },
