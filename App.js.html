    renderCurrentPackReveal() {
      const container = this.el('pokepokeCardsFanContainer');
      const summaryContainer = this.el('tenRenSummaryContainer');
      const noticeEl = this.el('tenRenProgressNotice');
      const nextBtn = this.el('nextPackBtn');
      const quickBtn = this.el('tenRenQuickRevealBtn');
      const revealAllBtn = this.el('revealAllCardsBtn');
      const closeBtn = this.el('closePackOpeningBtn');
      const headingTitle = this.el('packRevealTitle');

      if (summaryContainer) summaryContainer.classList.add('hidden');
      if (container) container.classList.remove('hidden');

      const is10 = !!this.state.is10RenPull;
      let drawn = [];

      if (is10) {
        const pIdx = this.state.tenRenCurrentPackIndex || 0;
        drawn = (this.state.tenRenPacks && this.state.tenRenPacks[pIdx]) || [];
        this.state.activeDrawnCards = drawn;

        if (noticeEl) {
          noticeEl.classList.remove('hidden');
          noticeEl.innerHTML = `<span style="color:#fbbf24; font-weight:900;">🔥 10連開封: パック ${pIdx + 1} / 10</span> <span style="margin-left:8px; color:#fef08a; font-size:12px;">(★ ex以上2枚確定保証)</span>`;
        }
        if (headingTitle) headingTitle.textContent = `✨ パック ${pIdx + 1} / 10 をめくろう！`;
        if (nextBtn) {
          nextBtn.classList.remove('hidden');
          if (pIdx < 9) {
            nextBtn.textContent = `次のパックへ ➔ (${pIdx + 2}/10)`;
            nextBtn.onclick = () => this.next10RenPack();
          } else {
            nextBtn.textContent = `🎉 全50枚の結果一覧を見る ➔`;
            nextBtn.onclick = () => this.show10RenSummary();
          }
        }
        if (quickBtn) quickBtn.classList.remove('hidden');
        if (closeBtn) closeBtn.classList.add('hidden');
      } else {
        drawn = this.state.activeDrawnCards || [];
        if (noticeEl) noticeEl.classList.add('hidden');
        if (headingTitle) headingTitle.textContent = '✨ カードを1枚ずつタップしてめくろう！';
        if (nextBtn) nextBtn.classList.add('hidden');
        if (quickBtn) quickBtn.classList.add('hidden');
        if (closeBtn) closeBtn.classList.remove('hidden');
      }

      if (revealAllBtn) revealAllBtn.classList.remove('hidden');

      if (!container) return;

      container.innerHTML = drawn.map((card, idx) => {
        const rarityClass = card.rarity ? 'rarity-aura-' + (card.rarity) : '';
        const rot = (idx - 2) * 6;
        const transY = Math.abs(idx - 2) * 8;
        const cardHtml = (window.CardSystem && typeof window.CardSystem.createCardHtml === 'function') ?
          window.CardSystem.createCardHtml(card, { size: 'normal' }) :
          ('<div style="padding:10px; color:#fff; text-align:center;">' + this.escapeHtml(card.name) + '</div>');

        return `
          <div class="pokepoke-card-item ${rarityClass}" style="transform: rotate(${rot}deg) translateY(${transY}px); z-index:${10 + idx};" onclick="App.flipPokepokeCard(this, ${idx})">
            <div class="pokepoke-card-inner">
              <div class="pokepoke-card-back">
                <div style="font-size:36px; color:#ffd700;">◇</div>
                <div style="font-size:10px; color:#ffd700; font-weight:800; margin-top:6px; letter-spacing:1px;">ORCEIN CARD</div>
              </div>
              <div class="pokepoke-card-front" style="padding:0; border:none; background:transparent;">
                ${cardHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');
    },

    next10RenPack() {
      const current = this.state.tenRenCurrentPackIndex || 0;
      if (current < 9) {
        this.state.tenRenCurrentPackIndex = current + 1;
        this.renderCurrentPackReveal();
      } else {
        this.show10RenSummary();
      }
    },

    show10RenSummary() {
      const fanContainer = this.el('pokepokeCardsFanContainer');
      const summaryContainer = this.el('tenRenSummaryContainer');
      const noticeEl = this.el('tenRenProgressNotice');
      const nextBtn = this.el('nextPackBtn');
      const quickBtn = this.el('tenRenQuickRevealBtn');
      const revealAllBtn = this.el('revealAllCardsBtn');
      const closeBtn = this.el('closePackOpeningBtn');
      const headingTitle = this.el('packRevealTitle');

      if (fanContainer) fanContainer.classList.add('hidden');
      if (summaryContainer) summaryContainer.classList.remove('hidden');
      if (nextBtn) nextBtn.classList.add('hidden');
      if (quickBtn) quickBtn.classList.add('hidden');
      if (revealAllBtn) revealAllBtn.classList.add('hidden');
      if (closeBtn) closeBtn.classList.remove('hidden');

      const allCards = this.state.all10RenDrawnCards || [];
      const exCards = allCards.filter(c => this.isExOrHigherCard(c));

      if (headingTitle) {
        headingTitle.innerHTML = `🎉 10連開封結果 (全50枚) <span style="font-size:18px; color:#fef08a; margin-left:8px; display:inline-block;">★ ex以上 ${exCards.length}枚 獲得！</span>`;
      }
      if (noticeEl) {
        noticeEl.classList.remove('hidden');
        noticeEl.innerHTML = `<span style="color:#38bdf8; font-weight:800;">カードをクリックすると詳細を確認できます。獲得カードは自動的にコレクションへ保存されました！</span>`;
      }

      if (!summaryContainer) return;

      const cardsHtml = allCards.map((card, idx) => {
        const isEx = this.isExOrHigherCard(card);
        const isAce = card.rarity === 'ACESPEC' || card.isAceSpec;
        const borderClass = isAce ? 'is-ace-card' : (isEx ? 'is-ex-card' : '');
        const badgeHtml = isAce ? '<div class="ten-ren-ex-badge" style="background:linear-gradient(135deg, #f43f5e, #be123c);">💎 ACE SPEC</div>' :
          (isEx ? '<div class="ten-ren-ex-badge">★ ' + (card.rarity || 'ex') + '</div>' : '');

        const cardInner = (window.CardSystem && typeof window.CardSystem.createCardHtml === 'function')
          ? window.CardSystem.createCardHtml(card, { size: 'sm' })
          : `<div style="font-size:12px; font-weight:bold; color:#fff; text-align:center;">${this.escapeHtml(card.name)}</div>`;

        return `
          <div class="ten-ren-card-wrapper ${borderClass}" onclick="CardSystem && CardSystem.showDetail && CardSystem.showDetail(App.state.all10RenDrawnCards[${idx}])" title="${this.escapeHtml(card.name)}">
            ${badgeHtml}
            <div style="width:100%; pointer-events:none;">
              ${cardInner}
            </div>
          </div>
        `;
      }).join('');

      summaryContainer.innerHTML = `
        <div class="ten-ren-summary-grid">
          ${cardsHtml}
        </div>
      `;
    },

    flipPokepokeCard(el, idx) {
      if (!el) return;
      const inner = el.querySelector('.pokepoke-card-inner');
      const card = (this.state.activeDrawnCards || [])[idx];
      if (!inner) return;

      if (inner.classList.contains('flipped')) {
        if (card && window.CardSystem && typeof window.CardSystem.showDetail === 'function') {
          window.CardSystem.showDetail(card);
        }
        return;
      }

      inner.classList.add('flipped');
      if (!card) return;

      if (card.rarity === 'ACESPEC' || card.rarity === 'ACE' || card.isAceSpec) {
        const glow = document.createElement('div');
        glow.className = 'ur-glow-effect';
        glow.style.background = 'radial-gradient(circle, rgba(244,63,94,0.45) 0%, rgba(217,70,239,0.3) 45%, transparent 75%)';
        document.body.appendChild(glow);
        setTimeout(() => { if (glow.parentNode) glow.parentNode.removeChild(glow); }, 1500);
        this.toast('✨ ACE SPEC！【' + card.name + '】を引き当てました！');
      } else if (card.rarity === 'SR' || card.rarity === 'UR') {
        const glow = document.createElement('div');
        glow.className = 'ur-glow-effect';
        document.body.appendChild(glow);
        setTimeout(() => { if (glow.parentNode) glow.parentNode.removeChild(glow); }, 1500);
        this.toast('✨ SUPER RARE！【' + card.name + '】を引き当てました！');
      } else if (card.rarity === 'RR') {
        this.toast('⚡ DOUBLE RARE！【' + card.name + '】を引き当てました！');
      } else if (card.rarity === 'AR') {
        this.toast('🎨 ART RARE！【' + card.name + '】を引き当てました！');
      } else if (card.rarity === 'R') {
        this.toast('🔷 RARE！【' + card.name + '】を手に入れました！');
      }
    },

    revealAllPackCards() {
      const container = this.el('pokepokeCardsFanContainer');
      if (!container) return;
      const items = container.querySelectorAll('.pokepoke-card-item');
      items.forEach((item, i) => {
        setTimeout(() => {
          this.flipPokepokeCard(item, i);
        }, i * 150);
      });
    },

    closePackOpening() {
      const modal = this.el('packOpeningOverlay');
      if (modal) modal.classList.add('hidden');
      this.state.is10RenPull = false;
      this.state.tenRenPacks = [];
      this.state.all10RenDrawnCards = [];
      this.toast('🎉 開封したカードはコレクションに保存されました！');
      if (window.CardSystem && typeof CardSystem.renderCardList === 'function') {
        CardSystem.renderCardList();
      }
    },

    openAdminPackModal() {
      if (!this.isAdmin()) {
        this.requireAdmin();
        return;
      }
      this.populateAdminCardPoolSelect();
      this.resetPackForm();
      const modal = this.el('adminPackModal');
      if (modal) modal.classList.remove('hidden');
      this.renderAdminPackTable();
    },

    populateAdminCardPoolSelect() {
      const sel = this.el('adminPackCardPool');
      if (!sel) return;
      const allCards = this.getAllCards();
      if (allCards.length === 0) {
        sel.innerHTML = '<option value="" disabled>登録されているカードがありません</option>';
        return;
      }
      sel.innerHTML = allCards.map(c =>
        '<option value="' + this.escapeHtml(c.id) + '">[' + this.escapeHtml(c.category || 'カード') + '] ' + this.escapeHtml(c.name) + ' (' + this.escapeHtml(c.type || '無色') + ')</option>'
      ).join('');
    },

    closeAdminPackModal() {
      const modal = this.el('adminPackModal');
      if (modal) modal.classList.add('hidden');
    },

    resetPackForm() {
      this.el('adminPackId').value = '';
      this.el('adminPackTitle').value = '';
      this.el('adminPackPrice').value = '100';
      this.el('adminPackDesc').value = '';
      this.el('adminPackImage').value = '';
      this.el('adminPackCardCount').value = '5';
      this._tempPackCardPool = [];
      this.updatePackCardPoolSummary();
      const saveBtn = this.el('adminPackSaveBtn');
      if (saveBtn) saveBtn.textContent = '💾 パックを保存';
      const statusBadge = this.el('adminPackFormStatus');
      if (statusBadge) {
        statusBadge.textContent = '新規作成';
        statusBadge.style.color = '#d946ef';
        statusBadge.style.borderColor = 'rgba(217,70,239,0.3)';
        statusBadge.style.background = 'rgba(217,70,239,0.15)';
      }
      const sel = this.el('adminPackCardPool');
      if (sel) {
        Array.from(sel.options).forEach(o => o.selected = false);
      }
    },

    handleAdminSavePack(e) {
      if (e && e.preventDefault) e.preventDefault();
      const id = this.el('adminPackId').value || ('pack_' + Date.now());
      const title = this.el('adminPackTitle').value.trim();
      const price = Number(this.el('adminPackPrice').value) || 100;
      const description = this.el('adminPackDesc').value.trim();
      const image = this.el('adminPackImage').value.trim();
      const cardCount = Number(this.el('adminPackCardCount').value) || 5;

      let cardPool = [];
      if (Array.isArray(this._tempPackCardPool) && this._tempPackCardPool.length > 0) {
        cardPool = [...this._tempPackCardPool];
      } else {
        const sel = this.el('adminPackCardPool');
        cardPool = sel ? Array.from(sel.selectedOptions).map(o => o.value) : [];
      }

      if (!title) {
        this.toast('パックタイトルを入力してください', true);
        return;
      }

      const newPack = { id, title, price, description, image, cardCount, cardPool };
      let packs = this.state.packs || [];
      const idx = packs.findIndex(p => p.id === id);
      if (idx >= 0) packs[idx] = newPack;
      else packs.push(newPack);

      this.state.packs = packs;
      try { localStorage.setItem('ORBITAL_CUSTOM_PACKS', JSON.stringify(packs)); } catch(err) {}

      if (window.google && google.script && google.script.run && !window._is_mock_gas) {
        google.script.run.withSuccessHandler(() => {
          App.toast('✅ パックをスプレッドシートDBに保存しました！');
        }).savePack(newPack, this.state.adminToken);
      }

      this.toast('🎁 パックを保存しました！');
      this.resetPackForm();
      this.renderAdminPackTable();
      this.renderPackGrid();
    },

    deleteAdminPack(packId) {
      if (!confirm('このパックを削除してもよろしいですか？')) return;
      this.state.packs = (this.state.packs || []).filter(p => p.id !== packId);
      try { localStorage.setItem('ORBITAL_CUSTOM_PACKS', JSON.stringify(this.state.packs)); } catch(err) {}

      if (window.google && google.script && google.script.run && !window._is_mock_gas) {
        google.script.run.deletePack(packId, this.state.adminToken);
      }

      this.toast('🗑️ パックを削除しました');
      this.renderAdminPackTable();
      this.renderPackGrid();
    },

    renderAdminPackTable() {
      const container = this.el('adminPackTableContainer');
      if (!container) return;
      const packs = this.state.packs || [];
      if (packs.length === 0) {
        container.innerHTML = '<div class="muted">パックが存在しません</div>';
        return;
      }

      const rows = packs.map(p =>
        '<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">' +
          '<td style="padding:6px; font-weight:700;">' + this.escapeHtml(p.title) + '</td>' +
          '<td style="padding:6px; color:#ffd700;">✨ ' + p.price + '</td>' +
          '<td style="padding:6px;">' + (p.cardCount || 5) + '枚</td>' +
          '<td style="padding:6px; font-size:11px; color:#94a3b8;">' + ((p.cardPool && p.cardPool.length > 0) ? (p.cardPool.length + '枚指定') : '全カード対象') + '</td>' +
          '<td style="padding:6px; text-align:right;">' +
            '<button type="button" class="secondary-button compact-btn" onclick="App.editAdminPack(\'' + p.id + '\')">編集</button> ' +
            '<button type="button" class="secondary-button compact-btn danger-btn" onclick="App.deleteAdminPack(\'' + p.id + '\')">削除</button>' +
          '</td>' +
        '</tr>'
      ).join('');

      container.innerHTML =
        '<table style="width:100%; border-collapse:collapse; font-size:13px;">' +
          '<thead>' +
            '<tr style="border-bottom:1px solid rgba(255,255,255,0.2); text-align:left;">' +
              '<th style="padding:6px;">タイトル</th>' +
              '<th style="padding:6px;">価格 (NMT)</th>' +
              '<th style="padding:6px;">枚数</th>' +
              '<th style="padding:6px;">対象カード</th>' +
              '<th style="padding:6px; text-align:right;">操作</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>';
    },

    editAdminPack(packId) {
      const pack = (this.state.packs || []).find(p => p.id === packId);
      if (!pack) return;
      this.el('adminPackId').value = pack.id;
      this.el('adminPackTitle').value = pack.title || '';
      this.el('adminPackPrice').value = pack.price || 100;
      this.el('adminPackDesc').value = pack.description || '';
      this.el('adminPackImage').value = pack.image || '';
      this.el('adminPackCardCount').value = pack.cardCount || 5;

      // 前に収録されていたカードプールを編集対象として引き継ぐ
      const pool = Array.isArray(pack.cardPool) ? [...pack.cardPool] : [];
      this._tempPackCardPool = pool;

      const sel = this.el('adminPackCardPool');
      if (sel) {
        Array.from(sel.options).forEach(o => {
          o.selected = pool.includes(o.value);
        });
      }

      this.updatePackCardPoolSummary();

      const saveBtn = this.el('adminPackSaveBtn');
      if (saveBtn) saveBtn.textContent = '💾 パックを更新';
      const statusBadge = this.el('adminPackFormStatus');
      if (statusBadge) {
        statusBadge.textContent = '「' + (pack.title || 'パック') + '」を編集中';
        statusBadge.style.color = '#38bdf8';
        statusBadge.style.borderColor = 'rgba(56,189,248,0.4)';
        statusBadge.style.background = 'rgba(56,189,248,0.15)';
      }

      const form = this.el('adminPackForm');
      if (form) form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    },

    _tempPackCardPool: [],

    openCardPickerForPackPool() {
      // 編集時は前に収録されていたカードプール（_tempPackCardPool）を初期選択として開く
      const currentSelected = Array.isArray(this._tempPackCardPool) ? [...this._tempPackCardPool] : [];
      if (window.CardSystem && CardSystem.openCardPicker) {
        CardSystem.openCardPicker({
          title: '🎁 パック収録カードプール選択',
          mode: 'multi',
          selectedIds: currentSelected,
          onConfirm: (selectedIds) => {
            App._tempPackCardPool = Array.isArray(selectedIds) ? [...selectedIds] : [];
            App.updatePackCardPoolSummary();
          }
        });
      }
    },

    updatePackCardPoolSummary() {
      const pool = this._tempPackCardPool || [];
      const label = this.el('adminPackPoolCountLabel');
      if (label) {
        label.textContent = pool.length > 0 ? (pool.length + '枚選択中') : '全カード対象';
      }
      const sel = this.el('adminPackCardPool');
      if (sel) {
        Array.from(sel.options).forEach(o => {
          o.selected = pool.includes(o.value);
        });
      }
      this.renderPackCardPoolPreviewChips();
    },

    renderPackCardPoolPreviewChips() {
      const container = this.el('adminPackPoolPreviewContainer');
      const chipsEl = this.el('adminPackPoolCardChips');
      const countEl = this.el('adminPackPoolPreviewCount');
      if (!container || !chipsEl) return;

      const pool = this._tempPackCardPool || [];
      if (countEl) countEl.textContent = pool.length;

      if (pool.length === 0) {
        container.style.display = 'none';
        chipsEl.innerHTML = '';
        return;
      }

      container.style.display = 'block';
      const allCards = this.getAllCards();
      const cardMap = new Map(allCards.map(c => [c.id, c]));

      chipsEl.innerHTML = pool.map(cardId => {
        const card = cardMap.get(cardId);
        const name = card ? card.name : cardId;
        const type = card?.type || '無色';
        const typeColor = this.getCardTypeColor(type);
        return '<div style="display:inline-flex; align-items:center; gap:5px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); padding:3px 8px; border-radius:14px; font-size:11px;">' +
          '<span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:' + typeColor + ';"></span>' +
          '<span style="font-weight:600; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + this.escapeHtml(name) + '</span>' +
          '<button type="button" style="background:none; border:none; color:#ef4444; font-size:12px; cursor:pointer; padding:0 2px; line-height:1;" title="除外" onclick="App.removeCardFromPackPool(\'' + this.escapeHtml(cardId) + '\')">×</button>' +
        '</div>';
      }).join('');
    },

    getCardTypeColor(type) {
      const colors = {
        '草': '#22c55e', '炎': '#ef4444', '水': '#3b82f6', '雷': '#eab308',
        '超': '#a855f7', '闘': '#f97316', '悪': '#64748b', '鋼': '#94a3b8',
        'ドラゴン': '#eab308', '無色': '#a1a1aa'
      };
      return colors[type] || '#a1a1aa';
    },

    removeCardFromPackPool(cardId) {
      if (!Array.isArray(this._tempPackCardPool)) return;
      this._tempPackCardPool = this._tempPackCardPool.filter(id => id !== cardId);
      this.updatePackCardPoolSummary();
    },

    clearPackCardPool() {
      this._tempPackCardPool = [];
      this.updatePackCardPoolSummary();
    },

    /* ============================================================
       シングルカードショップ (Single Card Shop) Logic
       ============================================================ */
    _tempShopItemCardId: null,
    _shopCatFilter: 'all',

    getDefaultSingleShopItems() {
      return [
        { id: 'shop_1', cardId: 'pk_pika_ex', price: 500, tag: '人気EX' },
        { id: 'shop_2', cardId: 'pk_charizard_ex', price: 1000, tag: '超強力' },
        { id: 'shop_3', cardId: 'tr_professor_research', price: 200, tag: '定番' },
        { id: 'shop_4', cardId: 'tr_boss_orders', price: 400, tag: 'おすすめ' },
        { id: 'shop_5', cardId: 'en_lightning', price: 50, tag: '基本エネルギー' }
      ];
    },

        loadShopAndTradeItemsFromGas() {
      if (!window.google || !google.script || !google.script.run || window._is_mock_gas) return;
      const self = this;
      try {
        if (typeof google.script.run.getSingleShopItems === 'function') {
          google.script.run.withSuccessHandler((items) => {
            if (Array.isArray(items) && items.length > 0) {
              self.state.singleShopItems = items;
              try { localStorage.setItem('ORBITAL_SINGLE_SHOP_ITEMS', JSON.stringify(items)); } catch(e) {}
              self.renderSingleShopGrid();
            }
          }).getSingleShopItems();
        }
        if (typeof google.script.run.getPlayerTradeItems === 'function') {
          google.script.run.withSuccessHandler((items) => {
            if (Array.isArray(items) && items.length > 0) {
              self.state.playerTradeItems = items;
              try { localStorage.setItem('ORBITAL_PLAYER_TRADE_ITEMS', JSON.stringify(items)); } catch(e) {}
              self.updateTradeCountBadge(items.length);
              self.renderPlayerTradeGrid();
            }
          }).getPlayerTradeItems();
        }
      } catch(e) {
        console.warn('loadShopAndTradeItemsFromGas error:', e);
      }
    },

    getSingleShopItems() {
      if (Array.isArray(this.state.singleShopItems)) {
        return this.state.singleShopItems;
      }
      try {
        const stored = localStorage.getItem('ORBITAL_SINGLE_SHOP_ITEMS');
        if (stored !== null) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed)) {
            this.state.singleShopItems = parsed;
            return parsed;
          }
        }
      } catch(e) {}
      const defaults = this.getDefaultSingleShopItems();
      this.state.singleShopItems = defaults;
      try { localStorage.setItem('ORBITAL_SINGLE_SHOP_ITEMS', JSON.stringify(defaults)); } catch(e) {}
      return defaults;
    },

    filterSingleShop(cat, el) {
      this._shopCatFilter = cat;
      document.querySelectorAll('#page-single-shop .card-picker-tab').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');
      this.renderSingleShopGrid();
    },

    renderSingleShopGrid() {
      const container = this.el('singleShopGrid');
      if (!container) return;

      const shopItems = this.getSingleShopItems();
      const allCards = this.getAllCards();
      const searchInput = this.el('singleShopSearchInput');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const catFilter = this._shopCatFilter || 'all';

      const nmtVal = this.getUserNmt();
      const nmtEl = this.el('singleShopNmtVal');
      if (nmtEl) nmtEl.textContent = nmtVal + ' NMT';

      const filtered = shopItems.filter(item => {
        const card = allCards.find(c => c.id === item.cardId) || { id: item.cardId, name: item.cardId, category: 'ポケモン' };
        if (catFilter !== 'all') {
          const cat = (card.category || '').toLowerCase();
          if (catFilter === 'pokemon' && (cat.includes('トレーナー') || cat.includes('サポート') || cat.includes('グッズ') || cat.includes('どうぐ') || cat.includes('道具') || cat.includes('スタジアム') || cat.includes('エネルギー'))) return false;
          if (catFilter === 'trainer' && !cat.includes('トレーナー') && !cat.includes('サポート') && !cat.includes('グッズ') && !cat.includes('どうぐ') && !cat.includes('道具') && !cat.includes('スタジアム')) return false;
          if (catFilter === 'energy' && !cat.includes('エネルギー')) return false;
        }
        if (query) {
          const nameMatch = (card.name || '').toLowerCase().includes(query);
          const idMatch = (card.id || '').toLowerCase().includes(query);
          return nameMatch || idMatch;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:60px; color:var(--muted); grid-column:1/-1;">販売中のカードはありません</div>';
        return;
      }

      const isAdmin = this.isAdmin();

      container.innerHTML = filtered.map(item => {
        const card = allCards.find(c => c.id === item.cardId) || { id: item.cardId, name: item.cardId, category: 'ポケモン', rarity: '★' };
        const cardHtml = window.CardSystem && CardSystem.createCardHtml ? CardSystem.createCardHtml(card, { size: 'normal' }) : ('<div>' + this.escapeHtml(card.name) + '</div>');

        const canAfford = nmtVal >= item.price;
        const tagHtml = item.tag ? ('<div class="single-shop-tag">' + this.escapeHtml(item.tag) + '</div>') : '';

        const adminBtns = isAdmin ? (
          '<div class="single-shop-admin-controls">' +
            '<button type="button" class="secondary-button compact-btn" style="flex:1;" onclick="App.openAdminShopItemModal(\'' + this.escapeHtml(item.id) + '\')">編集</button>' +
            '<button type="button" class="secondary-button compact-btn danger-btn" style="flex:1;" onclick="App.deleteShopItem(\'' + this.escapeHtml(item.id) + '\')">削除</button>' +
          '</div>'
        ) : '';

        return '<div class="single-shop-card-item">' +
          tagHtml +
          '<div style="width:100%; display:flex; justify-content:center; margin-top:8px;">' +
            cardHtml +
          '</div>' +
          '<div class="single-shop-price-badge">' +
            '<span>✨</span><span>' + item.price + ' NMT</span>' +
          '</div>' +
          '<button type="button" class="single-shop-buy-btn" ' + (canAfford ? '' : 'disabled style="opacity:0.5; cursor:not-allowed;"') + ' onclick="App.buySingleCard(\'' + this.escapeHtml(item.id) + '\')">' +
            (canAfford ? '🛒 NMTで購入' : 'NMT不足 (' + item.price + ' NMT)') +
          '</button>' +
          adminBtns +
        '</div>';
      }).join('');
    },

    buySingleCard(itemId) {
      const shopItems = this.getSingleShopItems();
      const item = shopItems.find(i => i.id === itemId);
      if (!item) return;

      const nmtVal = this.getUserNmt();
      if (nmtVal < item.price) {
        this.toast('NMTが足りません！ (必要: ' + item.price + ' NMT)', true);
        return;
      }

      const allCards = this.getAllCards();
      const card = allCards.find(c => c.id === item.cardId) || { id: item.cardId, name: item.cardId };

      if (!confirm('「' + card.name + '」を ' + item.price + ' NMT で購入しますか？')) return;

      // Deduct NMT
      this.setUserNmt(nmtVal - item.price);

      // Add to collection
      this.addCardToCollection(item.cardId);

      this.toast('✨ 「' + card.name + '」を ' + item.price + ' NMT で購入し、コレクションに追加しました！');
      this.renderSingleShopGrid();
      this.updateNmtDisplays();
    },

    /* ============================================================
       カード売却所 (Card Sell Shop / Buyback for NMT)
       ============================================================ */
    getSellRates() {
      const DEFAULT_RATES = {
        'N': 10,
        'R': 30,
        'AR': 100,
        'RR': 200,
        'SR': 500,
        'UR': 1000,
        'ACESPEC': 1500,
        'DEFAULT': 10
      };
      try {
        const custom = localStorage.getItem('ORBITAL_SELL_RATES');
        if (custom) return Object.assign({}, DEFAULT_RATES, JSON.parse(custom));
      } catch(e) {}
      return DEFAULT_RATES;
    },

    getCardSellPrice(card) {
      if (!card) return 10;
      const rates = this.getSellRates();
      const rawRarity = String(card.rarity || 'N').toUpperCase().trim();

      if (rates[rawRarity] !== undefined) return rates[rawRarity];

      // レアリティの別名・日本語表記の正規化
      if (['C', 'COMMON', 'ノーマル', 'コモン'].includes(rawRarity)) return rates['N'] || 10;
      if (['U', 'UC', 'UNCOMMON', 'アンコモン', 'レア'].includes(rawRarity)) return rates['R'] || 30;
      if (['ART', 'アートレア', 'AR'].includes(rawRarity)) return rates['AR'] || 100;
      if (['DOUBLE', 'ダブルレア', 'RR'].includes(rawRarity)) return rates['RR'] || 200;
      if (['SUPER', 'SAR', 'HR', 'スーパーレア'].includes(rawRarity)) return rates['SR'] || 500;
      if (['ULTRA', 'ウルトラレア', 'UR'].includes(rawRarity)) return rates['UR'] || 1000;
      if (['ACE', 'ACESPEC', 'エーススペック'].includes(rawRarity) || !!card.isAceSpec) return rates['ACESPEC'] || 1500;

      return rates['DEFAULT'] || 10;
    },

    removeCardFromCollection(cardId, count = 1) {
      count = Math.max(1, Number(count) || 1);
      let col = this.getUserCollection();
      const allCards = this.getAllCards();
      const card = allCards.find(c => String(c.id) === String(cardId) || c.name === cardId);
      const key = card ? String(card.id || card.name) : String(cardId);

      let foundKey = null;
      if (col[key] !== undefined) foundKey = key;
      else if (card && card.name && col[card.name] !== undefined) foundKey = card.name;
      else if (card && card.id && col[card.id] !== undefined) foundKey = card.id;

      if (foundKey) {
        col[foundKey] = Math.max(0, (col[foundKey] || 0) - count);
        if (col[foundKey] <= 0) {
          delete col[foundKey];
        }
      }

      this.state.userCollection = col;
      try { localStorage.setItem('ORBITAL_USER_COLLECTION', JSON.stringify(col)); } catch(e) {}
      if (window.CardSystem && typeof window.CardSystem.saveUserCollection === 'function') {
        window.CardSystem.saveUserCollection(col);
      }
      this.saveUserCollectionToGas(col);
      return col;
    },

    filterSellShopCat(cat, el) {
      this._sellCatFilter = cat || 'all';
      const tabs = document.querySelectorAll('[data-sell-cat]');
      tabs.forEach(t => t.classList.toggle('active', t.dataset.sellCat === this._sellCatFilter));
      this.renderSellShopGrid();
    },

    renderSellShop() {
      this._sellSteppers = this._sellSteppers || {};
      this.updateNmtDisplays();
      this.renderSellShopGrid();
    },

    getSellStepperVal(cardKey, maxCount) {
      this._sellSteppers = this._sellSteppers || {};
      if (this._sellSteppers[cardKey] === undefined) {
        this._sellSteppers[cardKey] = 1;
      }
      return Math.min(maxCount, Math.max(1, Number(this._sellSteppers[cardKey]) || 1));
    },

    adjustSellStepper(cardKey, delta, maxCount) {
      this._sellSteppers = this._sellSteppers || {};
      const current = this.getSellStepperVal(cardKey, maxCount);
      const next = Math.min(maxCount, Math.max(1, current + delta));
      this._sellSteppers[cardKey] = next;

      const valEl = document.getElementById('sellStepperVal_' + cardKey);
      if (valEl) valEl.textContent = next + '枚';

      const allCards = this.getAllCards();
      const card = allCards.find(c => String(c.id || c.name) === String(cardKey));
      if (card) {
        const unitPrice = this.getCardSellPrice(card);
        const subtotalEl = document.getElementById('sellSubtotal_' + cardKey);
        if (subtotalEl) subtotalEl.textContent = '+' + (unitPrice * next).toLocaleString() + ' NMT';
      }
    },

    renderSellShopGrid() {
      const container = this.el('sellShopGrid');
      if (!container) return;

      const colMap = this.getUserCollection();
      const allCards = this.getAllCards();
      const catFilter = this._sellCatFilter || 'all';

      const rarityFilterEl = this.el('sellShopRarityFilter');
      const rarityFilter = rarityFilterEl ? rarityFilterEl.value : '';

      const dupFilterEl = this.el('sellShopDuplicatesFilter');
      const dupFilter = dupFilterEl ? dupFilterEl.value : 'duplicates';

      const sortEl = this.el('sellShopSortSelect');
      const sortKey = sortEl ? sortEl.value : 'count_desc';

      const searchInput = this.el('sellShopSearchInput');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';

      // 所持しているカードを抽出
      const ownedCardsList = [];
      let totalOwnedTypes = 0;
      let totalOwnedCards = 0;

      allCards.forEach(card => {
        const key = String(card.id || card.name);
        const count = colMap[key] || (card.name ? colMap[card.name] : 0) || (card.id ? colMap[card.id] : 0) || 0;
        if (count > 0) {
          totalOwnedTypes++;
          totalOwnedCards += count;
          ownedCardsList.push({
            card,
            key,
            count,
            price: this.getCardSellPrice(card)
          });
        }
      });

      // サマリー表示更新
      const summaryEl = this.el('sellShopCardSummary');
      if (summaryEl) {
        summaryEl.textContent = '所持: ' + totalOwnedTypes + '種類 (計 ' + totalOwnedCards + '枚)';
      }

      // フィルタリング
      const filtered = ownedCardsList.filter(item => {
        const card = item.card;

        // 重複フィルター
        if (dupFilter === 'duplicates' && item.count < 2) return false;

        // カテゴリフィルター
        if (catFilter !== 'all') {
          const cat = (card.category || '').toLowerCase();
          if (catFilter === 'pokemon' && (cat.includes('トレーナー') || cat.includes('サポート') || cat.includes('グッズ') || cat.includes('どうぐ') || cat.includes('道具') || cat.includes('スタジアム') || cat.includes('エネルギー'))) return false;
          if (catFilter === 'trainer' && !cat.includes('トレーナー') && !cat.includes('サポート') && !cat.includes('グッズ') && !cat.includes('どうぐ') && !cat.includes('道具') && !cat.includes('スタジアム')) return false;
          if (catFilter === 'energy' && !cat.includes('エネルギー')) return false;
        }

        // レアリティフィルター
        if (rarityFilter) {
          const r = String(card.rarity || 'N').toUpperCase().trim();
          if (rarityFilter === 'ACESPEC' || rarityFilter === 'ACE') {
            if (r !== 'ACESPEC' && r !== 'ACE' && !card.isAceSpec) return false;
          } else if (r !== rarityFilter) {
            return false;
          }
        }

        // 検索クエリ
        if (query) {
          const nameMatch = (card.name || '').toLowerCase().includes(query);
          const idMatch = (card.id || '').toLowerCase().includes(query);
          return nameMatch || idMatch;
        }

        return true;
      });

      // ソート
      filtered.sort((a, b) => {
        if (sortKey === 'count_desc') return b.count - a.count;
        if (sortKey === 'price_desc') return b.price - a.price;
        if (sortKey === 'name_asc') return (a.card.name || '').localeCompare(b.card.name || '', 'ja');
        if (sortKey === 'rarity_desc') {
          const rarityOrder = { 'ACESPEC': 7, 'ACE': 7, 'UR': 6, 'SR': 5, 'RR': 4, 'AR': 3, 'R': 2, 'N': 1 };
          const rA = rarityOrder[String(a.card.rarity || 'N').toUpperCase()] || 0;
          const rB = rarityOrder[String(b.card.rarity || 'N').toUpperCase()] || 0;
          return rB - rA;
        }
        return 0;
      });

      if (filtered.length === 0) {
        const emptyMsg = dupFilter === 'duplicates'
          ? '売却可能な重複カード（2枚以上所持）はありません。<br><span style="font-size:13px; color:var(--muted);">「すべての所持カード」に切り替えるか、パックを開封してカードを獲得してください。</span>'
          : '条件に一致する所持カードはありません。';
        container.innerHTML = '<div style="text-align:center; padding:60px; color:var(--muted); grid-column:1/-1;">' +
          '<div style="font-size:40px; margin-bottom:12px;">🎴</div>' +
          '<div>' + emptyMsg + '</div>' +
          '<div style="margin-top:20px;"><button type="button" class="primary-button" onclick="App.showPage(\'pack\')">🎁 パックを開封する</button></div>' +
          '</div>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        const card = item.card;
        const key = item.key;
        const ownedCount = item.count;
        const unitPrice = item.price;
        const currentStepper = this.getSellStepperVal(key, ownedCount);
        const subtotal = unitPrice * currentStepper;

        const cardHtml = window.CardSystem && CardSystem.createCardHtml
          ? CardSystem.createCardHtml(card, { size: 'normal' })
          : ('<div class="card-placeholder">' + this.escapeHtml(card.name) + '</div>');

        const rarityBadge = '<span class="sell-rarity-tag rarity-badge-' + this.escapeHtml(card.rarity || 'N') + '">' +
          this.escapeHtml(card.rarity || 'N') + '</span>';

        const ownedBadge = '<div class="sell-owned-tag">所持: ' + ownedCount + '枚</div>';

        const leaveOneBtn = ownedCount > 4
          ? '<button type="button" class="sell-leave-one-btn" style="background:rgba(56,189,248,0.12); border-color:rgba(56,189,248,0.3); color:#38bdf8;" onclick="App.sellAllExtrasOfCard(\'' + this.escapeHtml(key) + '\', 4)" title="4枚残して、余分な ' + (ownedCount - 4) + '枚をまとめて売却します">' +
            '✨ 4枚残して余り(' + (ownedCount - 4) + '枚)を売却' +
            '</button>'
          : (ownedCount > 1
              ? '<button type="button" class="sell-leave-one-btn" onclick="App.sellAllExtrasOfCard(\'' + this.escapeHtml(key) + '\', 1)" title="1枚残して、余分な ' + (ownedCount - 1) + '枚をまとめて売却します">' +
                '✨ 1枚残して余り(' + (ownedCount - 1) + '枚)を売却' +
                '</button>'
              : '');

        return '<div class="sell-shop-card-item" id="sellCardItem_' + this.escapeHtml(key) + '">' +
          ownedBadge +
          rarityBadge +
          '<div style="width:100%; display:flex; justify-content:center; margin-top:14px;">' +
            cardHtml +
          '</div>' +
          '<div class="sell-price-preview">' +
            '<span>💰</span><span id="sellSubtotal_' + this.escapeHtml(key) + '">+' + subtotal.toLocaleString() + ' NMT</span>' +
            '<span class="unit-rate">(@' + unitPrice + ' NMT)</span>' +
          '</div>' +
          '<div class="sell-stepper-box">' +
            '<button type="button" class="sell-stepper-btn" onclick="App.adjustSellStepper(\'' + this.escapeHtml(key) + '\', -1, ' + ownedCount + ')">－</button>' +
            '<span class="sell-stepper-val" id="sellStepperVal_' + this.escapeHtml(key) + '">' + currentStepper + '枚</span>' +
            '<button type="button" class="sell-stepper-btn" onclick="App.adjustSellStepper(\'' + this.escapeHtml(key) + '\', 1, ' + ownedCount + ')">＋</button>' +
          '</div>' +
          '<button type="button" class="sell-execute-btn" onclick="App.executeCardSell(\'' + this.escapeHtml(key) + '\')">' +
            '💰 このカードを売却' +
          '</button>' +
          leaveOneBtn +
        '</div>';
      }).join('');
    },

    executeCardSell(cardKey) {
      const colMap = this.getUserCollection();
      const allCards = this.getAllCards();
      const card = allCards.find(c => String(c.id || c.name) === String(cardKey));
      if (!card) return;

      const owned = colMap[cardKey] || (card.name ? colMap[card.name] : 0) || 0;
      const count = this.getSellStepperVal(cardKey, owned);
      this.sellCard(card.id || cardKey, count);
    },

    sellAllExtrasOfCard(cardKey, keepCount = 4) {
      keepCount = Math.max(1, Number(keepCount) || 4);
      const colMap = this.getUserCollection();
      const allCards = this.getAllCards();
      const card = allCards.find(c => String(c.id || c.name) === String(cardKey));
      if (!card) return;

      const owned = colMap[cardKey] || (card.name ? colMap[card.name] : 0) || 0;
      if (owned <= keepCount) {
        this.toast('余剰カードがありません (所持数: ' + owned + '枚 / ' + keepCount + '枚残し)', true);
        return;
      }
      const excess = owned - keepCount;
      this.sellCard(card.id || cardKey, excess);
    },

    sellCard(cardId, count = 1) {
      count = Math.max(1, Number(count) || 1);
      const colMap = this.getUserCollection();
      const allCards = this.getAllCards();
      const card = allCards.find(c => String(c.id) === String(cardId) || c.name === cardId);
      if (!card) {
        this.toast('カードが見つかりません', true);
        return;
      }

      const key = String(card.id || card.name);
      const owned = colMap[key] || (card.name ? colMap[card.name] : 0) || (card.id ? colMap[card.id] : 0) || 0;
      if (owned < count) {
        this.toast('所持数が足りません (所持: ' + owned + '枚 / 売却希望: ' + count + '枚)', true);
        return;
      }

      const unitPrice = this.getCardSellPrice(card);
      const totalNmt = unitPrice * count;
      const willBeZero = (owned - count === 0);

      const warningZero = willBeZero ? '\n⚠️ 売却するとこのカードの所持数が「0枚」になります。' : '';
      if (!confirm('「' + card.name + '」を ' + count + '枚 売却して、+' + totalNmt.toLocaleString() + ' NMT を獲得しますか？' + warningZero)) {
        return;
      }

      this.removeCardFromCollection(card.id || key, count);
      const curNmt = this.getUserNmt();
      const newNmt = curNmt + totalNmt;
      this.setUserNmt(newNmt);

      this.toast('💰 「' + card.name + '」を ' + count + '枚売却し、+' + totalNmt.toLocaleString() + ' NMT を獲得しました！（所持: ' + newNmt.toLocaleString() + ' NMT）');
      this.renderSellShopGrid();
      this.updateNmtDisplays();
    },

    bulkSellDuplicates(onlyLowRarity = false, keepCount = 4) {
      keepCount = Math.max(1, Number(keepCount) || 4);
      const colMap = this.getUserCollection();
      const allCards = this.getAllCards();

      const toSellList = [];
      let totalNmt = 0;
      let totalCount = 0;

      allCards.forEach(card => {
        const key = String(card.id || card.name);
        const owned = colMap[key] || (card.name ? colMap[card.name] : 0) || (card.id ? colMap[card.id] : 0) || 0;
        if (owned > keepCount) {
          const excess = owned - keepCount;
          const rarity = String(card.rarity || 'N').toUpperCase().trim();
          if (onlyLowRarity) {
            const isLow = ['N', 'C', 'COMMON', 'ノーマル', 'コモン', 'R', 'U', 'UC', 'UNCOMMON', 'アンコモン', 'レア'].includes(rarity);
            if (!isLow) return;
          }
          const price = this.getCardSellPrice(card);
          const subtotal = price * excess;
          toSellList.push({ card, key, count: excess, price, subtotal });
          totalNmt += subtotal;
          totalCount += excess;
        }
      });

      if (toSellList.length === 0) {
        this.toast('売却可能な' + (onlyLowRarity ? '低レア(N/R)' : '') + '重複カードがありません。（すべて' + keepCount + '枚以下の所持です）', true);
        return;
      }

      const label = onlyLowRarity ? '低レア(N/R)の重複カード' : 'すべての重複カード';
      const cardBreakdown = toSellList.slice(0, 5).map(item => '・' + item.card.name + ' × ' + item.count + '枚 (+' + item.subtotal.toLocaleString() + ' NMT)').join('\n') +
        (toSellList.length > 5 ? '\n...他 ' + (toSellList.length - 5) + '種類' : '');

      const confirmMsg = '【' + label + 'の一括売却 (' + keepCount + '枚残し)】\n\n' +
        '対象: ' + toSellList.length + '種類（合計 ' + totalCount + '枚）\n' +
        '獲得予定: +' + totalNmt.toLocaleString() + ' NMT\n\n' +
        '※各カード' + keepCount + '枚（デッキ投入上限）は手元に残ります。\n売却を実行しますか？\n\n' +
        cardBreakdown;

      if (!confirm(confirmMsg)) return;

      toSellList.forEach(item => {
        this.removeCardFromCollection(item.card.id || item.key, item.count);
      });

      const curNmt = this.getUserNmt();
      const newNmt = curNmt + totalNmt;
      this.setUserNmt(newNmt);

      this.toast('🎉 重複カード ' + totalCount + '枚を一括売却しました！（各カード' + keepCount + '枚残し / +' + totalNmt.toLocaleString() + ' NMT）');
      this.renderSellShopGrid();
      this.updateNmtDisplays();
    },

    /* ============================================================
       ユーザー認証 & セッション管理 (Gmail / パスワード)
       ============================================================ */
    isLoggedIn() {
      if (this.state.userProfile && this.state.userProfile.isLoggedIn && this.state.userProfile.email && this.state.userProfile.email.toLowerCase() !== 'player@gmail.com') {
        return true;
      }
      try {
        const stored = localStorage.getItem('ORBITAL_LOGGED_IN_USER');
        if (stored) {
          const user = JSON.parse(stored);
          if (user && user.email && user.email.toLowerCase() !== 'player@gmail.com') {
            this.state.userProfile = Object.assign({ isLoggedIn: true }, user);
            return true;
          } else {
            localStorage.removeItem('ORBITAL_LOGGED_IN_USER');
          }
        }
        const savedEmail = localStorage.getItem('orbital_mock_user_email');
        if (savedEmail && savedEmail.toLowerCase() !== 'player@gmail.com') {
          this.state.userProfile = { email: savedEmail, displayName: savedEmail.split('@')[0], avatar: '👤', isLoggedIn: true };
          return true;
        } else if (savedEmail && savedEmail.toLowerCase() === 'player@gmail.com') {
          localStorage.removeItem('orbital_mock_user_email');
        }
      } catch (e) {}
      return false;
    },

    requireLogin(featureName = 'この機能') {
      if (this.isLoggedIn()) return true;
      this.toast('🔑 ' + featureName + 'をご利用いただくにはGmailアカウントでログインが必要です。', true);
      this.openAuthModal('login');
      return false;
    },

    openAuthModal(tab = 'login') {
      const modal = this.el('authModal');
      if (!modal) return;
      this.switchAuthTab(tab);
      const errEl = this.el('authErrorMsg');
      if (errEl) {
        errEl.textContent = '';
        errEl.classList.add('hidden');
      }
      modal.classList.remove('hidden');
    },

    closeAuthModal() {
      const modal = this.el('authModal');
      if (modal) modal.classList.add('hidden');
    },

    switchAuthTab(tab) {
      const tabLogin = this.el('authTabLogin');
      const tabReg = this.el('authTabRegister');
      const formLogin = this.el('authLoginForm');
      const formReg = this.el('authRegisterForm');

      if (tab === 'register') {
        if (tabLogin) tabLogin.classList.remove('active');
        if (tabReg) tabReg.classList.add('active');
        if (formLogin) formLogin.classList.add('hidden');
        if (formReg) formReg.classList.remove('hidden');
      } else {
        if (tabLogin) tabLogin.classList.add('active');
        if (tabReg) tabReg.classList.remove('active');
        if (formLogin) formLogin.classList.remove('hidden');
        if (formReg) formReg.classList.add('hidden');
      }
    },

    submitLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      const email = (this.el('loginEmail').value || '').trim();
      const password = (this.el('loginPassword').value || '').trim();
      const errEl = this.el('authErrorMsg');

      if (!email || !password) {
        if (errEl) {
          errEl.textContent = 'Gmailアドレスとパスワードを入力してください。';
          errEl.classList.remove('hidden');
        }
        return;
      }

      const self = this;
      const btn = this.el('loginSubmitBtn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'ログイン中...';
      }

      if (window.google && google.script && google.script.run && !window._is_mock_gas && typeof google.script.run.loginUser === 'function') {
        try {
          google.script.run
            .withSuccessHandler((res) => {
              if (btn) { btn.disabled = false; btn.textContent = '🔑 ログイン'; }
              if (!res || !res.ok) {
                if (errEl) {
                  errEl.textContent = (res && res.message) ? res.message : 'ログインに失敗しました。';
                  errEl.classList.remove('hidden');
                }
                return;
              }
              self.onAuthSuccess(res.user);
            })
            .withFailureHandler((err) => {
              if (btn) { btn.disabled = false; btn.textContent = '🔑 ログイン'; }
              if (errEl) {
                errEl.textContent = 'サーバー通信エラーが発生しました: ' + err.toString();
                errEl.classList.remove('hidden');
              }
            })
            .loginUser(email, password);
          return;
        } catch(err) {}
      }

      // Mock / Local Fallback
      setTimeout(() => {
        if (btn) { btn.disabled = false; btn.textContent = '🔑 ログイン'; }
        let mockUsers = [];
        try {
          const raw = localStorage.getItem('orbital_mock_users');
          if (raw) mockUsers = JSON.parse(raw);
        } catch(e) {}

        const clean = email.toLowerCase();
        let found = mockUsers.find(u => String(u.email).toLowerCase() === clean);
        if (!found) {
          found = {
            email: clean,
            displayName: clean.split('@')[0],
            avatar: '👤',
            nmtBalance: 10000,
            userCollection: {},
            password: password
          };
          mockUsers.push(found);
          try { localStorage.setItem('orbital_mock_users', JSON.stringify(mockUsers)); } catch(e) {}
        }
        found.isLoggedIn = true;
        self.onAuthSuccess(found);
      }, 500);
    },

    submitRegister(e) {
      if (e && e.preventDefault) e.preventDefault();
      const email = (this.el('regEmail').value || '').trim();
      const password = (this.el('regPassword').value || '').trim();
      const displayName = (this.el('regDisplayName').value || '').trim();
      const avatar = (this.el('regAvatar').value || '👤').trim();
      const errEl = this.el('authErrorMsg');

      if (!email || !email.includes('@') || !email.includes('.')) {
        if (errEl) {
          errEl.textContent = '有効なGmailアドレスを入力してください。';
          errEl.classList.remove('hidden');
        }
        return;
      }
      if (!password || password.length < 4) {
        if (errEl) {
          errEl.textContent = 'パスワードは4文字以上で指定してください。';
          errEl.classList.remove('hidden');
        }
        return;
      }

      const self = this;
      const btn = this.el('regSubmitBtn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '登録中...';
      }

      if (window.google && google.script && google.script.run && !window._is_mock_gas && typeof google.script.run.registerUser === 'function') {
        try {
          google.script.run
            .withSuccessHandler((res) => {
              if (btn) { btn.disabled = false; btn.textContent = '✨ アカウント作成 (Users保存)'; }
              if (!res || !res.ok) {
                if (errEl) {
                  errEl.textContent = (res && res.message) ? res.message : 'アカウント登録に失敗しました。';
                  errEl.classList.remove('hidden');
                }
                return;
              }
              self.onAuthSuccess(res.user);
            })
            .withFailureHandler((err) => {
              if (btn) { btn.disabled = false; btn.textContent = '✨ アカウント作成 (Users保存)'; }
              if (errEl) {
                errEl.textContent = 'サーバー通信エラーが発生しました: ' + err.toString();
                errEl.classList.remove('hidden');
              }
            })
            .registerUser(email, password, displayName, avatar);
          return;
        } catch(err) {}
      }

      // Mock / Local Fallback
      setTimeout(() => {
        if (btn) { btn.disabled = false; btn.textContent = '✨ アカウント作成 (Users保存)'; }
        const clean = email.toLowerCase();
        const userObj = {
          email: clean,
          displayName: displayName || clean.split('@')[0],
          avatar: avatar || '👤',
          nmtBalance: 10000,
          userCollection: {},
          password: password,
          isLoggedIn: true
        };
        try {
          let mockUsers = [];
          const raw = localStorage.getItem('orbital_mock_users');
          if (raw) mockUsers = JSON.parse(raw);
          const idx = mockUsers.findIndex(u => String(u.email).toLowerCase() === clean);
          if (idx >= 0) mockUsers[idx] = userObj;
          else mockUsers.push(userObj);
          localStorage.setItem('orbital_mock_users', JSON.stringify(mockUsers));
        } catch(e) {}
        self.onAuthSuccess(userObj);
      }, 500);
    },

    onAuthSuccess(userObj) {
      if (!userObj) return;
      userObj.isLoggedIn = true;
      if (userObj.lastBonusDate) userObj.lastBonusDate = this.normalizeDateStr(userObj.lastBonusDate);
      this.state.userProfile = userObj;
      try {
        localStorage.setItem('ORBITAL_LOGGED_IN_USER', JSON.stringify(userObj));
        localStorage.setItem('orbital_mock_user_email', userObj.email);
        if (userObj.lastBonusDate) {
          localStorage.setItem('ORBITAL_LAST_DAILY_BONUS', userObj.lastBonusDate);
          localStorage.setItem('ORBITAL_LAST_DAILY_BONUS_' + userObj.email, userObj.lastBonusDate);
        }
        if (userObj.streakDay) {
          localStorage.setItem('ORBITAL_LOGIN_STREAK_DAY', String(userObj.streakDay));
          localStorage.setItem('ORBITAL_LOGIN_STREAK_DAY_' + userObj.email, String(userObj.streakDay));
        }
      } catch(e) {}

      if (userObj.nmtBalance != null) {
        this.setUserNmt(userObj.nmtBalance);
      }
      if (userObj.userCollection && typeof userObj.userCollection === 'object') {
        this.state.userCollection = userObj.userCollection;
        try { localStorage.setItem('ORBITAL_USER_COLLECTION', JSON.stringify(userObj.userCollection)); } catch(e) {}
        if (window.CardSystem && typeof window.CardSystem.saveUserCollection === 'function') {
          window.CardSystem.saveUserCollection(userObj.userCollection);
        }
      }

      if (window.DeckSystem && window.DeckSystem.state) {
        window.DeckSystem.state.currentUser = userObj;
        if (typeof window.DeckSystem.updateUserBadge === 'function') {
          window.DeckSystem.updateUserBadge();
        }
      }

      this.updateUserBadge();
      this.updateNmtBadge();
      this.renderDailyBonusStreak();
      this.closeAuthModal();
      this.toast('✨ ログイン完了: ようこそ ' + (userObj.displayName || userObj.email) + ' さん！');

      // 本日のボーナスがまだ未受取ならモーダルを案内
      const { isClaimedToday } = this.getLoginStreakInfo();
      if (!isClaimedToday) {
        setTimeout(() => this.openDailyBonusModal(), 600);
      }
    },

    logout() {
      try {
        localStorage.removeItem('ORBITAL_LOGGED_IN_USER');
      } catch(e) {}
      this.state.userProfile = null;
      if (window.DeckSystem && window.DeckSystem.state) {
        window.DeckSystem.state.currentUser = null;
      }
      this.updateUserBadge();
      this.updateNmtBadge();
      this.renderDailyBonusStreak();
      this.toast('👋 ログアウトしました');
    },

    updateUserBadge() {
      const badgeBtn = this.el('userProfileBtn') || document.querySelector('.user-profile-badge');
      if (!badgeBtn) return;

      if (this.isLoggedIn()) {
        const prof = this.state.userProfile;
        const av = prof ? (prof.avatar || '👤') : '👤';
        const name = prof ? (prof.displayName || prof.email.split('@')[0]) : 'ログイン中';
        badgeBtn.innerHTML = '<span class="user-avatar-badge">' + this.escapeHtml(av) + '</span><span class="user-name-text">' + this.escapeHtml(name) + '</span>';
        badgeBtn.onclick = () => {
          if (confirm('👤 Logged in as: ' + name + ' (' + (prof ? prof.email : '') + ')\n\nログアウトしますか？')) {
            App.logout();
          }
        };
      } else {
        badgeBtn.innerHTML = '<span class="user-avatar-badge">🔑</span><span class="user-name-text">ログイン / 登録</span>';
        badgeBtn.onclick = () => App.openAuthModal('login');
      }
    },

    getUserEmail() {
      try {
        if (this.state.userProfile && this.state.userProfile.email && this.state.userProfile.email !== 'player@gmail.com') {
          return this.state.userProfile.email;
        }
        const loggedIn = localStorage.getItem('ORBITAL_LOGGED_IN_USER');
        if (loggedIn) {
          const u = JSON.parse(loggedIn);
          if (u && u.email && u.email !== 'player@gmail.com') {
            this.state.userProfile = Object.assign({ isLoggedIn: true }, u);
            return u.email;
          } else if (u && u.email === 'player@gmail.com') {
            try { localStorage.removeItem('ORBITAL_LOGGED_IN_USER'); } catch(e) {}
          }
        }
        if (window.DeckSystem && window.DeckSystem.state && window.DeckSystem.state.currentUser && window.DeckSystem.state.currentUser.email && window.DeckSystem.state.currentUser.email !== 'player@gmail.com') {
          return window.DeckSystem.state.currentUser.email;
        }
        const saved = localStorage.getItem('orbital_mock_user_email');
        if (saved && saved !== 'player@gmail.com') return saved;
        if (saved === 'player@gmail.com') {
          try { localStorage.removeItem('orbital_mock_user_email'); } catch(e) {}
        }
      } catch(e) {}
      return '';
    },

    getUserDisplayName() {
      try {
        if (this.state.userProfile && this.state.userProfile.displayName) return this.state.userProfile.displayName;
        const loggedIn = localStorage.getItem('ORBITAL_LOGGED_IN_USER');
        if (loggedIn) {
          const u = JSON.parse(loggedIn);
          if (u && u.displayName) return u.displayName;
        }
      } catch(e) {}
      const email = this.getUserEmail();
      return (email && email.includes('@')) ? email.split('@')[0] : 'ゲスト';
    },

    getUserAvatar() {
      try {
        if (this.state.userProfile && this.state.userProfile.avatar) return this.state.userProfile.avatar;
        const loggedIn = localStorage.getItem('ORBITAL_LOGGED_IN_USER');
        if (loggedIn) {
          const u = JSON.parse(loggedIn);
          if (u && u.avatar) return u.avatar;
        }
      } catch(e) {}
      return '👤';
    },

    loadUserProfileFromGas(email) {
      const targetEmail = email || this.getUserEmail() || 'player@gmail.com';
      if (!targetEmail) return;
      const self = this;
      if (window.google && google.script && google.script.run && typeof google.script.run.getUserProfile === 'function') {
        try {
          google.script.run.withSuccessHandler((prof) => {
            if (!prof || !prof.email) return;
            if (prof.lastBonusDate) prof.lastBonusDate = self.normalizeDateStr(prof.lastBonusDate);
            self.state.userProfile = prof;
            if (prof.dnaUid) {
              try {
                localStorage.setItem('ORBITAL_USER_DNA_UID_' + prof.email, prof.dnaUid);
                localStorage.setItem('ORBITAL_USER_DNA_UID', prof.dnaUid);
              } catch(e) {}
            }
            try {
              if (prof.lastBonusDate) {
                localStorage.setItem('ORBITAL_LAST_DAILY_BONUS', prof.lastBonusDate);
                localStorage.setItem('ORBITAL_LAST_DAILY_BONUS_' + prof.email, prof.lastBonusDate);
              }
              if (prof.streakDay) {
                localStorage.setItem('ORBITAL_LOGIN_STREAK_DAY', String(prof.streakDay));
                localStorage.setItem('ORBITAL_LOGIN_STREAK_DAY_' + prof.email, String(prof.streakDay));
              }
            } catch(e) {}
            if (prof.nmtBalance != null) {
              const val = Number(prof.nmtBalance);
              self.state.nmt = val;
              self.state.nmtBalance = val;
              try { localStorage.setItem('ORBITAL_NMT_BALANCE', String(val)); } catch(e) {}
              self.updateNmtDisplays();
            }
            if (prof.userCollection && typeof prof.userCollection === 'object') {
              self.state.userCollection = prof.userCollection;
              try { localStorage.setItem('ORBITAL_USER_COLLECTION', JSON.stringify(prof.userCollection)); } catch(e) {}
              if (window.CardSystem && window.CardSystem.state) {
                window.CardSystem.state.userCollection = prof.userCollection;
              }
            }
            if (window.DeckSystem && window.DeckSystem.state) {
              window.DeckSystem.state.currentUser = prof;
              if (typeof window.DeckSystem.updateUserBadge === 'function') {
                window.DeckSystem.updateUserBadge();
              }
            }
            self.updateNmtBadge();
            self.renderDailyBonusStreak();
          }).getUserProfile(targetEmail);
        } catch(e) {
          console.warn('loadUserProfileFromGas error:', e);
        }
      }
    },

    getUserNmt() {
      if (this.state.userProfile && this.state.userProfile.nmtBalance != null) return Number(this.state.userProfile.nmtBalance);
      if (this.state.userProfile && this.state.userProfile.nmt != null) return Number(this.state.userProfile.nmt);
      if (this.state.nmtBalance != null) return Number(this.state.nmtBalance);
      if (this.state.nmt != null) return Number(this.state.nmt);
      try {
        const stored = localStorage.getItem('ORBITAL_NMT_BALANCE');
        if (stored) return Number(stored);
      } catch(e) {}
      return 1000;
    },

    setUserNmt(val) {
      val = Math.max(0, Number(val) || 0);
      if (!this.state.userProfile) this.state.userProfile = {};
      this.state.userProfile.nmtBalance = val;
      this.state.userProfile.nmt = val;
      this.state.nmtBalance = val;
      this.state.nmt = val;
      try { localStorage.setItem('ORBITAL_NMT_BALANCE', String(val)); } catch(e) {}
      this.updateNmtDisplays();

      // GAS DB への残高保存
      let email = this.getUserEmail();
      if (!email || email === 'player@gmail.com') {
        email = (this.state.userProfile && this.state.userProfile.email) ||
                (window.DeckSystem && window.DeckSystem.state && window.DeckSystem.state.currentUser && window.DeckSystem.state.currentUser.email) ||
                localStorage.getItem('orbital_mock_user_email') ||
                localStorage.getItem('ORBITAL_USER_EMAIL') ||
                'player@gmail.com';
      }

      if (window.google && google.script && google.script.run && typeof google.script.run.saveUserNmtBalance === 'function') {
        try {
          console.log('📡 [GAS Sync] Saving NMT balance to Users sheet:', val, 'for email:', email);
          google.script.run.withSuccessHandler((res) => {
            console.log('✅ [GAS Sync Success] saveUserNmtBalance:', res);
          }).withFailureHandler((err) => {
            console.warn('⚠️ [GAS Sync Error] saveUserNmtBalance:', err);
          }).saveUserNmtBalance(email, val);
        } catch(e) {
          console.warn('setUserNmt GAS error:', e);
        }
      }
    },

    updateNmtDisplays() {
      const val = this.getUserNmt();
      const valText = val + ' NMT';
      ['nmtBalanceVal', 'singleShopNmtVal', 'sellShopNmtVal'].forEach(id => {
        const el = this.el(id);
        if (el) el.textContent = valText;
      });
    },

    getUserCollection() {
      if (this.state.userCollection && typeof this.state.userCollection === 'object' && Object.keys(this.state.userCollection).length > 0) {
        return this.state.userCollection;
      }
      if (window.CardSystem && typeof window.CardSystem.getUserCollection === 'function') {
        const col = window.CardSystem.getUserCollection();
        if (col && typeof col === 'object') {
          this.state.userCollection = col;
          return col;
        }
      }
      try {
        const stored = localStorage.getItem('ORBITAL_USER_COLLECTION');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && typeof parsed === 'object') {
            this.state.userCollection = parsed;
            return parsed;
          }
        }
      } catch(e) {}
      this.state.userCollection = this.state.userCollection || {};
      return this.state.userCollection;
    },

    saveUserCollectionToGas(col) {
      const collectionObj = col || this.getUserCollection();
      if (!collectionObj || typeof collectionObj !== 'object') return;

      // ローカルストレージは即時同期
      try {
        localStorage.setItem('ORBITAL_USER_COLLECTION', JSON.stringify(collectionObj));
      } catch (e) {}

      this._pendingCollectionToSave = Object.assign({}, collectionObj);

      // デバウンス処理: 10連開封や連続カード獲得時の重複リクエスト・ロック衝突を完全に防止
      if (this._collectionSaveTimer) {
        clearTimeout(this._collectionSaveTimer);
      }

      const self = this;
      this._collectionSaveTimer = setTimeout(() => {
        self._flushCollectionSave();
      }, 250);
    },

    _flushCollectionSave(retryCount = 0) {
      if (this._isSavingCollection && retryCount === 0) {
        this._hasQueuedCollectionSave = true;
        return;
      }

      const collectionObj = this._pendingCollectionToSave || this.getUserCollection();
      if (!collectionObj) return;

      let email = this.getUserEmail();
      if (!email || email === 'player@gmail.com') {
        email = (this.state.userProfile && this.state.userProfile.email) ||
                (window.DeckSystem && window.DeckSystem.state && window.DeckSystem.state.currentUser && window.DeckSystem.state.currentUser.email) ||
                localStorage.getItem('orbital_mock_user_email') ||
                localStorage.getItem('ORBITAL_USER_EMAIL') ||
                'player@gmail.com';
      }

      this._isSavingCollection = true;
      this._hasQueuedCollectionSave = false;
      const self = this;

      const onSuccess = (res) => {
        self._isSavingCollection = false;
        console.log('✅ [GAS Sync Success] saveUserCollection:', res);
        if (self._hasQueuedCollectionSave) {
          self._hasQueuedCollectionSave = false;
          self._flushCollectionSave();
        }
      };

      const onError = (err) => {
        console.warn(`⚠️ [GAS Sync Error] saveUserCollection (attempt ${retryCount + 1}):`, err);
        if (retryCount < 3) {
          const delay = Math.pow(2, retryCount) * 1000;
          setTimeout(() => {
            self._flushCollectionSave(retryCount + 1);
          }, delay);
        } else {
          self._isSavingCollection = false;
          console.error('❌ [GAS Sync Failed] saveUserCollection failed after 3 retries:', err);
        }
      };

      if (window.google && google.script && google.script.run && typeof google.script.run.saveUserCollection === 'function') {
        try {
          console.log('📡 [GAS Sync] Saving collection to Users sheet for email:', email);
          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onError)
            .saveUserCollection(collectionObj, email);
          return;
        } catch(e) {
          onError(e);
        }
      } else {
        setTimeout(() => {
          onSuccess({ ok: true, userCollection: collectionObj });
        }, 50);
      }
    },

    addCardToCollection(cardId) {
      let col = this.getUserCollection();
      col[cardId] = (col[cardId] || 0) + 1;
      this.state.userCollection = col;
      try { localStorage.setItem('ORBITAL_USER_COLLECTION', JSON.stringify(col)); } catch(e) {}

      if (window.CardSystem && window.CardSystem.state) {
        window.CardSystem.state.userCollection = col;
      }
      if (window.CardSystem && window.App && window.App.state && window.App.state.page === 'collection') {
        window.CardSystem.renderCollectionPage();
      }

      this.saveUserCollectionToGas(col);
    },

    openAdminShopItemModal(itemId = null) {
      if (!this.isAdmin()) {
        this.requireAdmin();
        return;
      }

      const modal = this.el('adminShopItemModal');
      if (!modal) return;

      if (itemId) {
        const items = this.getSingleShopItems();
        const item = items.find(i => i.id === itemId);
        if (item) {
          this.el('adminShopItemId').value = item.id;
          this.el('adminShopItemCardId').value = item.cardId;
          this.el('adminShopItemPrice').value = item.price || 300;
          this.el('adminShopItemTag').value = item.tag || '';
          this._tempShopItemCardId = item.cardId;
          this.renderShopItemCardPreview(item.cardId);
        }
      } else {
        this.el('adminShopItemId').value = '';
        this.el('adminShopItemCardId').value = '';
        this.el('adminShopItemPrice').value = '300';
        this.el('adminShopItemTag').value = '';
        this._tempShopItemCardId = null;
        this.renderShopItemCardPreview(null);
      }

      modal.classList.remove('hidden');
    },

      const modal = this.el('adminShopItemModal');
      if (modal) modal.classList.add('hidden');
    },

    openCardPickerForShopItem() {
      const currentSelected = this._tempShopItemCardId ? [this._tempShopItemCardId] : [];
      if (window.CardSystem && CardSystem.openCardPicker) {
        CardSystem.openCardPicker({
          title: '🛍️ ショップ出品カード選択',
          mode: 'single',
          selectedIds: currentSelected,
          onConfirm: (selectedIds) => {
            if (selectedIds.length > 0) {
              App._tempShopItemCardId = selectedIds[0];
              App.el('adminShopItemCardId').value = selectedIds[0];
              App.renderShopItemCardPreview(selectedIds[0]);
            }
          }
        });
      }
