<script>
console.log('[ORBITAL] App.js.html started execution');
(() => {
  'use strict';

  const CardSystem = new Proxy({}, {
    get(target, prop) {
      if (window.CardSystem && typeof window.CardSystem[prop] === 'function') {
        return function (...args) {return window.CardSystem[prop].apply(window.CardSystem, args);};
      }
      if (window.CardSystem && prop in window.CardSystem) {
        return window.CardSystem[prop];
      }
      return function () {
        console.warn('[Proxy] CardSystem.' + String(prop) + ' called before CardSystem ready');
      };
    }
  });
  const DeckSystem = new Proxy({}, {
    get(target, prop) {
      return window.DeckSystem ? window.DeckSystem[prop] : undefined;
    }
  });
  const BattleSystem = new Proxy({}, {
    get(target, prop) {
      return window.BattleSystem ? window.BattleSystem[prop] : undefined;
    }
  });

  function safeGetSession(key) {
    try {return window.sessionStorage ? window.sessionStorage.getItem(key) || '' : '';} catch (e) {return '';}
  }
  function safeSetSession(key, val) {
    try {if (window.sessionStorage) window.sessionStorage.setItem(key, val);} catch (e) {}
  }
  function safeRemoveSession(key) {
    try {if (window.sessionStorage) window.sessionStorage.removeItem(key);} catch (e) {}
  }

  const App = {
    state: {
      page: 'home',
      cards: [],
      editingCardId: null,
      adminToken: safeGetSession('orbital_admin_token'),
      currentVersion: (function() { try { return localStorage.getItem('orbital_app_version') || 'v1.0.0'; } catch(e) { return 'v1.0.0'; } })(),
      latestUpdate: null,
      nmtBalance: (function() { try { var b = localStorage.getItem('ORBITAL_NMT_BALANCE'); return b !== null ? Number(b) : 100; } catch(e) { return 100; } })(),
      packs: [],
      activeDrawnCards: []
    },

    init() {
      const safe = (name, fn) => {
        try {fn();}
        catch (e) {console.error('[App.init] ' + name + ' failed:', e);}
      };
      safe('initStartupLoader', () => this.initStartupLoader());
      safe('initPresenceTracking', () => this.initPresenceTracking());
      safe('initGlobalChat', () => this.initGlobalChat());
      safe('bindNavigation', () => this.bindNavigation());
      safe('initFontSize', () => this.initFontSize());
      safe('initNmtAndPacks', () => this.initNmtAndPacks());
      safe('loadUserProfileFromGas', () => this.loadUserProfileFromGas());
      safe('bindHome', () => this.bindHome());
      safe('bindEditor', () => this.bindEditor());
      safe('bindFilters', () => this.bindFilters());
      safe('bindModal', () => this.bindModal());
      safe('bindAdmin', () => this.bindAdmin());
      safe('bindAccountProfileModal', () => this.bindAccountProfileModal());
      safe('loadCards', () => this.loadCards());
      safe('loadShopAndTradeItemsFromGas', () => this.loadShopAndTradeItemsFromGas());
      safe('checkForUpdates', () => this.checkForUpdates());
      safe('checkCamouflageAccess', () => this.checkCamouflageAccess());
      safe('CardSystem.init', () => {
        if (window.CardSystem && window.CardSystem.init) CardSystem.init();
      });
      safe('DeckSystem.init', () => {
        if (window.DeckSystem && window.DeckSystem.init) {
          DeckSystem.init();
          DeckSystem.loadDecks();
        }
      });
      safe('BattleSystem.init', () => {
        if (window.BattleSystem && window.BattleSystem.init) BattleSystem.init();
      });
      safe('showPage', () => {
        let initialPage = 'home';
        try {
          initialPage = new URLSearchParams(window.location.search).get('page') ||
            window.location.hash.replace('#', '') ||
            'home';
        } catch (e) { initialPage = 'home'; }
        if ((initialPage === 'cards' || initialPage === 'create') && !this.isAdmin()) {
          initialPage = 'home';
        }
        this.showPage(initialPage);
      });
      safe('checkInitialAuthPrompt', () => {
        // 旧ダミーアカウント player@gmail.com をクリーンアップ
        this.getUserEmail();

        // 起動時にGmailでログインしていない場合は、ログインモーダルを表示してログインを促す
        if (!this.isLoggedIn()) {
          setTimeout(() => {
            this.openAuthModal('login');
          }, 350);
        }
      });
      try {
        const loaderScreen = document.getElementById('gas-loader-screen');
        if (loaderScreen) {
          loaderScreen.style.display = 'none';
          if (loaderScreen.parentNode) loaderScreen.parentNode.removeChild(loaderScreen);
        }
        const startupOverlay = document.getElementById('startupLoadingOverlay');
        if (startupOverlay) {
          startupOverlay.style.display = 'none';
          startupOverlay.classList.add('hidden');
          if (startupOverlay.parentNode) startupOverlay.parentNode.removeChild(startupOverlay);
        }
      } catch (e) {}
    },

    checkCamouflageAccess() {
      try {
        const hasLoggedIn = localStorage.getItem('ORBITAL_HAS_LOGGED_IN');
        const camouPage = document.getElementById('camouflagePage');
        const appContainer = document.getElementById('app');

        if (!hasLoggedIn || hasLoggedIn !== 'true') {
          if (camouPage) camouPage.classList.remove('hidden');
          if (appContainer) appContainer.classList.add('hidden');
          return false;
        } else {
          if (camouPage) camouPage.classList.add('hidden');
          if (appContainer) appContainer.classList.remove('hidden');
          return true;
        }
      } catch (e) {
        console.error('checkCamouflageAccess error:', e);
        return true;
      }
    },

    openCamouflageLoginModal() {
      const modal = document.getElementById('camouLoginModal');
      const input = document.getElementById('camouPasswordInput');
      const err = document.getElementById('camouPasswordError');
      if (err) err.style.display = 'none';
      if (input) input.value = '';
      if (modal) modal.classList.remove('hidden');
      if (input) setTimeout(() => input.focus(), 100);
    },

    closeCamouflageLoginModal() {
      const modal = document.getElementById('camouLoginModal');
      if (modal) modal.classList.add('hidden');
    },

            submitCamouflageLogin() {
      const emailInput = document.getElementById('camouEmailInput');
      const passInput = document.getElementById('camouPasswordInput');
      const err = document.getElementById('camouPasswordError');

      const email = (emailInput ? emailInput.value : '').trim().toLowerCase();
      const pass = (passInput ? passInput.value : '').trim();

      if (!email || !email.includes('@')) {
        if (err) { err.textContent = '有効なGmailアドレスを入力してください。'; err.style.display = 'block'; }
        return;
      }
      if (!pass) {
        if (err) { err.textContent = 'パスワードを入力してください。'; err.style.display = 'block'; }
        return;
      }

      const validPasswords = ['123', 'orcein'];
      if (!validPasswords.includes(pass.toLowerCase())) {
        if (err) { err.textContent = 'パスワードが正しくありません。'; err.style.display = 'block'; }
        return;
      }

      try {
        localStorage.setItem('orbital_mock_user_email', email);
        localStorage.setItem('orbital_mock_user_password', pass);
        localStorage.setItem('ORBITAL_HAS_LOGGED_IN', 'true');
      } catch(e) {}

      const displayName = email.split('@')[0];
      const userProfile = { email, displayName, avatar: '👤', isLoggedIn: true };
      this.state.userProfile = userProfile;
      if (window.DeckSystem && window.DeckSystem.state) {
        window.DeckSystem.state.currentUser = userProfile;
        if (typeof window.DeckSystem.updateUserBadge === 'function') window.DeckSystem.updateUserBadge();
        if (typeof window.DeckSystem.loadDecks === 'function') window.DeckSystem.loadDecks();
      }

      this.closeCamouflageLoginModal();
      const camouPage = document.getElementById('camouflagePage');
      const appContainer = document.getElementById('app');
      if (camouPage) camouPage.classList.add('hidden');
      if (appContainer) appContainer.classList.remove('hidden');

      this.toast('🔑 認証成功: 酢酸オルセイン TCG へようこそ！');
    },

    unlockCamouflageAndLogin() {
      this.openCamouflageLoginModal();
    },

    initFontSize() {
      let mode = 'normal';
      try {
        mode = localStorage.getItem('orbital_font_scale') || 'normal';
      } catch (e) {}
      this.setFontSizeMode(mode, false);
      const btn = this.el('fontSizeToggleBtn');
      if (btn) {
        btn.addEventListener('click', () => {
          let current = 'normal';
          try {
            current = localStorage.getItem('orbital_font_scale') || 'normal';
          } catch (e) {}
          const next = current === 'normal' ? 'large' : (current === 'large' ? 'xlarge' : 'normal');
          this.setFontSizeMode(next, true);
        });
      }
    },

    setFontSizeMode(mode, showToast) {
      if (document.body) {
        document.body.classList.remove('font-size-large', 'font-size-xlarge');
        if (mode === 'large') {
          document.body.classList.add('font-size-large');
        } else if (mode === 'xlarge') {
          document.body.classList.add('font-size-xlarge');
        }
      }
      let label = 'Aa 文字サイズ: 標準';
      if (mode === 'large') label = 'Aa 文字サイズ: 大';
      else if (mode === 'xlarge') label = 'Aa 文字サイズ: 特大';
      try {
        localStorage.setItem('orbital_font_scale', mode);
      } catch (e) {}
      const btn = this.el('fontSizeToggleBtn');
      if (btn) btn.textContent = label;
      if (showToast) {
        this.toast('文字サイズを「' + (mode === 'large' ? '大' : (mode === 'xlarge' ? '特大' : '標準')) + '」に変更しました。');
      }
    },

    el(id) {
      return document.getElementById(id);
    },

    showPage(page) {
      // ページセクションが main の外に押し出されていても、必ず main 直下に戻す (レイアウトずれ防止)
      const mainEl = document.querySelector('main.main');
      if (mainEl) {
        document.querySelectorAll('section.page').forEach((sec) => {
          if (sec.parentElement !== mainEl) mainEl.appendChild(sec);
        });
      }
      if (page === 'shop') page = 'single-shop';
      if (page === 'sell' || page === 'sell_shop') page = 'sell-shop';
      if (page === 'packs' || page === 'pack_shop') page = 'pack';
      if (page === 'admin-pack' || page === 'admin_pack') {
        this.openAdminPackModal();
        return;
      }
      if (page === 'feedback') {
        this.openFeedbackModal();
        return;
      }

      if ((page === 'create' || page === 'cards') && !this.isAdmin()) {
        this.requireAdmin();
        return;
      }

      const target = this.el("page-" + page);
      if (!target) {
        console.warn('⚠️ [showPage] Target page section not found: page-' + page + '. Falling back to home.');
        if (page !== 'home') this.showPage('home');
        return;
      }

      document.querySelectorAll('.page').forEach((el) => el.classList.remove('active'));
      target.classList.add('active');

      document.querySelectorAll('.nav-button').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.page === page || (btn.dataset.page === 'single-shop' && page === 'single-shop') || (btn.dataset.page === 'sell-shop' && page === 'sell-shop'));
      });

      this.state.page = page;
      if (page !== 'battle') {
        document.body.classList.remove('in-battle-arena');
      }
      const sidebar = this.el('sidebar');
      if (sidebar) sidebar.classList.remove('open');

      if (page === 'cards' && window.CardSystem) {
        if (typeof CardSystem.renderList === 'function') CardSystem.renderList();
      }
      if (page === 'deck' && window.DeckSystem) {
        DeckSystem.init();
        DeckSystem.loadDecks();
      }
      if (page === 'battle' && window.BattleSystem) {
        if (window.DeckSystem && typeof window.DeckSystem.loadDecks === 'function') {
          DeckSystem.loadDecks();
        }
        BattleSystem.init();
      }
      if (page === 'create' && window.CardSystem) {
        CardSystem.syncCategoryForm();
        CardSystem.updatePreview();
      }
      if (page === 'collection' && window.CardSystem && typeof CardSystem.renderCollectionPage === 'function') {
        CardSystem.renderCollectionPage();
      }
      if (page === 'pack') {
        this.loadPacks();
        this.renderPackGrid();
      }
      if (page === 'single-shop') {
        this.loadShopAndTradeItemsFromGas();
        this.renderSingleShopGrid();
      }
      if (page === 'sell-shop') {
        this.renderSellShop();
      }
    },

    toast(message, isError = false) {
      const toast = this.el('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.style.borderColor = isError ? 'var(--danger)' : '';
      toast.classList.add('show');
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    },

    bindNavigation() {
      document.querySelectorAll('.nav-button').forEach((btn) => {
        if (btn.dataset && btn.dataset.page) {
          btn.addEventListener('click', () => this.showPage(btn.dataset.page));
        }
      });

      const menuBtn = this.el('mobileMenuButton');
      if (menuBtn) {
        menuBtn.addEventListener('click', () => {
          const sb = this.el('sidebar');
          if (sb) sb.classList.toggle('open');
        });
      }
    },

    bindHome() {
      const onEl = (id, fn) => {const el = this.el(id);if (el) el.addEventListener('click', fn);};
      onEl('heroCreateButton', () => {if (!this.requireAdmin()) return;CardSystem.resetEditor();this.showPage('create');});
      onEl('heroCardsButton', () => this.showPage('collection'));
      onEl('homeRefreshButton', () => this.loadCards());
      onEl('homeGitHubSyncButton', () => this.promptGitHubSync());
      onEl('newCardButton', () => {if (!this.requireAdmin()) return;CardSystem.resetEditor();this.showPage('create');});
    },

    promptGitHubSync() {
      const current = localStorage.getItem('ORBITAL_GITHUB_REPO') || '';
      const input = prompt(
        '🐙 GitHubリポジトリからシステム全体（最新プログラムコード・カード・デッキ・パック設定）を読み込み・同期します。\n\n' +
        '・リポジトリ名 (例: owner/repository) または Raw URL を入力してください。\n' +
        '・同期を解除してローカルに戻す場合は「reset」と入力するか空欄でOKを押してください:',
        current || 'owner/repository'
      );
      if (input !== null) {
        const trimmed = input.trim();
        if (trimmed === '' || trimmed.toLowerCase() === 'reset') {
          try { localStorage.removeItem('ORBITAL_GITHUB_REPO'); } catch (e) {}
          this.toast('🧹 GitHub同期を解除し、ローカルデータに戻しました。');
          this.loadDefaultLocalCards();
        } else {
          this.loadFromGitHub(trimmed, true);
        }
      }
    },

    bindEditor() {
      const on = (id, event, handler) => {
        const node = this.el(id);
        if (node) node.addEventListener(event, handler);
      };

      on('saveCardButton', 'click', () => CardSystem.save());
      on('resetEditorButton', 'click', () => CardSystem.resetEditor());
      on('uploadImageButton', 'click', () => CardSystem.uploadImage());
      on('abilityEffectButton', 'click', () => CardSystem.openEffectEditor('ability'));
      on('attack1EffectButton', 'click', () => CardSystem.openEffectEditor('attack1'));
      on('attack2EffectButton', 'click', () => CardSystem.openEffectEditor('attack2'));
      on('trainerEffectButton', 'click', () => CardSystem.openEffectEditor('trainer'));
      on('category', 'change', () => {
        CardSystem.syncCategoryForm();
        CardSystem.updatePreview();
      });
      on('closeEffectEditorButton', 'click', () => CardSystem.closeEffectEditor());
      on('cancelEffectEditorButton', 'click', () => CardSystem.closeEffectEditor());
      on('saveEffectEditorButton', 'click', () => CardSystem.applyEffectEditor());

      const effectModal = this.el('effectEditorModal');
      if (effectModal) {
        const backdrop = effectModal.querySelector('.modal-backdrop');
        if (backdrop) backdrop.addEventListener('click', () => CardSystem.closeEffectEditor());
      }

      on('cardForm', 'input', () => CardSystem.updatePreview());
      on('cardForm', 'change', () => CardSystem.updatePreview());

      // 効果エディター内のボタンはイベント委譲で確実に処理する
      document.addEventListener('click', (e) => {
        const tab = e.target.closest('[data-effect-tab]');
        if (tab) {
          e.preventDefault();
          CardSystem.switchEffectTab(tab.dataset.effectTab);
          return;
        }
        const insert = e.target.closest('[data-effect-insert]');
        if (insert) {
          e.preventDefault();
          CardSystem.insertEffectCode(insert.dataset.effectInsert || '');
          return;
        }
      });

      // effectCodeEditor のキー操作・入力イベントは CardSystem 側で一元管理されています
    },

    bindFilters() {
      ['searchInput', 'categoryFilter', 'typeFilter', 'rarityFilter'].forEach((id) => {
        const el = this.el(id);
        if (!el) return;
        el.addEventListener('input', () => CardSystem.renderList());
        el.addEventListener('change', () => CardSystem.renderList());
      });
      ['collectionSearchInput', 'collectionCategoryFilter', 'collectionRarityFilter', 'collectionOwnedFilter'].forEach((id) => {
        const el = this.el(id);
        if (!el) return;
        el.addEventListener('input', () => CardSystem.renderCollectionPage());
        el.addEventListener('change', () => CardSystem.renderCollectionPage());
      });
    },

    bindModal() {
      const closeBtn = this.el('closeModalButton');
      if (closeBtn) closeBtn.addEventListener('click', () => this.closeModal());
      const modal = this.el('detailModal');
      if (modal) {
        const backdrop = modal.querySelector('.modal-backdrop');
        if (backdrop) backdrop.addEventListener('click', () => this.closeModal());
      }
    },

    openModal(html) {
      this.el('detailContent').innerHTML = html;
      this.el('detailModal').classList.remove('hidden');
    },

    closeModal() {
      this.el('detailModal').classList.add('hidden');
    },

    bindAdmin() {
      this.updateAdminStatus();
      const onEl = (id, fn) => {const el = this.el(id);if (el) el.addEventListener('click', fn);};
      onEl('adminLoginButton', () => {if (this.isAdmin()) this.logoutAdmin();else this.openAdminLogin();});
      onEl('closeAdminLoginButton', () => this.closeAdminLogin());
      onEl('adminLoginSubmit', () => this.loginAdmin());
      const modal = this.el('adminLoginModal');
      if (modal) {
        const backdrop = modal.querySelector('.modal-backdrop');
        if (backdrop) backdrop.addEventListener('click', () => this.closeAdminLogin());
      }
      const pwd = this.el('adminPassword');
      if (pwd) pwd.addEventListener('keydown', (e) => {if (e.key === 'Enter') this.loginAdmin();});
    },

    isAdmin() {return !!this.state.adminToken;},

    requireAdmin() {
      if (this.isAdmin()) return true;
      this.openAdminLogin();
      this.toast('カード作成には管理者ログインが必要です。', true);
      return false;
    },

    // ============================================================
    // オンラインプレゼンス (誰がオンラインか) & グローバルチャット
    // ============================================================
    getCurrentActivity() {
      if (window.BattleSystem && window.BattleSystem.state && window.BattleSystem.state.phase === 'battle') {
        return '⚔️ バトル対戦中';
      }
      const page = this.state.page || 'home';
      switch (page) {
        case 'battle': return '⚔️ バトルロビー';
        case 'deck': return '🎴 デッキ編集中';
        case 'collection': return '📖 カード図鑑';
        case 'pack': return '🎁 パック開封中';
        case 'single-shop': return '🏪 ショップ利用中';
        case 'trade': return '🔄 トレード中';
        case 'create': return '🛠️ カード作成中';
        default: return '🟢 ロビー待機中';
      }
    },

    initPresenceTracking() {
      this.refreshPresence();
      if (this._presenceInterval) clearInterval(this._presenceInterval);
      this._presenceInterval = setInterval(() => this.refreshPresence(), 30000);
    },

    refreshPresence(manual) {
      const email = this.getUserEmail() || ('guest_' + (this.state.guestId || (this.state.guestId = Math.random().toString(36).substring(2, 8))) + '@guest.local');
      const displayName = this.getUserDisplayName() || 'ゲスト';
      const avatar = this.getUserAvatar() || '👤';
      const activity = this.getCurrentActivity();

      const applyPresenceRes = (res) => {
        if (!res) return;
        const count = res.onlineCount != null ? res.onlineCount : (res.onlineUsers?.length || 1);
        const countEl = document.getElementById('onlinePlayerCount');
        const floatCountEl = document.getElementById('chatFloatOnlineCount');
        const windowCountEl = document.getElementById('chatWindowOnlineCount');
        if (countEl) countEl.textContent = count;
        if (floatCountEl) floatCountEl.textContent = count;
        if (windowCountEl) windowCountEl.textContent = count;

        this.state.onlineUsers = res.onlineUsers || [];
        this.renderOnlineUsersList();

        if (manual) this.toast('👥 オンライン状態を更新しました');
      };

      if (window.google && google.script && google.script.run && !window._is_mock_gas) {
        try {
          google.script.run
            .withSuccessHandler(applyPresenceRes)
            .withFailureHandler((err) => {
              console.warn('pingPresence error:', err);
              applyPresenceRes({ ok: true, onlineCount: 1, onlineUsers: [] });
            })
            .pingPresence(email, activity, displayName, avatar);
        } catch (e) {
          applyPresenceRes({ ok: true, onlineCount: 1, onlineUsers: [] });
        }
      } else if (window.google && google.script && google.script.run && window.google.script.run.pingPresence) {
        google.script.run
          .withSuccessHandler(applyPresenceRes)
          .pingPresence(email, activity, displayName, avatar);
      } else {
        // Mock fallback
        try {
          const raw = localStorage.getItem('orbital_presence_list') || '[]';
          let list = JSON.parse(raw);
          if (!Array.isArray(list)) list = [];
          const now = Date.now();
          const nowIso = new Date(now).toISOString();
          let found = false;
          for (let u of list) {
            if (String(u.email).toLowerCase() === email.toLowerCase()) {
              u.displayName = displayName;
              u.avatar = avatar;
              u.activity = activity;
              u.lastActiveAt = nowIso;
              u.lastActiveTime = now;
              found = true;
              break;
            }
          }
          if (!found) {
            list.push({ email, displayName, avatar, activity, lastActiveAt: nowIso, lastActiveTime: now });
          }
          list = list.filter(u => (now - (u.lastActiveTime || new Date(u.lastActiveAt).getTime())) <= 5 * 60 * 1000);
          localStorage.setItem('orbital_presence_list', JSON.stringify(list));
          if (window._orbital_community_bc) {
            window._orbital_community_bc.postMessage({ type: 'presence_updated', list });
          }
          applyPresenceRes({ ok: true, onlineCount: list.length, onlineUsers: list });
        } catch (e) {
          applyPresenceRes({ ok: true, onlineCount: 1, onlineUsers: [] });
        }
      }
    },

    renderOnlineUsersList() {
      const container = document.getElementById('globalOnlineUsersList');
      if (!container) return;
      const users = this.state.onlineUsers || [];
      const currentEmail = (this.getUserEmail() || '').toLowerCase();

      if (users.length === 0) {
        container.innerHTML = '<div class="chat-empty-hint">接続中のプレイヤーはいません。</div>';
        return;
      }

      // Sort: current user first, then active
      const sorted = [...users].sort((a, b) => {
        if (a.email?.toLowerCase() === currentEmail) return -1;
        if (b.email?.toLowerCase() === currentEmail) return 1;
        return new Date(b.lastActiveAt || 0) - new Date(a.lastActiveAt || 0);
      });

      container.innerHTML = sorted.map((u) => {
        const isYou = u.email?.toLowerCase() === currentEmail;
        const name = this.escapeHtml(u.displayName || u.email?.split('@')[0] || 'プレイヤー');
        const icon = this.escapeHtml(u.avatar || '⚡');
        const act = this.escapeHtml(u.activity || '🟢 オンライン');
        const timeAgo = this.formatRelativeTime(u.lastActiveAt);

        return `
          <div class="online-user-card ${isYou ? 'is-current-user' : ''}">
            <div class="online-user-avatar-wrap">
              <div class="online-user-avatar">${icon}</div>
              <span class="online-user-status-dot"></span>
            </div>
            <div class="online-user-info">
              <div class="online-user-name-row">
                <span class="online-user-name">${name}</span>
                ${isYou ? '<span class="online-user-you-tag">あなた</span>' : ''}
              </div>
              <div class="online-user-activity-row">
                <span class="online-user-activity-badge">${act}</span>
                <span class="online-user-time">${timeAgo}</span>
              </div>
            </div>
            <div class="online-user-actions">
              ${!isYou ? `<button type="button" class="online-user-action-btn" onclick="App.mentionUser('${name.replace(/'/g, "\\'")}')" title="チャットでメンション">💬 話しかける</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    },

    formatRelativeTime(dateStr) {
      if (!dateStr) return '今';
      const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
      if (diff < 60) return 'たった今';
      if (diff < 3600) return Math.floor(diff / 60) + '分前';
      return Math.floor(diff / 3600) + '時間前';
    },

    initGlobalChat() {
      // 1. Cross-tab BroadcastChannel
      try {
        if (typeof BroadcastChannel !== 'undefined') {
          window._orbital_community_bc = new BroadcastChannel('orbital_global_community_bc');
          window._orbital_community_bc.onmessage = (ev) => {
            if (!ev || !ev.data) return;
            if (ev.data.type === 'new_chat_message') {
              this.onReceiveNewChatMessage(ev.data.message);
            } else if (ev.data.type === 'presence_updated' && Array.isArray(ev.data.list)) {
              this.state.onlineUsers = ev.data.list;
              const countEl = document.getElementById('onlinePlayerCount');
              const floatCountEl = document.getElementById('chatFloatOnlineCount');
              const windowCountEl = document.getElementById('chatWindowOnlineCount');
              if (countEl) countEl.textContent = ev.data.list.length;
              if (floatCountEl) floatCountEl.textContent = ev.data.list.length;
              if (windowCountEl) windowCountEl.textContent = ev.data.list.length;
              this.renderOnlineUsersList();
            }
          };
        }
      } catch (e) {
        console.warn('BroadcastChannel error:', e);
      }

      // 2. Load initial chat messages
      this.loadGlobalChatMessages();

      // 3. Periodic chat poll (every 10s)
      if (this._chatPollInterval) clearInterval(this._chatPollInterval);
      this._chatPollInterval = setInterval(() => {
        const win = document.getElementById('globalChatWindow');
        if (win && !win.classList.contains('hidden')) {
          this.loadGlobalChatMessages(false);
        }
      }, 10000);
    },

    toggleGlobalChat(forceState) {
      const win = document.getElementById('globalChatWindow');
      if (!win) return;
      const willOpen = forceState !== undefined ? forceState : win.classList.contains('hidden');

      if (willOpen) {
        win.classList.remove('hidden');
        this.clearUnreadChatBadge();
        this.scrollChatToBottom();
        const input = document.getElementById('globalChatInput');
        if (input) setTimeout(() => input.focus(), 100);
        this.loadGlobalChatMessages(false);
      } else {
        win.classList.add('hidden');
      }
    },

    openOnlineUsersList() {
      this.toggleGlobalChat(true);
      this.switchChatTab('online');
    },

    switchChatTab(tabName) {
      const messagesTab = document.getElementById('chatTabMessages');
      const onlineTab = document.getElementById('chatTabOnline');
      const messagesPane = document.getElementById('chatPaneMessages');
      const onlinePane = document.getElementById('chatPaneOnline');

      if (tabName === 'online') {
        if (messagesTab) messagesTab.classList.remove('active');
        if (onlineTab) onlineTab.classList.add('active');
        if (messagesPane) messagesPane.classList.remove('active');
        if (onlinePane) onlinePane.classList.add('active');
        this.refreshPresence();
      } else {
        if (onlineTab) onlineTab.classList.remove('active');
        if (messagesTab) messagesTab.classList.add('active');
        if (onlinePane) onlinePane.classList.remove('active');
        if (messagesPane) messagesPane.classList.add('active');
        this.clearUnreadChatBadge();
        this.scrollChatToBottom();
        const input = document.getElementById('globalChatInput');
        if (input) input.focus();
      }
    },

    loadGlobalChatMessages(showLoading = true) {
      const listEl = document.getElementById('globalChatMessagesList');
      if (showLoading && listEl && (!this.state.globalChatMessages || this.state.globalChatMessages.length === 0)) {
        listEl.innerHTML = '<div class="chat-loading-placeholder">メッセージを読み込み中...</div>';
      }

      const applyMessages = (res) => {
        if (res && Array.isArray(res.messages)) {
          const prevLen = (this.state.globalChatMessages || []).length;
          const prevIds = new Set((this.state.globalChatMessages || []).map(m => m.id));
          const newMsgs = res.messages.filter(m => !prevIds.has(m.id));

          this.state.globalChatMessages = res.messages;
          this.renderGlobalChatMessages();
          if (res.messages.length > prevLen) {
            this.scrollChatToBottom();
          }

          // 初回ロードを除き、新着メッセージの中で自分宛てメンションがあれば通知
          if (prevLen > 0 && newMsgs.length > 0) {
            newMsgs.forEach(msg => {
              if (this.isMentionedToMe(msg)) {
                this.notifyMention(msg);
              }
            });
          }
        }
      };

      if (window.google && google.script && google.script.run && !window._is_mock_gas && typeof google.script.run.getGlobalChatMessages === 'function') {
        google.script.run
          .withSuccessHandler(applyMessages)
          .withFailureHandler((err) => console.warn('getGlobalChatMessages err:', err))
          .getGlobalChatMessages(50);
      } else if (window.google && google.script && google.script.run && window.google.script.run.getGlobalChatMessages) {
        google.script.run.withSuccessHandler(applyMessages).getGlobalChatMessages(50);
      } else {
        try {
          const raw = localStorage.getItem('orbital_global_chat_messages');
          let list = raw ? JSON.parse(raw) : [];
          if (!list || list.length === 0) {
            list = [
              {
                id: 'msg_welcome_1',
                email: 'system@orbital.tcg',
                displayName: 'オーキド博士',
                avatar: '👨‍🔬',
                text: 'オルビタルTCGへようこそ！ここでは全プレイヤーとチャットや対戦募集ができます！✨',
                createdAt: new Date(Date.now() - 3600000).toISOString(),
                isSystem: true
              },
              {
                id: 'msg_welcome_2',
                email: 'trainer_red@orbital.tcg',
                displayName: 'レッド',
                avatar: '🧢',
                text: 'よろしく！だれかバトルしようぜ！⚔️',
                createdAt: new Date(Date.now() - 1800000).toISOString()
              }
            ];
            localStorage.setItem('orbital_global_chat_messages', JSON.stringify(list));
          }
          applyMessages({ ok: true, messages: list });
        } catch (e) {
          applyMessages({ ok: true, messages: [] });
        }
      }
    },

    onReceiveNewChatMessage(msg) {
      if (!msg || !msg.id) return;
      if (!this.state.globalChatMessages) this.state.globalChatMessages = [];
      if (this.state.globalChatMessages.some(m => m.id === msg.id)) return;

      this.state.globalChatMessages.push(msg);
      this.renderGlobalChatMessages();

      const win = document.getElementById('globalChatWindow');
      const isChatOpen = win && !win.classList.contains('hidden');
      const isMessagesTab = document.getElementById('chatPaneMessages')?.classList.contains('active');

      if (isChatOpen && isMessagesTab) {
        this.scrollChatToBottom();
      } else {
        this.incrementUnreadChatBadge();
      }

      // メンション判定と通知のトリガー
      if (this.isMentionedToMe(msg)) {
        this.notifyMention(msg);
      }
    },

    incrementUnreadChatBadge() {
      this.state.unreadChatCount = (this.state.unreadChatCount || 0) + 1;
      const badge = document.getElementById('chatUnreadBadge');
      const dot = document.getElementById('chatTabUnreadDot');
      if (badge) {
        badge.textContent = this.state.unreadChatCount;
        badge.classList.remove('hidden');
      }
      if (dot) dot.classList.remove('hidden');
    },

    clearUnreadChatBadge() {
      this.state.unreadChatCount = 0;
      const badge = document.getElementById('chatUnreadBadge');
      const dot = document.getElementById('chatTabUnreadDot');
      if (badge) badge.classList.add('hidden');
      if (dot) dot.classList.add('hidden');
    },

    scrollChatToBottom() {
      requestAnimationFrame(() => {
        const listEl = document.getElementById('globalChatMessagesList');
        if (listEl) {
          listEl.scrollTop = listEl.scrollHeight;
        }
      });
    },

    insertChatEmoji(emoji) {
      const input = document.getElementById('globalChatInput');
      if (input) {
        input.value = (input.value || '') + emoji;
        input.focus();
      }
    },

    mentionUser(displayName) {
      this.switchChatTab('messages');
      this.requestNotificationPermission();
      const input = document.getElementById('globalChatInput');
      if (input) {
        input.value = `@${displayName} ` + (input.value || '');
        input.focus();
      }
    },

    isMentionedToMe(msg) {
      if (!msg || !msg.text) return false;
      const myEmail = (this.getUserEmail() || '').toLowerCase().trim();
      const senderEmail = (msg.email || '').toLowerCase().trim();
      if (myEmail && senderEmail && myEmail === senderEmail) return false;

      const myDisplayName = (this.getUserDisplayName() || '').trim();
      const myNameFromEmail = myEmail ? myEmail.split('@')[0] : '';

      const candidates = [];
      if (myDisplayName) candidates.push(myDisplayName);
      if (myNameFromEmail && myNameFromEmail !== myDisplayName) candidates.push(myNameFromEmail);
      if (myEmail) candidates.push(myEmail);

      const text = String(msg.text);

      // 全員宛てメンション (@all, @everyone, @全員)
      if (/(?:^|[\s　])@(all|everyone|全員)(?=[\s　、。!?！？]|$)/i.test(text)) {
        return true;
      }

      // 個別ユーザーメンション (@名前)
      for (const name of candidates) {
        if (!name) continue;
        const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`@${escaped}(?=[\\s　、。!?！？]|$)`, 'i');
        if (regex.test(text) || text.toLowerCase().includes('@' + name.toLowerCase())) {
          return true;
        }
      }
      return false;
    },

    notifyMention(msg) {
      if (!msg || !msg.id) return;
      if (!this._notifiedMentionIds) this._notifiedMentionIds = new Set();
      if (this._notifiedMentionIds.has(msg.id)) return;
      this._notifiedMentionIds.add(msg.id);

      const senderName = msg.displayName || msg.email?.split('@')[0] || '誰か';
      const previewText = msg.text ? (msg.text.length > 60 ? msg.text.substring(0, 57) + '...' : msg.text) : '';

      // 1. チャイム音再生（Web Audio API ピロリン♪）
      this.playMentionSound();

      // 2. ブラウザデスクトップ通知（バックグラウンド時でも到達）
      this.showBrowserNotification(
        `🔔 @メンション: ${senderName}さん`,
        previewText,
        () => {
          this.toggleGlobalChat(true);
          this.switchChatTab('messages');
          this.scrollChatToBottom();
        }
      );

      // 3. アプリ内フローティング通知カード
      this.showMentionNotificationPopup(senderName, previewText, msg.avatar || '💬');

      // 4. チャットフローティングボタン・未読バッジ強調
      this.incrementUnreadChatBadge();
      const floatBtn = document.getElementById('globalChatFloatBtn');
      if (floatBtn) {
        floatBtn.classList.add('chat-float-mention-pulse');
        setTimeout(() => floatBtn.classList.remove('chat-float-mention-pulse'), 5000);
      }
    },

    showMentionNotificationPopup(sender, text, avatar) {
      try {
        const existing = document.getElementById('mentionNotificationCard');
        if (existing) existing.remove();

        const popup = document.createElement('div');
        popup.id = 'mentionNotificationCard';
        popup.className = 'mention-notification-popup';
        popup.innerHTML = `
          <div class="mention-icon">${avatar || '🔔'}</div>
          <div class="mention-notification-content">
            <div class="mention-notification-title">
              <span>🔔 @メンションが届きました</span>
              <button type="button" class="mention-notification-close" title="閉じる" onclick="event.stopPropagation(); this.closest('.mention-notification-popup').remove();">&times;</button>
            </div>
            <div class="mention-notification-body">
              <strong>${this.escapeHtml(sender)}:</strong> ${this.escapeHtml(text)}
            </div>
          </div>
        `;

        popup.onclick = () => {
          popup.remove();
          this.toggleGlobalChat(true);
          this.switchChatTab('messages');
          this.scrollChatToBottom();
        };

        document.body.appendChild(popup);

        setTimeout(() => {
          if (popup && popup.parentNode) {
            popup.style.animation = 'mentionSlideIn 0.3s reverse forwards';
            setTimeout(() => popup.remove(), 300);
          }
        }, 7000);
      } catch (e) {
        console.warn('Error showing mention popup:', e);
      }
    },

    playMentionSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!this._audioCtx) {
          this._audioCtx = new AudioContext();
        }
        if (this._audioCtx.state === 'suspended') {
          this._audioCtx.resume();
        }
        const ctx = this._audioCtx;
        const now = ctx.currentTime;

        // 心地よい2音アルペジオ (D5 587.33Hz -> A5 880.00Hz)
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now);
        gain1.gain.setValueAtTime(0.18, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.32);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880.00, now + 0.11);
        gain2.gain.setValueAtTime(0.22, now + 0.11);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.11);
        osc2.stop(now + 0.55);
      } catch (e) {
        console.warn('Audio playback error:', e);
      }
    },

    requestNotificationPermission() {
      if (typeof window !== 'undefined' && 'Notification' in window && Notification.permission === 'default') {
        try {
          Notification.requestPermission();
        } catch(e) {}
      }
    },

    showBrowserNotification(title, body, onClick) {
      if (typeof window === 'undefined' || !('Notification' in window)) return;
      if (Notification.permission === 'granted') {
        try {
          const n = new Notification(title, {
            body: body,
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🔔</text></svg>'
          });
          if (typeof onClick === 'function') {
            n.onclick = () => {
              window.focus();
              onClick();
              n.close();
            };
          }
        } catch(e) {}
      }
    },

    formatChatMentionText(rawText) {
      if (!rawText) return '';
      let escaped = this.escapeHtml(rawText);
      const myDisplayName = (this.getUserDisplayName() || '').trim();
      const myEmail = (this.getUserEmail() || '').trim();
      const myNameFromEmail = myEmail ? myEmail.split('@')[0] : '';

      // @all, @everyone, @全員 をタグ化
      escaped = escaped.replace(/(^|[\s　])@(all|everyone|全員)(?=[\s　、。!?！？]|$)/gi, (match, prefix, tag) => {
        return prefix + `<span class="chat-mention-tag is-me">@${tag}</span>`;
      });

      // @ユーザー名 をタグ化
      escaped = escaped.replace(/(^|[\s　])@([^\s　、。!?！？@]{1,30})/g, (match, prefix, targetName) => {
        const isMe = (myDisplayName && targetName.toLowerCase() === myDisplayName.toLowerCase()) ||
                     (myNameFromEmail && targetName.toLowerCase() === myNameFromEmail.toLowerCase()) ||
                     (myEmail && targetName.toLowerCase() === myEmail.toLowerCase());
        return prefix + `<span class="chat-mention-tag ${isMe ? 'is-me' : ''}">@${targetName}</span>`;
      });

      return escaped;
    },

    handleSendChatMessage(e) {
      if (e && e.preventDefault) e.preventDefault();
      const input = document.getElementById('globalChatInput');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;

      if (!this.requireLogin('チャット投稿')) return;
      const email = this.getUserEmail();
      const displayName = this.getUserDisplayName() || 'トレーナー';
      const avatar = this.getUserAvatar() || '⚡';

      const tempId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      const newMsg = {
        id: tempId,
        email,
        displayName,
        avatar,
        text,
        createdAt: new Date().toISOString()
      };

      // Clear input immediately
      input.value = '';

      // Optimistically add message
      if (!this.state.globalChatMessages) this.state.globalChatMessages = [];
      this.state.globalChatMessages.push(newMsg);
      this.renderGlobalChatMessages();
      this.scrollChatToBottom();

      // Broadcast locally
      if (window._orbital_community_bc) {
        window._orbital_community_bc.postMessage({ type: 'new_chat_message', message: newMsg });
      }

      // Send to backend
      if (window.google && google.script && google.script.run && !window._is_mock_gas && typeof google.script.run.sendGlobalChatMessage === 'function') {
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.message) {
              const idx = this.state.globalChatMessages.findIndex(m => m.id === tempId);
              if (idx !== -1) this.state.globalChatMessages[idx] = res.message;
              this.renderGlobalChatMessages();
            }
          })
          .withFailureHandler((err) => {
            this.toast('チャット送信エラー: ' + (err.message || err), true);
          })
          .sendGlobalChatMessage(newMsg);
      } else if (window.google && google.script && google.script.run && window.google.script.run.sendGlobalChatMessage) {
        google.script.run.sendGlobalChatMessage(newMsg);
      } else {
        // Mock save
        try {
          const raw = localStorage.getItem('orbital_global_chat_messages') || '[]';
          let list = JSON.parse(raw);
          if (!Array.isArray(list)) list = [];
          list.push(newMsg);
          if (list.length > 200) list = list.slice(list.length - 200);
          localStorage.setItem('orbital_global_chat_messages', JSON.stringify(list));
        } catch (e) {}
      }
    },

    renderGlobalChatMessages() {
      const container = document.getElementById('globalChatMessagesList');
      if (!container) return;
      const messages = this.state.globalChatMessages || [];
      const currentEmail = (this.getUserEmail() || '').toLowerCase();

      if (messages.length === 0) {
        container.innerHTML = '<div class="chat-empty-hint">チャットメッセージはまだありません。<br>最初のメッセージを送信してみましょう！</div>';
        return;
      }

      container.innerHTML = messages.map((m) => {
        if (m.isSystem) {
          return `
            <div class="chat-msg-row chat-msg-system">
              <div class="chat-msg-text">${this.escapeHtml(m.text)}</div>
            </div>
          `;
        }

        const isMentioned = this.isMentionedToMe(m);
        const isSelf = m.email && m.email.toLowerCase() === currentEmail;
        const name = this.escapeHtml(m.displayName || m.email?.split('@')[0] || 'プレイヤー');
        const icon = this.escapeHtml(m.avatar || '⚡');
        const timeStr = m.createdAt ? new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        const formattedText = this.formatChatMentionText(m.text);
        const mentionBadge = isMentioned ? '<span class="chat-mention-pill">🔔 あなた宛</span>' : '';

        return `
          <div class="chat-msg-row ${isSelf ? 'chat-msg-self' : 'chat-msg-other'} ${isMentioned ? 'chat-msg-mentioned' : ''}" data-msg-id="${this.escapeHtml(m.id || '')}">
            <div class="chat-msg-avatar" title="${name}">${icon}</div>
            <div class="chat-msg-body">
              <div class="chat-msg-header">
                <span class="chat-msg-sender">${name}</span>
                ${mentionBadge}
                <span class="chat-msg-time">${timeStr}</span>
              </div>
              <div class="chat-msg-text">${formattedText}</div>
            </div>
          </div>
        `;
      }).join('');
    },

    openFeedbackModal() {
      const modal = document.getElementById('feedbackModal');
      const emailInput = document.getElementById('feedbackEmailInput');
      const msgInput = document.getElementById('feedbackMessageInput');

      if (emailInput && this.state.userProfile?.email) {
        emailInput.value = this.state.userProfile.email;
      }
      if (msgInput) msgInput.value = '';

      this.selectFeedbackCategory('💡 機能要望');

      if (modal) {
        modal.classList.remove('hidden');
        modal.style.display = 'grid';
      }
    },

    closeFeedbackModal() {
      const modal = document.getElementById('feedbackModal');
      if (modal) {
        modal.classList.add('hidden');
        modal.style.display = 'none';
      }
    },

    selectFeedbackCategory(category) {
      this.state.selectedFeedbackCategory = category;
      document.querySelectorAll('.feedback-cat-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.cat === category);
      });
    },

    submitFeedback() {
      const emailInput = document.getElementById('feedbackEmailInput');
      const msgInput = document.getElementById('feedbackMessageInput');
      const btn = document.getElementById('submitFeedbackBtn');

      const email = (emailInput ? emailInput.value : '').trim() || (this.getUserEmail() || '');
      const message = (msgInput ? msgInput.value : '').trim();
      const category = this.state.selectedFeedbackCategory || '💡 機能要望';

      if (!message) {
        this.toast('ご意見・要望の内容を入力してください。', true);
        return;
      }

      if (btn) btn.disabled = true;

      const applySuccess = (res) => {
        if (btn) btn.disabled = false;
        this.toast('📮 ご意見を受け付けました！貴重なフィードバックありがとうございます。');
        this.closeFeedbackModal();
      };

      if (window.google && google.script && google.script.run && typeof google.script.run.submitFeedback === 'function' && !window._is_mock_gas) {
        google.script.run.withSuccessHandler((res) => {
          if (!res || !res.ok) {
            if (btn) btn.disabled = false;
            this.toast(res?.message || '送信に失敗しました。', true);
            return;
          }
          applySuccess(res);
        }).withFailureHandler((err) => {
          if (btn) btn.disabled = false;
          this.toast('送信エラー: ' + (err.message || err), true);
        }).submitFeedback({ email, category, message });
      } else {
        setTimeout(() => {
          applySuccess({ ok: true });
        }, 200);
      }
    },

    openAdminFeedbackModal() {
      const modal = document.getElementById('adminFeedbackModal');
      const listGrid = document.getElementById('adminFeedbackListGrid');
      if (!modal) return;

      modal.classList.remove('hidden');
      modal.style.display = 'grid';

      if (listGrid) listGrid.innerHTML = '<div style="text-align:center; color:var(--muted); padding:30px;">読み込み中...</div>';

      const renderList = (list) => {
        if (!listGrid) return;
        if (!list || list.length === 0) {
          listGrid.innerHTML = '<div style="text-align:center; color:var(--muted); padding:30px;">まだご意見は届いていません。</div>';
          return;
        }
        listGrid.innerHTML = list.map((item) => {
          const dateStr = item.createdAt ? new Date(item.createdAt).toLocaleString('ja-JP') : '日時不明';
          return `
            <div class="feedback-item-card">
              <div class="feedback-item-header">
                <span class="feedback-item-category">${this.escape(item.category || 'その他')}</span>
                <span>👤 ${this.escape(item.email || '匿名')} • ${this.escape(dateStr)}</span>
              </div>
              <div class="feedback-item-body">${this.escape(item.message || '')}</div>
            </div>
          `;
        }).join('');
      };

      if (window.google && google.script && google.script.run && typeof google.script.run.getFeedbackList === 'function' && !window._is_mock_gas) {

        }).getFeedbackList(this.state.adminToken);
      } else {
        try {

    openAdminLogin() {this.el('adminLoginModal').classList.remove('hidden');this.el('adminPassword').focus();},

    loginAdmin() {
      const password = (this.el('adminPassword') ? this.el('adminPassword').value : '').trim();
      if (!password) { this.toast('パスワードを入力してください。', true); return; }
      if (password !== '3838') { this.toast('管理者パスワードが正しくありません。', true); return; }
      const btn = this.el('adminLoginSubmit');
      if (btn) btn.disabled = true;

      if (window.google && google.script && google.script.run && typeof google.script.run.loginAdmin === 'function' && !window._is_mock_gas) {
        google.script.run.withSuccessHandler((result) => {
          if (btn) btn.disabled = false;
          this.state.adminToken = result ? result.token : 'admin_token';
          safeSetSession('orbital_admin_token', this.state.adminToken);
          if (this.el('adminPassword')) this.el('adminPassword').value = '';
          this.closeAdminLogin();
          this.updateAdminStatus();
          this.toast('🔑 管理者としてログインしました。');
        }).withFailureHandler((err) => {
          if (btn) btn.disabled = false;
          this.toast('ログイン失敗: ' + (err.message || err), true);
        }).loginAdmin(password);
      } else {
        setTimeout(() => {
          if (btn) btn.disabled = false;
          const token = 'mock_admin_token_' + Date.now();
          this.state.adminToken = token;
          safeSetSession('orbital_admin_token', token);
          if (this.el('adminPassword')) this.el('adminPassword').value = '';
          this.closeAdminLogin();
          this.updateAdminStatus();
          this.toast('🔑 管理者としてログインしました (ローカルモード)');
        }, 200);
      }
    },

    logoutAdmin() {
      const token = this.state.adminToken;
      this.state.adminToken = '';
      safeRemoveSession('orbital_admin_token');
      this.updateAdminStatus();
      google.script.run.withFailureHandler(() => {}).logoutAdmin(token);
      this.toast('ログアウトしました。');
    },

    updateAdminStatus() {
      const status = this.el('adminStatus');
      const button = this.el('adminLoginButton');
      const pubBtn = this.el('publishUpdateBtn');
      const adminUis = document.querySelectorAll('.admin-only-ui');

      if (this.isAdmin()) {
        if (status) status.textContent = '管理者モード';
        if (button) button.textContent = 'ログアウト';
        if (pubBtn) pubBtn.classList.remove('hidden');
        adminUis.forEach((el) => el.classList.remove('hidden'));

        if (button) button.textContent = '管理者ログイン';

        if (this.state.page === 'create' || this.state.page === 'cards') {
          this.showPage('home');

      }
    },

    /* ---------- アプデ配信・通知機能 ---------- */

    checkForUpdates() {
      if (!window.google || !google.script || !google.script.run || window._is_mock_gas) return;
      try {
        google.script.run
          .withSuccessHandler((res) => {
            if (!res || !res.ok || !res.update) return;
            const update = res.update;
            this.state.latestUpdate = update;
            const currentVer = this.state.currentVersion || 'v1.0.0';
            if (update.version && update.version !== currentVer) {
              const banner = this.el('appUpdateTopBanner');
              const bannerText = this.el('appUpdateTopBannerText');
              if (bannerText) {
        bannerText.textContent = '🚀 新しいアップデート (' + update.version + ': ' + update.title + ') が配信されました！';
              }
              if (banner) banner.classList.remove('hidden');
            }
          })
          .getLatestAppUpdate();
      } catch (e) {
        console.warn('checkForUpdates warning:', e);
      }
    },

    openUpdatePublishModal() {
      if (!this.requireAdmin()) return;
      const modal = this.el('appUpdatePublishModal');
      if (!modal) return;
      const verInput = this.el('updateVersionInput');
      if (verInput && !verInput.value) {
        verInput.value = 'v1.1.0';
      }
      modal.classList.remove('hidden');
    },

    closeUpdatePublishModal() {
      const modal = this.el('appUpdatePublishModal');
      if (modal) modal.classList.add('hidden');
    },

    submitAppUpdate() {
      if (!this.requireAdmin()) return;
      const verInput = this.el('updateVersionInput');
      const titleInput = this.el('updateTitleInput');
      const notesInput = this.el('updateNotesInput');
      const syncCheck = this.el('updateSyncCardsCheckbox');

      const version = verInput ? verInput.value.trim() : '';
      const title = titleInput ? titleInput.value.trim() : '';
      const notes = notesInput ? notesInput.value.trim() : '';
      const syncCards = syncCheck ? syncCheck.checked : true;

      if (!version || !title) {
        this.toast('バージョン番号とタイトルを入力してください。', true);
        return;
      }

      const btn = this.el('submitAppUpdateBtn');
      if (btn) btn.disabled = true;

      google.script.run.withSuccessHandler((res) => {
        if (btn) btn.disabled = false;
        if (!res || !res.ok) {
          this.toast('配信に失敗しました: ' + (res?.message || '不明なエラー'), true);
          return;
        }
        this.closeUpdatePublishModal();
        this.toast('🎉 アプデ (' + version + ') の配信が完了しました！');
        this.state.currentVersion = version;
        try { localStorage.setItem('orbital_app_version', version); } catch(e) {}
        if (titleInput) titleInput.value = '';
        if (notesInput) notesInput.value = '';
        this.checkForUpdates();
      }).withFailureHandler((err) => {
        if (btn) btn.disabled = false;
        this.toast('配信失敗: ' + (err.message || err), true);
      }).publishAppUpdate({ version, title, notes, syncCards }, this.state.adminToken);
    },

    openUpdateNoticeModal() {
      const update = this.state.latestUpdate;
      if (!update) return;
      const modal = this.el('appUpdateNoticeModal');
      if (!modal) return;

      const titleEl = this.el('updateNoticeTitleDisplay');
      const verBadge = this.el('updateNoticeVersionBadge');
      const dateBadge = this.el('updateNoticeDateBadge');
      const notesEl = this.el('updateNoticeNotesDisplay');

      if (titleEl) titleEl.textContent = '🚀 ' + (update.title || '新しいアップデートが配信されました！');
      if (verBadge) verBadge.textContent = update.version || 'v1.0.0';
      if (dateBadge) dateBadge.textContent = update.publishedAt || '';
      if (notesEl) notesEl.textContent = update.notes || '詳細なアップデート内容はありません。';

      modal.classList.remove('hidden');
    },

    closeUpdateNoticeModal() {
      const modal = this.el('appUpdateNoticeModal');
      if (modal) modal.classList.add('hidden');
    },

    applyAppUpdate() {
      const update = this.state.latestUpdate;
      if (!update) {
        this.closeUpdateNoticeModal();
        return;
      }
      const version = update.version || 'v1.0.0';
      try { localStorage.setItem('orbital_app_version', version); } catch(e) {}
      this.state.currentVersion = version;

      const banner = this.el('appUpdateTopBanner');
      if (banner) banner.classList.add('hidden');

      this.closeUpdateNoticeModal();

      if (window.CardSystem && window.CardSystem.loadCards) {
        window.CardSystem.loadCards(true);
      } else {
        this.loadCards();
      }
      if (window.DeckSystem && window.DeckSystem.loadDecks) {
        window.DeckSystem.loadDecks();
      }

        this.toast('🎉 バージョン ' + version + ' へ更新を適用しました！');
    },

    initStartupLoader() {
      const overlay = this.el('startupLoadingOverlay');
      const bar = this.el('startupProgressBar');
      const text = this.el('startupStatusText');

      const hideAllLoaders = () => {
        try {
          if (overlay) {
            overlay.style.display = 'none';
            overlay.classList.add('hidden');
            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          }
          const gasLoader = document.getElementById('gas-loader-screen');
          if (gasLoader) {
            gasLoader.style.display = 'none';
            if (gasLoader.parentNode) gasLoader.parentNode.removeChild(gasLoader);
          }
        } catch (e) {}
      };

      // ハードセーフティタイムアウト（最大3.5秒でローディング画面を強制削除）
      const safetyTimeout = setTimeout(hideAllLoaders, 3500);

      if (!overlay || !bar) {
        clearTimeout(safetyTimeout);
        hideAllLoaders();
        return;
      }

      let progress = 0;
      const updateProgress = (target, statusText) => {
        progress = Math.max(progress, target);
        bar.style.width = progress + '%';
        if (statusText && text) text.textContent = statusText;
      };

      updateProgress(20, 'システムコンポーネント初期化中…');

      setTimeout(async () => {
        try {
          updateProgress(50, 'GitHubリポジトリからデータ・モジュールを検出中…');
          const savedRepo = localStorage.getItem('ORBITAL_GITHUB_REPO');

          if (window.google && google.script && google.script.run && !window._is_mock_gas) {
            updateProgress(80, 'スプレッドシートからカードデータを読み込み中…');
            this.loadCards();
          } else if (savedRepo) {
            updateProgress(75, 'GitHub (' + savedRepo + ') から最新データを取得中…');
            const success = await this.loadFromGitHub(savedRepo, false);
            if (!success) {
              updateProgress(85, 'ローカルデータに復帰中…');
              this.loadDefaultLocalCards();
            }
          } else {
            updateProgress(80, 'カードライブラリをロード中…');
            this.loadCards();
          }
          updateProgress(100, '起動完了！');
        } catch (err) {
          console.warn('Startup loader warning:', err);
          this.loadDefaultLocalCards();
        } finally {
          clearTimeout(safetyTimeout);
          setTimeout(hideAllLoaders, 150);
        }
      }, 100);
    },

    getAllCards() {
      // 1. 基本マスターカード（スプレッドシート/DBロード済みカード）
      const base = (this.state && Array.isArray(this.state.cards)) ? [...this.state.cards] : [];

      // 2. CardSystem.state.cards があればマージ
      if (window.CardSystem && window.CardSystem.state && Array.isArray(window.CardSystem.state.cards)) {
        window.CardSystem.state.cards.forEach((c) => {
          if (c && !base.some((x) => x && String(x.id || x.name) === String(c.id || c.name))) {
            base.push(c);
          }
        });
      }

      // 3. CardSystem.customCards（自作カード等）があればマージ
      if (window.CardSystem && Array.isArray(window.CardSystem.customCards)) {
        window.CardSystem.customCards.forEach((c) => {
          if (c && !base.some((x) => x && String(x.id || x.name) === String(c.id || c.name))) {
            base.push(c);
          }
        });
      }

      if (base.length > 0) return base;

      if (window.CardSystem && typeof window.CardSystem.getCards === 'function') {
        const res = window.CardSystem.getCards();
        if (Array.isArray(res) && res.length > 0) return res;
      }
      return [];
    },

    loadCards() {
      const countEl = this.el('homeCardCount');
      if (countEl) countEl.textContent = '読み込み中…';

      if (window.google && google.script && google.script.run && !window._is_mock_gas) {
        try {
          console.log('📡 Requesting getCards from Spreadsheet via GAS...');
          google.script.run
            .withSuccessHandler((cards) => {
              console.log('✅ Received cards from Spreadsheet:', cards);
              const remoteNormalized = this.normalizeCardData(cards);

              // スプレッドシート側の書き込み反映遅延対策: ローカルキャッシュにのみ存在する新カードを保護・マージ
              const localCandidates = [];
              try {
                const c1 = JSON.parse(localStorage.getItem('ORBITAL_CUSTOM_CARDS') || '[]');
                const c2 = JSON.parse(localStorage.getItem('orbital_cards') || '[]');
                const c3 = JSON.parse(localStorage.getItem('orbital_cards_mock') || '[]');
                const mergedCandidates = [...c1, ...c2, ...c3];
                mergedCandidates.forEach(c => {
                  if (c && (c.id || c.name)) {
                    if (!localCandidates.some(x => String(x.id || x.name) === String(c.id || c.name))) {
                      localCandidates.push(c);
                    }
                  }
                });
              } catch(e) {}

              const mergedList = [...remoteNormalized];
              localCandidates.forEach(lc => {
                const key = String(lc.id || lc.name);
                const exists = mergedList.some(r => String(r.id || r.name) === key);
                if (!exists) {
                  console.log('✨ Merging newly saved local card not yet in Sheets query:', lc.name || lc.id);
                  mergedList.push(lc);
                }
              });

              this.state.cards = mergedList;
              const el = this.el('homeCardCount');
              if (el) el.textContent = this.state.cards.length + '枚のカード';
              if (window.CardSystem) {
                if (typeof CardSystem.renderList === 'function') CardSystem.renderList();
                if (typeof CardSystem.renderRecent === 'function') CardSystem.renderRecent();
              }
              if (window.DeckSystem && typeof DeckSystem.syncCardPool === 'function') {
                DeckSystem.syncCardPool();
              }
            })
            .withFailureHandler((err) => {
              console.error('❌ GAS getCards error:', err);
              this.loadDefaultLocalCards();
            })
            .getCards();
        } catch (e) {
          console.error('❌ Exception in getCards runner:', e);
          this.loadDefaultLocalCards();
        }
        return;
      }

      const savedGitHubRepo = localStorage.getItem('ORBITAL_GITHUB_REPO');
      if (savedGitHubRepo) {
        this.loadFromGitHub(savedGitHubRepo);
        return;
      }

      this.loadDefaultLocalCards();
    },

    normalizeCardData(rawCards) {
      if (!Array.isArray(rawCards)) return [];
      return rawCards.map((c, i) => {
        if (!c) return c;

        // 全プロパティキーを小文字・記号除去でインデックス化
        const normKeyMap = {};
        Object.keys(c).forEach(k => {
          if (k != null) {
            const cleanKey = String(k).trim().toLowerCase().replace(/[\s　_\-–—]+/g, '');
            normKeyMap[cleanKey] = c[k];
          }
        });

        const getVal = (candidates) => {
          for (let cand of candidates) {
            if (c[cand] !== undefined && c[cand] !== null && String(c[cand]).trim() !== '') {
              return c[cand];
            }
            const cleanCand = String(cand).trim().toLowerCase().replace(/[\s　_\-–—]+/g, '');
            if (normKeyMap[cleanCand] !== undefined && normKeyMap[cleanCand] !== null && String(normKeyMap[cleanCand]).trim() !== '') {
              return normKeyMap[cleanCand];
            }
          }
          return '';
        };

        const image = String(getVal(['image', 'imageUrl', 'image_url', '画像url', '画像URL', '画像', 'イラスト', '写真', 'url', 'img', 'src']) || '').trim();
        const attack1Name = String(getVal(['attack1Name', 'attack1name', 'attack1', 'ワザ1', 'ワザ1名', '技1', '技1名']) || '').trim();
        const attack1Damage = getVal(['attack1Damage', 'attack1damage', 'ワザ1ダメージ', '技1ダメージ', 'ダメージ1']);
        const attack1Energy = String(getVal(['attack1Energy', 'attack1energy', 'ワザ1エネ', 'ワザ1エネルギー', '技1エネ', 'コスト1']) || '').trim();
        const attack1Text = String(getVal(['attack1Text', 'attack1text', 'ワザ1説明', 'ワザ1効果', 'ワザ1テキスト', '技1効果']) || '').trim();

        const attack2Name = String(getVal(['attack2Name', 'attack2name', 'attack2', 'ワザ2', 'ワザ2名', '技2', '技2名']) || '').trim();
        const attack2Damage = getVal(['attack2Damage', 'attack2damage', 'ワザ2ダメージ', '技2ダメージ', 'ダメージ2']);
        const attack2Energy = String(getVal(['attack2Energy', 'attack2energy', 'ワザ2エネ', 'ワザ2エネルギー', '技2エネ', 'コスト2']) || '').trim();
        const attack2Text = String(getVal(['attack2Text', 'attack2text', 'ワザ2説明', 'ワザ2効果', 'ワザ2テキスト', '技2効果']) || '').trim();

        const abilityName = String(getVal(['abilityName', 'abilityname', 'ability', '特性', '特性名', 'とくせい']) || '').trim();
        const abilityText = String(getVal(['abilityText', 'abilitytext', '特性説明', '特性効果', '特性テキスト']) || '').trim();

        const weakness = String(getVal(['weakness', '弱点', 'じゃくてん', '弱点タイプ']) || '').trim();
        const resistance = String(getVal(['resistance', '抵抗力', '抵抗', 'ていこう', '抵抗タイプ']) || '').trim();
        const retreat = getVal(['retreat', 'にげる', '逃げる', '逃げ', '逃げエネ', '逃げコスト', 'にげるコスト', 'にげるエネルギー']);

        let description = String(getVal(['description', '説明', '説明文', 'テキスト', 'フレーバー', 'text', 'info']) || '').trim();

        // 【自動修復】もし image が空で、description に URL (http/https) が入っている場合、画像URLとして自動修復
        if (!image && /^https?:\/\//i.test(description)) {
          image = description;
          description = '';
        }

        let name = String(getVal([
          'name', 'Name', 'NAME', 'カード名', '名前', '名称', 'カード', 'card', 'Card',
          'CardName', 'Card Name', 'card_name', 'title', 'Title', 'タイトル',
          'ポケモン名', 'ポケモン', 'キャラクター名', 'キャラ名', 'キャラクター', 'キャラ',
          'モンスター名', 'モンスター', 'ユニット名', 'ユニット', '見出し', 'Pokemon', 'pokemon', 'POKEMON'
        ]) || c.name || '').trim();

        // 1. もし名前が見つからない、または「カード_1」などの自動連番名になっている場合、B列/A列・他属性から真の名前を復元
        if (!name || /^カード_\d+$/.test(name)) {
          if (c._col1 && typeof c._col1 === 'string' && String(c._col1).trim() && isNaN(Number(c._col1)) && !/^カード_\d+$/.test(String(c._col1).trim())) {
            name = String(c._col1).trim();
          } else if (c._rawRow && c._rawRow[1] && typeof c._rawRow[1] === 'string' && String(c._rawRow[1]).trim() && isNaN(Number(c._rawRow[1])) && !/^カード_\d+$/.test(String(c._rawRow[1]).trim())) {
            name = String(c._rawRow[1]).trim();
          } else if (c._col0 && typeof c._col0 === 'string' && String(c._col0).trim() && !String(c._col0).startsWith('card_') && isNaN(Number(c._col0)) && !/^カード_\d+$/.test(String(c._col0).trim())) {
            name = String(c._col0).trim();
          }
        }

        // 2. それでも見つからない場合、オブジェクト内の最初の文字列プロパティから探索
        if (!name || /^カード_\d+$/.test(name)) {
          const vals = Object.entries(c);
          for (const [k, v] of vals) {
            if (k.startsWith('_') || k === 'id' || k === 'category' || k === 'type' || k === 'rarity' || k === 'hp' || k === 'image') continue;
            if (typeof v === 'string' && v.trim() && isNaN(Number(v)) && !/^https?:\/\//.test(v) && v.length <= 30 && !/^カード_\d+$/.test(v.trim())) {
              name = v.trim();
              break;
            }
          }
        }

        // 3. IDから名前の推測（例: card_pikachu -> pikachu, card_リザードン -> リザードン）
        if (!name || /^カード_\d+$/.test(name)) {
          const rawId = String(c.id || '');
          const idMatch = rawId.match(/^(?:card_)?([a-zA-Z\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]{2,})/);
          if (idMatch && idMatch[1] && !/^\d+$/.test(idMatch[1]) && idMatch[1] !== 'test') {
            name = idMatch[1];
          }
        }

        if (!name) {
          name = 'カード_' + (i + 1);
        }
        const category = String(getVal(['category', 'Category', 'カテゴリ', '区分', '種別', '分類']) || c.category || 'たね').trim();
        const isTrainerCategory = category === 'グッズ' || category === 'サポート' || category === 'トレーナー' || category === 'スタジアム' || category === 'ポケモンのどうぐ' || category === 'ポケモンの道具' || category.includes('どうぐ') || category.includes('道具');
        const cardType = isTrainerCategory ? '' : String(getVal(['type', 'Type', 'タイプ', '属性']) || c.type || '無').trim();
        const rarity = String(getVal(['rarity', 'Rarity', 'レアリティ', 'レア', 'R']) || c.rarity || 'C').trim();
        const hpVal = getVal(['hp', 'HP', 'たいりょく', '体力']);
        const hp = hpVal !== '' && hpVal != null ? Number(hpVal) : (c.hp !== '' && c.hp != null ? Number(c.hp) : '');
        const preEvolution = String(getVal(['preEvolution', '進化前', '進化元']) || c.preEvolution || '').trim();
        const artLayout = String(getVal(['artLayout', 'アートレイアウト', 'レイアウト']) || c.artLayout || 'standard').trim();
        const imageFit = String(getVal(['imageFit', '画像フィット']) || c.imageFit || 'cover').trim();
        const imageScale = getVal(['imageScale', '画像拡大']) !== '' ? Number(getVal(['imageScale', '画像拡大'])) : (c.imageScale != null ? Number(c.imageScale) : 100);
        const imageX = getVal(['imageX', '画像位置X']) !== '' ? Number(getVal(['imageX', '画像位置X'])) : (c.imageX != null ? Number(c.imageX) : 50);
        const imageY = getVal(['imageY', '画像位置Y']) !== '' ? Number(getVal(['imageY', '画像位置Y'])) : (c.imageY != null ? Number(c.imageY) : 50);
        const imageHeight = getVal(['imageHeight', '画像高さ']) !== '' ? Number(getVal(['imageHeight', '画像高さ'])) : (c.imageHeight != null ? Number(c.imageHeight) : '');
        const subCategory = String(getVal(['subCategory', 'サブカテゴリ']) || c.subCategory || '').trim();
        const isEx = !!(c.isEx || getVal(['isEx', 'ex', 'EX']) || (name && /[\s_・-]ex|ex$/i.test(name)));
        const isAceSpec = !!(c.isAceSpec || c.aceSpec || getVal(['isAceSpec', 'aceSpec', 'ACESPEC', 'エーススペック']));

        return {
          ...c,
          id: String(getVal(['id', 'ID', 'カードID', 'コード']) || c.id || ('card_' + (i + 1))),
          name: name,
          type: cardType,
          category: category,
          rarity: rarity,
          hp: hp,
          image: image,
          abilityName: abilityName,
          abilityText: abilityText,

    loadDefaultLocalCards() {
      try {
        const rawCustom = localStorage.getItem('ORBITAL_CUSTOM_CARDS');
        const rawMock = localStorage.getItem('orbital_cards_mock');
        const rawCards = localStorage.getItem('orbital_cards');
        const listCustom = rawCustom ? JSON.parse(rawCustom) : [];
        const listMock = rawMock ? JSON.parse(rawMock) : [];
        const listCards = rawCards ? JSON.parse(rawCards) : [];
        const combined = [
          ...(Array.isArray(this.state.cards) ? this.state.cards : []),
          ...(Array.isArray(listCustom) ? listCustom : []),
          ...(Array.isArray(listCards) ? listCards : []),
          ...(Array.isArray(listMock) ? listMock : [])
        ];
        const unique = [];
        combined.forEach(c => {
          if (c && (c.id || c.name)) {
            const key = String(c.id || c.name);
            if (!unique.some(x => String(x.id || x.name) === key)) {
              unique.push(c);
            }
          }
        });
        if (unique.length > 0) {
          this.state.cards = unique;
        }
      } catch (e) {
        console.error('Error loading default local cards:', e);
      }

      this.state.cards = Array.isArray(this.state.cards) ? this.state.cards : [];
      const el = this.el('homeCardCount');
      if (el) el.textContent = this.state.cards.length + '枚のカード';
      if (window.CardSystem) {
        if (typeof CardSystem.renderList === 'function') CardSystem.renderList();
        if (typeof CardSystem.renderRecent === 'function') CardSystem.renderRecent();
      }
      if (window.DeckSystem) {
        if (typeof DeckSystem.syncCardPool === 'function') DeckSystem.syncCardPool();
      }
    },

    parseGitHubRawBaseUrl(inputStr) {
      if (!inputStr) return null;
      let clean = String(inputStr).trim();
      if (!clean) return null;

      // https://raw.githubusercontent.com/owner/repo/branch/
      if (clean.includes('raw.githubusercontent.com')) {
        return clean.endsWith('/') ? clean : clean + '/';
      }

      // https://github.com/owner/repo or owner/repo
      clean = clean.replace(/^https?:\/\/github\.com\//i, '');
      clean = clean.replace(/\/$/, '');
      const parts = clean.split('/');
      if (parts.length >= 2) {
        const owner = parts[0];
        const repo = parts[1];
        const branch = parts[3] || 'main';
        return 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/' + branch + '/';
      }
      return null;
    },

    loadFromGitHub: async function(repoInput, showToast = true) {
      const baseUrl = this.parseGitHubRawBaseUrl(repoInput);
      if (!baseUrl) {
        if (showToast) this.toast('有効なGitHubリポジトリURL（例: owner/repository）を入力してください。', true);
        return false;
      }

      if (showToast) this.toast('🐙 GitHubリポジトリからデータを同期中…');
      const countEl = this.el('homeCardCount');
      if (countEl) countEl.textContent = 'GitHub同期中…';

      const fetchWithTimeout = async (url, timeoutMs = 4000) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(timer);
          return res;
        } catch (e) {
          clearTimeout(timer);
          throw e;
        }
      };

      try {
        const cardsUrl = baseUrl + 'cards.json';
        const cardsRes = await fetchWithTimeout(cardsUrl, 4000);
        if (!cardsRes.ok) {
          throw new Error('cards.json の取得に失敗しました (HTTP ' + cardsRes.status + ')');
        }
        let cardsData = await cardsRes.json();
        if (!Array.isArray(cardsData) && cardsData && Array.isArray(cardsData.cards)) {
          cardsData = cardsData.cards;
        }

        if (Array.isArray(cardsData) && cardsData.length > 0) {
          cardsData = cardsData.map(c => {
            if (!c) return c;
            let img = String(c.image || '').trim();
            if (img && !img.startsWith('http') && !img.startsWith('data:')) {
              img = baseUrl + img.replace(/^\//, '');
            }
            return { ...c, image: img };
          });

          this.state.cards = this.normalizeCardData(cardsData);
          localStorage.setItem('ORBITAL_GITHUB_REPO', repoInput);
          if (countEl) countEl.textContent = this.state.cards.length + '枚 (GitHub同期)';

          if (window.CardSystem) {
            if (typeof CardSystem.renderList === 'function') CardSystem.renderList();
            if (typeof CardSystem.renderRecent === 'function') CardSystem.renderRecent();
            if (typeof CardSystem.renderCollectionPage === 'function' && this.state.page === 'collection') CardSystem.renderCollectionPage();
          }
          if (window.DeckSystem && typeof DeckSystem.syncCardPool === 'function') {
            DeckSystem.syncCardPool();
          }
        } else {
          throw new Error('cards.json のデータ形式が無効です');
        }

        // デッキデータ (decks.json) の同期
        try {
          const decksUrl = baseUrl + 'decks.json';
          const decksRes = await fetchWithTimeout(decksUrl, 3000);
          if (decksRes.ok) {
            let decksData = await decksRes.json();
            if (!Array.isArray(decksData) && decksData && Array.isArray(decksData.decks)) {
              decksData = decksData.decks;
            }
            if (Array.isArray(decksData) && window.DeckSystem) {
              window.DeckSystem.state.decks = decksData;
              if (typeof window.DeckSystem.renderDeckList === 'function') window.DeckSystem.renderDeckList();
            }
          }
        } catch (e) {
          console.warn('decks.json fetch info:', e);
        }

        // パック設定 (packs.json) の同期
        try {
          const packsUrl = baseUrl + 'packs.json';
          const packsRes = await fetchWithTimeout(packsUrl, 3000);
          if (packsRes.ok) {
            let packsData = await packsRes.json();
            if (!Array.isArray(packsData) && packsData && Array.isArray(packsData.packs)) {
              packsData = packsData.packs;
            }
            if (Array.isArray(packsData) && packsData.length > 0) {
              this.state.packs = packsData;
              try { localStorage.setItem('ORBITAL_CUSTOM_PACKS', JSON.stringify(packsData)); } catch(e) {}
              if (typeof this.renderPackGrid === 'function') this.renderPackGrid();
            }
          }
        } catch (e) {
          console.warn('packs.json fetch info:', e);
        }

        // 最新システムスタイル (CSS.html) の動的適用
        try {
          const cssUrl = baseUrl + 'CSS.html';
          const cssRes = await fetchWithTimeout(cssUrl, 3000);
          if (cssRes.ok) {
            const cssText = await cssRes.text();
            let styleTag = document.getElementById('github-dynamic-system-css');
            if (!styleTag) {
              styleTag = document.createElement('style');
              styleTag.id = 'github-dynamic-system-css';
              document.head.appendChild(styleTag);
            }
            const cleanCss = cssText.replace(/<\/?script[^>]*>/gi, '').replace(/<\/?style[^>]*>/gi, '');
            styleTag.textContent = cleanCss;
            console.log('✅ GitHubからの最新CSSシステムスタイルの動的適用に成功しました');
          }
        } catch (e) {
          console.warn('CSS.html dynamic sync info:', e);
        }

        if (showToast) this.toast('✅ GitHubからのシステム・データ全体同期に成功しました！');
        return true;
      } catch (err) {
        console.error('loadFromGitHub error:', err);
        // エラー時は壊れたリポジトリ設定をlocalStorageから自動消去し、無限ループを回避
        try { localStorage.removeItem('ORBITAL_GITHUB_REPO'); } catch (e) {}

        if (showToast) {
          this.toast('❌ GitHub同期エラー: ' + err.message + ' (ローカルデータに復帰)', true);
        }
        this.loadDefaultLocalCards();
        return false;
      }
    },

      const profileObj = { email, displayName, avatar, password, dnaUid };

      const applyProfile = (prof) => {
        if (saveBtn) saveBtn.disabled = false;
        self.state.userProfile = prof;
        if (prof.nmtBalance !== undefined && prof.nmtBalance !== null) {
          self.setUserNmt(prof.nmtBalance);

              applyProfile(profileObj);
            }

          .withFailureHandler((err) => {
