    renderFunctionList(query = '', cat = 'all') {
      const container = document.getElementById('funcListContainer');
      const countBadge = document.getElementById('funcListCountBadge');
      if (!container) return;
            const q = String(query || '').toLowerCase().trim();

      let items = (this.functionReferenceData || []).filter((fn) => {
        if (cat !== 'all' && fn.category !== cat) return false;
        if (!q) return true;
        const matchName = fn.name.toLowerCase().includes(q);
        const matchSig = fn.signature.toLowerCase().includes(q);
        const matchDesc = fn.desc.toLowerCase().includes(q);
        const matchBadge = (fn.badge || '').toLowerCase().includes(q);
        const matchParams = (fn.params || []).some((p) => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
        return matchName || matchSig || matchDesc || matchBadge || matchParams;
      });

      if (countBadge) {
        countBadge.textContent = items.length + '件';
      }

      if (items.length === 0) {
        container.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:12px;">条件に一致する関数が見つかりませんでした</div>';
        return;
      }

      container.innerHTML = items.map((fn) => {
        const badgeClass = 'badge-' + (fn.category === 'choice' ? 'choice' : (fn.category === 'event' ? 'event' : 'func'));
        const paramsHtml = (fn.params || []).map((p) => {
          return '<div class="func-param-line">' +
            '<span class="func-param-name">' + this.escape(p.name) + '</span>' +
            '<span class="func-param-type">(' + this.escape(p.type) + ')</span>' +
            '<span class="func-param-desc">' + this.escape(p.desc) + '</span>' +
          '</div>';
        }).join('');

        const codeSnippet = fn.snippet || fn.example || (fn.signature + ';');

        return '<div class="func-card" data-func-name="' + this.escape(fn.name) + '">' +
          '<div class="func-card-header">' +
            '<div class="func-signature">' + this.escape(fn.signature) + '</div>' +
            '<div class="func-badges-row">' +
              '<span class="completion-badge ' + badgeClass + '">' + this.escape(fn.badge || fn.catLabel) + '</span>' +
              '<span class="func-return-badge">戻り値: ' + this.escape(fn.returns) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="func-desc">' + this.escape(fn.desc) + '</div>' +
          (paramsHtml ? '<div class="func-params-box">' + paramsHtml + '</div>' : '') +
          '<div class="func-code-row">' +
            '<div class="func-code-preview">' + this.escape(codeSnippet) + '</div>' +
            '<div class="func-actions">' +
              '<button type="button" class="func-insert-btn" data-insert-snippet="' + this.escape(codeSnippet) + '" title="エディターの現在位置に挿入">＋ 挿入</button>' +
              '<button type="button" class="func-copy-btn" data-copy-snippet="' + this.escape(codeSnippet) + '" title="コードをコピー">📋 コピー</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    },

    toggleFunctionList(forceOpen = null) {
      const panel = document.getElementById('functionListPanel');
      const toggleBtn = document.getElementById('toggleFunctionListButton');
      if (!panel) return;
      const shouldOpen = forceOpen !== null ? forceOpen : panel.classList.contains('hidden');
      panel.classList.toggle('hidden', !shouldOpen);
      if (toggleBtn) {
        toggleBtn.classList.toggle('active', shouldOpen);
        toggleBtn.textContent = shouldOpen ? '📋 関数リスト: ON' : '📋 関数データリスト';
      }
      if (shouldOpen) {
        const searchInput = document.getElementById('funcListSearchInput');
        this.renderFunctionList(
          searchInput ? searchInput.value : '',
          this.activeFuncCat || 'all'
        );
      }
    },

    openEffectEditor(target) {
      try {
        target = target || 'attack1';
        this.effectEditor.target = target;
        this.effectEditor.activeTab = target;
        this.effectEditor.codes = {
          ability: document.getElementById('abilityCode')?.value || '',
          attack1: document.getElementById('attack1Code')?.value || '',
          attack2: document.getElementById('attack2Code')?.value || '',
          trainer: document.getElementById('attack1Code')?.value || ''
        };
        this.effectEditor.texts = {
          ability: document.getElementById('abilityText')?.value || '',
          attack1: document.getElementById('attack1Text')?.value || '',
          attack2: document.getElementById('attack2Text')?.value || '',
          trainer: document.getElementById('attack1Text')?.value || ''
        };
        let title = (target === 'attack1' ? 'ワザ1' : 'ワザ2') + 'の効果エディター';
        if (target === 'ability') title = '特性の効果エディター';
        if (target === 'trainer') title = 'グッズ / サポートの効果エディター';
        const titleEl = document.getElementById('effectEditorTitle');
        if (titleEl) titleEl.textContent = title;
        this.renderCodeEditor();
        this.renderFunctionList();
        const modal = document.getElementById('effectEditorModal');
        if (modal) {
          modal.classList.remove('hidden');
          modal.style.display = 'grid';
        }
      } catch (err) {
        console.error('[EffectEditor.openEffectEditor] Error:', err);
      }
    },

    closeEffectEditor() {
      const modal = document.getElementById('effectEditorModal');
      if (modal) {
        modal.classList.add('hidden');
        modal.style.display = 'none';
      }

    findEnclosingFunction(before) {
      if (!before) return null;
      let inString = false;
      let stringChar = '';
      let stack = [];

      for (let i = 0; i < before.length; i++) {
        const ch = before[i];

        if (inString) {
          if (ch === stringChar && before[i - 1] !== '\\') inString = false;
          continue;
        }
        if (ch === '"' || ch === "'") {
          inString = true;
          stringChar = ch;
          continue;
        }

        if (ch === '(') {
          let k = i - 1;
          while (k >= 0 && /\s/.test(before[k])) k--;
          const nameEnd = k + 1;
          while (k >= 0 && /[a-zA-Z0-9_$.]/.test(before[k])) k--;
          const funcName = before.slice(k + 1, nameEnd).trim();
          stack.push({
            funcName: funcName,
            openIndex: i,
            commaCount: 0,
            lastSepIndex: i,
            braceLevel: 0,
            bracketLevel: 0
          });
        } else if (ch === ')') {
          if (stack.length > 0) stack.pop();
        } else if (ch === '{') {
          if (stack.length > 0) stack[stack.length - 1].braceLevel++;
        } else if (ch === '}') {
          if (stack.length > 0 && stack[stack.length - 1].braceLevel > 0) stack[stack.length - 1].braceLevel--;
        } else if (ch === '[') {
          if (stack.length > 0) stack[stack.length - 1].bracketLevel++;
        } else if (ch === ']') {
          if (stack.length > 0 && stack[stack.length - 1].bracketLevel > 0) stack[stack.length - 1].bracketLevel--;
        } else if (ch === ',') {
          if (stack.length > 0) {
            const top = stack[stack.length - 1];
            if (top.braceLevel === 0 && top.bracketLevel === 0) {
              top.commaCount++;
              top.lastSepIndex = i;
            }
          }
        }
      }

      if (stack.length === 0) return null;
      const current = stack[stack.length - 1];
      if (!current.funcName) return null;

      const rawArgQuery = before.slice(current.lastSepIndex + 1);
      const argQuery = rawArgQuery.trim();

      return {
        funcName: current.funcName,
        argIndex: current.commaCount,
        argQuery: argQuery,
        lastSepIndex: current.lastSepIndex
      };
    },

      // 12. event.on
      if (fn === 'event.on' || fn === 'on') {

            { keyword: '"beforeDamage"', label: '"beforeDamage"', category: 'event', badge: '被ダメ直前', desc: '被ダメージ直前（無効化・軽減）', snippet: '"beforeDamage"' },
            { keyword: '"onDamage"', label: '"onDamage"', category: 'event', badge: '被ダメ後', desc: 'ダメージを受けた時', snippet: '"onDamage"' },
            { keyword: '"onKnockout"', label: '"onKnockout"', category: 'event', badge: 'きぜつ時', desc: 'このポケモンがきぜつした時', snippet: '"onKnockout"' },

    updateCompletion(forceOpen = false, explicitQuery = null) {
      const editor = document.getElementById('effectCodeEditor');
      const popup = document.getElementById('effectCompletion');
      if (!editor || !popup) return;

      
      // 自動補完が無効の場合は、明示的ボタン押下(forceOpen)または検索バー以外では開かない
      if (!this.effectEditor.autoCompletionEnabled && !forceOpen) {
        popup.style.display = 'none';
        this.effectEditor.currentCandidates = [];
        this.effectEditor.userNavigated = false;
        this.effectEditor.completionMode = null;
        return;
      }

      let word = '';
      let isMemberAccess = false;
      let memberObj = '';
      let memberProp = '';
      let isFunctionArg = false;
      let funcArgInfo = null;
      let funcArgCandidates = [];

      if (explicitQuery !== null && explicitQuery !== undefined) {
        word = String(explicitQuery).trim();
        const dotIdx = word.lastIndexOf('.');
        if (dotIdx >= 0) {
          isMemberAccess = true;
          memberObj = word.slice(0, dotIdx);
          memberProp = word.slice(dotIdx + 1);
        }
      } else {
        const selStart = editor.selectionStart || 0;
        const before = editor.value.slice(0, selStart);

        // 現在行がコメント行（//）の場合は自動補完しない
        const lastNewLine = before.lastIndexOf('\n');
        const currentLine = lastNewLine >= 0 ? before.slice(lastNewLine + 1) : before;
        if (!forceOpen && currentLine.trim().startsWith('//')) {
          popup.style.display = 'none';
          this.effectEditor.currentCandidates = [];
          this.effectEditor.userNavigated = false;
          this.effectEditor.completionMode = null;
          return;
        }

        // 1. ドット参照 (例: opponent. , opponent.a , self.active.h など) の検出
        const reMember = new RegExp('([a-zA-Z0-9_$]+(?:\\.[a-zA-Z0-9_$]+)*)\\.([a-zA-Z0-9_$]*)' + String.fromCharCode(36));
        const memberMatch = before.match(reMember);
        if (memberMatch) {
          isMemberAccess = true;
          memberObj = memberMatch[1];
          memberProp = memberMatch[2] || '';
        } else {
          // 2. 関数呼び出し内の引数補完チェック (例: damage( , choiceCard(self, "hand", など)
          const encFunc = this.findEnclosingFunction(before);
          if (encFunc && encFunc.funcName) {
            const argItems = this.getFunctionArgumentCompletions(encFunc.funcName, encFunc.argIndex);
            if (argItems && argItems.length > 0) {
              isFunctionArg = true;
              funcArgInfo = encFunc;
              funcArgCandidates = argItems;
            }
          }

          if (!isFunctionArg) {
            // 通常の英数字・日本語マッチング (GASパーサー保護のため安全な終端マッチを使用)
            const reEndWord = new RegExp('(?:^|[\\s(,;.]|\\n)([A-Za-z0-9_\\u3040-\\u309F\\u30A0-\\u30FF\\u4E00-\\u9FAF]+)' + String.fromCharCode(36));
            const match = before.match(reEndWord);
            word = match ? match[1] : '';
          }
        }
      }

      // ドット参照（メンバー補完）の場合
      if (isMemberAccess) {
        const members = this.getMemberCompletionsForObject(memberObj);
        let candidates = [];
        if (members && members.length > 0) {
          if (memberProp) {
            const propLower = memberProp.toLowerCase();
            candidates = members.filter((m) => {
              return m.keyword.toLowerCase().includes(propLower) ||
                     m.label.toLowerCase().includes(propLower) ||
                     (m.desc && m.desc.toLowerCase().includes(propLower));
            });
            candidates.sort((a, b) => {
              const aStarts = a.keyword.toLowerCase().startsWith(propLower) ? 1 : 0;
              const bStarts = b.keyword.toLowerCase().startsWith(propLower) ? 1 : 0;
              if (aStarts !== bStarts) return bStarts - aStarts;
              return a.keyword.localeCompare(b.keyword);
            });
          } else {
            // ドット直後（例: opponent. ）は全候補を表示
            candidates = members.slice();
          }
        }

        if (!candidates.length) {
          popup.style.display = 'none';
          this.effectEditor.currentCandidates = [];
          this.effectEditor.userNavigated = false;
          this.effectEditor.completionMode = null;
          this.effectEditor.memberPropLength = 0;
          return;
        }

        this.effectEditor.completionMode = 'member';
        this.effectEditor.memberPropLength = memberProp.length;
        this.effectEditor.currentCandidates = candidates;
        this.effectEditor.completionIndex = 0;
        this.effectEditor.userNavigated = false;
        this.renderCompletionPopup();
        return;
      }

      // 関数内の引数補完の場合
      if (isFunctionArg && funcArgInfo && funcArgCandidates) {
        let candidates = funcArgCandidates;
        const q = (funcArgInfo.argQuery || '').toLowerCase();
        if (q) {
          candidates = funcArgCandidates.filter((c) => {
            return c.keyword.toLowerCase().includes(q) ||
                   c.label.toLowerCase().includes(q) ||
                   (c.desc && c.desc.toLowerCase().includes(q));
          });
          candidates.sort((a, b) => {
            const aStarts = a.keyword.toLowerCase().startsWith(q) ? 1 : 0;
            const bStarts = b.keyword.toLowerCase().startsWith(q) ? 1 : 0;
            if (aStarts !== bStarts) return bStarts - aStarts;
            return a.keyword.localeCompare(b.keyword);
          });
        }

        if (!candidates.length) {
          popup.style.display = 'none';
          this.effectEditor.currentCandidates = [];
          this.effectEditor.userNavigated = false;
          this.effectEditor.completionMode = null;
          return;
        }

        this.effectEditor.completionMode = 'arg';
        this.effectEditor.argLastSepIndex = funcArgInfo.lastSepIndex;
        this.effectEditor.currentCandidates = candidates;
        this.effectEditor.completionIndex = 0;
        this.effectEditor.userNavigated = false;
        this.renderCompletionPopup();
        return;
      }

      this.effectEditor.completionMode = null;
      this.effectEditor.memberPropLength = 0;

      // 単語が空、かつ明示的オープンでない場合は補完を開かない（空行や改行を阻害しない！）
      if (!word && !forceOpen) {
        popup.style.display = 'none';
        this.effectEditor.currentCandidates = [];
        this.effectEditor.userNavigated = false;
        return;
      }

      const tab = this.effectEditor && this.effectEditor.activeTab ? this.effectEditor.activeTab : 'attack1';

      let candidates = [];
      const wordLower = (word || '').toLowerCase();
      if (word) {
        candidates = this.effectApiCompletions.filter((x) => {
          return x.keyword.toLowerCase().includes(wordLower) ||
          x.label.toLowerCase().includes(wordLower) ||
          (x.badge && x.badge.toLowerCase().includes(wordLower)) ||
          (x.desc && x.desc.toLowerCase().includes(wordLower));
        });
      } else if (forceOpen) {
        candidates = this.effectApiCompletions.filter((x) => x.targets.includes(tab));
        if (!candidates.length) {
          candidates = this.effectApiCompletions.slice(0, 12);
        }
      }

      candidates.sort((a, b) => {
        const aFit = a.targets.includes(tab) ? 1 : 0;
        const bFit = b.targets.includes(tab) ? 1 : 0;
        if (aFit !== bFit) return bFit - aFit;

        if (wordLower) {
          const aStarts = a.keyword.toLowerCase().startsWith(wordLower) ? 1 : 0;
          const bStarts = b.keyword.toLowerCase().startsWith(wordLower) ? 1 : 0;
          if (aStarts !== bStarts) return bStarts - aStarts;
        }

        return a.keyword.localeCompare(b.keyword);
      });

      if (!candidates.length) {
        popup.style.display = 'none';
        this.effectEditor.currentCandidates = [];
        this.effectEditor.userNavigated = false;
        return;
      }

      this.effectEditor.currentCandidates = candidates;
      this.effectEditor.completionIndex = 0;
      this.effectEditor.userNavigated = false;
      this.renderCompletionPopup();
    },

    applyCompletionPosition() {
      const popup = document.getElementById('effectCompletion');
      if (!popup) return;
            const ed = this.effectEditor;
      if (ed.popupPos) {
        popup.style.left = ed.popupPos.left + 'px';
        popup.style.top = ed.popupPos.top + 'px';
        popup.style.right = 'auto';
      } else if (ed.isDockedRight) {
        popup.style.left = 'auto';
        popup.style.right = '12px';
        popup.style.top = '10px';
      } else {
        popup.style.left = '14px';
        popup.style.right = 'auto';
        popup.style.top = '10px';
      }
    },

    toggleCompletionDock() {
            const ed = this.effectEditor;
      ed.popupPos = null;
      ed.isDockedRight = !ed.isDockedRight;
      this.applyCompletionPosition();
      const popup = document.getElementById('effectCompletion');
      if (popup && popup.style.display === 'none') {
        this.updateCompletion(true);
      } else {
        this.renderCompletionPopup();
      }
    },

    initEffectDrag() {
            if (this.effectEditor.dragInitialized) return;
      this.effectEditor.dragInitialized = true;

      const popup = document.getElementById('effectCompletion');
      if (!popup) return;

      let startX = 0, startY = 0;
      let initLeft = 0, initTop = 0;
      let dragging = false;

      function onStart(clientX, clientY, target) {
        const topbar = target && target.closest && target.closest('.completion-topbar');
        if (!topbar || (target && target.closest && target.closest('button'))) return false;

        dragging = true;
        popup.classList.add('is-dragging');
        startX = clientX;
        startY = clientY;
        const rect = popup.getBoundingClientRect();
        const parentRect = popup.offsetParent ? popup.offsetParent.getBoundingClientRect() : { left: 0, top: 0 };
        initLeft = rect.left - parentRect.left;
        initTop = rect.top - parentRect.top;
        return true;
      }

      function onMove(clientX, clientY) {
        if (!dragging) return;
        const dx = clientX - startX;
        const dy = clientY - startY;
        let newLeft = initLeft + dx;
        let newTop = initTop + dy;

        const parent = popup.offsetParent || document.body;
        const maxLeft = Math.max(0, parent.clientWidth - 80);
        const maxTop = Math.max(0, parent.clientHeight + 200);
        newLeft = Math.max(-100, Math.min(newLeft, maxLeft));
        newTop = Math.max(0, Math.min(newTop, maxTop));

        popup.style.right = 'auto';
        popup.style.left = newLeft + 'px';
        popup.style.top = newTop + 'px';
        this.effectEditor.popupPos = { left: newLeft, top: newTop };
      }

      function onEnd() {
        if (!dragging) return;
        dragging = false;
        popup.classList.remove('is-dragging');
      }

      popup.addEventListener('mousedown', function (e) {
        if (onStart(e.clientX, e.clientY, e.target)) {
          e.preventDefault();
        }
      });

      window.addEventListener('mousemove', function (e) {
        if (dragging) {
          onMove(e.clientX, e.clientY);
        }
      });

      window.addEventListener('mouseup', onEnd);

      popup.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length === 1) {
          onStart(e.touches[0].clientX, e.touches[0].clientY, e.target);
        }
      }, { passive: true });

      window.addEventListener('touchmove', function (e) {
        if (dragging && e.touches && e.touches.length === 1) {
          onMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchend', onEnd);
    },

    renderCompletionPopup() {
      const popup = document.getElementById('effectCompletion');
      if (!popup) return;
      const ed = (this && this.effectEditor) || (window.EffectEditor && window.EffectEditor.effectEditor) || EffectEditor.effectEditor;
      const candidates = (ed && Array.isArray(ed.currentCandidates)) ? ed.currentCandidates : [];
      const selectedIndex = Number(ed && ed.completionIndex) || 0;
      const esc = (this && typeof this.escape === 'function') ? this.escape : (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

      const itemsHtml = candidates.map((x, i) => {
        const isSelected = i === selectedIndex ? ' selected' : '';
        const badgeClass = "badge-" + (x.category || 'func');
        return "\n          <div class=\"completion-item" +
        isSelected + "\" data-completion-idx=\"" + i + "\">\n            <div class=\"completion-header\">\n              <span class=\"completion-badge " +
        badgeClass + "\">" + esc(x.badge || 'API') + "</span>\n              <strong>" +
        esc(x.label) + "</strong>\n            </div>\n            <div class=\"completion-desc\">" +
        esc(x.desc) + "</div>\n          </div>\n        ";
      }).join('');

      const isRight = ed && ed.isDockedRight && !ed.popupPos;
      const dockLabel = isRight ? '↔ 左へ' : '↔ 右へ';

      popup.innerHTML = "\n        <div class=\"completion-topbar\" title=\"ドラッグして好きな位置にずらせます\">\n          <div class=\"completion-drag-title\">\n            <span>⠿ ドラッグで移動</span>\n            <span style=\"opacity:0.75;font-weight:normal;\">(" +
      candidates.length + "件)</span>\n          </div>\n          <div class=\"completion-topbar-actions\">\n            <button type=\"button\" class=\"completion-action-btn\" id=\"dockCompletionToggleBtn\" title=\"補完ウィンドウを左右にずらす\">" +
      dockLabel + "</button>\n            <button type=\"button\" class=\"completion-close-btn\" id=\"closeCompletionPopupBtn\" title=\"閉じる\">×</button>\n          </div>\n        </div>\n        " + (
      itemsHtml || '<div style="padding:8px;font-size:11px;color:var(--muted)">該当する補完候補がありません</div>') + "\n      ";

      if (typeof this.initEffectDrag === 'function') this.initEffectDrag();
      if (typeof this.applyCompletionPosition === 'function') this.applyCompletionPosition();
      popup.style.display = 'block';

      const selectedEl = popup.querySelector('.completion-item.selected');
      if (selectedEl && typeof selectedEl.scrollIntoView === 'function') {
        selectedEl.scrollIntoView({ block: 'nearest' });
      }

      popup.querySelectorAll('[data-completion-idx]').forEach((el) => {
        el.addEventListener('mousedown', (e) => {
          e.preventDefault();
          const idx = Number(el.dataset.completionIdx);
          if (candidates[idx]) {
            if (typeof EffectEditor.applyCompletionItem === 'function') {
              EffectEditor.applyCompletionItem(candidates[idx]);
            }
          }
        });
      });

      const dockBtn = popup.querySelector('#dockCompletionToggleBtn');
      if (dockBtn) {
        dockBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (typeof EffectEditor.toggleCompletionDock === 'function') {
            EffectEditor.toggleCompletionDock();
          }
        });
      }

      const closeBtn = popup.querySelector('#closeCompletionPopupBtn');
      if (closeBtn) {
        closeBtn.addEventListener('click', (e) => {
          e.preventDefault();
          popup.style.display = 'none';
        });
      }
    },

    selectCompletionIndex(newIndex) {
            const len = this.effectEditor.currentCandidates.length;
      if (!len) return;
      this.effectEditor.completionIndex = (newIndex + len) % len;
      this.renderCompletionPopup();
    },

    applySelectedCompletion() {
            const item = this.effectEditor.currentCandidates[this.effectEditor.completionIndex];
      if (item) {
        this.applyCompletionItem(item);
        return true;
      }
      return false;
    },

    applyCompletionItem(item) {
      if (!item) return;
      const editor = document.getElementById('effectCodeEditor');
      if (!editor) return;
      editor.focus();
            const pos = editor.selectionStart || 0;
      const before = editor.value.slice(0, pos);

      if (this.effectEditor.completionMode === 'member') {
        const propLen = Number(this.effectEditor.memberPropLength || 0);
        const start = Math.max(0, pos - propLen);
        editor.setRangeText(item.snippet, start, pos, 'end');
      } else if (this.effectEditor.completionMode === 'arg') {
        const lastSep = Number(this.effectEditor.argLastSepIndex || 0);
        const afterSep = before.slice(lastSep + 1);
        const leadingSpaces = (afterSep.match(/^\s*/) || [''])[0];
        const start = lastSep + 1 + leadingSpaces.length;
        editor.setRangeText(item.snippet, start, pos, 'end');
      } else {
        const reEndWord = new RegExp('([A-Za-z0-9_\\u3040-\\u309F\\u30A0-\\u30FF\\u4E00-\\u9FAF]+)' + String.fromCharCode(36));
        const match = before.match(reEndWord);
        const start = match ? pos - match[1].length : pos;
        editor.setRangeText(item.snippet, start, pos, 'end');
      }

      const popup = document.getElementById('effectCompletion');
      if (popup) popup.style.display = 'none';
      this.effectEditor.currentCandidates = [];
      this.effectEditor.completionMode = null;
      this.effectEditor.memberPropLength = 0;
      this.effectEditor.argLastSepIndex = 0;
      this.updateCodePreview();
      editor.focus();
    },

    handleEditorKeydown(e) {
            const now = Date.now();
      // 日本語IME変換中、または確定直後(200ms以内)は横取りしない
      if (e.isComposing || e.keyCode === 229 || (now - (this.effectEditor.lastCompositionEndTime || 0) < 200)) {
        return;
      }

      const popup = document.getElementById('effectCompletion');
      const isOpen = popup && popup.style.display !== 'none' && this.effectEditor.currentCandidates && this.effectEditor.currentCandidates.length > 0;

      if (isOpen) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          this.effectEditor.userNavigated = true;
          this.selectCompletionIndex(this.effectEditor.completionIndex + 1);
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          this.effectEditor.userNavigated = true;
          this.selectCompletionIndex(this.effectEditor.completionIndex - 1);
          return;
        }
        if (e.key === 'Tab') {
          // Tabキーで補完確定
          e.preventDefault();
          this.applySelectedCompletion();
          return;
        }
        if (e.key === 'Enter') {
          // ユーザーが上下矢印キーで明示的に候補を選んだ時だけEnterで確定
          // それ以外は通常の「改行」として通し、補完は閉じる
          if (this.effectEditor.userNavigated) {
            e.preventDefault();
            this.applySelectedCompletion();
            return;
          } else {
            popup.style.display = 'none';
            this.effectEditor.currentCandidates = [];
            this.effectEditor.userNavigated = false;
            return;
          }
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          popup.style.display = 'none';
          this.effectEditor.currentCandidates = [];
          this.effectEditor.userNavigated = false;
          return;
        }
      }
    },

    applyEffectEditor() {
      const editor = document.getElementById('effectCodeEditor');
      const descInput = document.getElementById('effectEditorDisplayText');
      const target = this.effectEditor.activeTab;
      if (!editor || !target) return;
      const code = editor.value.trim();
      this.effectEditor.codes[target] = code;

      const userText = descInput ? descInput.value.trim() : '';
      const autoText = this.makeEffectDisplayText(code);

      if (target === 'trainer') {
        const codeEl = document.getElementById('attack1Code');
        if (codeEl) codeEl.value = code;
        const textEl = document.getElementById('attack1Text');
        const finalDesc = userText || (textEl ? textEl.value.trim() : '') || autoText;
        if (textEl && finalDesc) textEl.value = finalDesc;
        const descEl = document.getElementById('description');
        if (descEl && (!descEl.value || descEl.value === textEl?.value)) descEl.value = finalDesc;

        if (this.effectEditor.texts) this.effectEditor.texts[target] = finalDesc;

        const summaryEl = document.getElementById('trainerEffectSummary');
        if (summaryEl) {
          summaryEl.textContent = finalDesc ? "✦ 設定効果: " + finalDesc : code ? '✦ 設定効果: JavaScript効果設定済み' : '';
        }
      } else {
        const codeId = target === 'ability' ? 'abilityCode' : target + "Code";
        const textId = target === 'ability' ? 'abilityText' : target + "Text";
        const summaryId = target + "EffectSummary";

        const codeEl = document.getElementById(codeId);
        if (codeEl) codeEl.value = code;
        const textEl = document.getElementById(textId);
        const finalDesc = userText || (textEl ? textEl.value.trim() : '') || autoText;
        if (textEl && finalDesc) textEl.value = finalDesc;

        if (this.effectEditor.texts) this.effectEditor.texts[target] = finalDesc;

        const summaryEl = document.getElementById(summaryId);
        if (summaryEl) {
          summaryEl.textContent = finalDesc ? "✦ 設定効果: " + finalDesc : code ? '✦ 設定効果: JavaScript効果設定済み' : '';
        }

        if (target === 'attack1' || target === 'attack2') {
          const dmgEl = document.getElementById(target + "Damage");
          if (dmgEl && !dmgEl.value) {
            const m = code.match(/damage\s*\(\s*[^,]+,\s*(\d+)/);
            if (m) dmgEl.value = Number(m[1]);
          }
        }
      }
      if (window.CardSystem && typeof window.CardSystem.updatePreview === 'function') {
        window.CardSystem.updatePreview();
      }
      this.closeEffectEditor();
      App.toast('効果を反映しました。');
    },

    makeEffectDisplayText(code) {
      if (!code) return '';
      const lines = [];

      // 特性イベント・起動回数プレフィックス
      const useLimitMatch = code.match(/(?:useLimit|limitPerTurn|timesPerTurn)\s*\(\s*([^)]*)\s*\)/);
      if (useLimitMatch) {
        const limArg = useLimitMatch[1].trim();
        if (limArg === 'Infinity') {
          lines.push('【自分の番に何度でも使える】');
        } else if (limArg && !isNaN(Number(limArg))) {
          lines.push('【自分の番に' + limArg + '回使える】');
        } else {
          lines.push('【自分の番に1回使える】');
        }
      }
      if (code.includes('turnStart') || code.includes('"start"') || code.includes("'start'")) lines.push('【毎ターン開始時(強制)】');
      if (code.includes('enterBattle')) lines.push('【バトル場に出た時】');
      if (code.includes('enterBench')) lines.push('【ベンチに出した時】');
      if (code.includes('onKnockoutOpponent')) lines.push('【相手を倒した時】');else
      if (code.includes('onKnockout')) lines.push('【きぜつした時】');
      if (code.includes('onDamage')) lines.push('【ダメージを受けた時】');
      if (code.includes('turnEnd')) lines.push('【ターン終了時】');

      // 条件分岐
      if (/if\s*\([^)]*(isKnockedOut|didKnockout|isDefeated|defeatedOpponent)/i.test(code)) {
        lines.push('相手を倒したなら、');
      } else if (/untilheads|表が出るまで|オモテが出るまで/i.test(code)) {
        lines.push('表が出るまでコインを投げ、出た回数分');
      } else if (/if\s*\(\s*(coinFlip|flipCoin)\s*\(/i.test(code)) {
        lines.push('コインを投げ表なら、');
      }
      if (/wasAllyKnockedOutLastTurn|didAllyKnockoutLastTurn|allyKnockedOutLastTurn/i.test(code)) {
        lines.push('前の番に自分のポケモンがきぜつしていたなら、');
      }
      if (/if\s*\([^)]*hp\s*<=/i.test(code)) {
        lines.push('HP条件を満たせば、');
      }
      if (/if\s*\([^)]*energy\s*>=/i.test(code)) {
        lines.push('エネルギー条件を満たせば、');
      }

      // APIコール解析
      const re = /(damage|benchDamage|heal|draw|attachEnergy|discardEnergy|applyStatus|clearStatus|switchActive|discardCards|searchCards|reduceDamage|takePrize|toHand|toDiscard|toDeck|toBench|reduceOpponentAttackNextTurn|nextTurnReduceOpponentAttack|reduceDamageNextTurn|nextTurnReduceDamage|nextTurnDamage|boostDamageNextTurn|reduceHp|reduceOpponentHp|reduceSelfHp|subHp|reduceMaxHp|lowerMaxHp|increaseMaxHp|addMaxHp|setHp|cantAttackNextTurn|nextTurnCantAttack)\s*\(([^)]*)\)/g;
      let m;
      while (m = re.exec(code)) {
        const fn = m[1];
        const args = m[2];
        if (fn === 'damage') lines.push(this.codeTarget(args) + "に" + this.codeNumber(args) + "ダメージ。");else
        if (fn === 'benchDamage') lines.push(this.codeTarget(args) + "のベンチ全員に" + this.codeNumber(args) + "ダメージ。");else
        if (fn === 'heal') lines.push(this.codeTarget(args) + "のHPを" + this.codeNumber(args) + "回復する。");else
        if (fn === 'draw') lines.push(this.codeTarget(args) + "はカードを" + this.codeNumber(args) + "枚引く。");else
        if (fn === 'takePrize') lines.push("サイドを" + (this.codeNumber(args) || 1) + "枚とる。");else
        if (fn === 'attachEnergy') lines.push(this.codeTarget(args) + "にエネルギーを" + this.codeNumber(args) + "個付ける。");else
        if (fn === 'discardEnergy') lines.push(this.codeTarget(args) + "のエネルギーを" + this.codeNumber(args) + "個トラッシュする。");else
        if (fn === 'applyStatus') lines.push(this.codeTarget(args) + "を「" + this.codeString(args) + "」状態にする。");else
        if (fn === 'clearStatus') lines.push(this.codeTarget(args) + "の特殊状態を回復する。");else
        if (fn === 'switchActive') lines.push(this.codeTarget(args) + "をベンチと入れ替える。");else
        if (fn === 'toHand') lines.push(this.codeTarget(args) + "の手札に加える。");else
        if (fn === 'toDiscard') lines.push(this.codeTarget(args) + "のトラッシュに送る。");else
        if (fn === 'toDeck') lines.push(this.codeTarget(args) + "の山札にもどす。");else
        if (fn === 'toBench') lines.push(this.codeTarget(args) + "のベンチに出す。");else
        if (fn === 'reduceDamage') lines.push(this.codeTarget(args) + "が受けるダメージを" + this.codeNumber(args) + "軽減する。");else
        if (fn === 'reduceOpponentAttackNextTurn' || fn === 'nextTurnReduceOpponentAttack') lines.push("次の相手の番、相手のワザの威力を-" + (this.codeNumber(args) || 20) + "する。");else
        if (fn === 'reduceDamageNextTurn' || fn === 'nextTurnReduceDamage') lines.push("次の相手の番、受けるワザのダメージを-" + (this.codeNumber(args) || 30) + "軽減する。");else
        if (fn === 'nextTurnDamage' || fn === 'boostDamageNextTurn') lines.push("次の自分の番、ワザの威力を+" + (this.codeNumber(args) || 80) + "する。");else
        if (fn === 'reduceHp' || fn === 'subHp') lines.push(this.codeTarget(args) + "のHPを直接" + (this.codeNumber(args) || 20) + "減少させる。");else
        if (fn === 'reduceOpponentHp') lines.push("相手バトル場のHPを直接" + (this.codeNumber(args) || 20) + "減少させる。");else
        if (fn === 'reduceSelfHp') lines.push("自分のHPを直接" + (this.codeNumber(args) || 20) + "減少させる。");else
        if (fn === 'reduceMaxHp' || fn === 'lowerMaxHp') lines.push(this.codeTarget(args) + "の最大HPを" + (this.codeNumber(args) || 20) + "減少させる。");else
        if (fn === 'increaseMaxHp' || fn === 'addMaxHp') lines.push(this.codeTarget(args) + "の最大HPを" + (this.codeNumber(args) || 30) + "増加させる。");else
        if (fn === 'setHp') lines.push(this.codeTarget(args) + "のHPを" + (this.codeNumber(args) || 100) + "に設定する。");else
        if (fn === 'cantAttackNextTurn' || fn === 'nextTurnCantAttack') lines.push("次の自分の番、このポケモンはワザを使えない。");
      }

      // choiceCard / choiceCards の解析
      const choiceRe = /choiceCards?\s*\(([^)]*)\)/g;
      let cm;
      while (cm = choiceRe.exec(code)) {
        const argsStr = cm[1];
        const srcPart = argsStr.split(',')[0].trim();
        let srcName = 'カード';
        if (srcPart.includes('self.deck')) srcName = '自分の山札';else
        if (srcPart.includes('self.hand')) srcName = '自分の手札';else
        if (srcPart.includes('self.discard')) srcName = '自分のトラッシュ';else
        if (srcPart.includes('self.bench')) srcName = '自分のベンチ';else
        if (srcPart.includes('opponent.deck')) srcName = '相手の山札';else
        if (srcPart.includes('opponent.hand')) srcName = '相手の手札';else
        if (srcPart.includes('opponent.discard')) srcName = '相手のトラッシュ';else
        if (srcPart.includes('opponent.bench')) srcName = '相手のベンチ';

        let actionDesc = '選ぶ。';
        if (argsStr.includes('self.hand') && !srcPart.includes('self.hand')) {
          actionDesc = '選び手札に加える。';
        } else if (argsStr.includes('discard') && !srcPart.includes('discard')) {
          actionDesc = '選びトラッシュする。';
        }

        let filterDesc = '';
        const catMatch = argsStr.match(/category\s*:\s*['"]([^'"]+)['"]/);
        if (catMatch) filterDesc += "「" + catMatch[1] + "」";
        const typeMatch = argsStr.match(/type\s*:\s*['"]([^'"]+)['"]/);
        if (typeMatch) filterDesc += "【" + typeMatch[1] + "】";

        lines.push(srcName + "から" + filterDesc + "カードを" + actionDesc);
      }

      return lines.join(' ');
    },

    codeString(args) {
      const parts = args.split(',');
      if (parts.length > 1) {
        return parts[1].replace(/['"]/g, '').trim();
      }
      return 'どく';
    },

    codeTarget(args) {
      const a = args.split(',')[0].trim();
      return { 'self': '自分', 'opponent': '相手', 'self.active': '自分のバトルカード', 'opponent.active': '相手のバトルカード', 'self.bench': '自分のベンチ', 'opponent.bench': '相手のベンチ', 'self.hand': '自分の手札', 'opponent.hand': '相手の手札' }[a] || a;
    },

    codeNumber(args) { const m = String(args || '').match(/\b(\d+)\b/); return m ? m[1] : ''; },
    escape(v) {return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');},

    open(target) { return this.openEffectEditor(target); },
    close() { return this.closeEffectEditor(); },
    apply() { return this.applyEffectEditor(); },
    switchTab(tab) { return this.switchEffectTab(tab); },
    insertCode(snippet) { return this.insertEffectCode(snippet); }
  };

  window.EffectEditor = EffectEditor;
  console.log('[ORBITAL] EffectEditor.js.html finished execution. window.EffectEditor =', typeof window.EffectEditor);
  if (window.__showDebugMsg) window.__showDebugMsg('EffectEditor準備完了 (' + typeof window.EffectEditor + ')');
})();
</script>
