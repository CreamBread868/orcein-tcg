        { name: 'きずぐすり', category: 'グッズ', type: '', hp: '', attack1Code: 'heal(self.active, 30);', attack1Text: '自分のバトルポケモンのHPを30回復する。', description: '自分のバトルポケモンのHPを30回復する。', count: 3 },

      fire: {

        cards: [
        { name: 'ヒトカゲ', category: 'たね', type: '炎', hp: 70, attack1Name: 'ひのこ', attack1Damage: 30, attack1Energy: '炎', attack1Text: '', attack1Code: 'damage(opponent.active, 30);', weakness: '水', resistance: '', retreat: 1, count: 4 },
        { name: 'リザードンex', category: '2進化ex', preEvolution: 'ヒトカゲ', type: '炎', hp: 330, attack1Name: 'れんごくしはい', attack1Damage: 180, attack1Energy: '炎,炎,無色', attack1Text: 'コインを2回投げ表の数×30。', attack1Code: 'const h = flipCoin(2); damage(opponent.active, 180 + (h * 30));', attack2Name: 'バーニングダーク', attack2Damage: 240, attack2Energy: '炎,炎,炎,無色', attack2Text: '相手を倒したなら山札を2枚引く。', attack2Code: 'damage(opponent.active, 240);\nif (didKnockout()) {\n  draw(self, 2);\n}', weakness: '水', resistance: '', retreat: 2, count: 2, isEx: true },
        { name: 'リザードン', category: '2進化', preEvolution: 'ヒトカゲ', type: '炎', hp: 160, attack1Name: 'かえんほうしゃ', attack1Damage: 90, attack1Energy: '炎,炎,無色', attack1Text: '', attack1Code: 'damage(opponent.active, 90);', attack2Name: 'バーンストライク', attack2Damage: 150, attack2Energy: '炎,炎,炎,無色', attack2Text: '', attack2Code: 'damage(opponent.active, 150);', weakness: '水', resistance: '', retreat: 3, count: 2 },
        { name: '博士の研究', category: 'サポート', type: '', hp: '', attack1Code: 'discardCards(self.hand, self.hand.length); draw(self, 7);', attack1Text: '自分の手札をすべてトラッシュし、山札を7枚引く。', description: '自分の手札をすべてトラッシュし、山札を7枚引く。', count: 4 },
        { name: 'きずぐすり', category: 'グッズ', type: '', hp: '', attack1Code: 'heal(self.active, 30);', attack1Text: '自分のバトルポケモンのHPを30回復する。', count: 3 },
        { name: '基本炎エネルギー', category: 'エネルギー', type: '炎', hp: '', description: '炎エネルギーを付ける。', count: 16 }]

      },
      water: {
        name: '💧 激流水流デッキ',
        description: '耐久力とカメックスexのコイン連打で戦うコントロールデッキ',
        cards: [
        { name: 'ゼニガメ', category: 'たね', type: '水', hp: 60, attack1Name: 'みずでっぽう', attack1Damage: 20, attack1Energy: '水', attack1Code: 'damage(opponent.active, 20);', weakness: '雷', resistance: '', retreat: 1, count: 4 },
        { name: 'カメックスex', category: '2進化ex', preEvolution: 'ゼニガメ', type: '水', hp: 330, attack1Name: 'ツインカノン', attack1Damage: 140, attack1Energy: '水,水', attack1Text: '表が出るまでコインを投げる。', attack1Code: 'const flips = flipCoin("表が出るまで"); damage(opponent.active, 140 + (flips * 40));', attack2Name: 'ハイドロバスター', attack2Damage: 200, attack2Energy: '水,水,無', attack2Text: '相手を倒したならサイドを1枚とる。', attack2Code: 'damage(opponent.active, 200);\nif (isKnockedOut(opponent.active)) {\n  takePrize(self, 1);\n}', weakness: '雷', resistance: '', retreat: 2, count: 2, isEx: true },
        { name: 'カメックス', category: '2進化', preEvolution: 'ゼニガメ', type: '水', hp: 150, attack1Name: 'ハイドロポンプ', attack1Damage: 100, attack1Energy: '水,水,無', attack1Code: 'damage(opponent.active, 100);', weakness: '雷', resistance: '', retreat: 2, count: 2 },
        { name: '博士の研究', category: 'サポート', type: '', hp: '', attack1Code: 'discardCards(self.hand, self.hand.length); draw(self, 7);', count: 4 },
        { name: 'ポケモンいれかえ', category: 'グッズ', type: '', hp: '', attack1Code: 'switchActive(self);', count: 3 },
        { name: '基本水エネルギー', category: 'エネルギー', type: '水', hp: '', description: '水エネルギーを付ける。', count: 16 }]

      }
    },

    init() {
      if (this.state.initialized) return;
      this.state.initialized = true;
      this.bindEvents();
      this.populateDeckSelect();
    },

    bindEvents() {
      const on = (id, evt, fn) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener(evt, fn);
      };

      on('battle-start-btn', 'click', () => this.handleStartClick());
      on('battle-player-deck-select', 'change', () => this.updatePlayerDeckPreview());
      on('battle-online-deck-select', 'change', () => this.updateOnlineDeckPreview());
      on('battle-ai-deck-select', 'change', () => this.updateAiDeckPreview());
      on('battleEndTurnBtn', 'click', () => {
        if (this.state.turnPlayer === 'player') this.endTurn();
      });
      on('battleSurrenderBtn', 'click', () => this.surrender());
      on('playerRetreatBtn', 'click', () => this.retreatActive());
      on('battleRestartBtn', 'click', () => {
        if (this.state.mode === 'online') {
          this.exitToSelectView();
        } else {
          this.handleStartClick();
        }
      });
      on('battleExitBtn', 'click', () => this.exitToSelectView());

      // 選択モーダル閉じる
      on('closeBattleChoiceModal', 'click', () => this.closeChoiceModal());
      on('cancelBattleChoiceBtn', 'click', () => this.closeChoiceModal());

      // カードアクションモーダル閉じる & 拡大
      on('closeCardActionModalBtn', 'click', () => this.closeCardActionModal());
      on('cardActionCloseBtn', 'click', () => this.closeCardActionModal());
      on('battleCardActionBackdrop', 'click', () => this.closeCardActionModal());
      on('cardActionZoomBtn', 'click', () => {
        if (this._currentActionCard && window.CardSystem && window.CardSystem.showDetail) {
          CardSystem.showDetail(this._currentActionCard);
        }
      });

      // フィールド中央（ディバイダー・スタジアム）へのカードドロップ
      const divider = document.querySelector('.arena-center-divider');
      if (divider) {
        divider.addEventListener('dragover', (e) => {
          if (this.draggedHandIndex != null) {
            e.preventDefault();
            divider.classList.add('drag-hover');
          }
        });
        divider.addEventListener('dragleave', () => {
          divider.classList.remove('drag-hover');
        });
        divider.addEventListener('drop', (e) => {
          e.preventDefault();
          divider.classList.remove('drag-hover');
          if (this.draggedHandIndex != null) {
            const idx = this.draggedHandIndex;
            this.draggedHandIndex = null;
            this.handleDropOnField(idx);
          }
        });
      }

      // 手札トレイの折りたたみ・展開
      on('toggleHandDockBtn', 'click', () => {
        const dock = document.getElementById('battleHandDock');
        const btn = document.getElementById('toggleHandDockBtn');
        if (dock) {
          dock.classList.toggle('is-collapsed');
          if (btn) {
            btn.textContent = dock.classList.contains('is-collapsed') ? '手札トレイ展開 ▲' : '手札トレイ収納 ▼';
          }
        }
      });
    },

    populateDeckSelect() {
      const sel = document.getElementById('battle-player-deck-select');
      if (!sel) return;

      const decks = window.DeckSystem && DeckSystem.state && DeckSystem.state.decks || [];
      sel.innerHTML = '';

      if (decks.length > 0) {
        decks.forEach((d) => {
          const opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = d.name + " (" + (d.totalCount || 60) + "枚)";
          sel.appendChild(opt);
        });
      }

      // 常にプリセットのスターターデッキも選択可能にする
      const starterOpt = document.createElement('option');
      starterOpt.value = 'preset_starter';
      starterOpt.textContent = '⚡ スターター雷デッキ (プリセット)';
      sel.appendChild(starterOpt);

      this.updatePlayerDeckPreview();
      this.updateAiDeckPreview();
    },

    updatePlayerDeckPreview() {
      const sel = document.getElementById('battle-player-deck-select');
      const prev = document.getElementById('battle-player-deck-preview');
      if (!sel || !prev) return;

      const deckId = sel.value;
      if (deckId === 'preset_starter') {
        prev.innerHTML = "<strong>⚡ スターター雷デッキ</strong>: ピカチュウとライチュウで構成された初心者向け完成デッキです。";
        return;
      }

      const decks = window.DeckSystem && DeckSystem.state && DeckSystem.state.decks || [];
      const deck = decks.find((d) => String(d.id) === String(deckId));
      if (deck) {
        prev.innerHTML = "<strong>" + this.escape(deck.name) + "</strong> (" + (deck.totalCount || 60) + "枚)<br><small>" + this.escape(deck.description || '自作デッキ') + "</small>";
      } else {
        prev.textContent = 'デッキを選択してください。';
      }
    },

    updateAiDeckPreview() {
      const sel = document.getElementById('battle-ai-deck-select');
      const prev = document.getElementById('battle-ai-deck-preview');
      if (!sel || !prev) return;

      const ai = this.aiDecks[sel.value] || this.aiDecks.electric;
      prev.innerHTML = "<strong>" + ai.name + "</strong><br><small>" + ai.description + "</small>";
    },

    setBattleMode(mode) {
      this.state.mode = mode || 'ai';
      const aiTab = document.getElementById('battleModeAiTab');
      const onlineTab = document.getElementById('battleModeOnlineTab');
      const aiCard = document.getElementById('battle-ai-setup-card');
      const onlineCard = document.getElementById('battle-online-lobby-card');
      if (aiTab) aiTab.classList.toggle('active', this.state.mode === 'ai');
      if (onlineTab) onlineTab.classList.toggle('active', this.state.mode === 'online');
      if (aiCard) aiCard.style.display = this.state.mode === 'ai' ? 'block' : 'none';
      if (onlineCard) onlineCard.style.display = this.state.mode === 'online' ? 'block' : 'none';

      if (this.state.mode === 'online') {
        this.populateOnlineDeckSelect();
        this.refreshRoomList();
      } else {
        this.populateDeckSelect();
      }
    },

    populateOnlineDeckSelect() {
      const sel = document.getElementById('battle-online-deck-select');
      if (!sel) return;
      const decks = window.DeckSystem && DeckSystem.state && DeckSystem.state.decks || [];
      sel.innerHTML = '';
      if (decks.length > 0) {
        decks.forEach((d) => {
          const opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = d.name + ' (' + (d.totalCount || 60) + '枚)';
          sel.appendChild(opt);
        });
      }
      const starterOpt = document.createElement('option');
      starterOpt.value = 'preset_starter';
      starterOpt.textContent = '⚡ スターター雷デッキ (プリセット)';
      sel.appendChild(starterOpt);

      this.updateOnlineDeckPreview();
    },

    updateOnlineDeckPreview() {
      const sel = document.getElementById('battle-online-deck-select');
      const prev = document.getElementById('battle-online-deck-preview');
      if (!sel || !prev) return;
      const deckId = sel.value;
      if (deckId === 'preset_starter') {
        prev.innerHTML = '<strong>⚡ スターター雷デッキ</strong>: ピカチュウとライチュウで構成された初心者向け完成デッキです。';
        return;
      }
      const decks = window.DeckSystem && DeckSystem.state && DeckSystem.state.decks || [];
      const deck = decks.find((d) => String(d.id) === String(deckId));
      if (deck) {
        prev.innerHTML = '<strong>' + this.escape(deck.name) + '</strong> (' + (deck.totalCount || 60) + '枚)<br><small>' + this.escape(deck.description || '自作デッキ') + '</small>';
      } else {
        prev.textContent = 'デッキを選択してください。';
      }
    },

    callGas(fnName, args, onSuccess, onFailure) {
      if (!window.google || !google.script || !google.script.run) {
        if (typeof onFailure === 'function') onFailure(new Error('google.script.run が利用できません。'));
        return;
      }
      try {
        const runner = google.script.run
          .withSuccessHandler(onSuccess || function () {})
          .withFailureHandler(onFailure || function (err) {
            console.error('[GAS Error]', err);
          });
        if (typeof runner[fnName] !== 'function') {
          const errMsg = 'GASサーバーに関数「' + fnName + '」が見つかりません。最新の Code.gs をデプロイ（clasp push）してください。';
          console.warn(errMsg);
          if (typeof onFailure === 'function') {
            onFailure(new Error(errMsg));
          } else if (window.App && App.toast) {
            App.toast(errMsg, true);
          }
          return;
        }
        runner[fnName].apply(runner, args || []);
      } catch (e) {
        console.error('callGas error:', e);
        if (typeof onFailure === 'function') onFailure(e);
      }
    },

    createRoom() {
      const deckVal = document.getElementById('battle-online-deck-select')?.value || 'preset_starter';
      const roomName = document.getElementById('online-room-name-input')?.value.trim() || '';
      const prizeCount = Number(document.getElementById('online-prize-count-select')?.value) || 6;
      const userEmail = window.DeckSystem && DeckSystem.state && DeckSystem.state.currentUser ? DeckSystem.state.currentUser.email : '';

      const rawDeck = this.resolveDeckCards(deckVal);
      if (!rawDeck || rawDeck.length === 0) {
        App.toast('対戦デッキを選択してください。', true);
        return;
      }

      const self = this;
      this.callGas('createOnlineRoom', [rawDeck, roomName, userEmail, { prizeCount: prizeCount }], function (res) {
        if (res && res.ok) {
          self.openWaitingRoom(res.roomId, rawDeck, prizeCount, 'host');
        } else {
          App.toast((res && res.message) || '部屋の作成に失敗しました。', true);
        }
      }, function (err) {
        App.toast('エラー: ' + err.message, true);
      });
    },

    openWaitingRoom(roomId, myDeck, prizeCount, role) {
      this.state.mode = 'online';
      this.state.online.roomId = roomId;
      this.state.online.role = role || 'host';
      this.state.online.myDeck = myDeck;
      this.state.online.prizeCount = prizeCount;
      this.state.online.lastSeq = 0;

      document.getElementById('battle-select-view').style.display = 'none';
      document.getElementById('battle-online-waiting-view').style.display = 'block';
      const codeEl = document.getElementById('waitingRoomIdDisplay');
      if (codeEl) codeEl.textContent = roomId;

      this.startWaitingRoomPolling();
    },

    startWaitingRoomPolling() {
      this.stopPolling();
      const self = this;
      this.state.online.pollTimer = setInterval(function () {
        if (!self.state.online.roomId) return;
        self.callGas('pollOnlineRoom', [self.state.online.roomId, self.state.online.role, self.state.online.lastSeq], function (res) {
          if (res && res.ok) {
            if (res.status === 'active' && res.actions && res.actions.length > 0) {
              const startAct = res.actions.find(function (a) { return a.type === 'game_start'; });
              if (startAct) {
                self.stopPolling();
                const payload = startAct.payload;
                self.startOnlineMatch(
                  self.state.online.myDeck,
                  payload.guestDeck,
                  payload.firstPlayer,
                  (payload.rules && payload.rules.prizeCount) || 6,
                  payload.hostName || 'あなた',
                  payload.guestName || '対戦相手'
                );
              }
            }
          }
        }, function (err) {
          console.warn('Waiting room poll error:', err);
        });
      }, 1200);
    },

    copyWaitingRoomId() {
      const code = this.state.online.roomId;
      if (!code) return;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(() => {
          App.toast('ルームID「' + code + '」をクリップボードにコピーしました！');
        });
      } else {
        App.toast('ルームID: ' + code);
      }
    },

    cancelWaitingRoom() {
      this.stopPolling();
      const roomId = this.state.online.roomId;
      if (roomId) {
        this.callGas('leaveOnlineRoom', [roomId, 'host']);
      }
      this.state.online.roomId = '';
      document.getElementById('battle-online-waiting-view').style.display = 'none';
      document.getElementById('battle-select-view').style.display = 'block';
      this.refreshRoomList();
    },

    joinRoom(roomId) {
      if (!roomId) return;
      const deckVal = document.getElementById('battle-online-deck-select')?.value || 'preset_starter';
      const userEmail = window.DeckSystem && DeckSystem.state && DeckSystem.state.currentUser ? DeckSystem.state.currentUser.email : '';
      const rawDeck = this.resolveDeckCards(deckVal);
      if (!rawDeck || rawDeck.length === 0) {
        App.toast('対戦デッキを選択してください。', true);
        return;
      }

      const self = this;
      this.callGas('joinOnlineRoom', [roomId, rawDeck, userEmail], function (res) {
        if (res && res.ok) {
          self.state.mode = 'online';
          self.state.online.roomId = res.roomId;
          self.state.online.role = 'guest';
          self.state.online.lastSeq = 1;
          self.state.online.myDeck = rawDeck;

          const room = res.room;
          self.startOnlineMatch(
            rawDeck,
            room.host ? room.host.deck : [],
            room.firstPlayer,
            (room.rules && room.rules.prizeCount) || 6,
            (room.guest && room.guest.name) || 'あなた',
            (room.host && room.host.name) || 'ホスト'
          );
        } else {
          App.toast((res && res.message) || 'ルームへの参加に失敗しました。', true);
        }
      }, function (err) {
        App.toast('エラー: ' + err.message, true);
      });
    },

    joinRoomDirect() {
      const input = document.getElementById('online-room-id-input');
      const roomId = (input && input.value || '').trim().toUpperCase();
      if (!roomId) {
        App.toast('ルームIDを入力してください。', true);
        return;
      }
      this.joinRoom(roomId);
    },

    refreshRoomList() {
      const container = document.getElementById('online-room-list');
      if (!container) return;
      container.innerHTML = '<div class="empty-room-msg">待機中の部屋を更新中…</div>';

      const self = this;
      this.callGas('getOnlineRoomList', [], function (list) {
        self.renderRoomList(Array.isArray(list) ? list : []);
      }, function (err) {
        container.innerHTML = '<div class="empty-room-msg">部屋一覧の取得に失敗しました。<br><small style="opacity:0.8">' + self.escape(err.message || '') + '</small></div>';
      });
    },

    renderRoomList(rooms) {
      const container = document.getElementById('online-room-list');
      if (!container) return;

      const waitingRooms = rooms.filter((r) => r.status === 'waiting');
      if (waitingRooms.length === 0) {
        container.innerHTML = '<div class="empty-room-msg">現在待機中の部屋はありません。「部屋を作成する」から募集しましょう！</div>';
        return;
      }

      let html = '';
      waitingRooms.forEach((r) => {
        html += '\n          <div class="room-item-card">\n            <div class="room-item-left">\n              <div class="room-item-name">' +
        this.escape(r.name || '対戦ルーム') + '</div>\n              <div class="room-item-meta">\n                <span class="room-id-tag">' +
        r.roomId + '</span>\n                <span><i class="fas fa-user"></i> ' +
        this.escape(r.hostName || 'ホスト') + '</span>\n              </div>\n            </div>\n            <button type="button" class="primary-button small-button" onclick="BattleSystem.joinRoom(\'' +
        r.roomId + '\')"><i class="fas fa-play"></i> 参加</button>\n          </div>\n        ';
      });

      container.innerHTML = html;
    },

    stopPolling() {
      if (this.state.online.pollTimer) {
        clearInterval(this.state.online.pollTimer);
        this.state.online.pollTimer = null;
      }
    },

    startOnlineMatch(myDeckRaw, oppDeckRaw, firstPlayerRole, prizeCount, myName, oppName) {
      const myDeck = this.shuffle((myDeckRaw || []).map((c) => this.createRuntimeCard(c)));
      const oppDeck = this.shuffle((oppDeckRaw || []).map((c) => this.createRuntimeCard(c)));

      this.state.phase = 'battle';
      this.state.turnNumber = 1;
      this.state.prizeCountRule = prizeCount || 6;
      this.state.logs = [];

      this.state.firstPlayer = (firstPlayerRole === this.state.online.role) ? 'player' : 'opponent';
      this.state.turnPlayer = this.state.firstPlayer;

      this.state.player = {
        id: 'player',
        name: myName || 'あなた',
        deck: myDeck,
        hand: [],
        active: null,
        bench: [],
        prizes: [],
        discard: [],
        energyAttached: false,
        supporterUsed: false,
        retreated: false
      };

      this.state.opponent = {
        id: 'opponent',
        name: oppName || '対戦相手',
        deck: oppDeck,
        hand: [],
        active: null,
        bench: [],
        prizes: [],
        discard: [],
        energyAttached: false,
        supporterUsed: false,
        retreated: false
      };

      // 手札ドロー
      this.drawInitialHand(this.state.player);
      this.drawInitialHand(this.state.opponent);

      // 初期配置
      this.setupInitialBoard(this.state.player);
      this.setupInitialBoard(this.state.opponent);

      // サイドカード配置
      for (let i = 0; i < this.state.prizeCountRule; i++) {
        if (this.state.player.deck.length) this.state.player.prizes.push(this.state.player.deck.shift());
        if (this.state.opponent.deck.length) this.state.opponent.prizes.push(this.state.opponent.deck.shift());
      }

      // UI切り替え
      document.getElementById('battle-select-view').style.display = 'none';
      document.getElementById('battle-online-waiting-view').style.display = 'none';
      document.getElementById('battle-arena-view').style.display = 'block';

      this.closeResultModal();
      this.log('🌐 オンライン対戦開始！ ルーム: ' + this.state.online.roomId);
      this.log('先攻は【' + (this.state.firstPlayer === 'player' ? this.state.player.name : this.state.opponent.name) + '】です。');

      this.render();
      this.startOnlineBattlePolling();
      this.startTurn(this.state.turnPlayer);
    },

    startOnlineBattlePolling() {
      this.stopPolling();
      const self = this;
      this.state.online.pollTimer = setInterval(function () {
        if (self.state.phase !== 'battle' || !self.state.online.roomId) return;
        self.callGas('pollOnlineRoom', [self.state.online.roomId, self.state.online.role, self.state.online.lastSeq], function (res) {
          if (res && res.ok && Array.isArray(res.actions)) {
            res.actions.forEach(function (act) {
              if (act.seq > self.state.online.lastSeq) {
                self.state.online.lastSeq = act.seq;
                if (act.by !== self.state.online.role) {
                  self.applyRemoteAction(act);
                }
              }
            });
          }
        });
      }, 1200);
    },

    broadcastOnlineAction(type, payload) {
      if (this.state.mode !== 'online' || !this.state.online.roomId) return;
      this.callGas('submitOnlineAction', [
        this.state.online.roomId,
        this.state.online.role,
        { type: type, payload: payload }
      ]);
    },

    applyRemoteAction(action) {
      if (!action || !action.type) return;
      const opp = this.state.opponent;
      const p = this.state.player;
      const payload = action.payload || {};

      switch (action.type) {
        case 'play_basic': {
          const card = payload.card || (opp.hand.length > 0 ? opp.hand.shift() : this.createRuntimeCard({ name: 'たねポケモン', hp: 70 }));
          if (payload.slotType === 'active') {
            opp.active = card;
            this.log('✦ 相手が【' + card.name + '】をバトル場に出しました。');
          } else {
            opp.bench.push(card);
            this.log('✦ 相手が【' + card.name + '】をベンチに出しました。');
          }
          this.render();
          break;
        }
        case 'evolve': {
          const evoCard = payload.evoCard;
          let target = null;
          if (payload.targetSlotType === 'active' || payload.benchIdx === -1) {
            target = opp.active;
          } else if (payload.benchIdx >= 0 && opp.bench[payload.benchIdx]) {
            target = opp.bench[payload.benchIdx];
          } else {
            target = opp.active;
          }
          if (target && evoCard) {
            target.attachedCards = target.attachedCards || [];
            target.attachedCards.unshift({ ...target });
            target.name = evoCard.name;
            target.maxHp = Number(evoCard.hp) || (target.maxHp + 40);
            target.hp = Math.min(target.maxHp, target.hp + 40);
            target.image = evoCard.image || target.image;
            target.attack1Name = evoCard.attack1Name;
            target.attack1Damage = evoCard.attack1Damage;
            target.attack1Energy = evoCard.attack1Energy;
            target.attack1Code = evoCard.attack1Code;
            target.attack2Name = evoCard.attack2Name;
            target.attack2Damage = evoCard.attack2Damage;
            target.attack2Energy = evoCard.attack2Energy;
            target.attack2Code = evoCard.attack2Code;
            target.abilityName = evoCard.abilityName;
            target.abilityCode = evoCard.abilityCode;
            this.log('🌟 相手の【' + target.name + '】が進化した！');
          }
          this.render();
          break;
        }
        case 'attach_energy': {
          const energyCard = payload.energyCard || { name: 'エネルギー', type: '無' };
          let target = null;
          if (payload.targetSlotType === 'active' || payload.benchIdx === -1) {
            target = opp.active;
          } else if (payload.benchIdx >= 0 && opp.bench[payload.benchIdx]) {
            target = opp.bench[payload.benchIdx];
          } else {
            target = opp.active;
          }
          if (target) {
            target.energy = (target.energy || 0) + 1;
            target.attachedEnergies = target.attachedEnergies || [];
            target.attachedEnergies.push(energyCard.type || '無');
            target.attachedCards = target.attachedCards || [];
            target.attachedCards.push(energyCard);
            this.log('⚡ 相手が【' + target.name + '】にエネルギーを付けました。');
          }
          this.render();
          break;
        }
        case 'play_trainer': {
          const card = payload.card || { name: 'トレーナーカード' };
          const kind = payload.kind || 'グッズ';
          this.log('📜 相手が【' + kind + '】「' + card.name + '」を使用しました！');
          this.animateTrainerCardPlay(card, kind);
          this.render();
          break;
        }
        case 'retreat': {
          if (opp.bench.length > 0) {
            const bIdx = Math.max(0, Math.min(opp.bench.length - 1, Number(payload.benchIdx) || 0));
            const cost = Number(payload.retreatCost) || 0;
            if (opp.active) {
              opp.active.energy = Math.max(0, (opp.active.energy || 0) - cost);
              const nextActive = opp.bench.splice(bIdx, 1)[0];
              opp.bench.push(opp.active);
              opp.active = nextActive;
              this.log('🏃 相手がにげるを選択！【' + nextActive.name + '】がバトル場に出ました。');
            }
          }
          this.render();
          break;
        }
        case 'attack': {
          const attacker = opp.active;
          const defender = p.active;
          const atkName = payload.atkName || (attacker ? attacker.attack1Name : 'ワザ');
          const atkDamage = payload.damage || (attacker ? attacker.attack1Damage : '30');

          this.log('⚔️ 相手の【' + (attacker ? attacker.name : 'バトルポケモン') + '】の「' + atkName + '」！');
          const numericDmg = parseInt(String(atkDamage).replace(/[^\d]/g, ''), 10) || 0;

          const oppEl = document.getElementById('oppActiveSpot');
          const playerEl = document.getElementById('playerActiveSpot');
          this.animateAttack(oppEl, playerEl, false, numericDmg, false);

          if (defender && numericDmg > 0) {
            defender.hp = Math.max(0, (defender.hp || 0) - numericDmg);
          }

          setTimeout(() => {
            if (defender && defender.hp <= 0) {
              this.handleKnockout(opp, p);
            } else {
              this.render();
            }
          }, 500);
          break;
        }
        case 'end_turn': {
          this.log('相手がターンを終了しました。あなたの番です！');
          this.state.turnNumber++;
          this.startTurn('player');
          break;
        }
        case 'surrender':
        case 'player_left': {
          this.finishBattle('player', '対戦相手が降伏または退出しました。あなたの勝利です！');
          break;
        }
      }
    },

    handleStartClick() {
      const playerDeckVal = document.getElementById('battle-player-deck-select')?.value || 'preset_starter';
      const aiDeckKey = document.getElementById('battle-ai-deck-select')?.value || 'electric';
      const prizeCount = Number(document.getElementById('battle-prize-count-select')?.value) || 6;

      this.startBattle(playerDeckVal, aiDeckKey, prizeCount);

    resolveDeckCards(deckVal) {
      if (deckVal === 'preset_starter') {
        return this.expandAiDeck(this.aiDecks.electric);
      }
      const decks = window.DeckSystem && DeckSystem.state && DeckSystem.state.decks || [];
      const deck = decks.find((d) => String(d.id) === String(deckVal));
      if (!deck || !deck.cards || !deck.cards.length) {
        return this.expandAiDeck(this.aiDecks.electric);
      }

      const allCards = window.App && App.state && App.state.cards || [];
      const expanded = [];
      deck.cards.forEach((entry) => {
        const c = allCards.find((card) => String(card.id) === String(entry.id));
        if (c) {
          const count = Number(entry.count) || 1;
          for (let i = 0; i < count; i++) {
            expanded.push(JSON.parse(JSON.stringify(c)));
          }
        }
      });

      return expanded.length > 0 ? expanded : this.expandAiDeck(this.aiDecks.electric);
    },

    expandAiDeck(preset) {
      const list = [];
      preset.cards.forEach((c) => {
        const count = c.count || 1;
        for (let i = 0; i < count; i++) {
          list.push(JSON.parse(JSON.stringify(c)));
        }
      });
      return list;
    },

      if (!c) return false;
      const cat = String(c.category || '');
      if (cat.includes('たね') || cat.toLowerCase().includes('basic')) return true;
      if (cat.includes('ポケモン') && !cat.includes('進化')) return true;
      return false;
    },
