    getPreEvolutionName(card) {
      if (!card) return 'たねポケモン';
      if (card.preEvolution) {
        const pVal = String(card.preEvolution).trim();
        const preCard = (window.App?.state?.cards || []).find((c) => String(c.id) === pVal || String(c.name) === pVal);
        return preCard ? preCard.name : pVal;
      }
      const textBlob = (card.description || '') + " " + (card.attack1Text || '') + " " + (card.attack2Text || '');
      const match = textBlob.match(/[「【](.*?)[」】]から進化/) || textBlob.match(/([^\s]+)から進化/);
      if (match && match[1]) return match[1].trim();

      const cleanName = String(card.name || '').replace(/ex|EX|\[EX\]|VMAX|VSTAR|V|\s+/g, '');
      const bases = this.POKEMON_EVO_MAP[cleanName] || this.POKEMON_EVO_MAP[card.name];
      if (bases && bases.length) return bases[0];
      return 'たねポケモン';
    },

    canEvolveFrom(evoCard, basePokemon) {
      if (!evoCard || !basePokemon) return { can: false, reason: '対象ポケモンが存在しません。' };
      if (!this.isEvolution(evoCard)) return { can: false, reason: evoCard.name + " は進化ポケモンではありません。" };
      if (this.isBasic(evoCard)) return { can: false, reason: 'たねポケモンを別のポケモンに重ねることはできません。' };

      // 先攻1ターン目進化不可ルール
      if (this.state.turnNumber === 1 && this.state.firstPlayer === 'player') {
        return { can: false, reason: '先攻の最初の番は進化できません。' };
      }

      // 場に出したターンは進化できない（次の自分の番から進化可能）
      if (basePokemon._turnPlayed != null && basePokemon._turnPlayed === this.state.turnNumber) {
        return { can: false, reason: "【" + basePokemon.name + "】は今場に出たばかりなので進化できません。（次の自分の番から進化可能）" };
      }

      const evoName = String(evoCard.name || '').trim();
      const baseName = String(basePokemon.name || '').trim();
      const baseId = String(basePokemon.id || '').trim();

      // 1. 明示的な preEvolution プロパティ (Card ID または カード名)
      if (evoCard.preEvolution) {
        const pVal = String(evoCard.preEvolution).trim();
        const preCard = (window.App?.state?.cards || []).find((c) => String(c.id) === pVal || String(c.name) === pVal);
        const preName = preCard ? preCard.name : pVal;

        const bLower = baseName.toLowerCase();
        const pLower = preName.toLowerCase();

        if (baseId === pVal || bLower === pLower || bLower.includes(pLower) || pLower.includes(bLower)) {
          return { can: true };
        }
        return { can: false, reason: "【" + evoCard.name + "】は「" + preName + "」からしか進化できません。（" + basePokemon.name + "には重ねられません）" };
      }

      // 2. 説明文等から「〇〇から進化」を抽出
      const textBlob = (evoCard.description || '') + " " + (evoCard.attack1Text || '') + " " + (evoCard.attack2Text || '');
      const match = textBlob.match(/[「【](.*?)[」】]から進化/) || textBlob.match(/([^\s]+)から進化/);
      if (match && match[1]) {
        const req = match[1].trim().toLowerCase();
        const b = baseName.toLowerCase();
        if (b === req || b.includes(req) || req.includes(b)) {
          return { can: true };
        }
        return { can: false, reason: "【" + evoCard.name + "】は「" + match[1] + "」からしか進化できません。（" + basePokemon.name + "には重ねられません）" };
      }

      // 3. POKEMON_EVO_MAP による照合
      const cleanEvo = evoName.replace(/ex|EX|\[EX\]|VMAX|VSTAR|V|\s+/g, '');
      const cleanBase = baseName.replace(/ex|EX|\[EX\]|VMAX|VSTAR|V|\s+/g, '');

      if (cleanEvo === cleanBase) {
        return { can: true };
      }

      const validBases = this.POKEMON_EVO_MAP[cleanEvo] || this.POKEMON_EVO_MAP[evoName];
      if (validBases) {
        const matches = validBases.some((vb) => {
          const cleanVb = vb.replace(/ex|EX|\s+/g, '');
          return cleanBase === cleanVb || cleanBase.includes(cleanVb) || cleanVb.includes(cleanBase);
        });
        if (matches) {
          return { can: true };
        }
        return { can: false, reason: "【" + evoCard.name + "】は「" + validBases.join(' または ') + "」からしか進化できません。（" + basePokemon.name + "には重ねられません）" };
      }

      // 4. オリジナルカードの場合のカテゴリ＆タイプ整合性チェック
      const evoCat = String(evoCard.category || '');
      const baseCat = String(basePokemon.category || '');
      const isEvo1 = evoCat.includes('1進化');
      const isEvo2 = evoCat.includes('2進化');
      const isBaseBasic = this.isBasic(basePokemon);
      const isBaseEvo1 = baseCat.includes('1進化');

      if (isEvo1 && !isBaseBasic) {
        return { can: false, reason: "1進化ポケモン【" + evoCard.name + "】はたねポケモンにしか重ねられません。" };
      }
      if (isEvo2 && !(isBaseEvo1 || isBaseBasic)) {
        return { can: false, reason: "2進化ポケモン【" + evoCard.name + "】は進化前ポケモンにしか重ねられません。" };
      }

      if (evoCard.type && basePokemon.type && evoCard.type !== '無' && basePokemon.type !== '無' && evoCard.type !== basePokemon.type) {
        return { can: false, reason: "属性が異なるポケモン(" + basePokemon.type + "タイプ)には進化できません。" };
      }

      return { can: true };
    },

    isEnergy(c) {
      if (!c) return false;
      const cat = String(c.category || '');
      return cat.includes('エネルギー') || cat.toLowerCase().includes('energy');
    },

    isTrainer(c) {
      if (!c) return false;
      const cat = String(c.category || '');
      return cat.includes('グッズ') || cat.includes('サポート') || cat.includes('スタジアム') || cat.toLowerCase().includes('trainer');
    },

    isPokemon(c) {
      if (!c) return false;
      if (this.isEnergy(c) || this.isTrainer(c)) return false;
      return Number(c.hp) > 0 || this.isBasic(c) || this.isEvolution(c);
    },

    createRuntimeCard(card) {
      const hp = Number(card.hp) || (this.isBasic(card) || this.isEvolution(card) ? 70 : 0);
      return {
        ...card,
        instanceId: 'inst_' + Math.random().toString(36).substring(2, 9),
        maxHp: hp,
        hp: hp,
        energy: 0,
        attachedEnergies: [],
        attachedCards: [],
        getCards(filter) {
          const cards = this.attachedCards || [];
          if (!filter) return [...cards];
          if (typeof window.matchesCardFilter === 'function') {
            return cards.filter((c) => window.matchesCardFilter(c, filter));
          }
          return [...cards];
        },
        status: null,
        damageReduction: 0
      };
    },

    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    },

    startBattle(playerDeckVal, aiDeckKey, prizeCount) {
      const rawPlayerDeck = this.resolveDeckCards(playerDeckVal);
      const rawAiDeck = this.expandAiDeck(this.aiDecks[aiDeckKey] || this.aiDecks.electric);

      const playerDeck = this.shuffle(rawPlayerDeck.map((c) => this.createRuntimeCard(c)));
      const oppDeck = this.shuffle(rawAiDeck.map((c) => this.createRuntimeCard(c)));

      this.state.phase = 'battle';
      this.state.turnNumber = 1;
      this.state.prizeCountRule = prizeCount;
      this.state.logs = [];

      // コインフリップで先攻決定
      const coin = Math.random() >= 0.5 ? 1 : 0;
      this.state.firstPlayer = coin === 1 ? 'player' : 'opponent';
      this.state.turnPlayer = this.state.firstPlayer;

      this.state.player = {
        id: 'player',
        name: 'プレイヤー',
        deck: playerDeck,
        hand: [],
        active: null,
        bench: [],
        prizes: [],
        discard: [],
        energyAttached: false,
        supporterUsed: false,
        retreated: false
      };

      this.state.opponent = {
        id: 'opponent',
        name: this.aiDecks[aiDeckKey]?.name || 'AIライバル',
        deck: oppDeck,
        hand: [],
        active: null,
        bench: [],
        prizes: [],
        discard: [],
        energyAttached: false,
        supporterUsed: false,
        retreated: false
      };

      // 手札7枚ドロー (たねポケモンを確実に引くまで)
      this.drawInitialHand(this.state.player);
      this.drawInitialHand(this.state.opponent);

      // バトル場とベンチの初期配置
      this.setupInitialBoard(this.state.player);
      this.setupInitialBoard(this.state.opponent);

      // サイドカード配置
      for (let i = 0; i < prizeCount; i++) {
        if (this.state.player.deck.length) this.state.player.prizes.push(this.state.player.deck.shift());
        if (this.state.opponent.deck.length) this.state.opponent.prizes.push(this.state.opponent.deck.shift());
      }

      // UI切り替え
      document.getElementById('battle-select-view').style.display = 'none';
      document.getElementById('battle-arena-view').style.display = 'block';

      this.closeResultModal();
      this.log('⚔ バトル開始！ 先攻は【' + (this.state.firstPlayer === 'player' ? 'プレイヤー' : 'AIライバル') + '】です。');

      this.render();

      // 先攻のターン開始
      this.startTurn(this.state.turnPlayer);
    },

    drawInitialHand(p) {
      let attempts = 0;
      while (attempts < 10) {
        attempts++;
        p.hand = [];
        for (let i = 0; i < 7; i++) {
          if (p.deck.length) p.hand.push(p.deck.shift());
        }
        const hasBasic = p.hand.some((c) => this.isBasic(c));
        if (hasBasic) break;
        // マリガン: 山札に戻してシャッフル
        p.deck.push(...p.hand);
        p.hand = [];
        this.shuffle(p.deck);
      }
      // もし10回の引き直しでもたねが見つからなかった場合の安全フォールバック
      if (!p.hand.some((c) => this.isBasic(c)) && p.deck.length > 0) {
        const basicInDeckIdx = p.deck.findIndex((c) => this.isBasic(c));
        if (basicInDeckIdx >= 0) {
          p.hand.push(p.deck.splice(basicInDeckIdx, 1)[0]);
        }
      }
    },

    setupInitialBoard(p) {
      // 最初のたねポケモンをバトル場へ
      let basicIdx = p.hand.findIndex((c) => this.isBasic(c));
      if (basicIdx < 0) {
        // ポケモンらしきカードをフォールバックとして使用
        basicIdx = p.hand.findIndex((c) => this.isPokemon(c));
      }
      if (basicIdx >= 0) {
        p.active = p.hand.splice(basicIdx, 1)[0];
      } else if (p.hand.length > 0) {
        p.active = p.hand.shift();
      }
      if (p.active && !p.active.hp) {
        p.active.hp = 70;
        p.active.maxHp = 70;
      }
      // ターン0として設定 (初期配置は進化可能)
      if (p.active) p.active._turnPlayed = 0;

      // 残りのたねポケモンを最大2匹までベンチへ
      for (let i = p.hand.length - 1; i >= 0; i--) {
        if (this.isBasic(p.hand[i]) && p.bench.length < 2) {
          const card = p.hand.splice(i, 1)[0];
          card._turnPlayed = 0;
          p.bench.push(card);
        }
      }
    },

    isBlocked(actionType, target = null, player = null) {
      if (window.ORBITAL_EFFECT_API && window.ORBITAL_EFFECT_API.isBlocked) {
        return window.ORBITAL_EFFECT_API.isBlocked({ game: this.state, self: player || (this.state.turnPlayer === 'player' ? this.state.player : this.state.opponent), opponent: player === this.state.opponent ? this.state.player : this.state.opponent }, actionType, target, player);
      }
      return false;
    },

    updateLocksOnTurnChange(curTurnWho) {
      if (!Array.isArray(this.state.activeLocks) || this.state.activeLocks.length === 0) return;

      const actLabels = {
        ability: '特性',
        attack: 'ワザ',
        effect: 'ワザの効果',
        retreat: 'にげる(交代)',
        item: 'グッズ',
        supporter: 'サポート',
        trainer: 'トレーナーズ',
        energy: 'エネルギー手貼り',
        evolution: '進化',
        all: 'すべてのアクション'
      };

      const remainingLocks = [];
      for (let lock of this.state.activeLocks) {
        if (lock.always) {
          if (lock.sourceCard) {
            const players = [this.state.player, this.state.opponent].filter(Boolean);
            let alive = false;
            for (let p of players) {
              if (p.active === lock.sourceCard || (Array.isArray(p.bench) && p.bench.includes(lock.sourceCard))) {
                if (lock.sourceCard.hp === undefined || lock.sourceCard.hp > 0) {
                  alive = true;
                  break;
                }
              }
            }
            if (!alive) {
              this.log('✦ 【' + (lock.sourceCard.name || 'カード') + '】が場を離れたため、' + (actLabels[lock.actionType] || lock.actionType) + 'の常時ロック効果が解除されました。');
              continue;
            }
          }
          remainingLocks.push(lock);
          continue;
        }

        let shouldDecrement = false;
        const prevTurnWho = curTurnWho === 'player' ? 'opponent' : 'player';
        const isCreatedTurn = (lock.createdTurn != null && lock.createdTurn === this.state.turnNumber);

        if (!isCreatedTurn) {
          if (lock.countBy === 'opponent' || !lock.countBy) {
            const isOpponentFinished = (lock.sourcePlayer === 'player' && prevTurnWho === 'opponent') ||
                                       (lock.sourcePlayer === 'opponent' && prevTurnWho === 'player');
            if (isOpponentFinished) shouldDecrement = true;
          } else if (lock.countBy === 'self') {
            const isSelfFinished = (lock.sourcePlayer === 'player' && prevTurnWho === 'player') ||
                                   (lock.sourcePlayer === 'opponent' && prevTurnWho === 'opponent');
            if (isSelfFinished) shouldDecrement = true;
          } else if (lock.countBy === 'both' || lock.countBy === 'turn') {
            shouldDecrement = true;
          }
        }

        if (shouldDecrement) {
          lock.turnsRemaining--;
        }

        if (lock.turnsRemaining > 0) {
          remainingLocks.push(lock);
        } else {
          this.log('🔓 【' + (actLabels[lock.actionType] || lock.actionType) + '】の禁止効果が終了しました。');
        }
      }
      this.state.activeLocks = remainingLocks;
    },

    startTurn(turnWho) {
      this.state.turnPlayer = turnWho;
      const cur = turnWho === 'player' ? this.state.player : this.state.opponent;

      cur.energyAttached = false;
      cur.supporterUsed = false;
      cur.retreated = false;
      [cur.active, ...(cur.bench || [])].filter(Boolean).forEach((c) => {
        c._abilityUsedThisTurn = false;
        c._abilityUseCount = 0;
      });

      this.updateLocksOnTurnChange(turnWho);

      // ターン開始時 (turnStart / start) の自動・強制発動
      const activePokemons = [cur.active, ...(cur.bench || [])].filter(Boolean);
      activePokemons.forEach((pk) => {
        if (pk.abilityCode && window.executeCardEffectCode) {
          try {
            window.executeCardEffectCode(
              pk.abilityCode,
              { players: [this.state.player, this.state.opponent], logs: this.state.logs },
              cur,
              'turnStart',
              { card: pk, pokemon: pk, turnNumber: this.state.turnNumber }
            );
            window.executeCardEffectCode(
              pk.abilityCode,
              { players: [this.state.player, this.state.opponent], logs: this.state.logs },
              cur,
              'start',
              { card: pk, pokemon: pk, turnNumber: this.state.turnNumber }
            );
          } catch (e) {
            console.error('turnStart ability error:', e);
          }
        }
      });

      // ドロー
      if (cur.deck.length === 0) {
        this.finishBattle(turnWho === 'player' ? 'opponent' : 'player', '山札がなくなりました (ライブラリアウト)');
        return;
      }
      const drawn = cur.deck.shift();
      cur.hand.push(drawn);

      this.log("【" + cur.name + "】の番（TURN " + this.state.turnNumber + "）: カードを1枚引きました。");

      // 特殊状態処理（どく: 10ダメージ）
      if (cur.active && cur.active.status === 'どく') {
        cur.active.hp -= 10;
        this.log("☠ どくのダメージ！ " + cur.active.name + " は10ダメージを受けた。(残りHP: " + cur.active.hp + ")");
        if (cur.active.hp <= 0) {
          this.handleKnockout(cur === this.state.player ? this.state.opponent : this.state.player, cur);
        }
      }

      this.render();

      if (turnWho === 'opponent') {
        if (this.state.mode === 'ai') {
          setTimeout(() => this.runAiTurn(), 800);
        }
      }
    },

    endTurn() {
      if (this.state.phase === 'ended') return;
      this.log("【" + (this.state.turnPlayer === 'player' ? 'プレイヤー' : 'AIライバル') + "】がターンを終了しました。");

      if (this.state.turnPlayer === 'player' && this.state.mode === 'online') {
        this.broadcastOnlineAction('end_turn', {});
      }

      if (this.state.turnPlayer === 'opponent') {
        this.state.turnNumber++;
        this.startTurn('player');
      } else {
        this.startTurn('opponent');
      }
    },

    surrender() {
      if (!confirm('本当に降参しますか？')) return;
      if (this.state.mode === 'online') {
        this.broadcastOnlineAction('surrender', {});
      }
      this.finishBattle('opponent', 'プレイヤーが降参しました。');
    },

    exitToSelectView() {
      this.stopPolling();
      if (this.state.mode === 'online' && this.state.online.roomId) {
        if (window.google && google.script && google.script.run) {
          google.script.run.leaveOnlineRoom(this.state.online.roomId, this.state.online.role);
        }
      }
      this.closeResultModal();
      this.state.phase = 'select';
      document.getElementById('battle-arena-view').style.display = 'none';
      document.getElementById('battle-select-view').style.display = 'block';
      if (this.state.mode === 'online') {
        this.populateOnlineDeckSelect();
        this.refreshRoomList();
      } else {
        this.populateDeckSelect();
      }
    },

    // プレイヤーが手札のカードをクリックした時のアクション
    handleHandCardClick(index) {
      if (this.state.turnPlayer !== 'player' || this.state.phase !== 'battle') return;
      const card = this.state.player.hand[index];
      if (!card) return;

      const p = this.state.player;

      // 1. たねポケモン
      if (this.isBasic(card)) {
        if (this.isBlocked('playBasic', card, p)) {
          App.toast('効果によりたねポケモンの場出しは禁止されています。', true);
          return;
        }
        if (!p.active) {
          const placed = p.hand.splice(index, 1)[0];
          placed._turnPlayed = this.state.turnNumber;
          p.active = placed;
          this.log("✦ " + card.name + " をバトル場に出しました。");
          this.broadcastOnlineAction('play_basic', { card: placed, slotType: 'active' });
          this.render();
          return;
        }
        if (p.bench.length < 5) {
          const placed = p.hand.splice(index, 1)[0];
          placed._turnPlayed = this.state.turnNumber;
          p.bench.push(placed);
          this.log("✦ " + card.name + " をベンチに出しました。");
          this.broadcastOnlineAction('play_basic', { card: placed, slotType: 'bench' });
          this.render();
          return;
        }
        App.toast('ベンチがいっぱいです（最大5匹）。', true);
        return;
      }

      // 2. 進化ポケモン
      if (this.isEvolution(card)) {
        if (this.isBlocked('evolution', card, p)) {
          App.toast('効果によりポケモンの進化は禁止されています。', true);
          return;
        }
        this.promptEvolution(index, card);
        return;
      }

      // 3. エネルギーカード
      if (this.isEnergy(card)) {
        if (this.isBlocked('energy', card, p)) {
          App.toast('効果によりエネルギーの手札付けは禁止されています。', true);
          return;
        }
        if (p.energyAttached) {
          App.toast('エネルギーの手札付けは1ターンに1回までです。', true);
          return;
        }
        this.promptEnergyAttachment(index, card);
        return;
      }

      // 4. グッズ
      const cat = String(card.category || '');
      if (cat.includes('グッズ') || cat.toLowerCase().includes('item')) {
        if (this.isBlocked('item', card, p) || this.isBlocked('trainer', card, p)) {
          App.toast('効果によりグッズの使用は禁止されています。', true);
          return;
        }
        this.playTrainerCard(index, card, 'グッズ');
        return;
      }

      // 5. サポート
      if (cat.includes('サポート') || cat.includes('トレーナー') || cat.toLowerCase().includes('supporter')) {
        if (this.isBlocked('supporter', card, p) || this.isBlocked('trainer', card, p)) {
          App.toast('効果によりサポートの使用は禁止されています。', true);
          return;
        }
        if (p.supporterUsed) {
          App.toast('サポートカードは1ターンに1枚までしか使えません。', true);
          return;
        }
        this.playTrainerCard(index, card, 'サポート');
        return;
      }

      App.toast("「" + card.name + "」を選択しました。");
    },

    promptEnergyAttachment(handIndex, energyCard) {
      const p = this.state.player;
      const targets = [];
      if (p.active) targets.push({ label: "バトル場: " + p.active.name + " (エネ: " + (p.active.energy || 0) + ")", target: p.active, isBench: false });
      p.bench.forEach((b, i) => {
        targets.push({ label: "ベンチ" + (i + 1) + ": " + b.name + " (エネ: " + (b.energy || 0) + ")", target: b, isBench: true, benchIdx: i });
      });

      if (!targets.length) {
        App.toast('エネルギーを付けるポケモンがいません。', true);
        return;
      }

      // 対象が1匹のみなら即座に直接付加！
      if (targets.length === 1) {
        const chosen = targets[0].target;
        const targetSlotEl = targets[0].isBench ?
        document.querySelectorAll('#playerBenchRow .bench-slot-occupied')[targets[0].benchIdx] :
        document.getElementById('playerActiveSpot');
        this.applyEnergyAttachment(handIndex, chosen, targetSlotEl);
        return;
      }

      this.showChoiceModal(targets.map((t) => ({ name: t.label, category: '対象ポケモン', type: t.target.type, hp: t.target.hp })), {
        title: 'エネルギーを付けるポケモンを選択',
        desc: energyCard.name + " を誰に付けますか？（手札からドラッグ＆ドロップでも直接付けられます）"
      }, (selectedIndex) => {
        const chosenItem = targets[selectedIndex];
        if (chosenItem) {
          const targetSlotEl = chosenItem.isBench ?
          document.querySelectorAll('#playerBenchRow .bench-slot-occupied')[chosenItem.benchIdx] :
          document.getElementById('playerActiveSpot');
          this.applyEnergyAttachment(handIndex, chosenItem.target, targetSlotEl);
        }
      });
    },

    applyEnergyAttachment(handIndex, targetPokemon, targetSlotEl) {
      const p = this.state.player;
      if (this.state.turnPlayer !== 'player' || this.state.phase !== 'battle') return;
      if (p.energyAttached) {
        App.toast('エネルギーの手札付けは1ターンに1回までです。', true);
        return;
      }
      const energyCard = p.hand[handIndex];
      if (!energyCard || !this.isEnergy(energyCard)) return;

      const sourceHandEl = document.querySelector("[data-hand-idx=\"" + handIndex + "\"]");

      p.hand.splice(handIndex, 1);
      targetPokemon.energy = (targetPokemon.energy || 0) + 1;
      targetPokemon.attachedEnergies = targetPokemon.attachedEnergies || [];
      targetPokemon.attachedEnergies.push(energyCard.type || '無');
      targetPokemon.attachedCards = targetPokemon.attachedCards || [];
      targetPokemon.attachedCards.push(energyCard);
      p.energyAttached = true;

      this.log("⚡ " + targetPokemon.name + " に " + energyCard.name + " を付けました。(合計エネルギー: " + targetPokemon.energy + ")");
      App.toast(targetPokemon.name + " にエネルギーを付けました！");

      this.broadcastOnlineAction('attach_energy', {
        energyCard: energyCard,
        targetSlotType: targetPokemon === p.active ? 'active' : 'bench',
        benchIdx: targetPokemon === p.active ? -1 : p.bench.indexOf(targetPokemon)
      });

      const stadiumTicker = document.getElementById('stadiumTicker');
      if (stadiumTicker) stadiumTicker.textContent = "あなた: " + targetPokemon.name + " にエネルギーをチャージ！";

      // エネルギー飛来アニメーション
      if (sourceHandEl && targetSlotEl) {
        this.animateEnergyFly(sourceHandEl, targetSlotEl, energyCard.type);
      }

      setTimeout(() => {
        this.render();
      }, 500);
    },

    animateEnergyFly(sourceEl, targetEl, energyType) {
      if (!sourceEl || !targetEl) return;
      try {
        const sRect = sourceEl.getBoundingClientRect();
        const tRect = targetEl.getBoundingClientRect();

        const orb = document.createElement('div');
        orb.className = 'flying-energy-orb type-' + (energyType || '無');
        orb.textContent = energyType || '✦';
        orb.style.left = sRect.left + sRect.width / 2 - 16 + 'px';
        orb.style.top = sRect.top + sRect.height / 2 - 16 + 'px';
        document.body.appendChild(orb);

        void orb.offsetHeight; // force layout

        const dx = tRect.left + tRect.width / 2 - (sRect.left + sRect.width / 2);
        const dy = tRect.top + tRect.height / 2 - (sRect.top + sRect.height / 2);
        orb.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(1.15)';

        setTimeout(() => {
          orb.remove();
          targetEl.classList.add('energy-absorb-pulse');
          setTimeout(() => {
            targetEl.classList.remove('energy-absorb-pulse');
          }, 500);
        }, 650);
      } catch (err) {
        console.error('animateEnergyFly error:', err);
      }
    },

    animateAttack(attackerSlotEl, defenderSlotEl, isPlayer, damage, isWeakness) {
      try {
        if (attackerSlotEl) {
          attackerSlotEl.classList.add(isPlayer ? 'lunge-player' : 'lunge-opp');
          setTimeout(() => {
            attackerSlotEl.classList.remove(isPlayer ? 'lunge-player' : 'lunge-opp');
          }, 650);
        }

        setTimeout(() => {
          const stadium = document.querySelector('.battle-stadium');
          if (stadium) {
            stadium.classList.add('stadium-screen-shake');
            setTimeout(() => stadium.classList.remove('stadium-screen-shake'), 450);
          }

          if (defenderSlotEl) {
            defenderSlotEl.classList.add('defender-hit-flash');
            setTimeout(() => defenderSlotEl.classList.remove('defender-hit-flash'), 400);

            const slash = document.createElement('div');
            slash.className = 'attack-slash-overlay';
            defenderSlotEl.appendChild(slash);
            setTimeout(() => slash.remove(), 400);

            if (damage > 0) {
              const dmgEl = document.createElement('div');
              dmgEl.className = 'floating-damage-number' + (isWeakness ? ' weakness-damage' : '');
              dmgEl.textContent = (isWeakness ? '弱点！ -' : '-') + damage;
              defenderSlotEl.appendChild(dmgEl);
              setTimeout(() => dmgEl.remove(), 1050);
            }
          }
        }, 240);
      } catch (err) {
        console.error('animateAttack error:', err);
      }
    },

    animateCardPlacement(targetEl) {
      if (!targetEl) return;
      targetEl.classList.add('card-placement-slam');
      setTimeout(() => targetEl.classList.remove('card-placement-slam'), 450);
    },

    wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    },

    placeBasicPokemon(handIndex, targetSlotType, targetEl) {
      const p = this.state.player;
      if (this.state.turnPlayer !== 'player' || this.state.phase !== 'battle') return;
      const card = p.hand[handIndex];
      if (!card || !this.isBasic(card)) return;

      if (targetSlotType === 'active') {
        if (p.active) {
          App.toast('バトル場には既にポケモンがいます。', true);
          return;
        }
        const placed = p.hand.splice(handIndex, 1)[0];
        placed._turnPlayed = this.state.turnNumber;
        p.active = placed;
        this.log('✦ ' + card.name + ' をバトル場に出しました。');
        App.toast(card.name + ' をバトル場に出しました！');
        this.animateCardPlacement(targetEl || document.getElementById('playerActiveSpot'));
        this.broadcastOnlineAction('play_basic', { card: placed, slotType: 'active' });
        this.render();
        return;
      }

      if (targetSlotType === 'bench') {
        if (p.bench.length >= 5) {
          App.toast('ベンチがいっぱいです（最大5匹）。', true);
          return;
        }
        const placed = p.hand.splice(handIndex, 1)[0];
        placed._turnPlayed = this.state.turnNumber;
        p.bench.push(placed);
        this.log('✦ ' + card.name + ' をベンチに出しました。');
        App.toast(card.name + ' をベンチに出しました！');
        this.animateCardPlacement(targetEl);
        this.broadcastOnlineAction('play_basic', { card: placed, slotType: 'bench' });
        this.render();
        return;
      }
    },

    executeEvolution(handIndex, targetPokemon, targetSlotEl) {
      const p = this.state.player;
      if (this.state.turnPlayer !== 'player' || this.state.phase !== 'battle') return;
      const evo = p.hand.splice(handIndex, 1)[0];
      if (!evo || !targetPokemon) return;

      targetPokemon.attachedCards = targetPokemon.attachedCards || [];
      targetPokemon.attachedCards.unshift({
        name: targetPokemon.name,
        category: targetPokemon.category,
        type: targetPokemon.type,
        hp: targetPokemon.maxHp || targetPokemon.hp,
        maxHp: targetPokemon.maxHp || targetPokemon.hp,
        preEvolution: targetPokemon.preEvolution,
        image: targetPokemon.image,
        isEx: targetPokemon.isEx
      });

      const damageTaken = (targetPokemon.maxHp || 70) - (targetPokemon.hp || 70);
      targetPokemon.name = evo.name;
      targetPokemon.category = evo.category;
      targetPokemon.type = evo.type || targetPokemon.type;
      targetPokemon.maxHp = Number(evo.hp) || targetPokemon.maxHp + 50;
      targetPokemon.hp = Math.max(10, targetPokemon.maxHp - damageTaken);
      targetPokemon.attack1Name = evo.attack1Name;
      targetPokemon.attack1Damage = evo.attack1Damage;
      targetPokemon.attack1Energy = evo.attack1Energy;
      targetPokemon.attack1Text = evo.attack1Text;
      targetPokemon.attack1Code = evo.attack1Code;
      targetPokemon.attack2Name = evo.attack2Name;
      targetPokemon.attack2Damage = evo.attack2Damage;
      targetPokemon.attack2Energy = evo.attack2Energy;
      targetPokemon.attack2Text = evo.attack2Text;
      targetPokemon.attack2Code = evo.attack2Code;
      targetPokemon.abilityName = evo.abilityName || targetPokemon.abilityName;
      targetPokemon.abilityText = evo.abilityText || targetPokemon.abilityText;
      targetPokemon.abilityCode = evo.abilityCode || targetPokemon.abilityCode;
      targetPokemon.image = evo.image || targetPokemon.image;
      targetPokemon.isEx = evo.isEx || targetPokemon.isEx;
      targetPokemon.preEvolution = evo.preEvolution;
      targetPokemon.weakness = evo.weakness || targetPokemon.weakness;
      targetPokemon.resistance = evo.resistance || targetPokemon.resistance;
      targetPokemon.retreat = evo.retreat != null ? evo.retreat : targetPokemon.retreat;
      targetPokemon.status = null;
      targetPokemon._turnPlayed = this.state.turnNumber;

      this.log('✨ 進化！ ' + targetPokemon.name + ' に進化しました！(HP: ' + targetPokemon.hp + '/' + targetPokemon.maxHp + ')');
      App.toast(targetPokemon.name + ' に進化しました！');

      const isTargetActive = targetPokemon === p.active;
      const targetBenchIdx = isTargetActive ? -1 : p.bench.indexOf(targetPokemon);
      this.broadcastOnlineAction('evolve', {
        evoCard: evo,
        targetSlotType: isTargetActive ? 'active' : 'bench',
        benchIdx: targetBenchIdx
      });

      if (targetSlotEl) {
        targetSlotEl.classList.add('evolution-flash');
        setTimeout(() => targetSlotEl.classList.remove('evolution-flash'), 750);
      }

      this.render();
    },

    handleDropOnPokemon(handIndex, targetPokemon, targetSlotEl, isBench, benchIdx) {
      if (handIndex == null) return;
      const p = this.state.player;
      const card = p.hand[handIndex];
      if (!card) return;

      if (this.isEnergy(card)) {
        if (!targetPokemon) {
          App.toast('エネルギーを付けるポケモンがいません。', true);
          return;
        }
        this.applyEnergyAttachment(handIndex, targetPokemon, targetSlotEl);
        return;
      }

      if (this.isEvolution(card)) {
        if (!targetPokemon) {
          App.toast('進化させる対象ポケモンがいません。', true);
          return;
        }
        const check = this.canEvolveFrom(card, targetPokemon);
        if (!check.can) {
          App.toast(check.reason || "【" + card.name + "】は " + targetPokemon.name + " には進化できません。", true);
          return;
        }
        this.executeEvolution(handIndex, targetPokemon, targetSlotEl);
        return;
      }

      if (this.isBasic(card)) {
        if (!targetPokemon && !isBench) {
          this.placeBasicPokemon(handIndex, 'active', targetSlotEl);
          return;
        }
        App.toast('たねポケモンは空いているスロット（ベンチ空など）に出してください。', true);
        return;
      }

      // トレーナー/グッズ/サポートカード
      const cat = String(card.category || '');
      const isSupp = cat.includes('サポート') || cat.includes('トレーナー') || cat.toLowerCase().includes('supporter');
      if (isSupp && p.supporterUsed) {
        App.toast('サポートカードは1ターンに1枚までしか使えません。', true);
        return;
      }
      this.playTrainerCard(handIndex, card, isSupp ? 'サポート' : 'グッズ', targetPokemon);
    },

    handleDropOnEmptyBench(handIndex, targetSlotEl, benchIdx) {
      if (handIndex == null) return;
      const p = this.state.player;
      const card = p.hand[handIndex];
      if (!card) return;

      if (this.isBasic(card)) {
        this.placeBasicPokemon(handIndex, 'bench', targetSlotEl);
        return;
      }
      App.toast('空のベンチスロットにはたねポケモンのみ出せます。', true);
    },

    handleDropOnField(handIndex) {
      if (handIndex == null) return;
      const p = this.state.player;
      const card = p.hand[handIndex];
      if (!card) return;

      if (this.isBasic(card)) {
        if (!p.active) {
          this.placeBasicPokemon(handIndex, 'active');
        } else if (p.bench.length < 5) {
          this.placeBasicPokemon(handIndex, 'bench');
        } else {
          App.toast('ベンチがいっぱいです。', true);
        }
        return;
      }

      if (this.isEvolution(card)) {
        this.promptEvolution(handIndex, card);
        return;
      }

      if (this.isEnergy(card)) {
        this.promptEnergyAttachment(handIndex, card);
        return;
      }

      // トレーナーカード
      const cat = String(card.category || '');
      const isSupp = cat.includes('サポート') || cat.includes('トレーナー') || cat.toLowerCase().includes('supporter');
      if (isSupp && p.supporterUsed) {
        App.toast('サポートカードは1ターンに1枚までしか使えません。', true);
        return;
      }
      this.playTrainerCard(handIndex, card, isSupp ? 'サポート' : 'グッズ');
    },

    promptEvolution(handIndex, evoCard) {
      const p = this.state.player;
      const allTargets = [];
      if (p.active) allTargets.push({ target: p.active, where: 'バトル場' });
      p.bench.forEach((b) => allTargets.push({ target: b, where: 'ベンチ' }));

      // canEvolveFrom でフィルタリング
      const eligible = allTargets.filter((e) => this.canEvolveFrom(evoCard, e.target).can);

      if (!eligible.length) {
        const preEvoName = this.getPreEvolutionName(evoCard);
        App.toast("【" + evoCard.name + "】は「" + preEvoName + "」が場にいないと進化できません。", true);
        return;
      }

      // もし対象が1匹のみなら即座に進化！
      if (eligible.length === 1) {
        this.executeEvolution(handIndex, eligible[0].target);
        return;
      }

      this.showChoiceModal(eligible.map((e) => ({ name: e.where + ': ' + e.target.name, type: e.target.type, hp: e.target.hp, category: e.target.category })), {
        title: '進化させる対象を選択',
        desc: evoCard.name + ' をどのポケモンに重ねて進化させますか？'
      }, (idx) => {
        const chosen = eligible[idx]?.target;
        if (chosen) {
          this.executeEvolution(handIndex, chosen);
        }
      });
    },

    // トレーナーカードを「場に出した」ように見せるアニメーション
    animateTrainerCardPlay(card, kind) {
      return new Promise((resolve) => {
        try {
          // カードのHTMLを生成
          const cardHtml = window.CardSystem && window.CardSystem.createCardHtml ?
          window.CardSystem.createCardHtml(card, { size: 'hand' }) :
          '<div style="background:rgba(255,209,102,0.2);border:2px solid #ffd166;border-radius:12px;width:110px;height:154px;display:flex;align-items:center;justify-content:center;color:#ffd166;font-weight:900;font-size:13px;">' + this.escape(card.name) + '</div>';

          // 種別バッジ色
          const kindColor = kind === 'サポート' ? '#a29bfe' : kind === 'グッズ' ? '#2ec4b6' : '#ffd166';
          const kindBg = kind === 'サポート' ? 'rgba(162,155,254,0.2)' : kind === 'グッズ' ? 'rgba(46,196,182,0.2)' : 'rgba(255,209,102,0.2)';

          // オーバーレイ生成
          const overlay = document.createElement('div');
          overlay.className = 'trainer-card-play-overlay';
          overlay.innerHTML =
          '<div class="trainer-card-play-card">' +
          '<div class="trainer-card-play-label">' +
          '<span class="trainer-kind-badge" style="background:' + kindBg + ';color:' + kindColor + ';border-color:' + kindColor + '50;">' + this.escape(kind) + '</span>' +
          this.escape(card.name) +
          '</div>' +
          cardHtml +
          '</div>';
          document.body.appendChild(overlay);

          // 効果テキストバナー
          const banner = document.createElement('div');
          banner.className = 'trainer-effect-banner';
          const effectText = card.attack1Text || card.description || kind + 'カードを使用！';
          const shortText = effectText.length > 40 ? effectText.slice(0, 40) + '…' : effectText;
          banner.textContent = shortText;
          document.body.appendChild(banner);

          // アニメーション完了後にクリーンアップ & resolve
          setTimeout(() => {
            overlay.remove();
            banner.remove();
            resolve();
          }, 900);
        } catch (err) {
          console.error('animateTrainerCardPlay error:', err);
          resolve(); // エラーでも続行
        }
      });
    },

    playTrainerCard(handIndex, card, kind, targetPokemon) {
      const p = this.state.player;
      p.hand.splice(handIndex, 1);
      p.discard.push(card);

      if (kind === 'サポート') {
        p.supporterUsed = true;
      }

      this.log('📜 【' + kind + '】「' + card.name + '」を使用しました！');

      this.broadcastOnlineAction('play_trainer', {
        card: card,
        kind: kind
      });

      // 手札表示を即座に更新（カードが消えるように見せる）
      this.render();

      // アニメーション → 効果実行
      this.animateTrainerCardPlay(card, kind).then(() => {
        // ActionEngine で効果実行
        const code = card.attack1Code || card.abilityCode;
        if (code && window.executeCardEffectCode) {
          try {
            window.executeCardEffectCode(
              code,
              { players: [this.state.player, this.state.opponent], logs: this.state.logs },
              p,
              'trainer',
              { card: card, pokemon: targetPokemon || p.active }
            );
          } catch (e) {
            console.error('Trainer card effect error:', e);
            this.log("⚠️ 効果実行エラー: " + e.message);
          }
        } else {
          // デフォルト効果フォールバック
          if (card.name.includes('博士')) {
            p.discard.push(...p.hand);
            p.hand = [];
            for (let i = 0; i < 7; i++) if (p.deck.length) p.hand.push(p.deck.shift());
            this.log("手札をトラッシュし、山札から7枚引きました。");
          } else if (card.name.includes('きずぐすり')) {
            const healTarget = targetPokemon || p.active;
            if (healTarget) {
              const oldHp = healTarget.hp;
              healTarget.hp = Math.min(healTarget.maxHp, healTarget.hp + 30);
              this.log(healTarget.name + "のHPを30回復しました。(" + oldHp + " → " + healTarget.hp + ")");
            }
          } else if (card.name.includes('いれかえ') && p.bench.length) {
            const n = p.bench.shift();
            p.bench.push(p.active);
            p.active = n;
            this.log("バトルポケモンを交代しました。(新しいバトルポケモン: " + p.active.name + ")");
          }
        }

        this.render();
      });
    },


    retreatActive() {
      const p = this.state.player;
      if (this.state.turnPlayer !== 'player') return;
      if (!p.active) return;
      if (this.isBlocked('retreat', p.active, p)) {
        App.toast('効果によりにげることは禁止されています。', true);
        return;
      }
      if (p.retreated) {
        App.toast('にげるは1ターンに1回のみ行えます。', true);
        return;
      }
      if (!p.bench.length) {
        App.toast('ベンチに交代できるポケモンがいません。', true);
        return;
      }
      const retreatCost = Number(p.active.retreat) || 0;
      if ((p.active.energy || 0) < retreatCost) {
        App.toast("にげるエネルギーが足りません (必要: " + retreatCost + "個 / 現在: " + (p.active.energy || 0) + "個)", true);
        return;
      }

      this.showChoiceModal(p.bench.map((b) => ({ name: b.name, type: b.type, hp: b.hp, category: '交代先' })), {
        title: 'バトル場に出すポケモンを選択',
        desc: "エネルギーを" + retreatCost + "個トラッシュして交代します。"
      }, (idx) => {
        p.active.energy -= retreatCost;
        if (p.active.attachedEnergies) {
          for (let i = 0; i < retreatCost; i++) p.active.attachedEnergies.pop();
        }
        if (p.active) {
          p.active.usedLastTurn = false;
        }
        const nextActive = p.bench.splice(idx, 1)[0];
        p.bench.push(p.active);
        p.active = nextActive;
        p.retreated = true;

        this.log("🏃 にげる！ " + nextActive.name + " がバトル場に出ました。");
        this.broadcastOnlineAction('retreat', {
          benchIdx: idx,
          retreatCost: retreatCost
        });
        this.render();
      });
    },

    declareAttack(attackIndex) {
      if (this.state.turnPlayer !== 'player') return;
      const attacker = this.state.player.active;
      const defender = this.state.opponent.active;

      if (!attacker || !defender) return;

      if (this.isBlocked('attack', attacker, this.state.player)) {
        App.toast('効果によりワザの使用は禁止されています。', true);
        return;
      }

      // 先攻第1ターンは攻撃不可ルール
      if (this.state.turnNumber === 1 && this.state.firstPlayer === 'player') {
        App.toast('先攻の最初のターンはワザを使うことができません。', true);
        return;
      }

      const atkName = attackIndex === 1 ? attacker.attack1Name : attacker.attack2Name;
      const atkDamage = attackIndex === 1 ? attacker.attack1Damage : attacker.attack2Damage;
      const atkEnergy = attackIndex === 1 ? attacker.attack1Energy : attacker.attack2Energy;
      const atkCode = attackIndex === 1 ? attacker.attack1Code : attacker.attack2Code;

      // エネルギーコストチェック
      const reqCount = this.parseEnergyCount(atkEnergy);
      if ((attacker.energy || 0) < reqCount) {
        App.toast("エネルギーが足りません (必要: " + reqCount + "個 / 現在: " + (attacker.energy || 0) + "個)", true);
        return;
      }

      const stadiumTicker = document.getElementById('stadiumTicker');
      if (stadiumTicker) stadiumTicker.textContent = "あなた: 「" + atkName + "」を発動！";

      // 突進アニメーション発火
      const attackerEl = document.getElementById('playerActiveSpot');
      if (attackerEl) {
        attackerEl.classList.add('lunge-player');
        setTimeout(() => attackerEl.classList.remove('lunge-player'), 650);
      }

      setTimeout(() => {
        this.log("⚔️ " + attacker.name + " の「" + atkName + "」！");

        this.broadcastOnlineAction('attack', {
          atkName: atkName,
          damage: atkDamage,
          attackIndex: attackIndex
        });

        let execCtx = null;
        // 処理は全部効果エディター (atkCode)
        if (atkCode && atkCode.trim() && window.executeCardEffectCode) {
          try {
            execCtx = window.executeCardEffectCode(
              atkCode,
              { players: [this.state.player, this.state.opponent], logs: this.state.logs },
              this.state.player,
              'attack',
              { card: attacker, pokemon: attacker, attackIndex: attackIndex }
            );
          } catch (e) {
            if (e && e.isEffectAbort) {
              execCtx = { isCancelled: true, cancelReason: e.message };
            } else {
              console.error('Attack effect error:', e);
              this.log("⚠️ ワザ効果コード実行エラー: " + e.message);
            }
          }
        } else {
          // 効果コード未設定カードのフォールバック（表示用ダメージ文字列から数値を抽出）
          const numericDmg = parseInt(String(atkDamage || '').replace(/[^\d]/g, ''), 10) || 0;
          if (numericDmg > 0 && window.ORBITAL_EFFECT_API) {
            window.ORBITAL_EFFECT_API.damage(
              { self: this.state.player, opponent: this.state.opponent, game: this.state },
              defender,
              numericDmg
            );
          }
        }

        // cant() による中断判定（ワザを使っていない扱いとし、番を終了しない）
        if (execCtx && execCtx.isCancelled) {
          this.log("⚠️ 条件を満たさなかったため、ワザは使用されませんでした。（自分の番は継続します）");
          this.render();
          return;
        }

        // きぜつ判定
        if (defender.hp <= 0) {
          this.handleKnockout(this.state.player, this.state.opponent);
        } else if (attacker.hp <= 0) {
          this.handleKnockout(this.state.opponent, this.state.player);
        } else {
          this.render();
          // 攻撃宣言後はターン終了
          setTimeout(() => this.endTurn(), 800);
        }
      }, 350);
    },

    parseEnergyCount(energyStr) {
      if (!energyStr) return 0;
      if (typeof energyStr === 'number') return Math.max(0, energyStr);
      const str = String(energyStr).trim();
      if (/^\d+$/.test(str)) return Number(str);
      if (str.includes(',')) {
        return str.split(',').map((s) => s.trim()).filter(Boolean).length;
      }
      return str.length;
    },

    handleKnockout(scorer, victim) {
      const koPokemon = victim.active;
      this.log("💀 " + koPokemon.name + " はきぜつした！");
      victim.discard.push(koPokemon);
      victim.active = null;

      // ex判定 (ポケモンexがきぜつしたとき、相手はサイドを2枚とる)
      const isEx = !!(koPokemon.isEx || String(koPokemon.category || '').includes('ex') || /[\s_・-]ex|ex/i.test(String(koPokemon.name || '')) || String(koPokemon.rarity || '').toLowerCase() === 'ex');

      const prizeCount = isEx ? Math.min(2, scorer.prizes.length) : Math.min(1, scorer.prizes.length);
      for (let i = 0; i < prizeCount; i++) {
        if (scorer.prizes.length > 0) {
          const prize = scorer.prizes.shift();
          scorer.hand.push(prize);
        }
      }

      if (isEx) {
        this.log("🌟 【exルール適用！】相手のポケモンex（" + koPokemon.name + "）がきぜつしたため、" + scorer.name + " はサイドを【2枚】とりました！（残りサイド: " + scorer.prizes.length + "枚）");
      } else {
        this.log("🏆 【" + scorer.name + "】がサイドを1枚獲得！（残りサイド: " + scorer.prizes.length + "枚）");
      }

      // 相手撃破時イベント onKnockoutOpponent の発火
      if (scorer.active?.abilityCode && window.executeCardEffectCode) {
        try {
          window.executeCardEffectCode(scorer.active.abilityCode, { players: [scorer, victim] }, scorer, 'onKnockoutOpponent', { koPokemon, isEx });
        } catch (e) {
          console.error('onKnockoutOpponent ability error:', e);
        }
      }

      // 勝利判定 1: サイドをすべて取り切った
      if (scorer.prizes.length === 0) {
        this.finishBattle(scorer.id, 'すべてのサイドカードを取り切りました！');
        return;
      }

      // 勝利判定 2: 相手のベンチが全滅
      if (!victim.bench.length) {
        this.finishBattle(scorer.id, '相手の場にポケモンがいなくなりました！');
        return;
      }

      // 交代ポケモンの選出
      if (victim.id === 'player') {
        this.showChoiceModal(victim.bench.map((b) => ({ name: b.name, type: b.type, hp: b.hp, category: 'バトル場へ' })), {
          title: 'きぜつによるバトルポケモン交代',
          desc: 'バトル場に出すベンチポケモンを選択してください。'
        }, (idx) => {
          victim.active = victim.bench.splice(idx, 1)[0];
          this.log("🔄 プレイヤーは " + victim.active.name + " をバトル場に出しました。");
          this.render();
          setTimeout(() => this.endTurn(), 600);
        });
      } else {
        // AI はHPが一番高いポケモンをバトル場へ昇格
        victim.bench.sort((a, b) => b.hp - a.hp);
        victim.active = victim.bench.shift();
        this.log("🔄 AIライバルは " + victim.active.name + " をバトル場に出しました。");
        this.render();
        setTimeout(() => this.endTurn(), 600);
      }
    },

    async runAiTurn() {
      if (this.state.phase !== 'battle' || this.state.turnPlayer !== 'opponent') return;
      const ai = this.state.opponent;
      const oppTicker = document.getElementById('stadiumTicker');

      // 0. AI思考開始
      if (oppTicker) oppTicker.textContent = '相手が次の行動を思考中...';
      await this.wait(600);

      // 1. ベンチ出し
      const basicIdx = ai.hand.findIndex((c) => this.isBasic(c));
      if (basicIdx >= 0 && ai.bench.length < 3) {
        const basic = ai.hand.splice(basicIdx, 1)[0];
        basic._turnPlayed = this.state.turnNumber;
        ai.bench.push(basic);
        this.log("🤖 AIライバルは " + basic.name + " をベンチに出しました。");
        if (oppTicker) oppTicker.textContent = "相手: " + basic.name + " をベンチに召喚！";
        this.render();
        const newBenchEl = document.querySelectorAll('#oppBenchRow .bench-slot-occupied')[ai.bench.length - 1];
        if (newBenchEl) this.animateCardPlacement(newBenchEl);
        await this.wait(750);
      }

      // 1.5. AI進化 (有効な進化先がある場合のみ)
      const evoIdx = ai.hand.findIndex((c) => this.isEvolution(c));
      if (evoIdx >= 0) {
        const evoCard = ai.hand[evoIdx];
        const targets = [
        ...(ai.active ? [ai.active] : []),
        ...ai.bench];

        const validTarget = targets.find((t) => {
          const check = this.canEvolveFrom(evoCard, t);
          // AIは先攻1ターン目制限を適用 (失敗しないようフォールバックなし)
          return check.can;
        });
        if (validTarget) {
          const evo = ai.hand.splice(evoIdx, 1)[0];
          validTarget.attachedCards = validTarget.attachedCards || [];
          validTarget.attachedCards.unshift({
            name: validTarget.name,
            category: validTarget.category,
            type: validTarget.type,
            hp: validTarget.maxHp || validTarget.hp,
            maxHp: validTarget.maxHp || validTarget.hp,
            preEvolution: validTarget.preEvolution,
            image: validTarget.image,
            isEx: validTarget.isEx
          });
          const damageTaken = (validTarget.maxHp || 70) - (validTarget.hp || 70);
          validTarget.name = evo.name;
          validTarget.category = evo.category;
          validTarget.type = evo.type || validTarget.type;
          validTarget.maxHp = Number(evo.hp) || validTarget.maxHp + 50;
          validTarget.hp = Math.max(10, validTarget.maxHp - damageTaken);
          validTarget.attack1Name = evo.attack1Name;
          validTarget.attack1Damage = evo.attack1Damage;
          validTarget.attack1Energy = evo.attack1Energy;
          validTarget.attack1Text = evo.attack1Text;
          validTarget.attack1Code = evo.attack1Code;
          validTarget.attack2Name = evo.attack2Name;
          validTarget.attack2Damage = evo.attack2Damage;
          validTarget.attack2Energy = evo.attack2Energy;
          validTarget.attack2Text = evo.attack2Text;
          validTarget.attack2Code = evo.attack2Code;
          validTarget.abilityName = evo.abilityName || validTarget.abilityName;
          validTarget.abilityText = evo.abilityText || validTarget.abilityText;
          validTarget.abilityCode = evo.abilityCode || validTarget.abilityCode;
          validTarget.isEx = evo.isEx || validTarget.isEx;
          validTarget.preEvolution = evo.preEvolution;
          validTarget.weakness = evo.weakness || validTarget.weakness;
          validTarget.resistance = evo.resistance || validTarget.resistance;
          validTarget.retreat = evo.retreat != null ? evo.retreat : validTarget.retreat;
          validTarget.status = null;
          validTarget._turnPlayed = this.state.turnNumber;
          this.log("🤖 AIライバルの " + validTarget.name + " に進化しました！");
          if (oppTicker) oppTicker.textContent = "相手: " + validTarget.name + " に進化！";
          this.render();
          await this.wait(800);
        }
      }

      // 2. エネルギー付加
      const energyIdx = ai.hand.findIndex((c) => c.category === 'エネルギー' || c.category === '基本エネルギー');
      if (energyIdx >= 0 && !ai.energyAttached && ai.active) {
        const nrg = ai.hand.splice(energyIdx, 1)[0];
        ai.active.energy = (ai.active.energy || 0) + 1;
        ai.active.attachedEnergies = ai.active.attachedEnergies || [];
        ai.active.attachedEnergies.push(nrg.type || '無');
        ai.active.attachedCards = ai.active.attachedCards || [];
        ai.active.attachedCards.push(nrg);
        ai.energyAttached = true;
        this.log("🤖 AIライバルは " + ai.active.name + " にエネルギーを付けました。(エネ: " + ai.active.energy + ")");
        if (oppTicker) oppTicker.textContent = "相手: " + ai.active.name + " にエネルギーをチャージ！";

        const oppActiveEl = document.getElementById('oppActiveSpot');
        const oppDeckEl = document.getElementById('oppDeckCount');
        if (oppActiveEl) {
          this.animateEnergyFly(oppDeckEl || oppActiveEl, oppActiveEl, nrg.type);
        }
        await this.wait(650);
        this.render();
        await this.wait(500);
      }

      // 3. サポート/グッズ使用
      const trainerIdx = ai.hand.findIndex((c) => (c.category === 'グッズ' || c.category === 'サポート') && c.name.includes('きずぐすり'));
      if (trainerIdx >= 0 && ai.active && ai.active.hp <= ai.active.maxHp - 30) {
        const tr = ai.hand.splice(trainerIdx, 1)[0];
        ai.discard.push(tr);
        ai.active.hp = Math.min(ai.active.maxHp, ai.active.hp + 30);
        this.log("🤖 AIライバルは「" + tr.name + "」を使用！ HPを回復しました。(HP: " + ai.active.hp + ")");
        if (oppTicker) oppTicker.textContent = "相手: 「" + tr.name + "」でHPを30回復！";
        this.render();
        await this.wait(700);
      }

      // 4. ワザ宣言・攻撃
      if (!ai.active || !this.state.player.active) {
        this.endTurn();
        return;
      }

      // 先攻1ターン目攻撃不可
      if (this.state.turnNumber === 1 && this.state.firstPlayer === 'opponent') {
        this.log("🤖 AIライバル: 先攻のため攻撃できません。ターン終了します。");
        if (oppTicker) oppTicker.textContent = '相手: 先攻のためワザを使わずターン終了';
        await this.wait(700);
        this.endTurn();
        return;
      }

      // ワザ選択
      const atk2Cost = this.parseEnergyCount(ai.active.attack2Energy);
      const atk1Cost = this.parseEnergyCount(ai.active.attack1Energy);

      let attackChoice = 0;
      if (ai.active.attack2Name && (ai.active.energy || 0) >= atk2Cost) {
        attackChoice = 2;
      } else if (ai.active.attack1Name && (ai.active.energy || 0) >= atk1Cost) {
        attackChoice = 1;
      }

      if (attackChoice > 0) {
        const atkName = attackChoice === 1 ? ai.active.attack1Name : ai.active.attack2Name;
        const atkDamage = attackChoice === 1 ? ai.active.attack1Damage : ai.active.attack2Damage;
        const atkCode = attackChoice === 1 ? ai.active.attack1Code : ai.active.attack2Code;
        const defender = this.state.player.active;

        if (oppTicker) oppTicker.textContent = "相手: 「" + atkName + "」を宣言！！";
        await this.wait(400);

        // 突進演出
        const attackerEl = document.getElementById('oppActiveSpot');
        if (attackerEl) {
          attackerEl.classList.add('lunge-opp');
          setTimeout(() => attackerEl.classList.remove('lunge-opp'), 650);
        }
        await this.wait(400);

        this.log("⚔️ AIライバル " + ai.active.name + " の「" + atkName + "」！");

        let execCtx = null;
        // 処理は全部効果エディター (atkCode)
        if (atkCode && atkCode.trim() && window.executeCardEffectCode) {
          try {
            execCtx = window.executeCardEffectCode(
              atkCode,
              { players: [this.state.opponent, this.state.player], logs: this.state.logs },
              this.state.opponent,
              'attack',
              { card: ai.active, pokemon: ai.active }
            );
          } catch (e) {
            if (e && e.isEffectAbort) {
              execCtx = { isCancelled: true, cancelReason: e.message };
            } else {
              console.error('AI Attack effect error:', e);
              this.log("⚠️ AIワザ効果コードエラー: " + e.message);
            }
          }
        } else {
          const numericDmg = parseInt(String(atkDamage || '').replace(/[^\d]/g, ''), 10) || 0;
          if (numericDmg > 0 && window.ORBITAL_EFFECT_API) {
            window.ORBITAL_EFFECT_API.damage(
              { self: this.state.opponent, opponent: this.state.player, game: this.state },
              defender,
              numericDmg
            );
          }
        }

        if (execCtx && execCtx.isCancelled) {
          this.log("🤖 AIライバル: ワザの条件を満たさなかったため攻撃しませんでした。");
          await this.wait(700);
          this.endTurn();
          return;
        }

        this.render();

        if (defender.hp <= 0) {
          await this.wait(400);
          this.handleKnockout(this.state.opponent, this.state.player);
        } else if (ai.active.hp <= 0) {
          await this.wait(400);
          this.handleKnockout(this.state.player, this.state.opponent);
        } else {
          await this.wait(800);
          this.endTurn();
        }
      } else {
        this.log("🤖 AIライバル: エネルギーが不足しているため攻撃せずターン終了します。");
        if (oppTicker) oppTicker.textContent = '相手: 攻撃エネルギー不足のためターン終了';
        await this.wait(700);
        this.endTurn();
      }
    },

    finishBattle(winnerId, reason) {
      this.stopPolling();
      this.state.phase = 'ended';
      const isWin = winnerId === 'player';

      const banner = document.getElementById('resultBanner');
      const title = document.getElementById('resultTitle');
      const msg = document.getElementById('resultMessage');
      const stats = document.getElementById('resultStats');

      if (banner) {
        banner.textContent = isWin ? 'VICTORY!' : 'DEFEAT...';
        banner.className = "result-banner " + (isWin ? 'win' : 'lose');
      }
      if (title) title.textContent = isWin ? '🎉 あなたの勝利！' : '💀 敗北…';
      if (msg) msg.textContent = reason || (isWin ? '対戦相手を圧倒しました！' : '再挑戦してリベンジしましょう！');

      if (stats) {
        stats.innerHTML = "\n          <div>対戦ターン数: <strong>" +
        this.state.turnNumber + " ターン</strong></div>\n          <div>あなたの残りサイド: <strong>" +

      }

      const modal = document.getElementById('battleResultModal');
      if (modal) modal.classList.remove('hidden');

          miniCardHtml + "\n              </div>\n              <div class=\"bench-hp-mini-strip\">\n                <div class=\"bench-hp-bar\"><div class=\"bench-hp-fill\" style=\"width: " +


          hpPct + "%; background: " + hpColor + ";\"></div></div>\n                <div class=\"bench-meta\">HP " +
          c.hp + " • ⚡" + (c.energy || 0) + "</div>\n              </div>\n            </div>\n          ";



        } else {
          slotsHtml += "<div class=\"bench-slot-empty\" data-empty-bench-idx=\"" + i + "\"><span>ベンチ空 (DnD)</span></div>";
        }
      }
      root.innerHTML = slotsHtml;

      // ベンチのカードをクリックでアクション / 詳細確認
      root.querySelectorAll('.bench-slot-occupied').forEach((slotEl) => {
        const benchIdx = Number(slotEl.dataset.benchIdx);
        const c = benchList[benchIdx];
        if (c) {
          slotEl.style.cursor = 'pointer';
          slotEl.onclick = () => {
            if (this.draggedHandIndex == null) {
              if (isPlayer) {
                this.openCardActionModal(c, true, benchIdx);
              } else if (window.CardSystem && window.CardSystem.showDetail) {
                CardSystem.showDetail(c);
              }
            }
          };
        }
      });

      // プレイヤーベンチ各スロットのドロップ受付
      if (isPlayer) {
        root.querySelectorAll('.bench-slot-occupied').forEach((slotEl) => {
          const benchIdx = Number(slotEl.dataset.benchIdx);
          slotEl.ondragover = (e) => {
            // 常に preventDefault することで ondrop を有効化
            e.preventDefault();
            e.stopPropagation();
            if (this.draggedHandIndex != null) {
              slotEl.classList.add('drag-hover');
            }
          };
          slotEl.ondragleave = (e) => {
            if (!slotEl.contains(e.relatedTarget)) {
              slotEl.classList.remove('drag-hover');
            }
          };
          slotEl.ondrop = (e) => {
            e.preventDefault();
            e.stopPropagation();
            slotEl.classList.remove('drag-hover');
            if (this.draggedHandIndex != null && this.state.player.bench[benchIdx]) {
              const idx = this.draggedHandIndex;
              this.draggedHandIndex = null;
              this.handleDropOnPokemon(idx, this.state.player.bench[benchIdx], slotEl, true, benchIdx);
            }
          };
        });

        root.querySelectorAll('.bench-slot-empty').forEach((slotEl) => {
          const benchIdx = Number(slotEl.dataset.emptyBenchIdx);
          slotEl.ondragover = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (this.draggedHandIndex != null) {
              const draggedCard = this.state.player.hand[this.draggedHandIndex];
              if (draggedCard && this.isBasic(draggedCard)) {
                slotEl.classList.add('drag-hover');
              }
            }
          };
          slotEl.ondragleave = (e) => {
            if (!slotEl.contains(e.relatedTarget)) {
              slotEl.classList.remove('drag-hover');
            }
          };
          slotEl.ondrop = (e) => {
            e.preventDefault();
            e.stopPropagation();
            slotEl.classList.remove('drag-hover');
            if (this.draggedHandIndex != null) {
              const idx = this.draggedHandIndex;
              this.draggedHandIndex = null;
              this.handleDropOnEmptyBench(idx, slotEl, benchIdx);
            }
          };
        });
      }
    },

    renderCommandPanel() {
      // コマンドパネルはカードクリック直接アクション方式に移行したため、存在する場合のみ後方互換で更新
      const root = document.getElementById('playerAttackButtons');
      if (!root) return;
      root.innerHTML = '<span class="muted" style="font-size:11px;">カードをタップして行動</span>';
    },

    openCardActionModal(card, isBench = false, benchIdx = null) {
      if (!card) return;
      this._currentActionCard = card;
      this._currentActionIsBench = isBench;
      this._currentActionBenchIdx = benchIdx;

      const modal = document.getElementById('battleCardActionModal');
      if (!modal) return;

      const symbol = window.CardSystem && window.CardSystem.typeSymbols && window.CardSystem.typeSymbols[card.type] || '✦';
      const symEl = document.getElementById('cardActionTypeSymbol');
      if (symEl) {
        symEl.textContent = symbol;
        symEl.className = "card-action-type-symbol type-" + this.escape(card.type || '無');
      }
      const nameEl = document.getElementById('cardActionName');
      if (nameEl) nameEl.textContent = card.name;
      const catEl = document.getElementById('cardActionCategory');
      if (catEl) catEl.textContent = card.category || (isBench ? 'ベンチ' : 'バトル場');

      const p = this.state.player;
      const isMyTurn = this.state.turnPlayer === 'player' && this.state.phase === 'battle';
      const isFirstTurnFirstPlayer = this.state.turnNumber === 1 && this.state.firstPlayer === 'player';
      const energyCount = card.energy || 0;

      const metaEl = document.getElementById('cardActionMeta');
      if (metaEl) {
        metaEl.textContent = "HP " + card.hp + "/" + card.maxHp + " • エネルギー: " + energyCount + "個 【" + (isBench ? 'ベンチ' : 'バトル場') + "】";
      }

      const listEl = document.getElementById('cardActionList');
      if (!listEl) return;

      let itemsHtml = '';

      // 1. 特性 (バトル場またはベンチ)
      if (card.abilityName) {
        const isAbilityBlocked = this.isBlocked('ability', card, p);
        const maxUses = this.getAbilityMaxUses(card);
        const remaining = this.getAbilityRemainingUses(card);
        const canUseAbility = isMyTurn && remaining > 0 && !isAbilityBlocked;

        let btnLabel = '✨ 特性を発動する';
        if (!isMyTurn) {
          btnLabel = '相手の番です';
        } else if (isAbilityBlocked) {
          btnLabel = '🚫 特性禁止中';
        } else if (remaining === 0) {
          btnLabel = maxUses === 1 ? '使用済み (1ターン1回)' : '使用済み (1ターン' + maxUses + '回)';
        } else if (maxUses === Infinity) {
          btnLabel = '✨ 特性を発動する (何度でも使用可)';
        } else if (maxUses > 1) {
          btnLabel = '✨ 特性を発動する (残り' + remaining + '回)';
        }

        itemsHtml += "\n          <div class=\"card-act-item is-ability\">\n            <div class=\"act-item-content\">\n              <div class=\"act-item-header\">\n                <span class=\"act-badge ability\">特性</span>\n                <span class=\"act-item-name\">" +
        this.escape(card.abilityName) + "</span>\n              </div>\n              <div class=\"act-item-text\">" +
        this.escape(card.abilityText || '特殊効果を発揮します。') + "</div>\n            </div>\n            <button type=\"button\" class=\"primary-button card-act-btn ability-btn\" data-action=\"ability\" " + (
        canUseAbility ? '' : 'disabled') + ">\n              " +
        btnLabel + "\n            </button>\n          </div>\n        ";
      }

      // 2. ワザ1
      if (card.attack1Name) {
        const cost = this.parseEnergyCount(card.attack1Energy);
        const hasEnergy = energyCount >= cost;
        const isAtkBlocked = this.isBlocked('attack', card, p);
        const canAttack = !isBench && isMyTurn && !isFirstTurnFirstPlayer && hasEnergy && !isAtkBlocked;

        let btnLabel = '⚔ ワザを使う';
        if (isBench) btnLabel = 'バトル場で使用可';else
        if (!isMyTurn) btnLabel = '相手の番です';else
        if (isFirstTurnFirstPlayer) btnLabel = '先攻1ターン目不可';else
        if (isAtkBlocked) btnLabel = '🚫 ワザ使用禁止中';else
        if (!hasEnergy) btnLabel = "エネ不足 (" + energyCount + "/" + cost + ")";

        itemsHtml += "\n          <div class=\"card-act-item is-attack\">\n            <div class=\"act-item-content\">\n              <div class=\"act-item-header\">\n                <span class=\"act-badge atk\">ワザ1</span>\n                <span class=\"act-item-name\">" +
        this.escape(card.attack1Name) + "</span>\n                <span class=\"act-item-dmg\">" +
        this.escape(card.attack1Damage != null && card.attack1Damage !== '' ? card.attack1Damage + ' ダメージ' : '') + "</span>\n              </div>\n              <div class=\"act-item-text\">" +
        this.escape(card.attack1Text || '') + "</div>\n              <div class=\"act-item-cost\">必要: " +
        this.renderCostText(card.attack1Energy) + " (現在: " + energyCount + "個)</div>\n            </div>\n            <button type=\"button\" class=\"primary-button card-act-btn\" data-action=\"attack1\" " + (
        canAttack ? '' : 'disabled') + ">\n              " +
        btnLabel + "\n            </button>\n          </div>\n        ";
      }

      // 3. ワザ2
      if (card.attack2Name) {
        const cost = this.parseEnergyCount(card.attack2Energy);
        const hasEnergy = energyCount >= cost;
        const isAtkBlocked = this.isBlocked('attack', card, p);
        const canAttack = !isBench && isMyTurn && !isFirstTurnFirstPlayer && hasEnergy && !isAtkBlocked;

        let btnLabel = '⚔ ワザを使う';
        if (isBench) btnLabel = 'バトル場で使用可';else
        if (!isMyTurn) btnLabel = '相手の番です';else
        if (isFirstTurnFirstPlayer) btnLabel = '先攻1ターン目不可';else
        if (isAtkBlocked) btnLabel = '🚫 ワザ使用禁止中';else
        if (!hasEnergy) btnLabel = "エネ不足 (" + energyCount + "/" + cost + ")";

        itemsHtml += "\n          <div class=\"card-act-item is-attack\">\n            <div class=\"act-item-content\">\n              <div class=\"act-item-header\">\n                <span class=\"act-badge atk\">ワザ2</span>\n                <span class=\"act-item-name\">" +
        this.escape(card.attack2Name) + "</span>\n                <span class=\"act-item-dmg\">" +
        this.escape(card.attack2Damage != null && card.attack2Damage !== '' ? card.attack2Damage + ' ダメージ' : '') + "</span>\n              </div>\n              <div class=\"act-item-text\">" +
        this.escape(card.attack2Text || '') + "</div>\n              <div class=\"act-item-cost\">必要: " +
        this.renderCostText(card.attack2Energy) + " (現在: " + energyCount + "個)</div>\n            </div>\n            <button type=\"button\" class=\"primary-button card-act-btn\" data-action=\"attack2\" " + (
        canAttack ? '' : 'disabled') + ">\n              " +
        btnLabel + "\n            </button>\n          </div>\n        ";
      }

      // 4. にげる (バトル場のみ)
      if (!isBench) {
        const retreatCost = Number(card.retreat) || 0;
        const hasBench = p.bench && p.bench.length > 0;
        const hasEnergy = energyCount >= retreatCost;
        const isRetreatBlocked = this.isBlocked('retreat', card, p);
        const canRetreat = isMyTurn && !p.retreated && hasBench && hasEnergy && !isRetreatBlocked;

        let btnLabel = '🏃 にげる (交代)';
        if (!isMyTurn) btnLabel = '相手の番です';else
        if (isRetreatBlocked) btnLabel = '🚫 にげる禁止中';else
        if (p.retreated) btnLabel = '今番既ににげました';else
        if (!hasBench) btnLabel = '交代ベンチなし';else
        if (!hasEnergy) btnLabel = "エネ不足 (" + energyCount + "/" + retreatCost + ")";

        itemsHtml += "\n          <div class=\"card-act-item is-retreat\">\n            <div class=\"act-item-content\">\n              <div class=\"act-item-header\">\n                <span class=\"act-badge retreat\">交代</span>\n                <span class=\"act-item-name\">にげる</span>\n                <span class=\"act-item-dmg\">要 " +
        retreatCost + " エネ</span>\n              </div>\n              <div class=\"act-item-text\">ベンチのポケモンと交代します（エネルギーを" +
        retreatCost + "個消費）。</div>\n            </div>\n            <button type=\"button\" class=\"secondary-button card-act-btn\" data-action=\"retreat\" " + (
        canRetreat ? '' : 'disabled') + ">\n              " +
        btnLabel + "\n            </button>\n          </div>\n        ";
      }

      if (!itemsHtml) {
        itemsHtml = '<div class="muted" style="text-align:center; padding: 20px;">現在実行可能なアクションはありません。</div>';
      }

      listEl.innerHTML = itemsHtml;

      // アクションボタンクリック設定
      listEl.querySelectorAll('[data-action]').forEach((btn) => {
        btn.onclick = () => {
          const act = btn.dataset.action;
          this.closeCardActionModal();
          if (act === 'attack1') {
            this.declareAttack(1);
          } else if (act === 'attack2') {
            this.declareAttack(2);
          } else if (act === 'ability') {
            this.activateAbility(card, isBench, benchIdx);
          } else if (act === 'retreat') {
            this.retreatActive();
          }
        };
      });

      modal.style.display = 'flex';
    },

    closeCardActionModal() {
      const modal = document.getElementById('battleCardActionModal');
      if (modal) modal.style.display = 'none';
      this._currentActionCard = null;
    },

    renderCostText(energyStr) {
      if (!energyStr) return '0個';
      return String(energyStr).split(',').map((e) => e.trim()).filter(Boolean).map((e) => {
        const sym = window.CardSystem && window.CardSystem.typeSymbols && window.CardSystem.typeSymbols[e] || e;
        return "" + sym + e;
      }).join(' ');
    },

    getAbilityMaxUses(card) {
      if (!card) return 1;
      if (card._abilityMaxUses !== undefined && card._abilityMaxUses !== null) {
        return Number(card._abilityMaxUses);
      }
      const code = String(card.abilityCode || '');
      if (/useLimit\s*\(\s*(?:Infinity|999|'infinite'|"infinite")\s*\)/i.test(code)) {
        return Infinity;
      }
      const match = code.match(/(?:useLimit|limitPerTurn|timesPerTurn|limit)\s*\(\s*(\d+)\s*\)/i);
      if (match) {
        return Number(match[1]);
      }
      return 1;
    },

    getAbilityRemainingUses(card) {
      if (!card) return 0;
      const maxUses = this.getAbilityMaxUses(card);
      if (maxUses === Infinity) return Infinity;
      const used = Number(card._abilityUseCount || 0);
      return Math.max(0, maxUses - used);
    },

    activateAbility(card, isBench = false, benchIdx = null) {
      if (this.state.turnPlayer !== 'player') {
        App.toast('あなたの番にのみ特性を使えます。', true);
        return;
      }
      if (this.isBlocked('ability', card, this.state.player)) {
        App.toast('効果により特性の使用は禁止されています。', true);
        return;
      }
      const maxUses = this.getAbilityMaxUses(card);
      const remaining = this.getAbilityRemainingUses(card);
      if (remaining <= 0) {
        App.toast(maxUses === 1 ? "特性【" + card.abilityName + "】は自分の番に1回しか使えません。" : "特性【" + card.abilityName + "】は自分の番に" + maxUses + "回までしか使えません。", true);
        return;
      }

      card._abilityUseCount = (card._abilityUseCount || 0) + 1;
      card._abilityUsedThisTurn = card._abilityUseCount >= maxUses;
      this.log("✨ 【特性発動！】" + card.name + " の特性「" + card.abilityName + "」を発動しました！" + (maxUses > 1 && maxUses !== Infinity ? " (この番 " + card._abilityUseCount + "/" + maxUses + " 回目)" : ""));

      let execCtx = null;
      if (card.abilityCode && window.executeCardEffectCode) {
        try {
          execCtx = window.executeCardEffectCode(card.abilityCode, { players: [this.state.player, this.state.opponent], logs: this.state.logs }, this.state.player, 'onActivateAbility', { card });
        } catch (e) {
          console.error('Ability code execution error:', e);
        }
      } else {
        const text = card.abilityText || '';
        if (text.includes('引く') || text.includes('ドロー')) {
          if (this.state.player.deck.length > 0) {
            const drawn = this.state.player.deck.shift();
            this.state.player.hand.push(drawn);
            this.log("✨ 特性効果で山札から1枚引きました。（" + drawn.name + "）");
          }
        } else if (text.includes('回復')) {
          card.hp = Math.min(card.maxHp, card.hp + 20);
          this.log("✨ 特性効果でHPを20回復しました。（現在HP: " + card.hp + "/" + card.maxHp + "）");
        }
      }

      if (execCtx && execCtx.isCancelled) {
        // 効果がキャンセル（cant()）された場合は使用回数を戻す
        card._abilityUseCount = Math.max(0, (card._abilityUseCount || 1) - 1);
        card._abilityUsedThisTurn = card._abilityUseCount >= maxUses;
        this.render();
        return;
      }

      App.toast("特性「" + card.abilityName + "」を発動しました！");
      this.render();
    },

    renderHand() {
      const root = document.getElementById('playerHandRow');
      if (!root) return;

      const hand = this.state.player.hand;
      if (!hand.length) {
        root.innerHTML = '<div class="muted hand-empty-msg">手札がありません</div>';
        return;
      }

      root.innerHTML = hand.map((c, i) => {
        let actionLabel = '使用';
        const isEn = this.isEnergy(c);
        const isBas = this.isBasic(c);
        const isEvo = this.isEvolution(c);
        if (isBas) actionLabel = '場に出す (DnD)';else
        if (isEn) actionLabel = '⚡ エネ付け (DnD)';else
        if (isEvo) actionLabel = '進化 (DnD)';else
        actionLabel = '発動 (DnD)';

        const isMyTurn = this.state.turnPlayer === 'player' && this.state.phase === 'battle';
        const draggableAttr = isMyTurn ? ' draggable="true"' : '';
        const cardKindClass = isEn ? ' is-energy-card' : isBas ? ' is-basic-card' : isEvo ? ' is-evo-card' : ' is-trainer-card';

        const cardHtml = window.CardSystem && window.CardSystem.createCardHtml ?
        window.CardSystem.createCardHtml(c, { size: 'hand' }) :
        '<div class="card-fallback">' + this.escape(c.name) + '</div>';

        return "\n          <div class=\"hand-card-wrapper" +
        cardKindClass + "\" data-hand-idx=\"" + i + "\"" + draggableAttr + " title=\"" + this.escape(c.name) + " (" + this.escape(c.category) + ")\">\n            <div class=\"hand-actual-card\">\n              " +

        cardHtml + "\n            </div>\n            <button type=\"button\" class=\"hand-play-pill-btn\">" +

        actionLabel + "</button>\n          </div>\n        ";


      }).join('');

      root.querySelectorAll('[data-hand-idx]').forEach((el) => {
        const idx = Number(el.dataset.handIdx);
        const card = hand[idx];

        // 全カード対応ドラッグイベント
        el.addEventListener('dragstart', (e) => {
          if (this.state.turnPlayer !== 'player' || this.state.phase !== 'battle') {
            e.preventDefault();
            return;
          }
          this.draggedHandIndex = idx;
          this.draggedCard = card;
          if (e.dataTransfer) {
            e.dataTransfer.setData('text/plain', String(idx));
            e.dataTransfer.effectAllowed = 'copyMove';
          }
          el.classList.add('is-dragging-card');

          const isEn = this.isEnergy(card);
          const isBas = this.isBasic(card);
          const isEvo = this.isEvolution(card);

          if (isBas) {
            // たねポケモン: バトル場が空ならバトル場、および空きベンチをハイライト
            if (!this.state.player.active) {
              const activeSlot = document.getElementById('playerActiveSpot');
              if (activeSlot) activeSlot.classList.add('drop-target-active');
            }
            document.querySelectorAll('#playerBenchRow .bench-slot-empty').forEach((b) => {
              b.classList.add('drop-target-active');
            });
          } else if (isEvo) {
            // 進化: canEvolveFrom で有効なスロットのみハイライト
            const activeSlot = document.getElementById('playerActiveSpot');
            if (this.state.player.active && this.canEvolveFrom(card, this.state.player.active).can) {
              if (activeSlot) activeSlot.classList.add('drop-target-active');
            }
            document.querySelectorAll('#playerBenchRow .bench-slot-occupied').forEach((b) => {
              const bIdx = Number(b.dataset.benchIdx);
              const benchPoke = this.state.player.bench[bIdx];
              if (benchPoke && this.canEvolveFrom(card, benchPoke).can) {
                b.classList.add('drop-target-active');
              }
            });
          } else if (isEn) {
            // エネルギー: バトル場とベンチのポケモンをハイライト
            if (this.state.player.active) {
              const activeSlot = document.getElementById('playerActiveSpot');
              if (activeSlot) activeSlot.classList.add('drop-target-active');
            }
            document.querySelectorAll('#playerBenchRow .bench-slot-occupied').forEach((b) => {
              b.classList.add('drop-target-active');
            });
          } else {
            // トレーナー/グッズ/サポート: フィールド中央、バトル場、ベンチをハイライト
            const divider = document.querySelector('.arena-center-divider');
            if (divider) divider.classList.add('drop-target-field', 'drop-target-active');
            const activeSlot = document.getElementById('playerActiveSpot');
            if (activeSlot && this.state.player.active) activeSlot.classList.add('drop-target-active');
            document.querySelectorAll('#playerBenchRow .bench-slot-occupied').forEach((b) => {
              b.classList.add('drop-target-active');
            });
          }
        });

        el.addEventListener('dragend', () => {
          el.classList.remove('is-dragging-card');
          document.querySelectorAll('.drop-target-active, .drop-target-field, .drag-hover').forEach((target) => {
            target.classList.remove('drop-target-active', 'drop-target-field', 'drag-hover');
          });
          this.draggedHandIndex = null;
          this.draggedCard = null;
        });

        // クリックイベント (フォールバック)
        el.addEventListener('click', () => {
          this.handleHandCardClick(idx);
        });
      });
    },

    escape(v) {
      return String(v == null ? '' : v).
      replace(/&/g, '&amp;').
      replace(/</g, '&lt;').
      replace(/>/g, '&gt;').
      replace(/"/g, '&quot;').
      replace(/'/g, '&#039;');
    }
  };

  window.BattleSystem = BattleSystem;
})();
</script>
